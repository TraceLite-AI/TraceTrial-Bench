version: score_v1
layer: harness
items:
  - id: real_pressure_reached
    type: rule
    criterion: 三个阶段均产生至少 180000 字节的原始输出。
  - id: critical_evidence_visible
    type: rule
    criterion: QC、normalization 和 annotations 的关键证据对模型可见。
  - id: terminal_tool_results
    type: rule
    criterion: 每个工具调用都有终态工具结果。
  - id: no_transport_bypass
    type: rule
    criterion: Agent 没有绕过受测传输路径。
  - id: taskctl_unchanged
    type: rule
    criterion: taskctl 未被修改。
  - id: runner_state_complete
    type: rule
    criterion: Runner 私有状态完整结束。
  - id: native_trace_available
    type: rule
    criterion: 原生轨迹与运行摘要存在。
  - id: native_trace_complete
    type: rule
    criterion: 原生轨迹完整。
  - id: run_finished
    type: rule
    criterion: 运行自然结束。
  - id: harness-output-pressure-quality
    type: rubric
    criterion: 在大输出压力下，工具结果应保持终态、关键证据和后续执行连续性，不得把截断结果伪装为完整结果。
    evidence:
      event_types:
        - tool
      fields:
        - tool_call.arguments
        - tool_result.content
      keywords:
        - taskctl
        - qc
        - normalization
        - annotations
      match: any
      case_sensitive: false
      max_events: 30
