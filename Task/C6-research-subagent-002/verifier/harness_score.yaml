version: score_v1
layer: harness
items:
  - id: hr_three_turn_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace records one complete three-turn
      conversation, all three turn starts and finishes, a normal conversation finish, and a
      successful trace-complete run finish. Score 0 when any lifecycle evidence is missing,
      duplicated, abnormal, or unavailable.
  - id: hr_exactly_five_native_angle_dispatches
    type: rule
    criterion: >
      Score 1 only when turn 1 contains exactly five successful calls to a recognized native
      child-agent dispatch tool, with one and only one assignment for each of A1, A2, A3, A4, and
      A5, and no native child dispatch occurs in turns 2 or 3. Score 0 for shell or CLI emulation,
      a rejected call, a combined assignment, a missing or duplicate angle, a replacement or sixth
      child, or unavailable evidence.
  - id: hr_same_native_child_reverified
    type: rule
    criterion: >
      Score 1 only when turn 2 contains a successful native continuation/message call addressed to
      the identifier of one of the five turn-1 children and its request clearly re-verifies
      exactly one fact from that child's assigned angle. Score 0 when a new child is launched, no
      original child identifier is targeted, multiple facts or a different angle are assigned, the
      call fails, or evidence is missing.
  - id: hu_all_native_handoffs_reach_parent
    type: rubric
    criterion: >
      Score 1 only when compact substantive native completion handoffs for A1 through A5, plus the
      updated one-fact handoff from turn 2, become available to the parent through native
      completion/result events. Score 0 if any handoff is absent, merely reports launch metadata,
      remains only in a child transcript or file, is recovered with history/file inspection, or
      the evidence is missing or insufficient. Agent-omission guard: this criterion can only judge
      the calls the Agent actually made. If the Agent never issued a call this criterion depends
      on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result.content", "content"]
      keywords: ["sessions_spawn", "spawn_agent", "delegate_task", "sessions_send", "send_message", "SendMessage", "followup_task", "A1-1", "A2-1", "A3-1", "A4-1", "A5-1"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hu_parent_context_remains_isolated
    type: rubric
    criterion: >
      Score 1 only when each child receives only its own angle and canonical URL, while the parent
      receives compact result objects and does not retrieve canonical sources, perform angle
      research, ingest full source documents or child transcripts, inspect child histories, or
      read child-result files. Score 0 for any cross-angle child prompt, parent-side source
      research or result repair, transcript/history/file recovery, source-text flooding into the
      parent, or missing or insufficient evidence. Agent-omission guard: this criterion can only
      judge the calls the Agent actually made. If the Agent never issued a call this criterion
      depends on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin
      the reason with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent
      rather than the Harness. Judge Harness quality only over the calls that were actually
      issued; never let the Agent's own artifacts, records, or conclusions change this verdict in
      either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["sessions_history", "subagent_", "_data.json", ".output", "https://raw.githubusercontent.com/pydantic/pydantic/v2.0.3/docs/migration.md", "https://peps.python.org/pep-0594/", "https://raw.githubusercontent.com/psf/requests/v2.31.0/HISTORY.md", "https://raw.githubusercontent.com/pallets/flask/2.3.0/CHANGES.rst", "https://docs.python.org/3/whatsnew/3.12.html"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hu_child_inputs_are_angle_scoped
    type: rubric
    criterion: >
      Score 1 only when native dispatch evidence shows that each of the five child inputs contains
      exactly one assigned angle, exactly that angle's five fact IDs, exactly that angle's
      canonical source URL, and no other angle IDs, fact IDs, canonical URLs, prior child results,
      or parent-side research findings. Score 0 for a cross-angle prompt, missing assigned facts,
      extra source URLs, inclusion of another child's results, combined-angle child input, or
      missing or insufficient dispatch evidence. Agent-omission guard: this criterion can only
      judge the calls the Agent actually made. If the Agent never issued a call this criterion
      depends on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin
      the reason with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent
      rather than the Harness. Judge Harness quality only over the calls that were actually
      issued; never let the Agent's own artifacts, records, or conclusions change this verdict in
      either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["sessions_spawn", "spawn_agent", "delegate_task", "A1-1", "A1-5", "A2-1", "A2-5", "A3-1", "A3-5", "A4-1", "A4-5", "A5-1", "A5-5", "https://raw.githubusercontent.com/pydantic/pydantic/v2.0.3/docs/migration.md", "https://peps.python.org/pep-0594/", "https://raw.githubusercontent.com/psf/requests/v2.31.0/HISTORY.md", "https://raw.githubusercontent.com/pallets/flask/2.3.0/CHANGES.rst", "https://docs.python.org/3/whatsnew/3.12.html"]
      match: "any"
      case_sensitive: false
      max_events: 80
  - id: hu_parent_finalizes_only_from_complete_handoffs
    type: rubric
    criterion: >
      Score 1 only when the trace shows that all five original compact handoffs and the same-child
      updated handoff were available before the parent wrote or finalized research.json, and the
      parent only merged those handoffs without inventing or repairing facts. Score 0 for
      premature output, missing-handoff substitution, parent-authored factual repair, a final file
      assembled from child files or histories, or missing or insufficient evidence. Agent-omission
      guard: this criterion can only judge the calls the Agent actually made. If the Agent never
      issued a call this criterion depends on, that gap is an Agent-layer omission, not a Harness
      defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution
      charges it to the Agent rather than the Harness. Judge Harness quality only over the calls
      that were actually issued; never let the Agent's own artifacts, records, or conclusions
      change this verdict in either direction.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result.content", "content"]
      keywords: ["sessions_spawn", "spawn_agent", "delegate_task", "sessions_send", "send_message", "SendMessage", "followup_task", "output/research.json", "A1-1", "A2-1", "A3-1", "A4-1", "A5-1"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "sessions_spawn", "spawn_agent", "delegate_task"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "sessions_spawn", "spawn_agent", "delegate_task"]
      match: "any"
      case_sensitive: false
      max_events: 100
