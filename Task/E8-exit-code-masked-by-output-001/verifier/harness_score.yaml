version: score_v1
layer: harness
items:
  - id: hr_typed_exit_channel_preserves_execution_truth
    type: rule
    criterion: >
      Score 1 only when the immutable fixture is unchanged, exactly one correlated native tool
      result confirms direct execution, that result preserves STATUS: OK and RESULT: complete, and
      an actual integer-valued exit_code/exitCode field with value 23 is structurally separate
      from its content/output field. Score 0 when the fixture is changed, execution is missing or
      duplicated, either marker is lost, or exit 23 exists only in prose or a JSON-encoded string.
      Missing evidence scores 0.
  - id: hr_typed_failure_reaches_post_tool_observer
    type: rule
    criterion: >
      Score 1 only when exactly one normalized post-tool observation is correlated to the fixture
      call and its typed top-level fields retain a terminal nonzero/failure outcome: exit_code=23,
      error=true, or an explicit failed/nonzero status. A nonzero exit paired with error=false, or
      any pending/running/in-progress status, is contradictory and scores 0. Score 0 when evidence
      is absent, duplicated, belongs to another call, or preserves the failure only inside output
      text or an encoded inner payload. Agent prose and artifacts are not substitutes. Missing
      evidence scores 0 and reproduces NONZERO_EXIT_NOT_PROPAGATED_TO_AFTER_TOOL_HOOK.
  - id: hr_trace_lifecycle_complete_and_correlated
    type: rule
    criterion: >
      Score 1 only when the canonical trace is marked complete and finished without a timeout or
      execution error; event sequence numbers are unique and contiguous through the summary's
      last_event_seq; run_started and run_finished bound the trace; the fixture tool result has a
      stable call id; and exactly one post-tool observation carries that same call id. Score 0
      when any lifecycle or correlation fact is missing, inconsistent, or ambiguous.
  - id: hu_initial_result_exposes_exact_exit_code
    type: rubric
    criterion: >
      Evaluate only the initial native result returned to the Agent for the matching fixture call.
      Score 1 if and only if that result preserves STATUS: OK and RESULT: complete while
      explicitly exposing exit code 23 in text or typed metadata. Score 0 when it contains only
      the success-shaped output, reports a different code, exposes the code only in later Agent-
      authored or post-tool content, or the matching initial result is missing. Missing evidence
      scores 0. Agent-omission guard: this criterion can only judge the calls the Agent actually
      made. If the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result"]
      keywords: ["ok_then_fail.sh", "STATUS: OK", "RESULT: complete"]
      match: "all"
      case_sensitive: true
      max_events: 1
  - id: hu_failure_classification_is_coherent
    type: rubric
    criterion: >
      Evaluate only the matching initial model-visible native result. Score 1 only when a typed
      top-level error/is_error=true or failed/error status explicitly classifies the process
      outcome as failed, and no typed field classifies it as successful, error-free, pending,
      running, or in progress. The numeric exit code by itself and Agent interpretation do not
      satisfy this separate classification requirement. Score 0 for error=false, error=null, a
      missing or ambiguous classification, a contradiction, classification available only inside
      an encoded string, or missing evidence. Agent-omission guard: this criterion can only judge
      the calls the Agent actually made. If the Agent never issued a call this criterion depends
      on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result"]
      keywords: ["ok_then_fail.sh", "STATUS: OK", "RESULT: complete"]
      match: "all"
      case_sensitive: true
      max_events: 1
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "ok_then_fail.sh", "STATUS: OK", "RESULT: complete"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "ok_then_fail.sh", "STATUS: OK", "RESULT: complete"]
      match: "any"
      case_sensitive: false
      max_events: 100
