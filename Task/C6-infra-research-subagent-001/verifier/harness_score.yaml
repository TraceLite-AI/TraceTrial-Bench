version: score_v1
layer: harness
items:
  - id: hr_three_turn_trace_complete
    type: rule
    criterion: >
      Score 1 only when one complete normalized three-turn conversation is present, every
      turn starts and finishes exactly once, the conversation and run finish normally, and
      trace_complete is true. Score 0 for missing, duplicate, failed, truncated, or unavailable
      lifecycle evidence. Missing evidence always scores 0; this metric has no N/A state.

  - id: hr_exact_native_dispatch_set
    type: rule
    criterion: >
      Score 1 only when turn 1 contains exactly five successful recognized native child-agent
      dispatches covering A1 through A5 exactly once and no dispatch occurs in turns 2 or 3.
      Score 0 for emulation, rejected calls, combined or duplicate angles, replacement children,
      or missing evidence. This metric is always binary.

  - id: hr_child_assignments_isolated
    type: rule
    criterion: >
      Score 1 only when each of the five dispatch prompts contains exactly its angle's five fact
      IDs, exactly its one canonical URL, the required four-field JSON schema, and no other angle,
      URL, prior result, or cross-angle material. Score 0 for any malformed or contaminated child
      assignment or missing prompt evidence. This metric is always binary.

  - id: hr_initial_native_handoffs_complete
    type: rule
    criterion: >
      Score 1 only when five parent-visible native child completion/result events arrive before
      turn 2, one per angle, and each parses as an exact five-key/four-string-field handoff.
      Dispatch metadata, continuation requests, parent messages, child files, and transcript reads
      never count as handoffs. Score 0 for any absent, duplicate, malformed, or unattributed result.

  - id: hr_initial_handoff_lineage_distinct
    type: rule
    criterion: >
      Score 1 only when the five initial handoffs are correlated to five distinct child identities
      created by the five turn-1 native dispatches, with each identity mapped to the same angle as
      its assignment. Score 0 for flattened, parent-authored, cross-child, duplicate, or missing
      lineage. This metric is always binary.

  - id: hr_same_child_reverification_requested
    type: rule
    criterion: >
      Score 1 only when turn 2 makes exactly one successful native continuation/message call to
      one original child and requests exactly one fact from that child's assigned angle, while no
      sixth or replacement child is dispatched. Score 0 otherwise; missing evidence scores 0.

  - id: hr_same_child_reverification_returned
    type: rule
    criterion: >
      Score 1 only when, after the turn-2 continuation, a new parent-visible native completion from
      that same child returns exactly the requested one-fact/four-string-field JSON handoff.
      The continuation request itself, launch metadata, parent repetition, files, and transcripts
      never count. Score 0 for missing, wrong-child, wrong-fact, malformed, or early delivery.

  - id: hr_parent_did_not_research_sources
    type: rule
    criterion: >
      Score 1 only when the parent makes no network/search/source-document retrieval and performs
      no angle-specific fact extraction or repair. Child-attributed retrieval of the assigned URL
      is allowed. Score 0 for any parent-side canonical or alternative URL access, search, source
      parsing, or missing actor attribution. This metric is always binary.

  - id: hr_no_history_or_file_recovery
    type: rule
    criterion: >
      Score 1 only when the parent never inspects child history/transcripts, lists child state to
      recover results, reads task output files, or uses nested CLI/shell processes to emulate child
      work. Score 0 for any prohibited recovery/emulation or missing trace evidence.

  - id: hr_turn_protocol_and_finalization_order
    type: rule
    criterion: >
      Score 1 only when no deliverable write occurs in turns 1 or 2, turn 3 performs no wait/yield,
      and the first research.json write happens in turn 3 after all five initial handoffs and the
      same-child updated handoff. Score 0 for premature output, final-turn waiting, absent write
      evidence, or missing required handoffs.

  - id: hr_final_output_derived_from_handoffs
    type: rule
    criterion: >
      Score 1 only when every final research.json entry exactly matches its native initial handoff,
      except that the single reverified fact exactly matches the later same-child handoff applied
      last. Score 0 for parent-authored repair, invention, omission, stale reverified data, file or
      transcript substitution, or missing provenance evidence.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
