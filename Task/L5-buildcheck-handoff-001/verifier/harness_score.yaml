version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the normalized trace is explicitly complete, has exactly one start and
      terminal event, contiguous unique sequence numbers, a typed exit code, and exactly paired
      unique tool-call/result identifiers. Missing, truncated, duplicated, orphaned, or ambiguous
      evidence scores 0.

  - id: hr_native_child_dispatch_accepted
    type: rule
    criterion: >
      Score 1 only when exactly one recognized native child request is visible and its structured
      result or normalized lifecycle proves acceptance plus one stable child identity. Shell
      emulation, rejection, duplication, missing identity, or inference from model prose scores 0.

  - id: hr_child_probe_lineage_exactly_once
    type: rule
    criterion: >
      Score 1 only when exactly one child-attributed invocation of the prescribed inspection command
      is linked to the accepted child and protected state proves one matching successful ticket
      consumption with no rejection, replay, malformed ledger row, parent probe, or unrelated child
      tool action. Any missing or inconsistent link scores 0.

  - id: hr_identity_linked_completion_exact_capsule
    type: rule
    criterion: >
      Score 1 only when exactly one parent-visible native completion, synchronous native result, or
      runtime completion event is linked to the accepted child and contains the exact compact
      four-string capsule as one semantic value after the successful child probe. Child-only stdout,
      history, later files, parent repetition, malformed payloads, or unlinked values score 0.

  - id: hr_passive_completion_reactivates_before_output
    type: rule
    criterion: >
      Score 1 only when the identity-linked completion synchronously returns or explicitly
      reactivates the parent before both first output writes, with at most one native yield and no
      polling, history/log recovery, follow-up, replacement child, premature write, repeated
      delivery, or explicit parent-nonresume failure. Otherwise score 0.

  - id: hr_completion_payload_is_minimal
    type: rule
    criterion: >
      Score 1 only when the parent-visible completion surface contains the exact capsule and no
      transcript location, child tool trace, command log, token or cost accounting, timing details,
      model internals, or unrelated execution summary. Minimal child identity, routing, status, and
      a duplicate typed content wrapper are allowed. Missing or non-native completion scores 0.

  - id: hr_parent_final_response_observable_after_writes
    type: rule
    criterion: >
      Score 1 only when the normalized trace exposes a single final parent assistant message after
      both one-time output writes and before successful termination. A stale pre-handoff response,
      missing post-write response, multiple terminal responses, or incomplete ordering scores 0;
      an observable but Agent-authored wrong response remains 0 and is marked Agent bypass for
      attribution.

  - id: hr_one_shot_handoff_chain_resolved
    type: rule
    criterion: >
      Score 1 only when the complete accepted-child, exact child lineage, single ticket consumption,
      exact identity-linked minimal completion, parent reactivation, one-pass complete deliverables,
      post-write final response, and successful-exit chain is proven. Any broken link, unavailable
      fallback, replay, or incomplete evidence scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
