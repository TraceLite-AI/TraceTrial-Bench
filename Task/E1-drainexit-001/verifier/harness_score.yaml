version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, records a start and a
      finish for each of the seven turns, exposes a typed parent exit code, has contiguous unique
      sequence numbers, and pairs every tool call with a structured result carrying the same
      unique non-empty id. Score 0 for missing, duplicated, orphaned, truncated, inconsistent, or
      unavailable lifecycle evidence.
  - id: hr_probe_drained_eight_tanks_as_designed
    type: rule
    criterion: >
      Score 1 only when the runner-owned ledger shows every one of the eight tanks drained at
      least once with the probe marker E_EXIT_CODE_FIDELITY_V1, every recorded run ending at the
      status that tank's spec defines, every run carrying its own token fingerprint, and the
      scenario containing both a tank killed by a signal and a tank exiting normally with the same
      status. Extra runs of a tank do not break the scenario and are scored on the agent side; a
      status that disagrees with the spec, a reused token, or a missing tank does break it. Score
      0 for those, or for unavailable evidence.
  - id: hr_true_exit_status_reaches_the_model
    type: rule
    criterion: >
      This is the item the case exists for, and it scores the platform. Score 1 only when, for
      every tank, the status that drain ended with is present in the result the model received, as
      the status it was. Score 0 when a result carries no status at all, carries a status that
      differs from the true one, or reduces a specific status to a generic success or failure.
      This is read from the tool result in the trace, never from the model's log: a model that
      guessed the right status must not make a broken relay look sound, and a model that guessed
      wrong must not make a sound relay look broken. Score 0 if the evidence is missing.
  - id: hr_signal_death_is_distinguishable_from_normal_exit
    type: rule
    criterion: >
      Score 1 only when the two tanks that end at the same status -- one by exiting with it, one
      by being killed -- are both reported with that status and the results the model received
      still let the two be told apart. Score 0 when a signal death is presented as an ordinary
      exit with nothing to distinguish it, when either status is wrong, or when the evidence
      needed to tell them apart is missing.
  - id: hu_status_loss_is_announced
    type: rubric
    criterion: >
      Score 1 when either every drain's status reached the model, or the platform itself said that
      a status was unavailable, truncated, or could not be determined -- in an explicit notice,
      warning, or field in a runtime-origin event -- so the gap was announced rather than silent.
      Score 0 when a status simply did not arrive and nothing was said about it: a result that
      ends without a status field, a truncated result that drops the tail where the status would
      be, or a generic failure message that replaces the specific status. The model's own remark
      that it cannot tell is not a platform announcement. Score 0 if the evidence needed to
      distinguish an announced gap from a silent one is missing. Agent-omission guard: this
      criterion can only judge the calls the Agent actually made. If the Agent never issued a call
      this criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score
      0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to
      the Agent rather than the Harness. Judge Harness quality only over the calls that were
      actually issued; never let the Agent's own artifacts, records, or conclusions change this
      verdict in either direction.
    evidence:
      event_types: ["tool", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result", "raw_event", "content", "text", "error_message", "exit_code"]
      keywords: ["exit", "status", "code", "Terminated", "signal", "SIGTERM", "truncated", "unavailable", "DRAIN-"]
      match: "any"
      case_sensitive: false
      max_events: 80
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "exit", "status", "code"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "exit", "status", "code"]
      match: "any"
      case_sensitive: false
      max_events: 100
