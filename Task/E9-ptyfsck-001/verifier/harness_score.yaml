version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_is_complete
    type: rule
    criterion: >
      Score 1 only when the normalized trace is marked complete, contains run_started
      and run_finished lifecycle events, contains at least one tool event, and the Harness
      finishes without an outer timeout or infrastructure error. Score 0 when any lifecycle
      segment is absent, the trace is incomplete, or execution terminates abnormally.

  - id: hr_real_pty_pressure_is_captured
    type: rule
    criterion: >
      Score 1 only when exactly one committed pty_probe request has both stdin and stdout
      attached to a real TTY, the normalized trace contains the correlated native command,
      and PTY_LINE> reaches the model through its result channel. Score 0 for no attempt,
      retries, a non-TTY endpoint, missing correlation, or a prompt visible only privately.

  - id: hr_eof_completion_and_continuity_are_captured
    type: rule
    criterion: >
      Score 1 only when authoritative simulator evidence records the exact canonical line
      followed by EOF on an empty buffer, issues PTY_EOF_COMPLETE with the private receipt,
      and one later followup request returns FOLLOWUP_OK probe=complete, with both results
      reaching the model in order. Score 0 when any stage, ordering, correlation, or
      model-visible result is missing.

  - id: hu_session_handle_is_actionable
    type: rubric
    criterion: >
      Score 1 only when the native probe result promptly exposes PTY_LINE> together with
      a stable retained-session handle and an unambiguous supported operation for writing
      more terminal input. Score 0 when the call blocks until termination, returns only a
      background job or file, hides the prompt, lacks a writable handle, or evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["sessionId"]
      match: all
      case_sensitive: false
      max_events: 60

  - id: hu_line_round_trip_is_visible
    type: rubric
    criterion: >
      Score 1 only when normalized evidence binds the exact VOLUME-42 plus one newline to
      the retained probe session and subsequently exposes PTY_EOF> from that same session.
      Score 0 when input is split or altered, sent to another session, lacks a newline,
      times out before acknowledgment, loses the next prompt, or evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["sessionId"]
      match: all
      case_sensitive: false
      max_events: 80

  - id: hu_eof_control_and_receipt_are_visible
    type: rubric
    criterion: >
      Score 1 only when normalized evidence shows an actual EOF control delivered after
      PTY_EOF> on the same retained session and then exposes the intact PTY_EOF_COMPLETE
      receipt with a successful terminal status. Score 0 for text or newline substitution,
      process killing, ambiguous control bytes, missing session correlation, a lost or
      altered receipt, or missing evidence.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["sessionId"]
      match: all
      case_sensitive: false
      max_events: 100

  - id: hu_terminal_outcome_is_actionable
    type: rubric
    criterion: >
      Score 1 only when the retained-session result reaches a definite terminal state and
      clearly distinguishes successful completion from an input deadline, native timeout,
      invalid-PTY failure, or other failure, while preserving the decisive prompt or marker.
      The normalized result must expose terminal status or exit code as a separate
      machine-readable field; prose such as "Process exited with code 0" alone is not
      sufficient. Score 0 when the session remains silently running, status is available
      only inside prose, status is ambiguous or contradictory, the decisive output is
      unavailable, or evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["INTERACTIVE_INPUT_TIMEOUT", "timed out", "interactive transport requires a valid PTY", "Process exited with code"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hu_post_session_execution_is_visible
    type: rubric
    criterion: >
      Score 1 only when a native follow-up call occurs after the probe's terminal result
      and its complete FOLLOWUP_OK result, including whether the probe was complete or
      incomplete, is bound to that call and visible to the model. Score 0 when ordering is
      wrong, later execution is blocked, result provenance is unclear, output is reduced,
      or evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["probe=complete", "probe=incomplete"]
      match: any
      case_sensitive: false
      max_events: 60
