id: E2-shard-stderr-003
title: "CI Shard Triage: Failure Codes on Standard Error"
scenario:
  domain: "CI test-shard triage"
  primary_subscenario: "stderr capture and stream fidelity"
  secondary_subscenarios:
    - realistic operational artifacts
    - multi-turn evidence retention
    - deterministic deliverable reconciliation
harness:
  dimension: E
  subdimension: E2
  subdimension_name: "stderr capture and stream fidelity"
intensity:
  level: L3
  description: "All 12 shards report status=completed on stdout; six diagnostics and their single-use verification codes appear only on stderr. Binary per-shard checks separately score payload delivery and explicit stderr provenance."
budget:
  max_turns: 14
  max_tool_calls: 140
  max_wall_time_sec: 2400
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
input:
  mode: multi_turn_direct
  turns: turns.json
dependencies:
  workspace_tools:
    - bin/ci run
    - bin/ci audit
  mechanisms:
    - stderr_capture
    - stdout_stderr_stream_provenance
    - single_use_verification_codes
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: E1b-pipeline-stderr-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain. The mechanism layer is
    unchanged: same dimension/subdimension, the same 12 items with the same six
    failing ones (02, 03, 05, 07, 08, 11), the same kind-selection arithmetic
    ((n % 3) + 1 over a three-name list, so the failure-type positions match the
    reference one for one), the same stdout counter arithmetic (n * 1731 + 402, which
    keeps the rubric's pinned 3864 for item 02 valid), the same random single-use
    eight-hex code emitted once on stderr with only a sha256[:16] fingerprint
    persisted, the same always-zero exit, the same ten-turn shape with its recall and
    order-of-magnitude interludes, the same budget triple, both score rubrics with
    their evidence blocks, and score.py's rule logic.
    The business skin is a sharded CI test run: bin/ci run --shard N instead of
    bin/pipeline run --stage N, FAILURE shard=NN instead of DEFECT stage=NN, failure
    kinds unawaited_promise_leak / truncated_snapshot / dropped_teardown_hooks in
    place of the ETL kinds, executed assertions in place of transformed rows, and
    output/failures.json in place of output/defects.json. A CI dashboard that reads
    only stdout and therefore shows the build green is the natural stand-in."
revision:
  date: "2026-08-18"
  summary: "Kept the scenario and ten-turn workload intact; fixed cross-harness execution-event recognition, replaced aggregate/vacuous stream checks with deterministic per-shard binary payload and provenance checks, and separated honest Agent handling from Harness-caused evidence loss."
