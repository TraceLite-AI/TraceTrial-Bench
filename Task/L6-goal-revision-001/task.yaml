id: L6-goal-revision-001
title: "Dam-reinforcement bid-lot settlement: revise scope and controlled fields in place"
scenario:
  domain: "Civil Engineering Project Controls"
  primary_subscenario: "Continuous revision of a dam-reinforcement settlement report"
  secondary_subscenarios:
    - "Immediate in-place revision"
    - "Revoked-field removal"
    - "Interruption recovery"
harness:
  dimension: L
  subdimension: L6
  subdimension_name: "Following the latest goal across consecutive revisions"
