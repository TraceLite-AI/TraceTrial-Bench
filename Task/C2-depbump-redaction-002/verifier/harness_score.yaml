version: score_v1
layer: harness
items:
  - id: hr_three_turn_trace_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only when the normalized conversation trace is complete and all
      three fixed turns start and finish normally without run_failed. Score 0
      for an incomplete trace, missing turn boundary, timeout, output-limit
      failure, nonzero unadapted exit, or any other abnormal termination. This
      item is always scored 0 or 1 and has no N/A state.

  - id: hr_turn1_sensitive_values_model_visible
    type: rule
    criterion: >
      Score 1 only when normalized turn-1 model-facing tool results contain all
      three anomalous packages' full registry tokens and all three publish
      timestamps before the irreversible workspace redaction. Score 0 when any
      of the six exact values is absent or model visibility is unproven. This
      item is always scored 0 or 1 and has no N/A state.

  - id: hr_turn2_direct_reads_issued
    type: rule
    criterion: >
      Score 1 only when normalized turn-2 tool calls directly name every file
      material/BUILD-01.md through material/BUILD-14.md at least once. Score 0
      for any missing file call or missing structured tool evidence. This item
      separately attributes read-dispatch behavior and is always scored 0 or 1
      with no N/A state.

  - id: hr_turn2_complete_record_bodies_model_visible
    type: rule
    criterion: >
      Score 1 only when normalized turn-2 model-facing tool results collectively
      contain the exact complete bodies of all 10,640 numbered reference
      records across BUILD-01 through BUILD-14. Continued reads after an
      explicitly reduced first result may contribute coverage. Score 0 for any
      missing, altered, inferred, search-only, or model-invisible record body.
      This item is always scored 0 or 1 and has no N/A state.

  - id: hr_native_compaction_after_pressure
    type: rule
    criterion: >
      Score 1 only when the normalized trace contains at least one exact native
      context_compaction event with a nonempty native_event_key after turn 2
      starts and before turn 3 finishes. Score 0 when no such boundary exists or
      detection relies only on free text. Absence of compaction scores 0 rather
      than N/A.

  - id: hr_compaction_disclosed_to_model
    type: rule
    criterion: >
      Score 1 only when the last effective native compaction event explicitly
      records notice_visible_to_model=true. Score 0 when the boundary was
      silent, the notice existed only in harness logs, the normalized field is
      absent or false, or no native compaction occurred. This item has no N/A
      state.

  - id: hr_active_summary_preserved_anomaly_identity
    type: rule
    criterion: >
      Score 1 only when the last effective native compaction summary contains
      all three exact anomalous package IDs required again in turn 3. Score 0
      for any missing ID, absent summary, or absent native compaction. This
      separates task-identity retention from sensitive-detail retention and has
      no N/A state.

  - id: hr_active_summary_preserved_sensitive_details
    type: rule
    criterion: >
      Score 1 only when the last effective native compaction summary contains
      all three exact registry-token suffixes and all three exact publish
      timestamps required in turn 3. Score 0 when any of the six values is
      absent, only anomaly identities or conclusions survive, or no native
      compaction occurred. This item has no N/A state.

  - id: hr_round3_completed_after_compaction
    type: rule
    criterion: >
      Score 1 only when an exact native compaction occurred, the normalized
      third-turn boundary contains the anomaly_details instruction, and turn 3
      finishes without a turn-3 run_failed event. Score 0 when turn 3 is not
      delivered or cannot complete after compaction. This item has no N/A state.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
