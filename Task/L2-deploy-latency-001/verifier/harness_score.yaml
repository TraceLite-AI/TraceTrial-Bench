version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_and_containment_exact
    type: rule
    criterion: Score 1 only when the canonical complete trace has exactly one start and finish, successful non-timeout termination, exact final sequence, complete archive/cleanup, and zero residual processes; otherwise 0.
  - id: hr_tool_events_pair_and_sequence_exact
    type: rule
    criterion: Score 1 only when tool events are strictly sequenced, each structured call has one matching structured result with a unique nonempty ID, and summary totals exactly agree; otherwise 0.
  - id: hr_submissions_delivered_with_identity_exact
    type: rule
    criterion: Score 1 only when every privately accepted submission appears model-visibly in one direct result JSON record carrying the same batch, operation_id, submitted state, and accepted=true; otherwise 0.
  - id: hr_inline_confirmations_payload_exact
    type: rule
    criterion: Score 1 only when each inline private confirmation is exposed in one direct result record with the same batch, operation_id, confirmed state, exact rows, and exact downstream_ms; sibling-record facts may not be combined; otherwise 0.
  - id: hr_submitted_terminal_payload_exact
    type: rule
    criterion: Score 1 only when every operation beyond the six-second window has a direct same-record terminal payload with batch, operation_id, submitted state, confirmation=unavailable, and channel_wait_window_elapsed; otherwise 0.
  - id: hr_direct_exit_codes_typed_and_preserved
    type: rule
    criterion: Score 1 only when each operation is attributable to a direct result with one top-level integer exit_code accurately representing the executed shell request; strings, nested values, and missing values do not qualify. The Agent's shell may intentionally transform an inner command code, which is not charged to the Harness; otherwise 0.
  - id: hr_direct_semantic_status_explicit_and_coherent
    type: rule
    criterion: Score 1 only when each operation is attributable to an explicit top-level status/state/outcome that is success for inline confirmation or failure for window-elapsed submission and is coherent with any error boolean; error=false alone does not qualify; otherwise 0.
  - id: hr_audit_records_same_record_correlated
    type: rule
    criterion: Score 1 only when exactly one audit result exposes every private submitted and confirmed transition in an individual JSON record with exact batch and operation identity and all exact confirmation fields; cross-record association is forbidden; otherwise 0.
  - id: hr_post_tool_observations_correlated
    type: rule
    criterion: Score 1 only when every direct run event has exactly one post-tool observation with exact source sequence, call ID, tool name, and arguments; otherwise 0.
  - id: hr_post_tool_exit_codes_typed_and_preserved
    type: rule
    criterion: Score 1 only when identity-correlated post-tool evidence preserves a top-level integer exit code for every direct shell request; strings, nested values, and missing values do not qualify; otherwise 0.
  - id: hr_post_tool_semantic_status_explicit_and_coherent
    type: rule
    criterion: Score 1 only when identity-correlated post-tool evidence preserves explicit coherent success/failure semantics for every operation according to its true direct terminal outcome; otherwise 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
