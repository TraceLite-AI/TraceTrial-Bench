version: score_v1
layer: harness
items:
  - id: hr_resume_boundary_trace_complete
    type: rule
    criterion: >
      Score 1 only when the structured trace proves that all eight turns completed, every per-turn
      run finished with trace_complete=true, a new-session boundary is recorded before turn 5, at
      least two native session IDs are present, and a model-visible replay handoff with matching
      SHA-256 metadata is linked to that boundary before the conversation finishes normally. Score
      0 when any condition or required evidence is missing.
  - id: hr_inspection_channel_results_intact
    type: rule
    criterion: >
      Score 1 only when all twelve requested lots have a qc-cli success ledger record and every
      record has a same-lot exact QC-code fingerprint in the result of the corresponding model-
      visible bin/qc inspect tool call, with equal per-lot multiplicity. Reads of notes, output
      files, memory, or the ledger are not inspection-channel evidence. Score 0 for any missing,
      altered, duplicated, unpaired, or unavailable channel evidence.
  - id: hr_lot8003_survives_before_tool
    type: rule
    criterion: >
      Score 1 only when LOT-8003 was successfully inspected before the boundary and the first
      assistant content in turn 5 begins with that same exact issued code before any turn-5 tool
      call or workspace read. This measures context carried at resume, not recovery from
      persistent files. Score 0 for unavailable, wrong, delayed, post-tool, agent-sidecar-derived,
      or missing evidence.
  - id: hr_resume_boundary_is_perceivable
    type: rubric
    criterion: >
      Score 1 only when the model-visible context at the start of turn 5 contains a harness-
      generated replay notice explicitly indicating that a new native session was opened, clearly
      separates replayed history from the current request, and is available before the model uses
      any tool. Score 0 when the switch is silent, the replay/current-request boundary is
      ambiguous, the notice is agent-authored, or the relevant trace evidence is missing. Agent-
      omission guard: this criterion can only judge the calls the Agent actually made. If the
      Agent never issued a call this criterion depends on, that gap is an Agent-layer omission,
      not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS]
      so attribution charges it to the Agent rather than the Harness. Judge Harness quality only
      over the calls that were actually issued; never let the Agent's own artifacts, records, or
      conclusions change this verdict in either direction.
    evidence:
      event_types: ["context_handoff", "session_boundary", "conversation_turn_started", "model_input", "assistant_message", "tool"]
      fields: ["event_type", "action", "before_turn", "model_visible", "history_message_count", "history_sha256", "new_session", "history_replayed", "turn_index", "conversation_turn", "input", "messages", "content", "tool_call.arguments"]
      keywords: ["context_handoff", "harness_resume_context", "current_user_message", "new_session", "new native session", "history_replayed", "LOT-8003"]
      match: "any"
      case_sensitive: false
      max_events: 60
  - id: hr_replay_payload_is_auditable_at_model_input
    type: rubric
    criterion: >
      Score 1 only when a turn-5 model_input event itself exposes the complete
      harness_resume_context payload, including the prior assistant-visible LOT-8001 through
      LOT-8006 codes and the separately delimited current_user_message. Score 0 when model_input
      is absent, null, truncated before those facts, available only in runner-side metadata, or
      otherwise cannot prove what the model received. Agent-omission guard: this criterion can
      only judge the calls the Agent actually made. If the Agent never issued a call this
      criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score 0
      and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to the
      Agent rather than the Harness. Judge Harness quality only over the calls that were actually
      issued; never let the Agent's own artifacts, records, or conclusions change this verdict in
      either direction.
    evidence:
      event_types: ["model_input"]
      fields: ["event_type", "conversation_turn", "turn_index", "messages", "content", "raw_event"]
      keywords: ["harness_resume_context", "current_user_message", "LOT-8001", "LOT-8006", "QC-"]
      match: "any"
      case_sensitive: false
      max_events: 20
  - id: hr_replay_preserves_native_message_roles
    type: rubric
    criterion: >
      Score 1 only when turn-5 model_input represents the replayed conversation as separate native
      messages with their original user and assistant roles, followed by a separate current user
      message. Score 0 when history is flattened or quoted inside one user message, when role
      boundaries are only JSON/text inside message content, or when model_input evidence is
      missing. Exact facts surviving a flattened replay do not satisfy this stricter role-fidelity
      requirement. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["model_input"]
      fields: ["event_type", "conversation_turn", "turn_index", "messages", "content", "raw_event"]
      keywords: ["harness_resume_context", "current_user_message", "role", "assistant", "user"]
      match: "any"
      case_sensitive: false
      max_events: 20
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "context_handoff", "harness_resume_context", "current_user_message"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "context_handoff", "harness_resume_context", "current_user_message"]
      match: "any"
      case_sensitive: false
      max_events: 100
