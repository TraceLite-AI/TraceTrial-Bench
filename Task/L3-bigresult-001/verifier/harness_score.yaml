version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, records a start and a
      finish for each of the seven turns, exposes a typed parent exit code, has contiguous unique
      sequence numbers, and pairs every tool call with a structured result carrying the same
      unique non-empty id. Score 0 for missing, duplicated, orphaned, truncated, inconsistent, or
      unavailable lifecycle evidence. Missing evidence scores 0.
  - id: hr_probe_tallied_six_lanes_with_distinct_seals
    type: rule
    criterion: >
      Score 1 only when the channel-owned evidence file records exactly six tally events with the
      probe marker L_CHILD_AGGREGATION_V1, one per distinct lane, each carrying a sixteen-
      character seal fingerprint distinct from every other and the figure the verifier
      independently recomputes from that lane's pallets, and when the recorded settle times are
      not all equal. Score 0 for a missing, duplicated, or extra lane, a reused or malformed
      fingerprint, a figure that disagrees with the recomputed value, a scenario in which every
      lane settled identically, or unavailable evidence.
  - id: hr_six_native_dispatches_one_per_lane
    type: rule
    criterion: >
      Score 1 only when the coordinator trajectory contains exactly six accepted calls to a
      recognized native child-dispatch tool, each carrying the assignment for exactly one distinct
      lane, together covering all six. Score 0 for a missing or duplicate lane, a combined
      assignment, shell or nested-CLI emulation, a rejected call that was not reissued, or missing
      structured call and result evidence. Whether the coordinator also did work it should have
      delegated is scored by the agent boundary item, not here.
  - id: hr_children_ran_concurrently
    type: rule
    criterion: >
      Score 1 only when the six dispatches were issued together rather than serialized behind one
      another, and the channel-owned evidence shows the lanes finishing at distinct times. Score 0
      when dispatches are spread across the trajectory in a way that shows each child was awaited
      before the next was started, when every lane finished at the same moment, or when the
      evidence needed to establish overlap is missing.
  - id: hr_each_child_result_stays_bound_to_its_lane
    type: rule
    criterion: >
      This is the item the case exists for, and it scores the platform. Score 1 only when, for
      every lane, exactly one child transcript shows that lane tallied, the figure and seal in
      that transcript are the ones the channel issued for that lane, and that seal reached the
      parent by some route -- a completion event, a tool result, or any other delivery the
      platform makes. Score 0 when a child completed but its result never reached the parent, when
      two children claim the same lane, when a child's payload carries another lane's figure or
      seal, or when the evidence needed to establish attribution is missing. A result the parent
      reconstructed or inferred is not a delivery.
  - id: hu_undelivered_child_results_are_announced
    type: rubric
    criterion: >
      Score 1 when either every dispatched child's result reached the parent, or the platform
      itself told the parent that a child's result was unavailable, failed, timed out, or would
      not be delivered -- through an explicit error, warning, or status in a runtime-origin event
      -- so the gap was announced rather than silent. Score 0 when a child completed and its
      result simply never arrived with nothing said about it: no completion event, no failure
      notice, no status the parent could act on. The parent's own observation that it is still
      waiting is not a platform announcement. Score 0 if the evidence needed to tell an announced
      gap from a silent one is missing. Agent-omission guard: this criterion can only judge the
      calls the Agent actually made. If the Agent never issued a call this criterion depends on,
      that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["principal_role", "child_session", "source", "conversation_turn", "tool_call.tool_name", "tool_call.arguments", "tool_result", "content", "text", "raw_event", "error_message"]
      keywords: ["task completion event", "subagent", "TALLY-", "TALLY_DONE", "unavailable", "failed", "timed out", "no result", "not delivered", "awaiting", "sessions_yield"]
      match: "any"
      case_sensitive: false
      max_events: 80
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "task completion event", "subagent", "TALLY-"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "task completion event", "subagent", "TALLY-"]
      match: "any"
      case_sensitive: false
      max_events: 100
