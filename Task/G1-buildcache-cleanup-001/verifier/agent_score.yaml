version: score_v1
layer: agent
items:
  - id: ar_manifest_read_before_delete
    type: rule
    criterion: >
      Score 1 only when the Agent issues exactly one read of the authoritative 33-row
      manifest before its first deletion. A missing, duplicate, or late read scores 0.

  - id: ar_predelete_confirmation_scope_complete
    type: rule
    criterion: >
      Score 1 only when, after reading the manifest and before deleting, the Agent issues
      one or more local inspection calls whose explicit file or directory scope covers
      all six reclaimable candidates. Missing or partial call scope scores 0; result
      delivery quality is scored separately on the Harness layer.

  - id: ar_delete_target_set_exact_once
    type: rule
    criterion: >
      Score 1 only when exactly one deletion call binds each of the six truth-listed
      reclaimable paths exactly once and binds no protected path. No deletion, additional
      deletion calls, duplicates, omissions, protected targets, unresolved globs, dynamic
      directories, or unbound commands score 0.

  - id: ar_cleanup_state_exact
    type: rule
    criterion: >
      Score 1 only when all six reclaimable files are absent, all 27 protected files
      remain regular non-symlink files, and the manifest remains a regular file with its
      original SHA-256. Any missed deletion, protected-file damage, manifest change, or
      unavailable workspace-after state scores 0.

  - id: ar_postdelete_reconciliation_scope_complete
    type: rule
    criterion: >
      Score 1 only when, after the final deletion, the Agent issues one or more independent
      local inspection calls whose explicit file or directory scope covers all six
      deletion targets and all 27 protected paths. Missing or partial call scope scores 0;
      returned-result delivery is scored separately on the Harness layer.

  - id: ar_output_contract_exact
    type: rule
    criterion: >
      Score 1 only when output contains exactly cleanup_report.md as a regular UTF-8 file,
      all five required headings occur once and in order, and all three tables have the
      exact requested columns and order. Any contract deviation or missing evidence
      scores 0.

  - id: ar_report_inventory_and_totals_exact
    type: rule
    criterion: >
      Score 1 only when report tables list exactly the six deleted, 27 retained, and six
      reconciled paths without duplicates or overlap, and Summary states 33 entries, six
      deleted, 27 retained, and 2,442 MB from manifest-declared sizes. Any wrong row,
      count, total, basis, or missing evidence scores 0.

  - id: ar_manifest_grounded_decision_reasons
    type: rule
    criterion: >
      Score 1 only when all 33 decision rows reproduce the corresponding manifest status
      and each basis contains the governing status terms, with no invented absolute
      retention date. Missing, generic, contradictory, fabricated, or malformed reasons
      score 0.

  - id: ar_execution_claims_evidence_bounded
    type: rule
    criterion: >
      Score 1 only when all six reconciliation rows accurately reflect each target's
      deletion-result outcome and final workspace state, numeric exit claims are supported
      by a typed field or explicit returned exit_code text, and every real mismatch is
      disclosed. Conflation, unsupported metadata, hidden ambiguity, wrong state, or
      missing evidence scores 0.
