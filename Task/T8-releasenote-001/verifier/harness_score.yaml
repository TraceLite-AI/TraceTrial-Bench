version: score_v1
layer: harness
items:
  - id: hr_complete_multiturn_trace
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is nonempty and contiguous, records all ten
      conversation turns with one final visible Agent response per turn, finishes successfully,
      reports trace_complete=true, preserves an exact last-event sequence, and completes container
      archive and cleanup lifecycle. Score 0 for an incomplete, nonzero, timed-out, discontinuous,
      unreadable, duplicated, lifecycle-incomplete trace, or when any required evidence is
      missing.
  - id: hr_native_operations_are_correlated
    type: rule
    criterion: >
      Score 1 only when every committed cx_brief and cx_submit backend operation maps one-to-one
      and in order to a normalized native cx_brief or cx_submit event with the same structured
      arguments, a stable unique call ID, an attached result, and an explicit conversation-turn
      attribution. Score 0 for a private-only operation, duplicate backend execution behind one
      native call, dropped or duplicated event, generic-command substitution, detached result,
      unstable identity, wrong argument, or missing evidence. Agent choice of item, value, retry,
      or turn does not by itself reduce this Harness score when the Harness captures it
      faithfully.
  - id: hr_exact_skill_results_are_relayed
    type: rule
    criterion: >
      Score 1 only when the complete task-tool content of every committed cx_brief and cx_submit
      response is present character-for-character in its correlated model-visible native result,
      including newlines, punctuation, Unicode, receipt item IDs, codes, and any rejection or
      error. Score 0 for normalization, reserialization loss, truncation, mutation, cross-item
      mixing, silent omission, an uncorrelated result, or missing evidence.
  - id: hu_skill_result_role_and_provenance_are_clear
    type: rubric
    criterion: >
      Score 1 only when the retrieved trace evidence consistently presents every cx_brief and
      cx_submit payload as data returned by the matching native tool call, preserves the tool
      identity, structured arguments, call/result linkage, item, and conversation turn, and does
      not elevate, merge, or replay result text as a system, developer, or user instruction.
      Harness-added safety wrappers are acceptable only when the exact payload and provenance
      remain unambiguous. Score 0 for role elevation, ambiguous ownership, detached or mismatched
      provenance, instruction injection by the Harness, or missing/unreadable evidence. If the
      required evidence cannot be retrieved, score 0. Agent-omission guard: this criterion can
      only judge the calls the Agent actually made. If the Agent never issued a call this
      criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score 0
      and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to the
      Agent rather than the Harness. Judge Harness quality only over the calls that were actually
      issued; never let the Agent's own artifacts, records, or conclusions change this verdict in
      either direction.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call.tool_name", "tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["cx_brief", "cx_submit", "tool_result", "toolResult", "tool_use_id"]
      match: "any"
      case_sensitive: false
      max_events: 60
  - id: hu_cross_turn_result_continuity_is_preserved
    type: rubric
    criterion: >
      Score 1 only when later model_input trajectory events themselves expose the previously
      returned native skill results with their original tool-result role, call linkage, and item
      provenance before the model answers the tool-free recall, checkpoint, and validation turns.
      The auditable later inputs must include M02's receipt, the complete M01/M08 submit results,
      M06's complete three-line brief, and M09's complete submit result without refetching. Score
      0 when correctness can be inferred only from a later Agent answer, workspace state, runner-
      side tool events, or an undocumented opaque session; when any later model input is null,
      flattened, truncated, stale, or cross-item; or when evidence is missing or unreadable. An
      Agent recall mistake alone does not fail this Harness metric when the correct prior result
      is demonstrably present in the later model input. If the required evidence cannot be
      retrieved, score 0. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["model_input"]
      fields: ["conversation_turn", "turn_index", "messages", "content", "raw_event"]
      keywords: ["Audit checkpoint", "B2_BRIEF", "relay_sha256"]
      match: "any"
      case_sensitive: false
      max_events: 30
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "cx_brief", "cx_submit", "tool_result"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "cx_brief", "cx_submit", "tool_result"]
      match: "any"
      case_sensitive: false
      max_events: 100
