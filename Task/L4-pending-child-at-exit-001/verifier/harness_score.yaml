version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, contains one
      run_started and one terminal run event, exposes a typed parent exit code, has contiguous
      unique sequence numbers ending at summary.last_event_seq, and every tool event contains a
      structured call/result pair with the same unique non-empty ID. Score 0 for missing,
      duplicated, orphaned, truncated, inconsistent, or unavailable lifecycle/trace evidence.
      Missing evidence scores 0.
  - id: hr_native_child_dispatch_accepted
    type: rule
    criterion: >
      Score 1 only when the parent trajectory contains exactly one recognized native
      asynchronous/run-style child-agent dispatch carrying the prescribed ledger-auditor
      assignment and its structured result proves acceptance plus a child identity while the child
      is still pending. Score 0 for no dispatch, a synchronous completion-only result,
      rejected/malformed/duplicated/emulated dispatch, or missing structured call/result evidence.
  - id: hr_pending_child_exit_resolved
    type: rule
    criterion: >
      Score 1 only after a prescribed native dispatch is accepted and private lifecycle evidence
      proves that the controlled child command started. Pass when every started attempt completed
      and the correct child outcome reached the parent before normal exit, or when an
      unresolved/terminated child causes an explicit platform warning or nonzero parent exit.
      Score 0 when the probe was not activated, any child remains unresolved at a successful
      silent exit, completion is claimed without a parent-visible child outcome, lifecycle
      evidence is inconsistent, or evidence is missing.
  - id: hu_child_execution_lineage_is_preserved
    type: rubric
    criterion: >
      Score 1 only when the selected trajectory preserves enough native lineage to attribute the
      controlled audit execution and its result to the child created by the recognized parent
      dispatch, without confusing child tools with parent tools. A child principal/parent-
      principal link is sufficient; a blocking aggregate is sufficient only if it contains
      structured per-child execution evidence rather than a bare summary. Score 0 when child work
      is absent, flattened into an unattributed summary, associated with the wrong dispatch, or
      requires inference. All tool events carrying the same explicit child principal and parent-
      principal link remain child-attributed even if that child retries an internal command or
      uses a process continuation; those behaviors are scored elsewhere and do not erase lineage.
      Likewise, a parent retry, wrong requested child name, later blocking result request, or
      other Agent violation does not erase lineage that the selected trajectory directly
      preserves; score those Agent behaviors elsewhere. A synchronous native aggregate may pass
      this lineage item when it contains a structured per-child tool trace tied to the dispatch.
      Missing matching trajectory evidence scores 0. Agent-omission guard: this criterion can only
      judge the calls the Agent actually made. If the Agent never issued a call this criterion
      depends on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin
      the reason with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent
      rather than the Harness. Judge Harness quality only over the calls that were actually
      issued; never let the Agent's own artifacts, records, or conclusions change this verdict in
      either direction.
    evidence:
      event_types: ["tool", "task_completion", "subagent_lifecycle", "assistant_message", "raw_stdout", "raw_stderr"]
      fields: ["principal_role", "principal_id", "parent_principal_id", "source", "status", "action", "tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result", "content", "raw_event"]
      keywords: ["tools/run_ledger_audit.sh", "principal_role", "parent_principal_id", "task_completion", "subagent_lifecycle", "ledger_auditor", "collaboration__spawn_agent", "sessions_spawn", "Agent", "subagent"]
      match: "any"
      case_sensitive: false
      max_events: 50
  - id: hu_pending_interval_is_observable
    type: rubric
    criterion: >
      Score 1 only when the trajectory directly shows an asynchronous child was accepted, remained
      independently pending or running after the dispatch returned, and was correlated with the
      same child identity while the parent yielded or otherwise reached its wait boundary. Score 0
      for a purely blocking dispatch, a completion-only aggregate, a fabricated local process,
      lost child identity, or no direct pending interval. A process continuation performed by an
      explicitly child-attributed principal does not turn the native child into a parent-emulated
      local child. A later prohibited blocking result request, retry, or other Agent violation
      also does not erase a pending interval that was already directly visible with the same child
      identity; those behaviors are scored elsewhere. Missing matching trajectory evidence scores
      0. Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "task_completion", "subagent_lifecycle", "native_event", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["principal_role", "principal_id", "parent_principal_id", "source", "status", "action", "native_event_type", "boundary_kind", "pending_child_ids", "tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result", "content", "text", "messages", "raw_event", "exit_code"]
      keywords: ["\"status\": \"accepted\"", "\"status\":\"accepted\"", "childSessionKey", "async_launched", "agentId", "task_name", "working in the background", "started subagent", "subagent_lifecycle", "still running", "collaboration__wait", "collaboration__wait_agent", "sessions_yield", "assistant.end_turn", "result.completed_empty_end_turn", "turn/end", "parent_turn_end", "yielded", "pending"]
      match: "any"
      case_sensitive: false
      max_events: 50
  - id: hu_completion_signal_is_direct_and_correlated
    type: rubric
    criterion: >
      Score 1 only when the parent-visible trajectory directly carries the matching child's
      CHILD_AUDIT_COMPLETE outcome with the complete sum and nonce, correlated to the recognized
      dispatch, before the parent claims completion. Child-only tool output, workspace artifacts,
      parent-authored repetition, an uncorrelated completion string, nested CLI output, or a
      coordinator-created process do not qualify. The recognized dispatch must be a native
      asynchronous dispatch that previously returned acceptance and child identity; a synchronous
      completion-only call does not qualify. Score 0 for delayed/lost/truncated/ambiguous delivery
      or missing evidence. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "task_completion", "subagent_lifecycle", "native_event", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["principal_role", "principal_id", "parent_principal_id", "source", "status", "action", "native_event_type", "boundary_kind", "pending_child_ids", "parent_reactivated", "tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result", "content", "model_visible_content", "text", "messages", "raw_event", "exit_code"]
      keywords: ["CHILD_AUDIT_COMPLETE", "task_completion", "subagent-settled", "native_author", "task_notification", "4002.13", "HB-L3D-8F3A1C7E92B4", "ledger_auditor"]
      match: "any"
      case_sensitive: false
      max_events: 50
  - id: hu_wait_boundary_returns_control_safely
    type: rubric
    criterion: >
      Score 1 only when an asynchronous native dispatch first returns acceptance and a child
      identity, the parent then performs exactly one native yield/return-to-runtime operation
      while that child is pending, and a directly correlated pushed completion or explicit non-
      completion event reactivates the parent before terminal exit. Score 0 for a
      synchronous/blocking child call, blocking result retrieval, multiple waits/yields,
      resumption without an observable cause, silent exit with a pending child, or chronology that
      cannot be reconstructed. A yield tool's immediate `status=yielded` acknowledgement is not
      the later reactivation cause. Parent-authored prose, a later final_status.json write, and
      child-only output are not substitutes. Claude SDK print mode may batch its preceding empty-
      turn `result` after the pushed notification on stdout. Its normalized pre-notification
      position is valid only when that raw result has no task-notification origin and explicitly
      reports a completed assistant `end_turn` with `last_content_type=none`; a final post-
      notification assistant turn is not valid. The selected evidence must itself contain, after
      the yield and before any final_status write or parent completion claim, a runtime-origin
      event carrying the correlated completion outcome or explicit non-completion notice. If that
      intervening event is absent, score 0 regardless of what the parent later writes or says.
      Missing matching evidence scores 0. Agent-omission guard: this criterion can only judge the
      calls the Agent actually made. If the Agent never issued a call this criterion depends on,
      that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "task_completion", "subagent_lifecycle", "native_event", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["principal_role", "principal_id", "parent_principal_id", "source", "status", "action", "native_event_type", "boundary_kind", "pending_child_ids", "parent_reactivated", "semantic_order_source", "observed_after_child_notification", "tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result", "content", "model_visible_content", "text", "messages", "raw_event", "exit_code", "trace_complete"]
      keywords: ["sessions_yield", "collaboration__wait", "collaboration__wait_agent", "assistant.end_turn", "result.completed_empty_end_turn", "turn/end", "parent_turn_end", "subagent-settled", "task_notification", "parent_reactivated", "yielded", "CHILD_AUDIT_COMPLETE", "status\": \"completed", "status\":\"completed", "out/final_status.json", "pending", "run_finished"]
      match: "any"
      case_sensitive: false
      max_events: 60
  - id: hu_parent_return_boundary_is_explicit
    type: rubric
    criterion: >
      Score 1 only when the selected trajectory contains a distinct native or normalized parent
      boundary event after asynchronous dispatch acceptance and before the correlated child
      completion/non-completion event. Examples include sessions_yield, a native mailbox wait, or
      a typed invocation-suspended/returned event. Score 0 when the boundary is inferred only from
      the later completion notification, ordinary model prose, elapsed time, or a final artifact
      write; when the only wait is a blocking child-result getter; when chronology or child
      correlation is ambiguous; or when evidence is absent. A completion notification is the cause
      of reactivation and cannot also serve as the earlier distinct boundary event. Claude's
      explicit completed-empty-turn native `result` is a boundary record even when print mode
      batches the record after notification; it must carry the strict no-origin EDE fields
      described above and must not be substituted by a later final `end_turn`. Missing matching
      evidence scores 0. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "task_completion", "subagent_lifecycle", "native_event", "raw_stdout", "run_finished", "run_failed"]
      fields: ["principal_role", "principal_id", "parent_principal_id", "source", "status", "action", "native_event_type", "boundary_kind", "pending_child_ids", "parent_reactivated", "semantic_order_source", "observed_after_child_notification", "tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result", "content", "model_visible_content", "text", "raw_event", "exit_code"]
      keywords: ["sessions_yield", "collaboration__wait", "collaboration__wait_agent", "assistant.end_turn", "result.completed_empty_end_turn", "completed_tool_turn", "turn/end", "parent_turn_end", "mailbox", "invocation", "suspended", "returned", "subagent-settled", "task_completion", "task_notification", "parent_reactivated"]
      match: "any"
      case_sensitive: false
      max_events: 60
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "tools/run_ledger_audit.sh", "principal_role", "parent_principal_id"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "tools/run_ledger_audit.sh", "principal_role", "parent_principal_id"]
      match: "any"
      case_sensitive: false
      max_events: 100
