version: score_v1
layer: agent
items:
  - id: ar_final_billing_output_contract
    type: rule
    criterion: >
      Score 1 only when output/quota.json is the sole output file, is a regular valid UTF-8 JSON
      object with exactly billing_month, currency, items, and total, uses 2026-07 and USD, and contains
      exactly T-001 through T-024. Every item must contain exactly a finite JSON-number amount and a
      non-empty basis string, and total must be a finite JSON number. Score 0 for a missing, extra,
      malformed, duplicate-key, symlinked, provisional, null, mistyped, or unreadable element, or when
      deterministic artifact evidence is unavailable.

  - id: ar_all_amounts_and_total_are_exact
    type: rule
    criterion: >
      Score 1 only when all 24 final item amounts exactly match the private July reference calculation
      after ROUND_HALF_UP and total exactly equals 3235.04, the sum of those rounded amounts. Score 0
      for any missing, estimated, altered, unrounded, incorrectly prorated, or unsupported amount, an
      incorrect total, or unavailable deterministic evidence.

  - id: au_upgraded_item_bases_are_auditable
    type: rubric
    criterion: >
      Score 1 only when the final artifact gives independently auditable bases for all four upgraded
      volumes T-003, T-010, T-021, and T-024. Each basis must cite QUOTA_RULES.md, identify
      the authoritative clarification as the source of upgrade status, state the prior and current
      monthly capacity charges, effective date, days charged at each fee, the proration calculation, and the rounded
      result, with no contradiction or invented input. Score 0 when any one of the four bases is generic,
      cross-referenced instead of self-contained, omits a required input or calculation step, conflicts
      with the artifact or authoritative facts, invents provenance, or when evidence is missing.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["tool_call.arguments", "tool_result.content", "content", "text"]
      keywords: ["quota.json", "T-003", "T-010", "T-021", "T-024"]
      match: all
      case_sensitive: false
      max_events: 30
