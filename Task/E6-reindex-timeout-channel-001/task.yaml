id: E6-reindex-timeout-channel-001
title: Timed-out archive reindex errors must reach post-tool observers
scenario:
  domain: Execution
  primary_subscenario: Timeout error propagation
  secondary_subscenarios:
    - Unresponsive archive-reindex worker
    - Native timeout evidence preservation
    - Audit-observer status propagation
harness:
  dimension: E
  subdimension: E6
  subdimension_name: Timeout propagation to post-tool observers
intensity:
  level: L3
  description: A timed-out native execution must independently preserve timeout and failure state in both the initial model-visible result and the correlated native post-tool result event, without inferring either state from missing output.
input:
  mode: single_turn
  turns: turns.json
dependencies:
  workspace_tools: [tools/reindex_archive.sh]
  native_tools: ["native command execution with per-call timeout"]
  mechanisms: [model_visible_timeout_and_failure, correlated_native_post_tool_timeout_and_failure, process_containment, partial_output_preservation]
budget:
  max_turns: 6
  max_tool_calls: 6
  max_wall_time_sec: 120
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, timeout_observation_v1, process_containment_v1, native_terminal_completion_v1]
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: E3d-timeout-error-channel-001
  branch: task_verifier / tasks/new_cases
  what_changed: "The archive-reindex skin and single-turn two-second native timeout
    probe are retained. The verifier is strengthened to keep the initial model-visible
    tool_result and the raw native post-tool result event as separate evidence channels,
    correlate them by native call id, reject wrappers, duplicate or stale calls and
    string-valued pseudo-booleans, verify immutable-fixture and process-containment
    health, and emit only deterministic 0/1 Harness and Agent criteria with explicit
    device-failure and Agent-bypass reasons for attribution."
