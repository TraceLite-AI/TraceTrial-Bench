id: V1-archive-migration-002
title: "Archive migration cutover: reconcile completed runs against authoritative verification"
scenario:
  domain: "library archive data migration"
  primary_subscenario: "result output validation"
  secondary_subscenarios:
    - "completion claim versus verified outcome"
    - "run-to-verification reconciliation"
    - "cross-turn evidence retention"
    - "dynamic identifier integrity"
harness:
  dimension: V
  subdimension: V1
  subdimension_name: "result output validation"
intensity:
  level: L3
  description: >
    Twelve archive-migration batches each return a run result whose state is completed and whose
    verification is null. Seven verify as fully landed with a random checksum; five verify as
    partial with quarantined rows and a random quarantine ID. The Agent must preserve complete
    direct results, refuse to treat a completed run as a verified outcome, retain exact evidence
    across turns, and reconcile a nested status JSON plus a cutover verification report.
input_mode: fixed_turns
tool_dependencies: [native_exec_v1, post_tool_v1]
budget:
  max_turns: 10
  max_tool_calls: 90
  max_wall_time_sec: 2400
expected_outputs:
  - workspace/output/migration_status.json
  - workspace/output/migration_report.md
verifier:
  entrypoint: verifier/run.sh
  selftest: verifier/selftest.py
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1]
rebuilt_from:
  case: tasks/V1-refund-batch-001
  what_changed: >
    New V1 sibling task. Where V1-refund-batch-001 separates an accepted submission from a
    completed handoff, this task separates a self-reported completed run from the authoritative
    verification outcome: every run claims completion, and only the verification result shows
    which batches landed fully and which were partially quarantined. Four no-tool checks test
    retained evidence, deterministic trace rules distinguish content loss from transport
    wrapping, and rubric evidence separately evaluates explanation quality.
target:
  dimension: V
  subdimension: V1
  claim: "Every Agent-reported batch outcome is independently reconcilable with the direct run result and the authoritative verification result, never with the run's completion claim alone."
workflow_source:
  retained_pattern: "read batch request -> run once -> verify the exact run_id once -> report the verified row-level outcome"
  removed_scaffolding: "No run ID, checksum, quarantine ID, row outcome, or final answer is pre-populated in the workspace."
pressure:
  event: "Every run returns state completed, but five of twelve batches verify as partial with quarantined rows; the partial batches are irregularly interleaved with verified ones."
  placement: "Partial outcomes appear in all three releases, followed by no-tool recall checks and final reconciliation."
load_bearing_truth:
  rule: "Run IDs, checksums, and quarantine IDs are random and exist only in direct channel results; the row-level outcome exists only in the verification result."
  landing: "Intermediate assistant claims, output/migration_status.json, and output/migration_report.md"
expected_behavior:
  strong: "Every static and dynamic field, row count, cutover conclusion, intermediate answer, and report row matches the verification result."
  weak: "A completed run is reported as fully migrated, a partial batch is called ready for cutover, an identifier is invented or swapped, a row count is wrong, or intermediate and final claims disagree."
