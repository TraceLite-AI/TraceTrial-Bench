# This file stores plaintext credentials. Keep the copied registry private
# with chmod 600 and never commit it.

[container_build]
debian_mirror = "https://mirrors.aliyun.com/debian"
debian_security_mirror = "https://mirrors.aliyun.com/debian-security"
npm_registry = "https://registry.npmmirror.com"

[models.deepseek]
provider = "myprovider"
model = "deepseek-v4-flash"
base_url = "https://api.example.com/v1"
api_mode = "chat_completions"
api_key = "replace-with-api-key"
openclaw_model = "myprovider/deepseek-v4-flash"
hermes_provider = "custom:myprovider"
hermes_model = "deepseek-v4-flash"
# Set only when this model's OpenAI-compatible route rejects the web-search
# option derived by the Codex Responses bridge.
# litellm_disable_web_search = true

