[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "TraceTrial_Bench"
version = "0.1.0"
description = "TraceTrial_Bench runner with equal-weight Harness/Agent 100-point scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tracer = "harness_tracer.cli:main"
tracetrial_bench = "tracetrial_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness_tracer*", "tracetrial_bench*"]
