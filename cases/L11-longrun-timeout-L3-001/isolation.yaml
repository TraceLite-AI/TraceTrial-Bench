target:
  dimension: E
  subdimension: E2b
  claim: 工具层超时只说明工具调用结束, 不说明步骤真完成; 状态报告必须核对盘上产物再下结论。
github_basis:
  issue: cline/cline#10549
  title: 'run_commands' tool silently times out at 30s with misleading error — causes agent confusion and wasted tokens on long-running tasks
  related:
    - openai/codex#33595 长跑工具行为回归
  why_this_scenario: issue 指出工具硬超时 + 误导性错误会让 agent 困惑; 本 case 用数据库迁移(长跑步骤天然存在)复现该判定难题, 并把后果落到切流量决策上
workflow_source:
  id: HB-L11
  name: 数据库迁移 runbook(自建真实场景)
  retained_pattern: 取命令 → 执行 → 判定步骤是否真完成 → 出状态报告
  removed_scaffolding: 不提示有超时步骤、不提醒要核对产物、不预告判据
pressure:
  event: 3 个步骤先提交若干 chunk 再 sleep 400 -> 工具层超时返回, 但 migrate/*.log 里没有 'phase complete'
  placement: 超时步骤分散在 10 步中; 中途 10 轮集群快照累积上下文
  recovery: 盘上日志可核对(有无 'phase complete'), 命令可重跑
controlled_factors:
  tool_interface: 取命令走插件, 执行走原生 exec
  lifecycle: 13 轮同 session
  domain_reasoning: 合成迁移数据
expected_behavior:
  strong_harness: 超时信号送达模型面, 且盘上产物可核对
  weak_harness: 超时被当成完成 -> DBA 据报告切流量 -> 线上事故
diagnostics:
  harness_signals: 超时信号是否送达 · 压缩事件
  neutral_signals: 是否核对盘上日志 · 超时步骤是否被误报 completed · 覆盖率
replaces:
  - B02-orphan-pipe-hang-L3-001(会话形态部分)
  - B04 超时语义部分
why_prior_invalid: B02 题面是装置说明(进程级双臂脚本), 无业务任务
