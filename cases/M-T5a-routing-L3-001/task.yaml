id: M-T5a-routing-L3-001
title: 运营待办路由（skill 路由）
scenario:
  domain: 运营待办路由
  primary_subscenario: skill 路由
  secondary_subscenarios:
    - 多轮长程
    - 真实业务材料
    - 交付物核对
harness:
  dimension: T
  subdimension: T5a
  subdimension_name: skill 路由
intensity:
