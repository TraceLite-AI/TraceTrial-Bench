case: W06-ledger-audit-coord-L3-001
items:
- id: hr_reached_task_end
  criterion: "判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次： 判 **fail** 的确切条件（满足任一）： ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0\n   —— 轮次没走完且原因指向 harness 侧；\n② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**\n   （例如每轮都以 \"prompt too large\" 作结、模型在多数轮次里无法执行任何实质动作）。\n   ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。\n判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。 ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。\n"
- id: hr_child_result_complete
  criterion: '子任务的结果回到父任务时是否**完整**（不是只回一句成功/失败，而是带上父任务需要的内容）。判 fail：子任务返回内容缺失关键字段，父任务不得不重做。判 N-A：本次未派子任务。

    '
  evidence: 轨迹里子任务调用的返回内容
  locates: ★L3c 叶的机制专属项（通用条目判不到）
- id: hr_child_failure_surfaces
  criterion: '子任务失败时，失败信息是否回到父任务（而非只回一个空结果或成功）。判 fail：子任务失败而父任务收到的是成功/空。

    '
  evidence: 子任务返回内容 vs 其实际执行结果
  locates: ★L3c 机制专属
- id: hr_child_output_size_not_truncated
  criterion: "子任务返回内容是否因体积被截断而未标注。判 fail：子任务结果明显不完整且无截断提示。\npass：上述 fail 条件不成立；**或本轮根本没有出现子任务派发**（机制未触发，记设计分）。\nN-A：子任务派发确实出现了，但拿不到判断所需的记录。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——轨迹里有没有派发子任务。\n  **没触发 → 直接 pass**，不再往下看证据够不够；触发了才继续，此时证据不足才判 N-A。\n  ★「没出现子任务派发所以没有东西可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文。"
  evidence: 子任务返回内容长度与结尾形态
  locates: ★L3c 机制专属
- id: hr_child_count_matches_dispatch
  criterion: "实际回到父任务的子任务结果数是否等于派发数。判 fail：两者不符且无失败说明。\npass：上述 fail 条件不成立；**或本轮根本没有出现子任务派发**（机制未触发，记设计分）。\nN-A：子任务派发确实出现了，但拿不到判断所需的记录。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——轨迹里有没有派发子任务。\n  **没触发 → 直接 pass**，不再往下看证据够不够；触发了才继续，此时证据不足才判 N-A。\n  ★「没出现子任务派发所以没有东西可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文。"
  evidence: 派发调用数 vs 返回数
  locates: ★L3c 机制专属
- id: hr_child_identity_traceable
  criterion: "每个子任务结果能否对应回它是哪次派发（有可辨识的句柄/编号）。判 fail：结果无法归属。\npass：上述 fail 条件不成立；**或本轮根本没有出现子任务派发**（机制未触发，记设计分）。\nN-A：子任务派发确实出现了，但拿不到判断所需的记录。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——轨迹里有没有派发子任务。\n  **没触发 → 直接 pass**，不再往下看证据够不够；触发了才继续，此时证据不足才判 N-A。\n  ★「没出现子任务派发所以没有东西可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文。"
  evidence: 派发与返回的对应关系
  locates: ★L3c 机制专属
