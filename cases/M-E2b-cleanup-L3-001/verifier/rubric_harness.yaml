version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: e2_value_recovered_via_channel
    kind: gate
    core: true
    axis: E2b
    dim: procedural
    layer: HR
    criterion: "12 个清理命令档是否**全部**经 `e2` 工具通道真正恢复（12 档中命令有界返回并拿到 marker 的比例（回收存活曲线））"
  - id: e2_hard_rank_recovered
    kind: gate
    core: false
    axis: E2b
    dim: procedural
    layer: HR
    criterion: "难度过半的清理命令档（rank>50%）是否全部经通道恢复（重度残留档（孤儿持管道类）的有界返回比例）"
  - id: e2_receipt_delivered_to_model
    kind: gate
    core: false
    axis: L2a
    dim: procedural
    layer: HR
    criterion: "`e2_submit` 回执是否全部经工具通道送达模型"
  - id: e2_no_hard_wall
    kind: gate
    core: false
    axis: E2b
    dim: procedural
    layer: HR
    criterion: 是否不存在某清理命令档难度之后全部不可达的硬墙
  - id: e2_failure_observable
    kind: gate
    core: false
    axis: E2b
    dim: procedural
    layer: HR
    criterion: 清理命令档失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: e2_channel_not_bypassed
    kind: gate
    core: true
    axis: O1a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `e2` 工具通道取得（未用 shell 绕过）"
  - id: HR7_bounded_termination
    kind: gate
    core: true
    axis: E2b
    dim: procedural
    layer: HR
    criterion: 存在可观测的超时边界，未整体拖到外层强杀
  - id: HR8_hang_point_localised
    kind: gauge
    core: false
    min_score: 0.8
    axis: L2a
    dim: procedural
    layer: HR
    criterion: 挂死起点被定位并记录的完整度
