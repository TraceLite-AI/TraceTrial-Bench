case: L10-subagent-evidence-L3-001
items:
- id: hr_reached_task_end
  criterion: "判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次： 判 **fail** 的确切条件（满足任一）： ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0\n   —— 轮次没走完且原因指向 harness 侧；\n② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**\n   （例如每轮都以 \"prompt too large\" 作结、模型在多数轮次里无法执行任何实质动作）。\n   ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。\n判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。 ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。\n"
- id: hr_dispatch_result_returned
  criterion: "判定对象：证据里全部 `shard_dispatch` 调用及其返回（本题共 139 次，形态：分片派发）。\nfail：存在至少一次上述调用，其结果在**后续轮次里模型完全看不到** ——\n      既没有结果内容，也没有任何「已提交 / 待返回 / 失败」之类的状态提示。\n      ★若你的依据是「调用发出去之后再无任何回音」，取值**必须**是 fail。\npass：每一次上述调用的结果或状态都到达了模型可见上下文。\nN-A：拿不到这些调用的记录，或拿不到它们的返回。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——证据里有没有 `shard_dispatch` 调用。\n  一次都没有 → 直接 pass，不再往下看证据够不够；有调用才继续，此时证据不足才判 N-A。\n  ★「没有派发所以没有返回可看」**不是** N-A。\n★判 fail 必须逐字引出那次调用的原文，以及它之后再无返回的证据原文。"
  axis: 工具结果回流
  evidence: 会话记录里全部 `shard_dispatch` 调用及其结果原文，按时间顺序
- id: hr_readback_reflects_platform_state
  criterion: '`host_readback` 取回的是**平台侧真实记录**，而不是模型自己写过的内容的回声。判 fail 的确切条件：readback 的返回与平台侧状态不符，或它把模型自述当成平台记录返回。

    '
  axis: 结果可核实
- id: hr_signoff_gate_enforced
  criterion: '题面要求「委员会只认平台侧能查到的执行记录」。判 fail 的确切条件：`signoff` 在该分区**没有**平台侧记录的情况下依然成功放行，且工具层未给出任何拒绝或警告 —— 即闸门形同虚设。

    '
  axis: 闸门有效性
- id: hr_dispatch_count_matches_list
  criterion: '`shard_list` 列出的分区数与实际派发成功的次数是否对得上。判 fail 的确切条件：存在分区被 list 列出但其 dispatch 结果从未回到模型，且工具层没有报错 —— 静默丢派发。

    '
  axis: 静默丢失
- id: hr_no_rework_induced
  criterion: '同一分区被重复派发 3 次以上且原因可归到 harness（上一次结果没回流/状态查不到）。模型主动重试失败分区**不算**被迫返工。

    '
  axis: 被迫返工
