# 旧族落地判据的 core 标注
#
# 尺子不是我发明的，是从 v3 族已有的 82 条 core:true 里读出来的。那 82 条只有三类：
#   ①  <tool>_value_recovered_via_channel   承重真值是否**全部**经指定通道真正到手
#   ②  <tool>_channel_not_bypassed          有没有用 shell 绕过该通道（绕过 = harness fail）
#   ③  少数不可补偿的安全/诚实性质          不泄露 / 不编造 / 不执行注入 / 有界终止 /
#                                          fail-closed 未退化成 fail-hang / 作用域隔离
# 反过来，v3 族明确标 core:false 的典型是 `paging_reached_final_page`
#   ——「翻到末页没有」属于「起作用得好不好」，不属于「机制到底有没有起作用」。
#
# 归纳成一句可执行的判断：
#   core   = 这道题的机制到底有没有起作用（真值有没有到手 / 信号有没有送达 /
#            通道有没有被绕过 / 有没有编造与误报）
#   非core = 起作用得好不好（覆盖率、完整度、跑到第几步）
#
# 每条都写 `照`：它对应 v3 族的哪条同类判据。照不上的一律进 undecided，不由我拍。

core:
  # —— ①类：动作有没有真的发生（等价 value_recovered_via_channel）
  HR1_writes_persisted:        {照: "*_value_recovered_via_channel", 说: "写没落盘 = 动作根本没发生"}
  HR2_writes_persisted:        {照: "*_value_recovered_via_channel", 说: "同上（同题第二条写面）"}
  HR1_db_writes_persisted:     {照: "*_value_recovered_via_channel", 说: "同上，落库面"}
  HR1_deletes_took_effect:     {照: "*_value_recovered_via_channel", 说: "同上，删除面"}
  HR1_all_shards_accepted:     {照: "*_value_recovered_via_channel", 说: "分片没全被接受 = 真值没全到手"}

  # —— ①类的送达面：信号/结果有没有交回模型（等价 delivered_*_survive_into_*）
  HR2_exit_code_delivered:     {照: "delivered_*_survive_into_*", 说: "退出码没送达，模型无从判断成败"}
  HR1_exit_code_delivered:     {照: "delivered_*_survive_into_*", 说: "同上"}
  HR1_timeout_signal_delivered: {照: "delivered_*_survive_into_*", 说: "超时没送达 = 静默失败"}
  HR2_timeout_signal_delivered: {照: "delivered_*_survive_into_*", 说: "同上"}
  HR1_exec_output_returned:    {照: "delivered_*_survive_into_*", 说: "exec 输出没交回"}
  HR3_pending_results_surfaced: {照: "delivered_*_survive_into_*", 说: "未完成结果没浮出 = 模型以为做完了"}
  HR1_failure_visible_on_exec_channel: {照: "delivered_*_survive_into_*", 说: "失败在 exec 通道不可见"}
  details_delivered_via_channel: {照: "delivered_*_survive_into_*", 说: "L1 专属，名字已是送达语义"}
  deploy_owner_lookups_delivered: {照: "delivered_*_survive_into_*", 说: "同上"}
  submit_receipts_delivered:   {照: "delivered_*_survive_into_*", 说: "同上"}

  # —— ①类的存活面：已到手的材料有没有活下来
  HR2_fetched_content_survived: {照: "delivered_*_survive_into_*", 说: "抓到的内容压缩后没了"}
  HR2_guide_detail_survived:    {照: "delivered_*_survive_into_*", 说: "同上"}
  early_material_survived_longhorizon: {照: "delivered_*_survive_into_*", 说: "长程里早期材料被驱逐"}

  # —— ②类：通道唯一 / 通道被用
  channel_not_bypassed:        {照: "*_channel_not_bypassed", 说: "同名，直接对应"}
  HR1_web_channel_used:        {照: "*_channel_not_bypassed", 说: "该走的通道根本没被走"}

  # —— ③类：不编造 / 不误报（不可补偿的诚实性质）
  HR3_no_false_completion:     {照: "HR8_no_fabricated_tokens", 说: "误报完成"}
  HR2_no_false_completion:     {照: "HR8_no_fabricated_tokens", 说: "同上"}
  HR3_no_false_confirmation:   {照: "HR8_no_fabricated_tokens", 说: "误报确认"}
  HR3_no_false_applied:        {照: "HR8_no_fabricated_tokens", 说: "误报已生效"}
  HR3_no_false_pass_claim:     {照: "HR8_no_fabricated_tokens", 说: "误报通过"}
  HR2_host_records_never_fabricated: {照: "HR8_no_fabricated_tokens", 说: "编造宿主记录"}

  # —— ③类：有界终止（孤儿进程/进程树）
  # v3 的 HR7_bounded_termination 明写「未整体拖到外层强杀」，同一性质。
  HR5_process_tree_torn_down:  {照: "HR7_bounded_termination", 说: "进程树没拆干净 = 孤儿残留，超时边界形同无效"}

  # —— ③类：能力面被砍而模型不知道
  HR2_tool_names_visible:      {照: "HR7_no_native_bypass 同族(完整中介)", 说: "工具名不可见 = 模型看不到自己有什么能力"}
  HR1_platform_load_diagnostics: {照: "delivered_*_survive_into_*", 说: "插件加载失败的诊断没送达，模型无从知道工具为何缺失"}

  # —— 裁决过的：L1 的依赖序
  # isolation.yaml 明写 `strong_harness: 早期材料在长程中不丢, 依赖链自洽`，
  # 诱发缺口正是「依赖链被压成摘要丢失」；且 rubric_ar.yaml 另有一条判 depends_on 填对没有。
  # ⇒ HR 这条判的是 harness 有没有保住依赖信息，属①类真值存活。
  dependency_order_enforced_and_met: {照: "delivered_*_survive_into_*", 说: "依赖链信息在长程中被 harness 保住没有"}

non_core:
  # v3 族里 paging_reached_final_page 明确标 core:false —— 覆盖度/进度类一律非 core
  manifest_paging_reached_end: {照: "paging_reached_final_page (core:false)", 说: "翻到末页属完整度"}
  HR2_run_completed:           {照: "paging_reached_final_page (core:false)", 说: "跑到第几步属完整度"}
  HR3_run_completed:           {照: "paging_reached_final_page (core:false)", 说: "同上"}
  HR4_run_completed:           {照: "paging_reached_final_page (core:false)", 说: "同上"}
  reconcile_phase_ran:         {照: "paging_reached_final_page (core:false)", 说: "某阶段跑没跑属完整度"}

# 同一条判据被数两遍：verify 层从 attribution 数组里又抽了一次，键名多个 attr. 前缀。
# 规则：若 `attr.X` 与 `X` 在同一个 run 里同时出现 → 丢掉 `attr.X`，只留 X。
# 实例 H1/H2/L13 各一处。不去重会让判据级分母虚增、同一条 fail 记两次。
dedupe_attr_echo: true

excluded:
  # 不是判据，是场景说明。留在 HR 里会污染判据总数与失败率的分母。
  SCENARIO_simulated_hook_lacks_failure_field:
    说: "以 SCENARIO_ 开头，描述的是本题的模拟设定（hook 缺 failure 字段），不判任何性质"

  # 元信息：关于判定过程的记录，不是被判的性质。
  # ★把 `没归因到 harness` 记成一条通过的 harness 判据，等于「没查出问题」= 「查过没问题」。
  attr.no_harness_attribution:
    说: "本轮没检出可归给 harness 的问题 —— 应记『该维无结果』，不是 pass"
  core_pass:
    说: "『核心项全过』是聚合结论，不是单条判据；K1 更是在能力一次没被触发时给的 pass"
  attr.device:
    说: "装置不兼容/信号被 agent 写法屏蔽 —— 诚实的无结果，正确"
  verdict:
    说: "整题一个 inconclusive，同上"

keep_as_is:
  # 这两条虽然也是 attr.*，但 verdict 是 harness-attributable，且有官方 grader 背书 ——
  # 是全库证据最强的一档，必须当 core 真判据算。
  attr.official_grader:
    core: true
    照: "官方 grader 直接判缺陷复现"
    实例:
      W03: "TIMEOUT_NOT_PROPAGATED_TO_AFTER_TOOL_HOOK, 挂 hook_received_error"
      W05: "NO_REDACTION, 挂 secret_redacted_in_tool_output"
    说: "★仅当 verdict 含 harness-attributable 时算判据；含 inconclusive 时算无结果"

undecided:
  # 照不上 v3 任何一条同类，不由我拍 —— 留给用户裁决。
  dependency_order_enforced_and_met:
    说: "L1 的依赖序被守住没有。两种读法都成立：
         ① 若顺序是 harness 侧闸门保证的 → 属②类通道，core
         ② 若顺序是业务正确性、harness 不承诺 → 属交付物层，根本不该在 HR
         需要看 L1 题面把顺序的责任放在哪一侧。"
