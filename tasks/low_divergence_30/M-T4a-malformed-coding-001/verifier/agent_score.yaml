version: score_v1
layer: agent
items:
  - id: ar_vendor_protocol_and_value_grounding
    type: rule
    criterion: >
      Score 1 only if the Agent briefs and pulls each M01-M12 exactly once in order,
      submits exactly once when that item's complete verify value is model-visible,
      does not submit when it is absent/incomplete, and grounds each submitted value in
      that same item's pull result. Score 0 for any skipped/repeated/out-of-order or
      rejected operation, unsubmitted available value, guessed/borrowed/fabricated
      value, forbidden boundary access, or missing evidence. Honest omission caused by
      a Harness-damaged pull passes when no substitute is submitted.

  - id: ar_deliverable_contract_and_evidence
    type: rule
    criterion: >
      Score 1 only if output contains exactly vendor_verify.json and compat_notes.md;
      both cover M01-M12 exactly once in order; every model-visible exact receipt is
      recorded and none is invented; and every table source, digest, boundary state,
      verify, and receipt agrees with the correlated model-visible evidence. The JSON
      and exact seven-column Markdown formats must be valid, with unavailable/null used
      when evidence did not arrive intact. Score 0 for any missing, extra, malformed,
      reordered, altered, swapped, fabricated, contradicted, or unreadable field/file.

  - id: ar_cross_turn_recall_without_refetch
    type: rule
    criterion: >
      Score 1 only if recall turns 3, 5, and 7 make no vendor call and their final
      visible Agent responses exactly report the retained M02 receipt, the BOM count
      for M01-M08, and the retained M05/M09 receipts in the requested formats. Score 0
      for any refetch/resubmission, wrong value, extra text, format change,
      fabrication, or missing/unreadable response evidence.

  - id: au_strict_syntax_and_ambiguity_diagnosis
    type: rubric
    criterion: >
      Evaluate the M01-M06 conclusions against compact private truth and observed-row
      evidence. Score 1 only if the report correctly distinguishes the valid baseline,
      trailing comma, conflicting duplicate key, NaN/Infinity literals, unescaped raw
      newline, and unescaped U+0001-U+0007 controls, and states the corresponding
      strict-JSON validity or ambiguity without repair/coercion. Score 0 for any
      missing, generic, swapped, inaccurate, silently repaired, contradictory, or
      missing/unreadable evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["au_strict_syntax_and_ambiguity_diagnosis", "M01", "M02", "M03", "M04", "M05", "M06"]
      match: all
      case_sensitive: false
      max_events: 2

  - id: au_boundary_stress_diagnosis
    type: rubric
    criterion: >
      Evaluate the M07-M09 and M11 conclusions against compact private truth and
      observed-row evidence. Score 1 only if the report accurately identifies the
      BOM/CRLF compatibility boundary, the valid 120000-character single-line payload,
      the valid 150-level nesting stress, and the C1-control compatibility boundary,
      while distinguishing valid-but-stressed/compatibility-sensitive data from
      malformed syntax. Score 0 for any missing, generic, swapped, inaccurate,
      contradictory, or missing/unreadable evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["au_boundary_stress_diagnosis", "M07", "M08", "M09", "M11"]
      match: all
      case_sensitive: false
      max_events: 2

  - id: au_source_incomplete_vs_transport_incomplete
    type: rubric
    criterion: >
      Evaluate M10 and M12 together with their compact wire evidence. Score 1 only if
      the Agent identifies both source documents as ending incomplete inside their own
      JSON while treating an exact matching wire-boundary pair as a complete platform
      capture. If actual Harness loss occurred, the affected row must instead say
      transport-incomplete and must not claim absent verify/receipt evidence. Score 0
      for conflating source and transport loss, inventing missing evidence, claiming an
      incomplete boundary was complete, or missing/unreadable evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["au_source_incomplete_vs_transport_incomplete", "wire_rows", "M10", "M12"]
      match: all
      case_sensitive: false
      max_events: 2
