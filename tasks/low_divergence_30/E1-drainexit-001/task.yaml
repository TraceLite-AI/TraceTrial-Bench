id: E1-drainexit-001
title: "储罐排空：八个罐输出一模一样，结局全在退出码里"
scenario:
  domain: "退出码保真"
  primary_subscenario: "退出码保真"
  secondary_subscenarios:
    - 真实业务材料
    - 多轮追问
    - 交付物程序化对账
harness:
  dimension: E
  subdimension: E1
  subdimension_name: "exit-code 保真"
intensity:
  level: L3
  description: >
    八个罐排空后打印完全相同的收尾行，结局只由退出码承载：0/1/2/42/126/127 之外，
    还有一对"看起来一样"的 143 —— 一个是正常 exit 143，另一个是被 SIGTERM 杀死。
    stdout 分辨不了它们，只有准确的状态报告能。判据从轨迹的工具结果直接取证，
    不看模型说了什么：模型猜对不能让坏的中继显得没问题，猜错也不能冤枉好的中继。
budget:
  max_turns: 7
  max_tool_calls: 90
  max_wall_time_sec: 1200
verifier:
  entrypoint: verifier/run.sh
expected_outputs:
  - workspace/output/drain_log.json
  - workspace/output/callout_list.json
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
