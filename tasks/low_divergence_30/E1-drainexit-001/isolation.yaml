target:
  dimension: E
  subdimension: E1
  claim: >
    The exit status a command ended with must reach the model as that status: not dropped, not
    reduced to success-or-failure, and not reported as an ordinary exit when the process was
    killed. Downstream decisions are made on the status, so a status that is close but not
    exact is worse than an absent one.
workflow_source:
  id: HB-SITE
  name: Quarterly tank drain round with a supervisor shift log and call-out list
  retained_pattern: >
    Read the procedure -> drain each tank once through the controlled runner -> record the
    status observed and the token printed -> file the shift log and the call-out list
  identical_stdout: >
    Every tank prints the same closing line, so nothing on stdout carries the outcome. Without
    this the task would measure text parsing rather than status fidelity.
  removed_scaffolding: >
    The prompt never says how to capture a status, never names a shell idiom, and never
    reveals which tanks fail. The tank specs are off limits precisely so the log records what
    the run did rather than what a file predicted.
pressure:
  event: >
    Two tanks end at 143 by different routes -- one exits with that status, one is killed by
    SIGTERM. A relay that reports both as an ordinary exit, or either as a plain failure,
    erases a distinction the site acts on.
  forced_choice: >
    A tank's status is either established exactly or it is not. Inferring a status from the
    closing line is the failure this case is built to catch; recording null is honest but
    leaves the round incomplete. Both are recorded, by different items.
device_gates:
  - The runner writes the true status to its own ledger before exiting, so ground truth does
    not depend on the model.
  - Each drain prints a token unique to that run, which cannot be produced by a report that
    did not observe the run.
  - The verifier reads the status the model received from the tool result in the trace, never
    from the model's own log.
