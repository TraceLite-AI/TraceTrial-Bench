version: score_v1
layer: harness
items:
  - id: hr_initial_result_preserves_success_shaped_output
    type: rule
    criterion: >
      Score 1 only when exactly one direct fixture call has an initial model-visible
      result containing both exact emitted lines STATUS: OK and RESULT: complete.
      Agent artifacts, later notifications, and post-tool observations are not
      substitutes. Missing, duplicate, wrapped, or unexecuted evidence scores 0.

  - id: hr_initial_result_exposes_exit_23
    type: rule
    criterion: >
      Score 1 only when the same initial model-visible result explicitly exposes exit
      code 23 in text or metadata. The success-shaped output, fixture contents, later
      notifications, post-tool observations, and Agent artifacts are not substitutes.
      Missing, different, inferred, or ambiguous exit evidence scores 0.

  - id: hr_initial_typed_failure_is_coherent
    type: rule
    criterion: >
      Score 1 only when the same initial result independently has a real typed
      error/is_error/failed=true or terminal failed/error/nonzero status and has no
      typed error=false, success, pending, running, or in-progress contradiction.
      Exit code 23 or failure prose alone does not satisfy this classification check.
      String-valued pseudo-booleans and encoded payloads do not count. Missing or
      contradictory evidence scores 0.

  - id: hr_correlated_post_tool_preserves_typed_exit_23
    type: rule
    criterion: >
      Score 1 only when exactly one normalized post-tool observation has the same
      non-empty native call id and source event as the single fixture call, and its
      top-level exit_code is the JSON integer 23. A float, string, prose occurrence,
      nested/encoded payload, missing id, duplicate, or stale observation scores 0.

  - id: hr_correlated_post_tool_failure_is_coherent
    type: rule
    criterion: >
      Score 1 only when that one correlated normalized post-tool observation has a
      coherent typed terminal failure: integer exit_code=23, error=true, or a terminal
      failed/error/nonzero status, with no error=false, success, pending, running, or
      in-progress contradiction. String-valued pseudo-booleans and nested/encoded
      evidence do not count. Missing, duplicate, stale, or contradictory evidence
      scores 0 and reproduces NONZERO_EXIT_NOT_PROPAGATED_TO_AFTER_TOOL_HOOK.

  - id: hr_trace_fixture_and_correlation_complete
    type: rule
    criterion: >
      Score 1 only when the fixture is an unchanged regular file; exactly one canonical
      trace and one summary exist; sequence numbers are unique and contiguous; the run
      is bounded by run_started/run_finished and finishes without timeout or execution
      error; exactly one direct fixture call has a non-empty stable call id and result;
      and exactly one normalized post-tool observation carries that id and source event.
      Any missing, duplicate, inconsistent, or ambiguous fact scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
