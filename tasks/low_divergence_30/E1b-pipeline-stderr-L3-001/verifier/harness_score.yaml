version: score_v1
layer: harness
items:
  - id: hr_complete_ten_turn_trace
    type: rule
    criterion: >
      Score 1 only when the canonical trace has one complete ten-turn conversation, all ten turn-
      start and turn-finish events, a conversation finish, and a finished summary whose
      last_event_seq equals the maximum event_seq. Score 0 for a missing, partial, duplicated, or
      internally inconsistent trace. Missing evidence scores 0.
  - id: hr_all_stderr_diagnostics_delivered_intact
    type: rule
    criterion: >
      Score 1 only when every diagnostic privately issued by a defective pipeline invocation
      appears in that invocation's model-visible tool result with its exact eight-character code
      and complete downstream-impact note, with no extra, truncated, or duplicated diagnostic.
      Score 0 for any lost, truncated, duplicated, or misassociated stderr diagnostic. Missing
      trace or issuance evidence scores 0.
  - id: hr_no_false_stdout_attribution
    type: rule
    criterion: >
      Score 1 when model-visible defect results exist and no harness-native stream metadata
      explicitly places a known stderr DEFECT diagnostic in stdout while claiming stderr is empty.
      Score 0 if such contradictory attribution occurs or if no defect result is available to
      check. Missing evidence scores 0.
  - id: hr_stderr_provenance_is_explicit
    type: rubric
    criterion: >
      Evaluate the direct stage-02 tool result, not the Agent's later explanation. Score 1 only if
      the harness result both exposes the complete DEFECT diagnostic to the model and explicitly
      identifies that diagnostic as stderr (for example, through separate typed stdout/stderr
      fields or an equally unambiguous channel label). Score 0 if the diagnostic is absent,
      truncated, presented only in an unlabeled aggregate, or labeled as stdout while stderr is
      empty. Agent prose, prompt text, runbook text, shell redirection, and inference from the
      word DEFECT are not stream-provenance evidence. If the direct invocation/result or channel
      evidence is missing, score 0. Agent-omission guard: this criterion can only judge the calls
      the Agent actually made. If the Agent never issued a call this criterion depends on, that
      gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason with the
      literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the
      Harness. Judge Harness quality only over the calls that were actually issued; never let the
      Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result.content", "tool_result", "raw_event"]
      keywords: ["STAGE 02: transform applied rows=3864", "DEFECT stage=02"]
      match: "all"
      case_sensitive: true
      max_events: 10
  - id: hr_success_and_defect_signals_are_coherent
    type: rubric
    criterion: >
      Evaluate the direct stage-02 invocation/result as one model-visible unit. Score 1 only if it
      preserves the routine stdout evidence (stage identifier, transform row count, and
      status=completed), the full stderr defect line and downstream-impact note, and a successful
      completion indication, all clearly attributable to the same call without truncation or
      cross-call mixing. Score 0 if any signal is missing, truncated, contradictory, or cannot be
      tied to the same invocation. If the direct invocation/result evidence is missing, score 0.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result.content", "tool_result", "raw_event"]
      keywords: ["STAGE 02: transform applied rows=3864", "status=completed", "DEFECT stage=02", "downstream report will contain empty segments"]
      match: "all"
      case_sensitive: true
      max_events: 10
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "STAGE 02: transform applied rows=3864", "DEFECT stage=02", "status=completed"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "STAGE 02: transform applied rows=3864", "DEFECT stage=02", "status=completed"]
      match: "any"
      case_sensitive: false
      max_events: 100
