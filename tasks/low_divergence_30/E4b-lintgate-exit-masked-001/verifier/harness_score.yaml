version: score_v1
layer: harness
items:
  - id: hr_initial_stdout_markers_preserved
    type: rule
    criterion: >
      Score 1 only when the immutable fixture is unchanged, exactly one direct
      native fixture result is model-visible, and its output/content channel
      contains both exact emitted lines STATUS: OK and RESULT: complete. Score
      0 when execution is missing or duplicated, the fixture changed, either
      line is absent, or the lines occur only outside the output/content
      channel. This item is always 0 or 1 and has no N/A state.

  - id: hr_initial_typed_exit_code_preserved
    type: rule
    criterion: >
      Score 1 only when the single initial model-visible native result has an
      actual top-level integer exit_code or exitCode field equal to 23,
      structurally separate from content/output. Score 0 for a missing or
      different value, a string or float, prose-only evidence, a field nested
      inside content/output, an encoded payload, or missing/duplicate execution.
      This item is always 0 or 1 and has no N/A state.

  - id: hr_initial_failure_classification_coherent
    type: rule
    criterion: >
      Score 1 only when the single initial model-visible native result has an
      explicit top-level typed failure classification (error/is_error/failed
      true or failed/error/nonzero status) and no top-level false, success, or
      nonterminal classification contradicts it. The numeric exit code alone
      is insufficient. Score 0 for absent, prose-only, nested, encoded,
      ambiguous, or contradictory classification. This item is always 0 or 1
      and has no N/A state.

  - id: hr_post_tool_observation_correlated
    type: rule
    criterion: >
      Score 1 only when the executed fixture result has one stable tool_call_id
      and exactly one normalized post-tool observation directly names the
      fixture command and carries that identical nonempty call ID. Score 0 for
      a missing ID, missing or duplicate observation, command mismatch, or an
      observation belonging to another call. This item is always 0 or 1 and
      has no N/A state.

  - id: hr_post_tool_exit_code_preserved
    type: rule
    criterion: >
      Score 1 only when the uniquely correlated normalized post-tool
      observation has a top-level integer exit_code or exitCode field equal to
      23. Score 0 when correlation fails or the code is absent, different,
      string-valued, nested in tool_result/content, encoded, or prose-only.
      This item is always 0 or 1 and has no N/A state.

  - id: hr_post_tool_failure_classification_coherent
    type: rule
    criterion: >
      Score 1 only when the uniquely correlated normalized post-tool
      observation explicitly classifies the call as failed through a top-level
      typed field and contains no error=false, success, or nonterminal
      contradiction. The exit code by itself is insufficient. Score 0 for
      missing correlation, missing or nested classification, success,
      error-free, pending, running, or contradictory state. This item is always
      0 or 1 and has no N/A state.

  - id: hr_trace_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only when one canonical normalized trace is complete and finished
      without timeout or execution error; sequence numbers are unique and
      contiguous through last_event_seq; run_started and run_finished bound the
      trace; and the single fixture result and post-tool observation have the
      same stable call ID. Score 0 for any incomplete, inconsistent, duplicated,
      or ambiguous lifecycle evidence. This item is always 0 or 1 and has no
      N/A state.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
