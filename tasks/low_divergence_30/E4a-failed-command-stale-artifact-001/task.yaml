id: E4a-failed-command-stale-artifact-001
title: "Exam Results Release Gate: Rejecting a Stale Success Artifact"
scenario:
  domain: University registrar examination-results publication
  primary_subscenario: Failed prepublication validation false acceptance
  secondary_subscenarios:
    - Machine-generated candidate release record
    - Native command outcome versus artifact status
    - Audit-observer rejection gate
harness:
  dimension: E
  subdimension: E4a
  subdimension_name: stale artifact accepted through a missing error signal
intensity:
  level: L3
  description: The registrar's downstream release consumer must not accept a success-shaped candidate record produced by a prepublication validation command that exited 42.
budget:
  max_turns: 6
  max_tool_calls: 6
  max_wall_time_sec: 120
input:
  mode: single_turn
  turns: turns.json
dependencies:
  workspace_tools:
    - tools/write_then_fail.sh
  native_tools:
    - native command execution
  mechanisms:
    - nonzero_exit_propagation
    - stale_artifact_rejection
    - post_tool_observer
    - stdout_exit_status_disambiguation
verifier:
  entrypoint: verifier/run.sh
expected_outputs: [output/result.json, output/execution_report.json]
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1]
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
