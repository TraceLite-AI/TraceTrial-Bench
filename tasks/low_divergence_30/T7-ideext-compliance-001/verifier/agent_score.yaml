version: score_v1
layer: agent
items:
  - id: ar_output_contract_exact
    type: rule
    criterion: "1 iff output contains only the required UTF-8 report with exact headings, eight-column table, six ordered rows, and one exact rejected-count line; otherwise 0."
  - id: ar_manifest_and_inspection_workflow_exact_once
    type: rule
    criterion: "1 iff the manifest and every bundle inspection each occur successfully exactly once in both native trace and committed simulator ledger; otherwise 0."
  - id: ar_verdict_submissions_exact_once_and_correct
    type: rule
    criterion: "1 iff every bundle has exactly one committed and native verdict submission with the exact decision and violation list; otherwise 0."
  - id: ar_declared_tools_and_vendors_exact
    type: rule
    criterion: "1 iff every row preserves the exact vendor and every complete declared tool name, including duplicates, in declaration order; otherwise 0."
  - id: ar_schema_audit_definition_complete
    type: rule
    criterion: "1 iff every declared definition has one indexed exact-name audit with all five binary checks, and only fox_lookup propertyTypes fails with exact query/type/strng evidence; otherwise 0."
  - id: ar_decisions_violations_and_count_exact
    type: rule
    criterion: "1 iff only VB-101/VB-104 are approved, all other decisions and violation-code sets are exact, and rejected count is exactly four; otherwise 0."
  - id: ar_platform_observations_exact
    type: rule
    criterion: "1 iff every row explicitly reports exact loaded status, registry policy, active names, overwrite state, and empty diagnostics, including VB-102 last-definition-wins; otherwise 0."
  - id: ar_violation_evidence_specific_and_complete
    type: rule
    criterion: "1 iff the four rejected rows give exact offending names and concrete evidence: duplicate indices, reserved build, full 144-character name versus limit 64, and fox_lookup query type strng; otherwise 0."
  - id: ar_remediation_minimal_and_preserves_siblings
    type: rule
    criterion: "1 iff approved rows prescribe none and each rejected row gives the smallest compliant correction while explicitly preserving its valid sibling; otherwise 0."
  - id: ar_full_names_never_abbreviated
    type: rule
    criterion: "1 iff the complete 144-character name is used wherever required and the report contains no shortened hbext name or ellipsis; otherwise 0."
  - id: ar_no_prohibited_hidden_or_network_access
    type: rule
    criterion: "1 iff the trace contains no network use or access to hidden bridge, simulator, verifier, Harness configuration, or prior-run artifacts; otherwise 0."
