id: T7-ideext-compliance-001
title: "Pre-release editor-extension command and input-Schema registration compliance review"
scenario:
  domain: "Workflow Automation"
  primary_subscenario: "Editor-extension command and Schema registration compliance"
  secondary_subscenarios:
    - "Lossless structured inspection results"
    - "Duplicate declaration and registry-effect preservation"
    - "Long-name and invalid-Schema literal preservation"
    - "Native call/result and receipt correlation"
harness:
  dimension: T
  subdimension: T7
  subdimension_name: "Structured result fidelity"
intensity:
  level: L3
  description: "Six bundles require definition-level name and Schema auditing, declared-versus-active registry reconciliation, exact verdict submission, and minimal remediation even though a permissive registry silently activates invalid definitions."
budget:
  max_turns: 1
  max_tool_calls: 20
  max_wall_time_sec: 600
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
expected_outputs:
  - workspace/output/compliance_review.md
business_simulator:
  version: unix_json_v1
  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: .harnessbench/simulator-cli
task_tools:
  version: mcp_stdio_v1
  manifest: simulator/tools.json
execution_probe:
  version: lifecycle_v1
  requires: [task_tools_v1, claude_completed_tool_turn_soft_exit_v1]
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: L13-plugin-compliance-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain and aligned to structured-result fidelity:
    the same six bundles VB-101..VB-106 in the same order with
    the same verdicts and the same one violation each at the same ordinals (duplicate name
    at 102, reserved name at 103, 144-character generated name at 105, misspelled property
    type at 106), the same clean sibling in every rejected bundle, the same permissive
    last-definition-wins registry policy, the same 64-character name limit, the same four
    violation codes, the same eight-column report contract and Rejected bundles: N line, the
    same single-turn shape, the same budget triple, both score rubrics with their evidence
    blocks, and score.py rule logic.
    The six vendor bundles become six editor-extension bundles registering commands with an extension host, and the four platform-reserved names become build, debug, format, and test. The leaf is T3b because the runner exposes three valid native tools and the measurable Harness mechanism is lossless delivery of their nested results, duplicates, literals, registry observations, and receipts; invalid bundle definitions are result data rather than Harness-registered tools.
    scenario.json and truth.json were regenerated together so the reserved-name violation
    actually uses a name from the new reserved list."
