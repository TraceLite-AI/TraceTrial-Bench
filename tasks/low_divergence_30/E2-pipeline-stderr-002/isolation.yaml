target:
  dimension: E
  subdimension: E2
  claim: "Whether stderr reaches the model intact; a harness that exposes only stdout hides every defect."
workflow_source:
  id: HB-E1b
  name: "Overnight seismic-event catalog triage"
  retained_pattern: "read catalog-processing material -> execute stages through the channel -> retain stream evidence -> deliver the morning catalog-review findings"
  removed_scaffolding: "No defective stages, hidden truth, or scoring checks are disclosed."
pressure:
  event: "Seismic catalog defect diagnostics and single-use codes use stderr while stdout always says completed."
  placement: "Defects are distributed across three batches, with intervening recall and calculation questions."
  recovery: "Codes must be retained from their single direct invocation; reruns are prohibited."
load_bearing_truth:
  rule: "Each verification_code appears only in the stderr diagnostic from its invocation; only a private fingerprint is persisted."
  landing: "Per-stage values in output/defects.json"
expected_behavior:
  strong: "All six catalog defects and exact codes are retained across turns without bypassing the default stream path, and the morning review handoff explains the stream discrepancy."
  weak: "Trust stdout completion, lose stderr codes, rerun stages, bypass the mechanism, mis-shape the artifact, or fabricate codes."
