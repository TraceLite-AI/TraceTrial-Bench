version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_is_complete
    type: rule
    criterion: >
      Score 1 only when the normalized trace is marked complete, contains run_started and
      run_finished lifecycle events, records at least one tool event, and the Harness run finishes
      without timeout or infrastructure error. Score 0 when any lifecycle segment is absent, the
      trace is incomplete, or the run terminates abnormally.
  - id: hr_one_time_pressure_event_is_captured
    type: rule
    criterion: >
      Score 1 only when private simulator evidence contains one successful one-time complete
      export, its stdout exceeded 3,000,000 UTF-8 bytes, and the normalized trace contains the
      corresponding logctl export call. Score 0 when the pressure event did not occur or either
      side of this correlation is missing.
  - id: hr_authoritative_content_reaches_model
    type: rule
    criterion: >
      Score 1 only when pre-delivery model-visible trajectory evidence contains the active
      SNAPSHOT_ID, TOTAL_FLAGGED, TOTAL_SEGMENTS, an explicit indication that the complete result
      was reduced when applicable, and all retention codes ultimately delivered by the Agent.
      Score 0 when headers, reduction disclosure, or any delivered authoritative code is absent
      from model-visible evidence; missing evidence scores 0.
  - id: hu_reduction_notice_is_actionable
    type: rubric
    criterion: >
      Score 1 only when the complete-export result shown to the Agent makes the reduction
      unmistakable and preserves enough immediate recovery information, including the snapshot
      identifier and export totals, to continue safely. Score 0 when reduction is silent or
      ambiguous, when the notice loses the snapshot or totals, or when evidence is missing. Agent-
      omission guard: this criterion can only judge the calls the Agent actually made. If the
      Agent never issued a call this criterion depends on, that gap is an Agent-layer omission,
      not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS]
      so attribution charges it to the Agent rather than the Harness. Judge Harness quality only
      over the calls that were actually issued; never let the Agent's own artifacts, records, or
      conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments.command", "tool_result.content", "tool_result.error"]
      keywords: ["logctl export"]
      match: "any"
      case_sensitive: false
      max_events: 60
  - id: hu_reduction_metadata_is_machine_readable
    type: rubric
    criterion: >
      Score 1 only when the normalized complete-export tool result exposes structured reduction
      metadata as separate result-object fields: an explicit truncation status (boolean or enum)
      and an integer original-size or omitted-size value in bytes or characters. Business-export
      KEY=value headers, line counts, a prose notice such as "5.7MB", and a persisted-file path do
      not qualify as reduction metadata. Score 0 when either required structured field is absent,
      metadata exists only inside text, values conflict, or evidence is missing. Agent-omission
      guard: this criterion can only judge the calls the Agent actually made. If the Agent never
      issued a call this criterion depends on, that gap is an Agent-layer omission, not a Harness
      defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution
      charges it to the Agent rather than the Harness. Judge Harness quality only over the calls
      that were actually issued; never let the Agent's own artifacts, records, or conclusions
      change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result"]
      keywords: ["logctl export"]
      match: "any"
      case_sensitive: false
      max_events: 50
  - id: hu_full_payload_retention_is_disclosed
    type: rubric
    criterion: >
      Score 1 only when a reduced complete result is retained in full by the Harness and the
      normalized result gives the Agent a clear, usable reference to that retained payload. Score
      0 when the payload is discarded, retained without a model-visible reference, the reference
      is unusable, or evidence is missing. Agent-omission guard: this criterion can only judge the
      calls the Agent actually made. If the Agent never issued a call this criterion depends on,
      that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result.content", "content", "text"]
      keywords: ["persisted-output", "Full output saved", "tool-results", "Output too large"]
      match: "any"
      case_sensitive: false
      max_events: 50
  - id: hu_result_provenance_is_unambiguous
    type: rubric
    criterion: >
      Score 1 only when normalized evidence lets the Agent distinguish command success from
      display reduction by binding the complete-export result to its tool call and exposing a
      reliable exit or error status. Score 0 when success/failure provenance is absent, detached
      from the result, contradictory, or unsupported by evidence. Agent-omission guard: this
      criterion can only judge the calls the Agent actually made. If the Agent never issued a call
      this criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score
      0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to
      the Agent rather than the Harness. Judge Harness quality only over the calls that were
      actually issued; never let the Agent's own artifacts, records, or conclusions change this
      verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_call.tool_name", "tool_call.name", "tool_call.arguments.command", "tool_result"]
      keywords: ["logctl export"]
      match: "any"
      case_sensitive: false
      max_events: 60
  - id: hu_retained_boundaries_support_diagnosis
    type: rubric
    criterion: >
      Score 1 only when a reduced complete-export result preserves useful beginning and end
      boundaries, or an equivalent indexed preview, while clearly marking the omitted middle so
      the Agent can locate the loss. Score 0 when only one arbitrary boundary survives, the
      omission boundary is unclear, retained text is misleading, or evidence is missing. Judge
      only the first successful complete-export presentation; ignore later export attempts,
      recovery choices, and whether the Agent eventually created deliverables. Agent-omission
      guard: this criterion can only judge the calls the Agent actually made. If the Agent never
      issued a call this criterion depends on, that gap is an Agent-layer omission, not a Harness
      defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution
      charges it to the Agent rather than the Harness. Judge Harness quality only over the calls
      that were actually issued; never let the Agent's own artifacts, records, or conclusions
      change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result.content"]
      keywords: ["logctl export", "SNAPSHOT_ID="]
      match: "all"
      case_sensitive: false
      max_events: 60
  - id: hu_recovery_responses_are_context_safe
    type: rubric
    criterion: >
      Score 1 only when same-snapshot recovery calls return bounded, readable, uncorrupted results
      and the normalized trajectory preserves their line coordinates and exact retention codes
      without another silent reduction. Score 0 when valid recovery is truncated or corrupted,
      crosses snapshots, loses coordinates or codes, is blocked by the Harness, or lacks evidence.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result.content", "tool_result.error"]
      keywords: ["logctl range"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "logctl export", "persisted-output", "Full output saved"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "logctl export", "persisted-output", "Full output saved"]
      match: "any"
      case_sensitive: false
      max_events: 100
