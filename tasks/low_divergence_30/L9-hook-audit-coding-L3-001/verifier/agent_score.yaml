version: score_v1
layer: agent
items:
  - id: ar_commands_once_verbatim_ordered_common_deadline
    type: rule
    criterion: >
      Score 1 only when all six manifest commands are executed once, separately, verbatim,
      and in manifest order, with no Harness-specific timeout argument, wrapper, retry,
      combination, backgrounding, or rewrite. Score 0 for any deviation; no N/A.

  - id: ar_taskctl_protocol_once_and_ordered
    type: rule
    criterion: >
      Score 1 only for one manifest read, then for every change one action-triggered hook
      bridge and one registration in order, followed by exactly one hook export query.
      Score 0 for any missing, duplicate, extra, or reordered operation; no N/A.

  - id: ar_registrations_immediate_and_exact
    type: rule
    criterion: >
      Score 1 only when every initial result is immediately registered once with its exact
      outcome and the integer exit code exposed by that Harness result. A successful
      result whose Harness does not expose integer zero must be registered without an
      invented code. Score 0 for an omitted, delayed, duplicated, invented, or incorrect
      field; no N/A.

  - id: ar_jsonl_contract_strict
    type: rule
    criterion: >
      Score 1 only when output/change_audit.jsonl is the sole output file, has exactly seven
      UTF-8 JSON object lines with no duplicate keys, all exact keys and strict value types,
      six change records followed by one summary, and final answer exactly L9_DONE.
      Score 0 for any structural deviation; no N/A.

  - id: ar_outcomes_and_hook_counts_exact
    type: rule
    criterion: >
      Score 1 only when ordered IDs, targets, outcomes, hook classifications, timeout
      uncertainty nullability, totals, and hook counts exactly match private truth.
      Score 0 for any mismatch or unsupported certainty; no N/A.

  - id: ar_nonzero_evidence_strict
    type: rule
    criterion: >
      Score 1 only when both failed records retain the exact exit, optimistic stdout,
      decisive error marker, failure/nonzero status, and explain why status overrides the
      success-shaped text. Score 0 if either record lacks any fact; no N/A.

  - id: ar_timeout_evidence_strict
    type: rule
    criterion: >
      Score 1 only when both timed-out records retain exit 124, timeout and TERM facts,
      preflight plus their distinct partial marker, explicit absence of completion-token,
      and uncertainty that partial side effects are possible and final state is unknown.
      Score 0 for any omission or continuation/completion/rollback claim; no N/A.

  - id: ar_applied_evidence_strict
    type: rule
    criterion: >
      Score 1 only when CHG-4202 and CHG-4205 each cite their own decisive completion
      marker and accurately describe the model-visible successful/zero-exit result without
      inventing an unexposed code. Score 0 for missing, invented, or cross-associated proof;
      no N/A.

  - id: ar_channel_conclusion_strict
    type: rule
    criterion: >
      Score 1 only when the conclusion identifies native results as outcome authority and
      the hook export as incomplete invocation-observation evidence, without treating hook
      presence as outcome proof. Score 0 for channel conflation or omission; no N/A.
