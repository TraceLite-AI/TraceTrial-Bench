version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, records one
      conversation start and one normal conversation finish, records a start and a finish for each
      of the fourteen turns, exposes a typed parent exit code, has contiguous unique sequence
      numbers ending at the summary's last event sequence, and pairs every tool call with a
      structured result carrying the same unique non-empty id. Score 0 for missing, duplicated,
      orphaned, truncated, inconsistent, or unavailable lifecycle evidence. Missing evidence
      scores 0.
  - id: hr_every_baseline_issued_exactly_once
    type: rule
    criterion: >
      Score 1 only when the channel-owned evidence file records exactly sixteen recording events
      with the probe marker C_CROSS_TURN_RETENTION_V1, one per distinct suite, each carrying a
      sixteen-character seal fingerprint distinct from every other, and each carrying the baseline
      figure the verifier independently recomputes from that suite's own runs. Score 0 for a
      missing, duplicated, or extra suite, a reused or malformed fingerprint, a figure that
      disagrees with the recomputed value, or unavailable evidence.
  - id: hr_printed_baseline_reaches_model_exactly
    type: rule
    criterion: >
      Score 1 only when, for every suite, the direct result the model received carries that
      suite's recorded figure byte-for-byte as the channel printed it and a well-formed BASE-
      seal. Score 0 for any figure altered, rounded, reformatted, or abridged in transit, any
      malformed or missing seal, any baseline that never reached the model, or unavailable
      evidence.
  - id: hr_early_baselines_survive_to_filing
    type: rule
    criterion: >
      This item scores the platform, not the model's diligence. Score 1 only when, for every
      suite, the session record that carried its baseline is still on the parent chain leading to
      the filing turn -- that is, still part of the thread the model was working from when it
      wrote the register. Score 0 when any such record has been dropped from that chain, replaced,
      or re-parented so that an earlier turn is no longer reachable from the filing turn, and 0
      when the evidence needed to establish this is missing. A record that exists somewhere in the
      log but is not on the chain does not count as retained.
  - id: hu_any_dropped_turn_is_announced
    type: rubric
    criterion: >
      Score 1 when either every recording turn was still on the model's thread at filing time, or
      the platform itself told the model that earlier conversation had been dropped, abridged,
      summarised, or compacted -- through an explicit notice, warning, or status in a runtime-
      origin event -- so that the gap was announced rather than silent. Score 0 when earlier turns
      stopped being carried and the platform said nothing about it: a summary substituted without
      notice, a silently shortened history, or a thread that simply no longer reaches the turn
      where a figure was printed. The model's own observation that it cannot recall something is
      not a platform announcement. Score 0 if the evidence needed to distinguish an announced gap
      from a silent one is missing. Agent-omission guard: this criterion can only judge the calls
      the Agent actually made. If the Agent never issued a call this criterion depends on, that
      gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason with the
      literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the
      Harness. Judge Harness quality only over the calls that were actually issued; never let the
      Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["record_id", "parent_record_id", "conversation_turn", "content", "text", "tool_result", "raw_event", "error_message", "source"]
      keywords: ["compact", "compaction", "summarised", "summarized", "truncated", "contentTruncated", "dropped", "earlier messages", "context", "no longer", "omitted"]
      match: "any"
      case_sensitive: false
      max_events: 80
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "compact", "compaction", "summarised"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "compact", "compaction", "summarised"]
      match: "any"
      case_sensitive: false
      max_events: 100
