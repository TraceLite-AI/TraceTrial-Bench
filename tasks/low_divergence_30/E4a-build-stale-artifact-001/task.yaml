id: E4a-build-stale-artifact-001
title: Failed build leaves a stale success receipt
scenario:
  domain: Execution
  primary_subscenario: failed command false acceptance
  secondary_subscenarios:
    - Machine-generated build receipt
    - Native command outcome versus artifact status
    - Audit-observer rejection gate
harness:
  dimension: E
  subdimension: E4a
  subdimension_name: stale artifact accepted through a missing error signal
intensity:
  level: L3
  description: A correlated after-tool reference consumer must reject the exact success-shaped receipt when the one native build exits 42; model-visible and native post-tool evidence are scored independently.
input:
  mode: single_turn
  turns: turns.json
dependencies:
  workspace_tools:
    - tools/build_then_fail.sh
  native_tools:
    - native command execution
  mechanisms:
    - model_visible_nonzero_exit_propagation
    - correlated_native_post_tool_error_propagation
    - reference_consumer_stale_artifact_rejection
    - stdout_exit_status_disambiguation
budget:
  max_turns: 6
  max_tool_calls: 6
  max_wall_time_sec: 120
verifier:
  entrypoint: verifier/run.sh
expected_outputs: [output/result.json, output/execution_report.json]
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1]
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: E4a-failed-command-stale-artifact-001
  branch: task_verifier / tasks/new_cases
  what_changed: "The coding prompt and fixture remain unchanged. The verifier is tightened
    around the E4a leaf: it independently scores the initial model-visible result, the
    correlated raw native post-tool result, and a deterministic reference consumer whose
    error gate consumes the exact stale receipt. It rejects wrappers, duplicate or stale
    calls, string-valued pseudo-booleans, altered fixture/receipt bytes, incomplete traces,
    and inferred success; emits only deterministic binary criteria; and prefixes apparatus
    failure and Agent bypass evidence so formal attribution does not blame the Harness."
