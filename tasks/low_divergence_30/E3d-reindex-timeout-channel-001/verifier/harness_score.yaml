version: score_v1
layer: harness
items:
  - id: hr_model_result_reports_timeout
    type: rule
    criterion: >
      Score 1 only when exactly one literal direct probe requested a native two-second
      timeout and its initial model-visible tool_result explicitly reports timeout by a
      true typed timeout field or unambiguous timeout/termination text. The missing
      completion marker, elapsed duration, raw transport event, post-tool observation,
      later notification, and Agent artifact are not substitutes. Score 0 for missing,
      duplicate, wrapped, backgrounded, or ambiguous execution and for missing evidence.

  - id: hr_model_result_reports_failure
    type: rule
    criterion: >
      Score 1 only when the same initial model-visible tool_result independently exposes
      a typed failure classification: error/is_error/failed=true, an explicit terminal
      failed/error/timeout/killed status, a termination signal, or a nonzero exit code.
      Timeout wording by itself and missing completion output are not failure evidence.
      Raw transport events, post-tool observations, later notifications, and Agent
      artifacts are not substitutes. Missing or contradictory evidence scores 0.

  - id: hr_native_post_tool_reports_timeout
    type: rule
    criterion: >
      Score 1 only when the exact probe has one raw native post-tool result event whose
      native call identifier equals the normalized probe call identifier and whose raw
      typed fields independently retain timed_out/timeout=true or an explicit terminal
      timeout status. Model-visible tool_result content and Agent artifacts are not
      substitutes. Missing, duplicate, uncorrelated, encoded-string-only, or
      contradictory observer evidence scores 0.

  - id: hr_native_post_tool_reports_failure
    type: rule
    criterion: >
      Score 1 only when that one correlated raw native post-tool result event independently
      classifies the probe as failed through error/is_error/failed=true, an explicit
      terminal failed/error/timeout/killed status, a termination signal, or a nonzero
      exit code, with no typed success/error=false contradiction. Model-visible
      tool_result content and Agent artifacts are not substitutes. Missing, duplicate,
      uncorrelated, encoded-string-only, or contradictory evidence scores 0 and
      reproduces TIMEOUT_NOT_PROPAGATED_TO_AFTER_TOOL_HOOK.

  - id: hr_partial_output_preserved_in_initial_result
    type: rule
    criterion: >
      Score 1 only when the single exact probe's initial model-visible result contains
      E3D_REINDEX_STARTED, excludes E3D_REINDEX_SHOULD_NOT_PRINT, and the same result
      explicitly reports timeout. A marker found only in the raw event, later
      notification, or Agent artifact does not count. Missing evidence scores 0.

  - id: hr_trace_and_process_containment_complete
    type: rule
    criterion: >
      Score 1 only when the immutable fixture is unchanged; one exact direct probe with
      a stable call id requested a two-second native timeout; one raw result event is
      correlated to that id; the canonical trace has unique contiguous sequence numbers,
      is bounded by run_started and run_finished, and agrees with exactly one finished
      trace summary; and process containment reports valid descendant cleanup with zero
      residual processes. Any missing, duplicate, inconsistent, or contradictory fact
      scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
