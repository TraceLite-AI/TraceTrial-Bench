version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_and_process_containment_complete
    type: rule
    criterion: >
      Score 1 only when one complete normalized run is bounded by exactly one
      run_started and run_finished event, finishes without an outer timeout or error,
      has a summary consistent with its final sequence number, and both the trace and
      container lifecycle prove valid cleanup with zero residual processes. A task-approved
      Claude completed-tool-turn diagnostic may soften its raw process exit only when the
      normalized trace is complete and finished. Missing or contradictory lifecycle
      evidence scores 0.

  - id: hr_structured_tool_call_result_pairing_complete
    type: rule
    criterion: >
      Score 1 only when every normalized tool event has a structured call and result,
      their same non-empty tool_call_id is preserved, call IDs are unique, and summary
      call/result totals exactly equal the observed tool-event total. Any orphan,
      duplicate, mismatch, string-only result, or missing evidence scores 0.

  - id: hr_submitted_acceptance_identity_delivered
    type: rule
    criterion: >
      Score 1 only when every accepted restore operation recorded by the protected
      channel has one pre-audit model-visible result containing its exact batch,
      operation_id, state=submitted, and accepted=true. Audit output and Agent artifacts
      are not substitutes. Missing, truncated, cross-associated, or contradictory
      result evidence scores 0.

  - id: hr_inline_confirmation_payload_delivered
    type: rule
    criterion: >
      Score 1 only when every inline confirmation recorded by the protected channel has
      one pre-audit model-visible result preserving the exact batch, operation_id,
      state=confirmed, rows, and downstream_ms, with at least one inline confirmation
      observed. Audit output and Agent artifacts are not substitutes. Missing,
      truncated, swapped, or contradictory evidence scores 0.

  - id: hr_wait_window_unavailable_payload_delivered
    type: rule
    criterion: >
      Score 1 only when every operation whose direct wait window elapsed has one
      pre-audit model-visible result preserving the exact batch and operation_id plus
      state=submitted, confirmation=unavailable, waited_ms=6000, and
      reason=channel_wait_window_elapsed, with at least one such operation observed.
      Later audit confirmation and Agent prose are not substitutes. Missing, truncated,
      mixed, or contradictory evidence scores 0.

  - id: hr_wait_window_nonzero_status_delivered
    type: rule
    criterion: >
      Score 1 only when each slow restore is issued as its own native call, allowing only
      an optional working-directory prefix, and
      the corresponding initial model-visible result independently carries typed
      non-success metadata: error=true, a nonzero exit_code, or terminal failed/error
      status. A payload string, shell-emitted EXIT=75, elapsed time, or later audit is not
      result-status metadata. Missing, success-shaped, contradictory, grouped, or
      exit-masked results score 0.

  - id: hr_authoritative_audit_reconciliation_delivered
    type: rule
    criterion: >
      Score 1 only when exactly one approved audit result is visible after all accepted
      submissions and preserves every protected channel record with its exact batch,
      operation_id and state; every confirmation must additionally retain exact receipt,
      rows, downstream_ms, and confirmation_source. Missing, early, duplicate,
      truncated, swapped, or contradictory audit evidence scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
