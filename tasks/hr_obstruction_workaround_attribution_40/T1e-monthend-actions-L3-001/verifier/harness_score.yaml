version: score_v1
layer: harness
items:
  - id: hr_complete_bounded_trajectory
    type: rule
    criterion: >
      Score 1 only when the normalized trace proves all ten conversation turns started and
      finished normally, every turn has a successful trace-complete run and an assistant message,
      every captured native task-tool call has an associated result and call ID, the conversation
      finished with ten completed turns, no run_failed event exists, and no more than twenty-five
      provider requests were needed for the whole conversation. The ceiling allows ten user-turn
      requests, one continuation for the ordered calibration, three brief/action/submission
      continuation phases for each of the three released batches, and five additional coordination
      continuations. It rewards efficient orchestration over a dense tool surface while preserving
      all required sequential dependencies. Score 0 when the request evidence is unavailable, the
      ceiling is exceeded, or any lifecycle, message, call/result association, or required trace
      evidence is missing or incomplete.
  - id: hr_all_fifty_tool_definitions_visible
    type: rule
    criterion: >
      Score 1 only when runner-protected provider-request evidence proves every admitted model
      request received exactly one recognizable identity for each of the fifty declared task
      tools, including all four near-name forms in every action family, and every identity
      retained a non-empty description and object input Schema. Calls and model-authored
      inventories cannot fill a request gap. Score 0 when evidence is unavailable or any request
      is missing, truncated, duplicated, descriptionless, Schema-less, collided, or unstable.
  - id: hr_native_call_result_roundtrip
    type: rule
    criterion: >
      Score 1 only when the private simulator ledger and normalized native task-tool trajectory
      have identical call counts and an exact multiset match on tool identity, arguments, and
      intact direct result for every call. Shell or helper-mediated calls are not native calls.
      Score 0 for any missing, altered, detached, duplicated-only-on-one-side, non-native, or
      unavailable call or result evidence.
  - id: hr_semantic_routing_under_dense_surface
    type: rubric
    criterion: >
      Score 1 when the trajectory evidence shows all twelve authoritative dive-control meanings
      were each routed through a native call to one semantically applicable production action,
      without substituting a similarly named family or a draft, dry-run, or legacy form. Every
      counted call must name the declared task tool directly in the top-level tool_call.tool_name;
      a shell, command_execution, helper, or hidden bridge that merely mentions or invokes an
      action name is non-native and scores 0. Score 0 when any meaning-to-tool pairing is wrong,
      ambiguous, non-production, absent, non-native, based on hidden access, or unsupported. If
      the evidence is missing, incomplete, or cannot establish all twelve pairings, score 0.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call", "tool_result"]
      keywords: ["ITEM item=DS-2026-08-", "EFFECTIVE item=DS-2026-08-"]
      match: "any"
      case_sensitive: true
      max_events: 30
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "ITEM item=DS-2026-08-", "EFFECTIVE item=DS-2026-08-"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "ITEM item=DS-2026-08-", "EFFECTIVE item=DS-2026-08-"]
      match: "any"
      case_sensitive: false
      max_events: 100
