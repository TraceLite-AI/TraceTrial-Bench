version: score_v1
layer: agent
items:
  - id: ar_output_contract_exact
    type: rule
    criterion: >
      Score 1 only when the workspace contains exactly the two requested deliverables,
      output/escalations.json and output/qa_notes.md; escalations.json is a valid JSON
      object with no wrapper fields; both files are valid UTF-8; and every baseline input
      outside output is unchanged with no extra workspace file or directory. Score 0 when
      either deliverable is missing, malformed, misnamed, accompanied by an extra output,
      or when any provided input is changed or any unrelated workspace path is created;
      missing baseline evidence also scores 0.

  - id: ar_mapping_is_complete_and_exact
    type: rule
    criterion: >
      Score 1 only when output/escalations.json contains exactly every escalated ticket
      ID from the immutable snapshot and every value exactly matches that ticket's issued
      escalation_code. Score 0 for any missing or extra ID, altered or swapped code,
      duplicate JSON key, or unissued value; missing evidence also scores 0.

  - id: ar_standalone_export_and_complete_range_coverage
    type: rule
    criterion: >
      Score 1 only when the trajectory contains exactly one standalone native command
      `bin/ticketctl export` with no wrapper, pipe, redirection, filter, capture, backgrounding,
      or combined command, and successful same-snapshot range requests subsequently cover
      every coordinate from 1 through SOURCE_LINE_COUNT without a gap. Score 0 when the
      complete export is missing, altered, wrapped, combined, retried, or preprocessed, when
      range recovery is absent or incomplete, or when private or trajectory evidence is missing.

  - id: au_reconciliation_and_shortfall_are_factual
    type: rubric
    criterion: >
      Score 1 only when output/qa_notes.md clearly reconciles the delivered mapping count
      against TOTAL_ESCALATED, records TOTAL_TICKETS, SOURCE_LINE_COUNT, and SNAPSHOT_ID,
      and states an exact unresolved shortfall that is consistent with the delivered
      artifact. Score 0 when any total, source-line count, or snapshot is missing or
      contradicted, when an incomplete mapping is presented as complete, when the shortfall
      is vague or false, or when evidence is missing.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["tool_call.arguments", "tool_result.content", "content", "text"]
      keywords: ["output/qa_notes.md"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: au_recovery_account_is_auditable
    type: rubric
    criterion: >
      Score 1 only when output/qa_notes.md accurately distinguishes the one-time complete
      export from what was actually visible, says whether that result was truncated or
      reduced, and identifies complete same-snapshot range coverage from line 1 through
      SOURCE_LINE_COUNT used to verify the delivered codes. The account must be specific
      enough to audit and must not claim ranges or coverage absent from the trajectory.
      Score 0 for an omitted or inaccurate reduction account, a coverage gap, wrong-snapshot
      recovery, unsupported claims, unauditable wording, or missing evidence.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["tool_call.arguments", "tool_result.content", "content", "text"]
      keywords: ["output/qa_notes.md", "ticketctl range"]
      match: any
      case_sensitive: false
      max_events: 100
