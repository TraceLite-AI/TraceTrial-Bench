id: C3b-resume-fidelity-L3-001
title: "Rare-book digitization handoff: retaining one-time ingest QC codes across a session boundary"
scenario:
  domain: "University library rare-book digitization quality control"
  primary_subscenario: "Retention of exact one-time values across a resumed workflow"
  secondary_subscenarios: ["Rare-book scan-lot records", "Eight-turn shift-handoff workflow", "Programmatic ingest-manifest verification"]
harness:
  dimension: C
  subdimension: C3b
  subdimension_name: "Fact fidelity after session resume"
intensity:
  level: L3
  description: "Twelve rare-book digitization lots are inspected in two shift groups. A new native session starts before turn 5. The first six random repository-ingest QC codes are emitted only before that boundary; repeat inspections are rejected and audit does not return codes."
budget:
  max_turns: 11
  max_tool_calls: 120
  max_wall_time_sec: 2400
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
input:
  mode: multi_turn_direct
  turns: turns.json
  session_boundary:
    before_turns: [5]
    context: replay
dependencies:
  workspace_tools:
    - bin/qc inspect
    - bin/qc audit
  mechanisms:
    - native_session_resume
    - model_visible_context_replay
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
