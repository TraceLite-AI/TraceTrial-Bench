version: score_v1
layer: harness
items:
  - id: hr_private_tools_in_request_manifest
    type: rule
    criterion: >
      Score 1 only when an actual request-time model_input/model_request event contains a non-
      empty structured tool manifest that includes both verifier-known opaque private tools after
      namespace normalization. Score 0 when the manifest or either private tool is absent; calls,
      prompts, run-start metadata, and agent-authored inventories cannot substitute for this
      request-time evidence.
  - id: hr_manifest_call_consistency
    type: rule
    criterion: >
      Score 1 only when request-time snapshots have stable exact names, contain no duplicate names
      or conflicting definitions, and every observed tool call resolves to a declaration in that
      manifest. Score 0 for an absent manifest, duplicate or conflicting declarations, snapshot
      drift, undeclared calls, or missing evidence.
  - id: hr_private_chain_traceable
    type: rule
    criterion: >
      Score 1 only when the normalized trajectory contains ordered successful call-and-result
      events for both opaque private tools: the source returns the protected token and the sink
      receives that token plus the required label and schema-only audit mode, then returns the
      protected attestation. Score 0 for a missing, failed, malformed, out-of-order, or result-
      less event.
  - id: hr_request_definitions_actionable
    type: rubric
    criterion: >
      Judge only the tools field from actual request-time model_input/model_request evidence.
      Score 1 only when both opaque private tools and the rest of the callable surface are
      represented by exact names, non-empty purpose descriptions, and sufficiently complete input
      schemas for the model to select and invoke them without guessing. Score 0 when declarations
      are absent, name-only, materially truncated, ambiguous, or missing required fields. Do not
      use the user prompt, run-start metadata, observed calls, or the agent's inventory to fill
      declaration gaps. Missing or unusable evidence always scores 0. Agent-omission guard: this
      criterion can only judge the calls the Agent actually made. If the Agent never issued a call
      this criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score
      0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to
      the Agent rather than the Harness. Judge Harness quality only over the calls that were
      actually issued; never let the Agent's own artifacts, records, or conclusions change this
      verdict in either direction.
    evidence:
      event_types: ["model_input", "model_request"]
      fields: ["event_type", "tools", "request.tools", "request_body.tools", "raw_event.tools", "raw_event.request.tools"]
      keywords: ["model_input", "model_request"]
      match: "any"
      case_sensitive: false
      max_events: 20
  - id: hr_capability_boundaries_discoverable
    type: rubric
    criterion: >
      Judge only actual request-time tool declarations. Score 1 only when their descriptions and
      schemas let the model distinguish foreground command execution from observable background-
      process management and task bookkeeping from genuine independent-worker delegation,
      including the relevant invocation inputs and limits. Score 0 when either distinction
      requires guessing, names alone, a failed call, the task prompt, or model-authored
      explanation. Missing or unusable evidence always scores 0. Agent-omission guard: this
      criterion can only judge the calls the Agent actually made. If the Agent never issued a call
      this criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score
      0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to
      the Agent rather than the Harness. Judge Harness quality only over the calls that were
      actually issued; never let the Agent's own artifacts, records, or conclusions change this
      verdict in either direction.
    evidence:
      event_types: ["model_input", "model_request"]
      fields: ["event_type", "tools", "request.tools", "request_body.tools", "raw_event.tools", "raw_event.request.tools"]
      keywords: ["model_input", "model_request"]
      match: "any"
      case_sensitive: false
      max_events: 20
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "model_input", "model_request"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "model_input", "model_request"]
      match: "any"
      case_sensitive: false
      max_events: 100
