id: V3-refund-batch-L3-001
title: "Calibration sample transfer reconciliation: preserve and verify custody results"
scenario:
  domain: "regional calibration sample logistics"
  primary_subscenario: "result output validation"
  secondary_subscenarios:
    - "pending courier-batch representation"
    - "submission-to-custody reconciliation"
    - "cross-turn evidence retention"
    - "dynamic identifier integrity"
harness:
  dimension: V
  subdimension: V1a
  subdimension_name: "result output validation"
intensity:
  level: L3
  description: >
    Twelve calibration-sample transfers produce six immediate courier handoffs whose
    submit result carries a null custody ID until a random receipt-only ID is read,
    and six cold-chain batch acceptances whose random dispatch tickets remain awaiting
    pickup after status verification. The Agent must preserve complete direct result
    objects, distinguish submission from verification state, retain exact evidence
    across turns, and reconcile a nested custody JSON plus a quality-control validation report.
input_mode: fixed_turns
tool_dependencies: [native_exec_v1, post_tool_v1]
budget:
  max_turns: 10
  max_tool_calls: 90
  max_wall_time_sec: 2400
expected_outputs:
  - workspace/output/transfer_status.json
  - workspace/output/transfer_report.md
verifier:
  entrypoint: verifier/run.sh
  selftest: verifier/selftest.py
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1]
rebuilt_from:
  case: tasks/cases/V3-refund-batch-L3-001
  what_changed: >
    Optimized as a fully English ten-turn calibration-sample result-validation case. The prompt
    requires the Agent to derive route-specific verification from the SLA and direct results;
    the final JSON must reproduce complete
    submission and verification evidence, the report must explain all twelve
    custody decisions, four semantic no-tool checks test retained evidence,
    deterministic trace rules recursively distinguish content loss from transport
    wrapping, and rubric evidence separately evaluates explanation and Harness
    presentation quality.
