version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_is_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is nonempty, has contiguous unique sequence
      numbers from run start through run finish, reports trace_complete=true, finishes
      successfully without timeout or infrastructure error, has balanced tool calls and results,
      and the container archive and cleanup lifecycle is complete. Score 0 for any missing,
      duplicated, discontinuous, partial, timed-out, internally inconsistent, or unreadable
      evidence.
  - id: hr_all_refusals_retain_error_status
    type: rule
    criterion: >
      Score 1 only when all four expected Snapshot Desk refusals are actually present in the
      committed service evidence and each maps to exactly one model-visible snapshot_attempt
      result that retains an explicit error or isError status. Score 0 when a refusal is not
      triggered, is private-only, is presented as success or ordinary text, is duplicated, is
      detached from its call, or required evidence is missing or unreadable.
  - id: hr_exact_refusal_notice_and_identity_are_preserved
    type: rule
    criterion: >
      Score 1 only when all four committed ArchiveRefusal responses map one-to-one to model-
      visible snapshot_attempt results with the same structured job_id, a nonempty unique call ID,
      and the complete exact issued SNAPSHOT_REFUSED notice; the four notices must remain distinct
      and attached to the correct jobs. Score 0 for a missing refusal, generic replacement,
      truncation, rewriting, reserialization loss, swapped job, duplicate identity, collapsed
      notice, detached result, or missing or unreadable evidence.
  - id: hu_refusal_role_and_provenance_are_unambiguous
    type: rubric
    criterion: >
      Score 1 only when every retrieved refusal is clearly represented as the result of the
      matching snapshot_attempt call, with its tool identity, structured job_id, call/result
      linkage, error role, and complete notice intact; no refusal text may be elevated, merged, or
      replayed as a system, developer, or user instruction. Shell, script, generic command-
      execution, or aggregate stdout wrappers do not establish native snapshot_attempt provenance
      and score 0. Score 0 for ambiguous ownership, role elevation, detached or mismatched
      provenance, wrapper-generated instruction text, any missing refusal, or missing or
      unreadable evidence. If the required evidence cannot be retrieved, score 0. Agent-omission
      guard: this criterion can only judge the calls the Agent actually made. If the Agent never
      issued a call this criterion depends on, that gap is an Agent-layer omission, not a Harness
      defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution
      charges it to the Agent rather than the Harness. Judge Harness quality only over the calls
      that were actually issued; never let the Agent's own artifacts, records, or conclusions
      change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["seq", "tool_call", "tool_result", "raw_event"]
      keywords: ["snapshot_attempt", "SNAPSHOT_REFUSED"]
      match: "all"
      case_sensitive: false
      max_events: 12
  - id: hu_error_semantics_are_specific_not_generic
    type: rubric
    criterion: >
      Score 1 only when each of the four model-visible error results identifies the refused job
      and preserves a specific refusal class and actionable detail while still being visibly
      marked as an error; harness wrappers must not replace the notice with a generic exception,
      transport error, success-shaped payload, or unexplained failure. A shell/script invocation
      or command-output aggregate is not a model-visible native error result and scores 0. Score 0
      for any genericization, ambiguity between success and refusal, missing class or detail,
      cross-job mixing, missing refusal, or missing or unreadable evidence. If the required
      evidence cannot be retrieved, score 0. Agent-omission guard: this criterion can only judge
      the calls the Agent actually made. If the Agent never issued a call this criterion depends
      on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["seq", "tool_call.tool_name", "tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["snapshot_attempt", "SNAPSHOT_REFUSED", "class=", "detail="]
      match: "all"
      case_sensitive: false
      max_events: 12
  - id: hu_post_refusal_model_context_is_auditable
    type: rubric
    criterion: >
      Score 1 only when trajectory evidence directly demonstrates that, after each of the four
      refusal results, the next model continuation received the same complete notice in an
      explicit tool-result role with the original call linkage and job identity. An Agent's later
      correct prose or artifact is not proof that the Harness supplied the result at the model
      boundary. Score 0 when any continuation boundary is absent, opaque, flattened, truncated,
      role-ambiguous, or proves only runner-side capture; when any refusal is missing; or when
      evidence is missing or unreadable. If the required evidence cannot be retrieved, score 0.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "model_input", "assistant_message"]
      fields: ["seq", "messages", "content", "tool_call", "tool_result", "raw_event"]
      keywords: ["snapshot_attempt", "notice=N-"]
      match: "all"
      case_sensitive: false
      max_events: 40
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "snapshot_attempt", "SNAPSHOT_REFUSED", "class="]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "snapshot_attempt", "SNAPSHOT_REFUSED", "class="]
      match: "any"
      case_sensitive: false
      max_events: 100
