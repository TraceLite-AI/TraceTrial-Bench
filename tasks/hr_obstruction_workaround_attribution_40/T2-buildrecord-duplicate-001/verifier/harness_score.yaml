version: score_v1
layer: harness
items:
  - id: hr_duplicate_catalog_activated
    type: rule
    criterion: >
      Score 1 only when task-private evidence proves that the selected Harness was configured with
      the task registry, initialized its MCP server, requested the live catalog, and received
      exactly two declarations named hb_build_record with distinct primary/recovery descriptions
      and mutually exclusive required fields plus the unique hb_build_pair_control declaration.
      Configuration alone, a copied fixture, a model mention, a changed catalog, or an unfired
      server scores 0.
  - id: hr_trace_lifecycle_and_tool_identity_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, has a contiguous
      sequence from one run_started to one successful run_finished, its summary last_event_seq
      equals the maximum event sequence, and every normalized tool event has matching nonempty
      call/result IDs and tool names. Score 0 for a missing, partial, duplicated, abnormal,
      internally inconsistent, or unavailable trace, or any tool event with unstable identity.
  - id: hr_collision_outcome_is_observable
    type: rule
    criterion: >
      Score 1 only after the duplicate catalog activation rule is satisfied and retained Harness
      evidence explicitly records rejection of one duplicate, a duplicate/collision diagnostic, or
      a collision-safe rename of the second hb_build_record to a distinct registered identity.
      Silent acceptance, silent first/last-definition collapse, a diagnostic word appearing only
      in task or tool prose, and missing evidence score 0.
  - id: hu_both_duplicate_capabilities_are_actionable
    type: rubric
    criterion: >
      Evaluate direct model-visible tool invocations and results. Score 1 only when the Harness
      lets the Agent invoke both logical declarations from the duplicate-name catalog as
      distinguishable callable capabilities, one with the primary_ticket schema and one with the
      recovery_ticket schema, and returns the intact BLD-P-417 and BLD-R-882 records respectively.
      A single collapsed definition, schema/description mismatch, rejected or misrouted call,
      result visible only in private logs, Agent reconstruction, or missing evidence scores 0.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["model_input", "tool", "assistant_message", "raw_stdout", "raw_stderr"]
      fields: ["tools", "messages", "tool_call.tool_name", "tool_call.arguments", "tool_result", "content", "text", "raw_event"]
      keywords: ["BUILD-2026-0808", "primary_ticket", "recovery_ticket", "BLD-P-417", "BLD-R-882", "hb_build_record"]
      match: "any"
      case_sensitive: true
      max_events: 40
  - id: hu_duplicate_routing_provenance_is_unambiguous
    type: rubric
    criterion: >
      Score 1 only when normalized trajectory evidence binds the successful primary and recovery
      requests to separate nonempty call IDs, preserves the callable identity and exact request
      arguments for each, associates each authoritative result with its own request without cross-
      call mixing, and then preserves the successful control result CTRL-55D9 / PAIR-6F2A as a
      third correlated call. Score 0 for absent or reused IDs, indistinguishable origins, altered
      arguments/results, misassociation, private-only evidence, missing control continuity, or
      unavailable evidence. Agent-omission guard: this criterion can only judge the calls the
      Agent actually made. If the Agent never issued a call this criterion depends on, that gap is
      an Agent-layer omission, not a Harness defect — score 0 and begin the reason with the
      literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the
      Harness. Judge Harness quality only over the calls that were actually issued; never let the
      Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["model_input", "tool"]
      fields: ["tools", "messages", "tool_call.tool_call_id", "tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["BUILD-2026-0808", "PRI-TKT-74A1", "REC-TKT-91C6", "BLD-P-417", "BLD-R-882", "CTRL-55D9", "PAIR-6F2A"]
      match: "any"
      case_sensitive: true
      max_events: 20
  - id: hu_collision_policy_is_model_transparent
    type: rubric
    criterion: >
      Score 1 only when evidence available to the model before its first duplicate-tool call
      explicitly states that two raw declarations collided and explains the retained callable
      identity or rejection outcome for each logical role, so the Agent need not infer policy from
      a suffix or failed call. Private gateway logs, post-hoc Agent speculation, two aliases
      without a collision explanation, generic tool descriptions, silent collapse, or missing pre-
      call evidence score 0. Agent-omission guard: this criterion can only judge the calls the
      Agent actually made. If the Agent never issued a call this criterion depends on, that gap is
      an Agent-layer omission, not a Harness defect — score 0 and begin the reason with the
      literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the
      Harness. Judge Harness quality only over the calls that were actually issued; never let the
      Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["model_input", "assistant_message", "raw_stdout", "raw_stderr", "tool"]
      fields: ["tools", "messages", "content", "text", "tool_call", "tool_result", "raw_event"]
      keywords: ["BUILD-2026-0808", "duplicate", "collision", "conflict", "registered as", "hb_build_record"]
      match: "any"
      case_sensitive: false
      max_events: 30
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "BUILD-2026-0808", "primary_ticket", "recovery_ticket"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "BUILD-2026-0808", "primary_ticket", "recovery_ticket"]
      match: "any"
      case_sensitive: false
      max_events: 100
