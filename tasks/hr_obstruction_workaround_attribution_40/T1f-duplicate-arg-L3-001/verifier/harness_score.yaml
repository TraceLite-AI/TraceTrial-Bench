version: score_v1
layer: harness
items:
  - id: hr_trace_and_native_channel_ready
    type: rule
    criterion: >
      Score 1 only when private evidence proves that the selected Harness initialized the live
      observation_register server and obtained its exact catalog, and the canonical trace is
      complete, contiguous, normally finished, and has consistent nonempty tool call/result
      identities. Score 0 for configuration-only evidence, an unfired or changed server, an
      incomplete or abnormal trace, inconsistent tool identities, or any missing required
      evidence.
  - id: hr_duplicate_observer_end_to_end_fidelity
    type: rule
    criterion: >
      Score 1 only when each repeat-bearing observation has exactly one native
      observation_register trace event, one correlated private dispatch/result record, and the
      raw-pair evidence contains every required top-level observer occurrence, exact value, and
      order, including all two- and three-occurrence cases. Score 0 for a shell/backend bypass,
      missing or repeated native attempt, uncorrelated result, first/last-value wins, merging,
      arrays, renaming, rewriting, loss, reordering, or unavailable evidence.
  - id: hr_distinct_controls_and_results_intact
    type: rule
    criterion: >
      Score 1 only when every distinct-name control observation is dispatched exactly once with
      its exact ordered pairs, band_ref and band_ref-check remain separate on every prefix-control
      observation, and each such private dispatch result has one correlated model-visible native
      result with identical observation, state, pairs, counts, and complete code or reason. Score
      0 for a missing or extra attempt, prefix collision, altered value, cross-call association,
      truncation, or missing evidence.
  - id: hr_request_surface_preserves_duplicate_member_contract
    type: rubric
    criterion: >
      Judge only complete, model-visible request-time tool declarations from tool_inventory,
      model_input, or model_request evidence. Score 1 only when an actual request-time declaration
      exposes observation_register and preserves the full pressure contract presented by the task:
      observation_id and observer are top-level string properties; the tool or observer
      description explicitly states that observer may occur more than once as separate raw top-
      level members in occurrence order and is not an array; and band_ref and band_ref-check
      remain two distinct exact property names. This rubric evaluates declaration fidelity only;
      whether a generated duplicate member survives dispatch is evaluated by the end-to-end rules.
      Score 0 when the declaration is absent, incomplete, not model-visible, truncated, or
      rewritten; when the repeated-member or occurrence-order contract is missing; when observer
      is presented as an array, renamed member, wrapper, or free-form encoded payload; or when
      band_ref and band_ref-check are merged or one is omitted. Missing or unusable evidence
      always scores 0. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool_inventory", "model_input", "model_request"]
      fields: ["event_type", "source", "model_visible", "complete", "tools", "request.tools", "request_body.tools", "raw_event.tools", "raw_event.request.tools"]
      keywords: ["observation_register", "observer", "band_ref", "band_ref-check"]
      match: "all"
      case_sensitive: false
      max_events: 5
  - id: hr_conflict_feedback_is_actionable
    type: rubric
    criterion: >
      Judge only the model-visible native tool-call/result trajectory. Score 1 only when every
      attempted repeat-bearing observation has a model-visible result that is clearly correlated
      to that observation and exposes enough exact information to act safely: state, required and
      received pair counts, ordered received pairs, and a nonempty direct reason. For an initial
      conflict, the reason may state that the ordered members did not match because the exact
      missing or altered occurrences are already identifiable from the paired counts and ordered
      received pairs. For a retried observation, an `already attempted` or `one-shot` rejection is
      the correct actionable reason and satisfies this rubric; retry compliance is scored in the
      Agent layer. Score 0 for a generic error without the exact fields, private-only details,
      missing fields, ambiguous call association, truncation, or missing evidence. Missing or
      unusable evidence always scores 0. Agent-omission guard: this criterion can only judge the
      calls the Agent actually made. If the Agent never issued a call this criterion depends on,
      that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["event_type", "tool_call.tool_call_id", "tool_call.tool_name", "tool_call.arguments", "tool_result.tool_call_id", "tool_result.tool_name", "tool_result.content", "tool_result.error"]
      keywords: ["observation_register"]
      match: "all"
      case_sensitive: false
      max_events: 20
  - id: hr_conflict_boundary_is_auditable
    type: rubric
    criterion: >
      Judge only the native tool-call/result trajectory. Score 1 only when trace evidence captures
      a lossless pre-dispatch argument representation that can itself show repeated member names
      and the correlated model-visible result exposes the ordered pairs received at dispatch, so a
      reviewer can determine whether each duplicate occurrence was generated, lost, altered, or
      preserved without relying on Agent narration. A normalized/post-coercion dictionary cannot
      prove repeated members existed before coercion. Score 0 for a normalized dictionary even
      when the result reports dispatch pairs, result-only evidence, unverifiable inference, or
      missing evidence. Missing or unusable evidence always scores 0. Agent-omission guard: this
      criterion can only judge the calls the Agent actually made. If the Agent never issued a call
      this criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score
      0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to
      the Agent rather than the Harness. Judge Harness quality only over the calls that were
      actually issued; never let the Agent's own artifacts, records, or conclusions change this
      verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["event_type", "tool_call.tool_call_id", "tool_call.tool_name", "tool_call.arguments", "tool_result.tool_call_id", "tool_result.tool_name", "tool_result.content", "raw_event"]
      keywords: ["observation_register"]
      match: "all"
      case_sensitive: false
      max_events: 20
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "observation_register", "observer", "band_ref"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "observation_register", "observer", "band_ref"]
      match: "any"
      case_sensitive: false
      max_events: 100
