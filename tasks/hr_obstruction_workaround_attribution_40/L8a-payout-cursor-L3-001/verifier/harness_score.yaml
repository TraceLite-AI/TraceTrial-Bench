version: score_v1
layer: harness
items:
  - id: hr_trace_is_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is present and complete, execution finished
      successfully without timeout, and the trace has the complete conversation envelope, all nine
      per-turn start/finish lifecycles, the configured fresh-session boundary before turn 5, and
      at least two distinct native session IDs. Score 0 for any missing, partial, failed, timed-
      out, or contradictory lifecycle, conversation, session, or event evidence.
  - id: hr_canonical_probe_results_are_correlated
    type: rule
    criterion: >
      Score 1 only when canonical normalized tool-call/result fields contain exactly one correctly
      paired probe event for every private judicial-relief payout-channel ledger row, with the
      same payout ID and request cursor; delivered rows preserve returned cursor, terminal flag,
      payout state, and channel-issued receipt when applicable; undelivered rows preserve
      retryable=true, delivered=false, and the failure identity. Score 0 for a missing,
      duplicated, shifted, cross-paired, truncated, altered, or raw-only outcome. Agent prose and
      final artifacts are not substitutes.
  - id: hr_fresh_session_audit_is_correlated
    type: rule
    criterion: >
      Score 1 only when the canonical turn-5 judicial-relief payout-audit call/result pair is
      present and its direct result faithfully preserves every one of the fourteen pre-handoff
      channel rows, including each payout ID, request cursor, delivery status, returned cursor and
      terminal flag for delivered rows, and retryable failure identity for the undelivered row.
      Score 0 for a missing, shifted, cross-paired, truncated, altered, raw-only, or incomplete
      audit outcome. Agent reconstruction and final artifacts are not substitutes.
  - id: hu_nonterminal_result_is_unambiguous
    type: rubric
    criterion: >
      Evaluate only the matched direct model-visible tool event for PO-2026-07-2213. Score 1 when
      the same result preserves payout ID, request cursor 0, returned cursor 1, terminal=false,
      payout_state=unknown, and an explicit warning not to conclude. Score 0 if any fact is
      missing, detached, mixed with another call, contradictory, truncated, or visible only in
      prompt/runbook prose, Agent-authored explanation, or a final artifact. Missing evidence
      scores 0. Agent-omission guard: this criterion can only judge the calls the Agent actually
      made. If the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["PO-2026-07-2213", "do not conclude"]
      match: "all"
      case_sensitive: false
      max_events: 3
  - id: hu_retryable_failure_is_unambiguous
    type: rubric
    criterion: >
      Evaluate only the matched direct model-visible tool event for the first PO-2026-07-2209
      request. Score 1 when one self-contained result preserves payout ID and request cursor 0,
      states retryable=true and delivered=false, identifies the transient transport failure,
      instructs retrying the same request cursor, and keeps a Harness-native non-success outcome
      rather than presenting success. Score 0 when any fact or failure status is missing,
      detached, mixed, contradictory, truncated, or recoverable only from prose/artifacts. Missing
      evidence scores 0. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["PO-2026-07-2209", "transient_transport_failure", "same request cursor"]
      match: "all"
      case_sensitive: false
      max_events: 3
  - id: hu_terminal_result_and_receipt_are_unambiguous
    type: rubric
    criterion: >
      Evaluate only the matched direct model-visible terminal result for PO-2026-07-2245. Score 1
      when the same call/result preserves payout ID, request cursor 5, terminal cursor 6,
      terminal=true, payout_state=duplicate_detected, and the exact case-specific channel-issued
      receipt in the same result. Score 0 if any fact is missing, detached, cross-associated,
      contradictory, truncated, or available only from Agent prose or final artifacts. Missing
      evidence scores 0. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["PO-2026-07-2245", "terminal receipt issued", "duplicate_detected"]
      match: "all"
      case_sensitive: false
      max_events: 3
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "PO-2026-07-2213", "do not conclude", "PO-2026-07-2209"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "PO-2026-07-2213", "do not conclude", "PO-2026-07-2209"]
      match: "any"
      case_sensitive: false
      max_events: 100
