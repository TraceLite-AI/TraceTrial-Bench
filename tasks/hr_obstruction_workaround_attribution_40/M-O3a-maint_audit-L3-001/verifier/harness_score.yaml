version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_all_turns_single_session
    type: rule
    criterion: >
      Score 1 only when the selected aggregate normalized trace is marked complete, has one
      conversation start and finish, contains matching start and finish events for all eight
      configured turns, has no run failure or session boundary, and reports exactly one nonempty
      native session ID. Score 0 for an incomplete lifecycle, missing or altered turn, multiple or
      missing sessions, a boundary or failure, or unavailable deterministic trace evidence.
  - id: hr_step_log_calls_results_complete_ordered
    type: rule
    criterion: >
      Score 1 only when exactly thirty-six business calls form the uninterrupted ordered sequence
      audit_brief, audit_do, audit_submit for M01-M12; M01-M04 occur only in turn 2, M05-M08 only
      in turn 4, and M09-M12 only in turn 7; every call has model-visible complete arguments and
      the exact bound action label, audit_ref, or receipt result; and no business call occurs in
      turns 1, 3, 5, 6, or 8. Score 0 for a missing, extra, retried, reordered, premature,
      unbound, truncated, or private-only step, or unavailable deterministic evidence. Non-
      business help calls are ignored.
  - id: hr_pressure_and_recovery_chain_complete
    type: rule
    criterion: >
      Score 1 only when turn 5 contains fourteen distinct direct initial complete-file reads, one
      for each requested control-record file, and the archived model-visible results contain at
      least 5,000 distinct exact numbered control-record lines across the fourteen files; turn 6
      then finishes in the same session with the exact M01-M08 checkpoint and no business call;
      and, when native compaction occurred before that response, the last effective replacement
      summary contains M01-M08 in order with every exact action label, audit_ref, and receipt.
      Continuation reads after explicit native truncation are allowed. Score 0 when any link in
      this pressure-to-recovery chain is missing, aggregated, private-only, incorrect, replayed,
      or unavailable to deterministic evidence.
  - id: hu_recovery_loss_was_model_visible_and_observable
    type: rubric
    criterion: >
      Score 1 only when exact early step values are genuinely unavailable at the turn-6 checkpoint
      and trajectory evidence shows that the model first received an explicit model-visible native
      compaction, overflow, eviction, or context-replacement notice that makes the loss
      observable; the later response must identify the affected values as unavailable rather than
      silently inventing or replaying them. Score 0 when no recovery loss occurred, the loss was
      silent or visible only in Harness-private logs, the notice cannot be tied to the model-
      facing recovery context, the response conceals or fabricates a value, a business call is
      repeated to compensate, or evidence is missing. Missing or unusable evidence must be scored
      0. Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["context_compaction", "model_input", "assistant_message", "conversation_turn_started", "conversation_turn_finished", "artifact", "tool"]
      fields: ["event_type", "conversation_turn", "turn_index", "seq", "notice_visible_to_model", "summary", "messages", "content", "path", "tool_call.arguments", "tool_result", "source", "raw_event"]
      keywords: ["context overflow", "context_compaction", "compacted", "unavailable", "MISSING", "null", "recall_checkpoint.json"]
      match: "any"
      case_sensitive: false
      max_events: 80
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "context overflow", "context_compaction", "compacted"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "context overflow", "context_compaction", "compacted"]
      match: "any"
      case_sensitive: false
      max_events: 100
