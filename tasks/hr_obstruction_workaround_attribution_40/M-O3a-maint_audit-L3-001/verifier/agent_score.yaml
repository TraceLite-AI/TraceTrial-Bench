version: score_v1
layer: agent
items:
  - id: ar_checkpoint_and_pressure_artifacts_exact
    type: rule
    criterion: >
      Score 1 only when output/control_review.json is duplicate-free UTF-8 JSON
      with exactly the fourteen reference segment summaries and
      output/recall_checkpoint.json is duplicate-free UTF-8 JSON with exactly
      the eight reference M01-M08 step records in execution order, including
      every exact action label, audit_ref, and receipt. Score 0 for any missing,
      null, malformed, reordered, extra, inferred, or incorrect value, or when
      deterministic artifact evidence is unavailable.

  - id: ar_final_receipt_trail_exact
    type: rule
    criterion: >
      Score 1 only when output/audit_trail.json is duplicate-free UTF-8 JSON
      containing exactly M01 through M12 in that order, every value is the exact
      signed receipt returned for that item, and output contains exactly
      control_review.json, recall_checkpoint.json, audit_trail.json, and
      replay.md. Score 0 for a wrapper, extra or missing file or key, null,
      duplicate key, symlink, or any value mismatch, or when deterministic
      artifact evidence is unavailable.

  - id: ar_replay_table_exact
    type: rule
    criterion: >
      Score 1 only when output/replay.md begins with the required heading and
      has exactly one five-column replay table with exactly twelve rows in
      execution order, and every sequence number, item, English action label,
      audit_ref, and receipt exactly matches the reference step log. Score 0
      for an omitted, duplicated, reordered, invented, malformed, or additional
      table row, or when deterministic artifact evidence is unavailable.

  - id: au_persistence_attestation_is_grounded
    type: rubric
    criterion: >
      Score 1 only when the Persistence Attestation in output/replay.md clearly
      states whether M01-M08 were recovered at the checkpoint from retained
      model-visible step history without a repeated business call, truthfully
      identifies every unavailable value or explicitly states that there were
      none, and does not claim private-ledger, hidden-state, or later replay as
      the source. Score 0 when the attestation is absent, vague, contradicted by
      the replay or checkpoint, conceals a gap, claims an unauthorized source,
      claims a repeated operation was recovery, or necessary evidence is
      missing. Missing or unusable evidence must be scored 0.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["replay.md", "Persistence Attestation", "M01", "M08"]
      match: all
      case_sensitive: false
      max_events: 10
