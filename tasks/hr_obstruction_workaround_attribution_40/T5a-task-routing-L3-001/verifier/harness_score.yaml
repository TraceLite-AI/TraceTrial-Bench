version: score_v1
layer: harness
items:
  - id: hr_native_surface_available
    type: rule
    criterion: >
      Score 1 only when protected provider-request evidence proves that every request carrying
      task tools exposes exactly one recognizable identity for all thirty-eight declared tools,
      with stable distinct names, non-empty descriptions, and object input schemas. Tool-free
      internal harness requests are ignored. Score 0 when no task-tool-bearing request exists or
      any such request has a missing, duplicate, collided, descriptionless, schema-less, or
      truncated task tool, or evidence is unavailable.
  - id: hr_native_result_roundtrip
    type: rule
    criterion: >
      Score 1 only when every committed simulator request is represented exactly once as a
      structured native task-tool call with the same canonical identity and arguments and an
      associated direct result preserving the committed content. Model-authored text, shell or
      helper calls, and detached results do not count. Score 0 for any missing, duplicate,
      altered, helper-mediated, unpaired, or unavailable call/result evidence.
  - id: hr_turn_policy_and_boundary
    type: rule
    criterion: >
      Score 1 only when native trajectory evidence proves the exact three-call calibration on turn
      2; exactly one ranger_brief and one applicable unsuffixed skill for every assignment on its
      release turn; exactly one ranger_submit after each complete EXECUTED result but none after
      the deliberately truncated execution; no retry after either degraded signal; no task-tool
      calls on preparation, recall, evidence-only, or finalization turns; and no access to hidden
      tool transport, private evidence, verifier data, or network tools. Score 0 for probing,
      retry, premature or late routing, incomplete processing, invalid submission, hidden-channel
      bypass, network use, or unavailable evidence.
  - id: hr_close_intent_first_choice
    type: rubric
    criterion: >
      Score 1 only when the normalized task-tool trajectory proves that all twelve authoritative
      ranger_brief requests led directly to the unique correct unsuffixed production skill on the
      first ranger-routing attempt, correctly resolving all six close-intent pairs and never
      calling a preview, v1, or alternate family for a ranger assignment. Score 0 for any semantic
      confusion, blind trial, invalid form, retry, missing assignment, detached call/result,
      unsupported inference, or unavailable evidence. A deliberately degraded result after the
      correct first-choice skill call does not fail this selection criterion; judge the selected
      tool identity and attempt order only. Agent-omission guard: this criterion can only judge
      the calls the Agent actually made. If the Agent never issued a call this criterion depends
      on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call", "tool_result"]
      keywords: ["NP-2026-08-"]
      match: "any"
      case_sensitive: true
      max_events: 60
  - id: hr_cross_turn_state_fidelity
    type: rubric
    criterion: >
      Score 1 only when normalized trajectory evidence proves that the later recall and
      classification answers preserve the exact earlier skill, receipt, and request distinctions
      for NP-2026-08-5106, NP-2026-08-5134, NP-2026-08-5139, NP-2026-08-5123, and NP-2026-08-5145,
      including preserving that NP-2026-08-5139 has no validated receipt because its EXECUTED
      signal was incomplete, without re-calling a task tool on those turns or converting missing
      evidence into claimed success. Score 0 for any altered identifier or receipt, confused
      wayfinding route, re-execution, unsupported success, contradiction, or unavailable evidence.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["conversation_turn", "content", "tool_call", "tool_result"]
      keywords: ["F67CE030", "94E31263", "3A4E", "9029239C", "69F9B158", "no validated receipt"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "NP-2026-08-", "F67CE030", "94E31263"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "NP-2026-08-", "F67CE030", "94E31263"]
      match: "any"
      case_sensitive: false
      max_events: 100
