version: score_v1
layer: agent
items:
  - id: ar_exact_probe_then_advised_correction_protocol
    type: rule
    criterion: >
      Score 1 only when the model-authored native trajectory contains, in release and
      batch order, one exact documented typed legacy probe per germplasm accession and,
      whenever that probe has a complete matching model-visible TYPE_CORRECTION result,
      one immediate second call whose typed value and literal exactly decode that direct
      suggestion. An accession whose attempted probe result is missing, truncated,
      detached, malformed, or inconsistent must have no second call. Score 0 for a
      correction not justified by intact model-visible advice, an omitted probe,
      exploratory, duplicate, retry, helper-mediated, early-release, out-of-order, or
      extra call, or unavailable required trajectory evidence.

  - id: ar_truthful_reconciliation_artifacts
    type: rule
    criterion: >
      Score 1 only when output contains exactly accession_result.json and accession_notes.md;
      the JSON has the exact accession/key order and reports only acceptance data proven
      by an intact model-visible TYPE_CORRECTION suggestion, an exactly suggestion-bound
      correction call, and its matching model-visible ACCEPTED result; and the Markdown has twelve ordered
      four-column rows whose first two evidence cells copy the complete matching
      model-visible TYPE_CORRECTION and ACCEPTED lines, using unavailable where direct
      evidence is absent. Every boundary-explanation cell must be a nonempty
      accession-specific sentence. Score 0 for a missing, extra, malformed, reordered,
      invented, borrowed, normalized, unsupported, empty, or unavailable artifact.

  - id: ar_cross_turn_recall_and_execution_boundary
    type: rule
    criterion: >
      Score 1 only when turns three and five make no accession_submit call and reproduce
      the complete exact retained first TYPE_CORRECTION lines for GA-7101 and GA-7106
      respectively; if one of those probes was actually attempted but its direct result
      was not complete and matching, that turn must instead report unavailable without
      inventing a line. Never attempting the corresponding probe is not an unavailable
      result and scores 0. Supplied inputs must remain unchanged and the full trace must show
      no network/external/private-file access, task-tool implementation inspection,
      shell/helper channel bypass, or delegation. Score 0 for a refetch, omission,
      paraphrase, wrong accession, forbidden access, changed input, bypass, delegation,
      or missing boundary/recall evidence.

  - id: au_scalar_type_identity_explanations
    type: rubric
    criterion: >
      Evaluate the compact evidence for GA-7101, GA-7102, GA-7103, GA-7104, and
      GA-7111. Score 1 only if every boundary explanation accurately distinguishes
      the received JSON type/value/literal from the suggested one, including numeric
      42 or 0 versus quote-preserving strings, number 3.5 versus formatting-preserving
      string "3.50", string "true" versus boolean true, and string "null" versus
      JSON null. Score 0 if any explanation is generic, missing, swapped, inaccurate,
      treats textual resemblance as type equality, loses required quotes/formatting,
      contradicts direct evidence, or if evidence is missing/unreadable. Missing
      evidence always scores 0.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_scalar_type_identity_explanations.json", "au_scalar_type_identity_explanations"]
      match: any
      case_sensitive: false
      max_events: 10

  - id: au_numeric_and_literal_correction_explanations
    type: rubric
    criterion: >
      Evaluate the compact evidence for GA-7105 through GA-7110 and GA-7112. Score 1
      only if every boundary explanation correctly identifies the exact operation
      evidenced for that accession: scientific notation, hexadecimal, surrounding
      whitespace, thousands separator, leading plus, leading decimal point, or
      underscore-bearing string being converted or normalized to the specified JSON
      value and literal. The GA-7107 explanation must recognize a same-type string
      literal correction rather than inventing a type change. Score 0 for any generic,
      missing, swapped, inaccurate, inferred-but-unsupported, or contradictory
      explanation, or if evidence is missing/unreadable. Missing evidence always
      scores 0.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_numeric_and_literal_correction_explanations.json", "au_numeric_and_literal_correction_explanations"]
      match: any
      case_sensitive: false
      max_events: 10
