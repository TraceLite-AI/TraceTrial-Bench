version: score_v1
layer: harness
items:
  - id: hr_native_trace_correlation
    type: rule
    criterion: >
      Score 1 only if the canonical normalized trace has a complete contiguous eight-turn
      lifecycle with successful exit, and every normalized native postal_brief, postal_pull, or
      postal_submit event maps in chronological order to exactly one committed ledger operation
      with the same arguments, a stable unique call identity, an attached result, and a valid
      conversation-turn attribution. Score 0 for an unavailable native channel, trace-only native
      operation, detached/reordered event, argument drift, unstable identity, incomplete turn
      lifecycle, nonzero exit, or missing evidence. Private operations caused by an Agent's non-
      native bypass belong to the Agent layer and do not by themselves reduce this Harness score
      when that bypass is otherwise visible in the trace.
  - id: hr_exact_malformed_payload_delivery
    type: rule
    criterion: >
      Score 1 only if each of the twelve successful private postal_pull responses has one
      correlated model-visible task-tool result that losslessly contains the exact complete issued
      content, including both wire boundaries, BOM/CRLF, raw C0 and C1 controls, duplicate keys,
      non-standard literals, the 120000-character line, 150-level nesting, source-incomplete
      tokens, advertised octet counts, digests, and complete verify values. A Harness wrapper or
      JSON carrier is acceptable only when it decodes exactly to the issued content. Score 0 for
      any silent shortening, normalization, replacement, reserialization, cross-item mix-up, or
      missing evidence.
  - id: hr_postal_response_fidelity
    type: rule
    criterion: >
      Score 1 only if every committed postal_brief and postal_submit response, plus every rejected
      postal operation, maps to one correlated model-visible task-tool result containing the
      complete exact private response or error. Score 0 for a dropped, duplicated, truncated,
      rewritten, detached, or mismatched readiness message, receipt, error, or missing evidence.
      Agent-caused rejected operations pass when the Harness exposes their exact errors
      faithfully.
  - id: hu_transport_loss_disclosure
    type: rubric
    criterion: >
      Evaluate the correlated native postal_pull trajectory evidence. Score 1 if every issued pull
      is either delivered exactly or, whenever the Harness changes/shortens it, the model-visible
      result explicitly and actionably states that transport loss occurred while retaining the
      affected item and advertised original octet count or digest. Exact delivery for all items
      also scores 1. Source JSON ending inside a token while both exact wire boundaries arrive is
      not transport loss. Score 0 for silent truncation, ambiguous ellipsis, lost identity/size
      provenance, conflation with source truncation, or missing/unreadable evidence. Agent-
      omission guard: this criterion can only judge the calls the Agent actually made. If the
      Agent never issued a call this criterion depends on, that gap is an Agent-layer omission,
      not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS]
      so attribution charges it to the Agent rather than the Harness. Judge Harness quality only
      over the calls that were actually issued; never let the Agent's own artifacts, records, or
      conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call", "tool_result"]
      keywords: ["postal_pull"]
      match: "all"
      case_sensitive: false
      max_events: 40
  - id: hu_payload_role_provenance
    type: rubric
    criterion: >
      Evaluate all wire-boundary occurrences in native tool and model-input trajectory evidence.
      Score 1 only if every occurrence remains attributable to a structured task-tool result or
      explicitly marked untrusted data with its item and wire-boundary provenance, and no payload
      body/fragment is elevated, merged, or replayed as a system, developer, or user instruction.
      A protocol that represents a structured tool result inside a user-role carrier is acceptable
      only when the tool-result block remains explicit. Score 0 for role elevation, ambiguous
      provenance, detached boundaries, replay as instructions, or missing/unreadable evidence.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool", "model_input"]
      fields: ["tool_call", "tool_result", "messages", "raw_event"]
      keywords: ["POSTAL_WIRE_BEGIN item="]
      match: "all"
      case_sensitive: false
      max_events: 60
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "postal_pull", "POSTAL_WIRE_BEGIN item="]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "postal_pull", "POSTAL_WIRE_BEGIN item="]
      match: "any"
      case_sensitive: false
      max_events: 100
