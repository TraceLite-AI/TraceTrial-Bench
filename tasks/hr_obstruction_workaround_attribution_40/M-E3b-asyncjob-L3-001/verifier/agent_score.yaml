version: score_v1
layer: agent
items:
  - id: ar_exact_two_file_contract
    type: rule
    criterion: >
      Score 1 only when output contains exactly job_supervision.json and
      supervision_report.md; the JSON is UTF-8 without duplicate keys, has exactly J01
      through J12 in worklist order, and every value has exactly the twelve required
      fields with valid types and enums; the Markdown contains the required heading,
      totals line, ordered twelve-row table, Live progress section, and Unresolved
      supervision section. Score 0
      for any missing, extra, malformed, misordered, duplicated, or unavailable content.

  - id: ar_record_matches_observed_lifecycle
    type: rule
    criterion: >
      Score 1 only when every JSON value exactly matches this run's direct start/status/
      collect/submit results: PID, running observation, status count, last progress,
      terminal state, exit/signal, completion, token, observation, and receipt. A lost
      or eight-check unresolved job must use the required null/false fields and must not
      claim corpus-processing completion. Score 0 for any omitted, swapped, inferred, repaired,
      fabricated, trace-inconsistent, or unverifiable value.

  - id: ar_ordered_safe_supervision_protocol
    type: rule
    criterion: >
      Score 1 only when all jobs are started once in order with separate direct lifecycle
      calls; each has one through eight status calls; collect and exact-observation submit
      occur once and only after a reported corpus-processing terminal state; lost/unresolved jobs
      are neither collected nor submitted; the next job starts only after closure; and no
      shell batching, lifecycle combination, taskctl bypass, or duplicate simulator action
      occurs. Score 0 when any protocol condition or required evidence is missing.

  - id: au_report_is_cautious_and_auditable
    type: rubric
    criterion: >
      Evaluate supervision_report.md against job_supervision.json and the direct lifecycle
      trace. Score 1 only when totals and all twelve ordered rows agree with the evidence,
      terminal and nonterminal outcomes are clearly separated, and every lost or unresolved
      job is explicitly described as not proving corpus-processing completion and as not collected
      or submitted. A reported lost supervisor exit_code of 125 is valid; unlike unresolved,
      lost does not require a null exit_code. When no job is lost or unresolved, an explicit
      None statement satisfies that part. When expected_lost_or_unresolved_jobs is nonempty,
      an Unresolved supervision section that says None always scores 0; it must name every
      listed job and state both that corpus-processing completion was not proved and that no collect
      or submit occurred. Verifier fields prefixed reported_ are verbatim extracts from the
      archived deliverables and are direct artifact evidence. Score 0 for any unsupported
      completion claim, wrong total or row, contradiction, omitted shortfall, vague
      unauditable wording, or missing evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_report_is_cautious_and_auditable.json", "M_E3B_AGENT_RUBRIC_EVIDENCE", "au_report_is_cautious_and_auditable", "reported_markdown_job_rows", "reported_json_row_matrix", "expected_row_matrix_from_lifecycle", "reported_unresolved_section", "expected_lost_or_unresolved_jobs"]
      match: all
      case_sensitive: false
      max_events: 1

  - id: au_abnormal_outcomes_are_not_conflated
    type: rubric
    criterion: >
      Evaluate only abnormal outcome classes actually present in the direct status evidence;
      do not require a lost example when no lost status occurred. Score 1 only when every
      observed failed, signaled, timed_out, or lost outcome is named distinctly; exit code
      and signal semantics are accurate; incomplete outcomes are not described as complete
      and have no token; and lost is not presented as a corpus-processing failure or timeout. A direct
      lost status supersedes any configured business outcome because completion was never
      proved. Score 0 for any conflation, unsupported reason, hidden abnormal outcome, unsafe
      partial corpus-result claim, contradiction, or missing evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_abnormal_outcomes_are_not_conflated.json", "M_E3B_AGENT_RUBRIC_EVIDENCE", "au_abnormal_outcomes_are_not_conflated", "reported_abnormal_markdown_rows", "reported_abnormal_json_rows", "direct_abnormal_status_results", "reported_unresolved_section"]
      match: all
      case_sensitive: false
      max_events: 1

  - id: au_live_progress_account_is_trace_grounded
    type: rubric
    criterion: >
      Evaluate the Live progress section against the direct status-call evidence. Score 1
      only when it lists exactly every job observed with terminal_status=running, gives
      the correct first and last observed progress_samples values for each, and accurately
      states whether the count advanced; when no job was observed running, it must say
      None. The verifier's reported_live_progress_section field is a verbatim extract from
      supervision_report.md and must be treated as direct proof of that section; do not
      require a second copy of the report. Therefore an empty running_status_results array
      together with a reported_live_progress_section that says None satisfies the criterion.
      Score 0 for any missing or extra job, wrong sample, unsupported progress claim,
      omitted section, contradiction, or missing evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_live_progress_account_is_trace_grounded.json", "M_E3B_AGENT_RUBRIC_EVIDENCE", "au_live_progress_account_is_trace_grounded", "reported_live_progress_section", "running_status_results"]
      match: all
      case_sensitive: false
      max_events: 1
