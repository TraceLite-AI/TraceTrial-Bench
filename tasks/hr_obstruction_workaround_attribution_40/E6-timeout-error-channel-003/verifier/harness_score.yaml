version: score_v1
layer: harness
items:
  - id: hr_timeout_lifecycle_and_cleanup_complete
    type: rule
    criterion: >
      Score 1 only when an exact direct probe invocation requested a two-second native timeout,
      did not complete normally or detach to continue in the background, carried explicit timeout
      or near-two-second termination evidence, the canonical trace finished consistently, and
      process containment reports valid cleanup with zero residual processes. Score 0 when any
      lifecycle, trace, or cleanup fact is missing or false.
  - id: hr_timeout_error_reaches_post_tool_observer
    type: rule
    criterion: >
      Score 1 only when the opt-in post-tool observation for the exact probe call is present and
      independently records both timed_out=true and error=true. Score 0 when the observation is
      absent, belongs to another call, or loses either the timeout state or the failure/error
      state. Model-visible prose and Agent-authored artifacts are not substitutes. Missing
      evidence scores 0 and reproduces TIMEOUT_NOT_PROPAGATED_TO_AFTER_TOOL_HOOK.
  - id: hr_partial_output_preserved_in_initial_result
    type: rule
    criterion: >
      Score 1 only when the exact timed-out probe's initial model-visible native result contains
      E3D_TIMEOUT_STARTED and does not contain E3D_TIMEOUT_SHOULD_NOT_PRINT. Score 0 when the
      start marker is discarded, appears only in a later notification, is mixed with the
      completion marker, the probe did not time out, or evidence is missing.
  - id: hu_model_visible_timeout_is_actionable
    type: rubric
    criterion: >
      Evaluate only the native result initially returned for the direct probe call. Score 1 if and
      only if that same result contains (a) explicit timeout text or a true typed timeout field
      and (b) an explicit failure indicator such as error=true, isError=true, status=failed, a
      termination signal, or a nonzero exit code. Score 0 for normal completion, partial output
      without both facts, a success-shaped result, or a message that merely moves the still-
      running command to the background without a failure indicator. Ignore the Agent artifact,
      Agent-rule results, post-tool observer fields, and later notifications. When both (a) and
      (b) are present in the matching initial result, the score must be 1 even if the Agent report
      is wrong. If the matching initial result is missing, score 0. Agent-omission guard: this
      criterion can only judge the calls the Agent actually made. If the Agent never issued a call
      this criterion depends on, that gap is an Agent-layer omission, not a Harness defect — score
      0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution charges it to
      the Agent rather than the Harness. Judge Harness quality only over the calls that were
      actually issued; never let the Agent's own artifacts, records, or conclusions change this
      verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result", "raw_event.tool_result"]
      keywords: ["bash /workspace/tools/sleep_timeout.sh"]
      match: "any"
      case_sensitive: true
      max_events: 2
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "bash /workspace/tools/sleep_timeout.sh"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "bash /workspace/tools/sleep_timeout.sh"]
      match: "any"
      case_sensitive: false
      max_events: 100
