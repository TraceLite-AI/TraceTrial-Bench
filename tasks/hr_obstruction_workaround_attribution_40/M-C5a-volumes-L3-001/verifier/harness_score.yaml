version: score_v1
layer: harness
items:
  - id: hr_three_session_trace_is_complete
    type: rule
    criterion: >
      Score 1 only when structured trace evidence contains one start and one successful finish for
      every turn 1 through 9, exactly two new-native-session boundaries before turns 4 and 7,
      three distinct chained native session IDs, preserved workspace state, and a matching model-
      visible replay handoff with a nonempty message count and identical history digest at each
      boundary. Score 0 for missing or inconsistent lifecycle evidence, or when a substantive
      prior assistant message is re-emitted and attributed to a later turn, because such cross-
      turn replay makes the normalized trace incomplete or misleading.
  - id: hr_lifecycle_responses_are_model_visible
    type: rule
    criterion: >
      Compare every successful RECEIPT, AMENDED, and RETIRED lifecycle fact in the private
      simulator ledger with normalized model-visible tool results. Score 1 only when all eighteen
      expected facts are present and the full fact multiplicity counters are identical. Score 0
      for a missing, altered, duplicated, unpaired, or unavailable fact; set-only equality is
      insufficient.
  - id: hr_replay_preserves_actionable_current_state
    type: rule
    criterion: >
      Inspect the actual model inputs at both boundaries. Score 1 only when the last visible
      current-state occurrence before turn 4 is M02=B8AF630A and M05=D3346039, the last such
      occurrence before turn 7 is M02=41C7D90E and M04=DA525ACF, and both inputs contain the
      model-visible resume wrapper. Score 0 for a missing, stale, wrong-group, runner-only, or
      unavailable current value.
  - id: hr_replay_scope_role_and_provenance_are_clear
    type: rubric
    criterion: >
      Score 1 only when both model-visible transition inputs explicitly identify a new native
      session, delimit replayed history from the current user request, preserve user/assistant
      role and chronological order for this task only, and link the payload through trace metadata
      to old/new session IDs, boundary turn, message count, and digest. Score 0 for silent or
      ambiguous transitions, replay/current mixing, role corruption, unrelated-history leakage,
      inconsistent provenance, or missing evidence. If the required evidence cannot be retrieved,
      score 0. Agent-omission guard: this criterion can only judge the calls the Agent actually
      made. If the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["context_handoff", "session_boundary", "conversation_turn_started", "model_input"]
      fields: ["event_type", "action", "before_turn", "previous_session_id", "session_id", "model_visible", "history_message_count", "history_sha256", "new_session", "history_replayed", "turn_index", "conversation_turn", "input", "messages", "content", "raw_event"]
      keywords: ["harness_resume_context", "current_user_message", "new native session", "session_boundary", "context_handoff", "replay"]
      match: "any"
      case_sensitive: false
      max_events: 80
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "harness_resume_context", "current_user_message", "new native session"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "harness_resume_context", "current_user_message", "new native session"]
      match: "any"
      case_sensitive: false
      max_events: 100
