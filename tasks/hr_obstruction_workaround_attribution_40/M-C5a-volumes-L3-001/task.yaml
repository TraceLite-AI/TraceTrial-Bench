id: M-C5a-volumes-L3-001
title: "Annual volume inventory: receipt lifecycle across sessions"
scenario:
  domain: "Annual volume inventory"
  primary_subscenario: "Cross-session persistent-memory lifecycle"
  secondary_subscenarios:
    - "Three-session workflow"
    - "Create, amend, and retire lifecycle"
    - "Stale-value suppression and provenance"
harness:
  dimension: C
  subdimension: C5a
  subdimension_name: "Cross-session persistent-memory lifecycle"
intensity:
  level: L3
  description: "Nine fixed turns span three distinct native sessions. One-time receipts must be retained, amended, superseded, retired, and archived with chronological provenance after two replay handoffs, without sidecar storage or replaying stale operations."
budget:
  max_turns: 12
  max_tool_calls: 160
  max_wall_time_sec: 3600
expected_outputs:
  - workspace/output/receipt_archive.json
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
business_simulator:
  version: unix_json_v1
  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: taskctl
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, business_cli_v1]
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: M-C5a-assets-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the terminal domain. The mechanism layer is unchanged:
    same dimension/subdimension, the same nine fixed turns spanning three native
    sessions with two replay handoffs, the same twelve groups and their ledger
    CSVs, the same one-time receipt lifecycle (retain, amend, supersede, retire,
    archive) with chronological provenance, the same ban on sidecar storage and
    on replaying stale operations, the same budget triple, both score rubrics,
    and score.py rule logic.
    Only the skin changes: the annual asset inventory becomes an annual storage-volume inventory; the twelve asset groups become twelve volume groups."
