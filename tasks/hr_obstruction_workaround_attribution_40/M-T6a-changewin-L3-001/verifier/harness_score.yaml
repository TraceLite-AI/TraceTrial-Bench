version: score_v1
layer: harness
items:
  - id: hr_complete_six_turn_trace
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace has contiguous sequence numbers, one
      complete six-turn conversation, one successful trace-complete run and assistant message per
      turn, a successful root finish, no run_failed event, and every native tool event has a
      stable call ID and associated result. Score 0 when any lifecycle boundary, turn, result
      association, final event, summary alignment, or required trace evidence is missing or
      incomplete.
  - id: hr_native_registry_roundtrip
    type: rule
    criterion: >
      Score 1 only when every committed simulator request for M01 through M08 has exactly one
      model-visible native change_discover or change_act event with the same top-level tool
      identity, arguments, complete direct result, stable call ID, and conversation turn.
      Uncommitted bridge validation errors do not count as simulator requests but must retain
      their own result. Score 0 for a generic wrapper identity, dropped, altered, detached,
      duplicated committed call, shell mediation, or unavailable evidence.
  - id: hr_dynamic_lifecycle_pressure
    type: rule
    criterion: >
      Score 1 only when private and native evidence jointly proves generation-one discovery and
      authorization during turns 2 and 4, following-turn execution attempts during turns 3 and 5,
      one no-effect CapabilityRetired transition for each of M04 and M08, and successful native
      generation-two rediscovery, reauthorization, and execution after each transition. Score 0
      when either independent pressure chain did not occur or cannot be associated with complete
      native trajectory evidence.
  - id: hu_discovery_authorization_visibility
    type: rubric
    criterion: >
      Evaluate only the native discovery and authorization evidence for M01 through M08. Score 1
      only when every successful discovery visibly preserves the matching item, opaque operation
      name, generation, lifecycle state, and next action, and every successful authorization
      visibly preserves its generation-bound credential, intervening-call limit, remaining-call
      value, lifecycle state, and next action, all attached to explicit native call identities and
      results. Score 0 for any missing, truncated, altered, ambiguous, generic-wrapper-only,
      cross-item, or detached field or result. Score 0 when evidence is missing or incomplete.
      Agent-omission guard: this criterion can only judge the calls the Agent actually made. If
      the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call", "tool_result"]
      keywords: ["CAPABILITY_DISCOVERED", "lifecycle_state=AUTHORIZED"]
      match: "any"
      case_sensitive: true
      max_events: 100
  - id: hu_cross_turn_continuity
    type: rubric
    criterion: >
      Evaluate only the initial authorization and first following-turn execution attempt for each
      released item. Score 1 only when the evidence unambiguously connects each turn-2
      authorization to its M01-M04 turn-3 attempt and each turn-4 authorization to its M05-M08
      turn-5 attempt, preserving item, operation, generation, credential, call identity, result,
      and turn boundary without replay confusion or loss. Score 0 for any missing, same-turn,
      cross-item, stale, generic-wrapper-only, detached, or ambiguous continuity evidence. Score 0
      when evidence is missing or incomplete. Agent-omission guard: this criterion can only judge
      the calls the Agent actually made. If the Agent never issued a call this criterion depends
      on, that gap is an Agent-layer omission, not a Harness defect — score 0 and begin the reason
      with the literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than
      the Harness. Judge Harness quality only over the calls that were actually issued; never let
      the Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call", "tool_result"]
      keywords: ["lifecycle_state=AUTHORIZED", "lifecycle_state=EXECUTED", "CAPABILITY_RETIRED"]
      match: "any"
      case_sensitive: true
      max_events: 100
  - id: hu_retirement_refresh_visibility
    type: rubric
    criterion: >
      Evaluate only the M04 and M08 retirement-and-refresh chains. Score 1 only when each native
      retirement result clearly reports the retired and current generations, no business effect,
      required rediscovery, and authorization invalidation, and the subsequent native evidence
      visibly supplies a new operation, new generation-bound authorization, and successful
      generation-two execution. Score 0 for a missing, truncated, altered, ambiguous, generic-
      wrapper-only, detached, stale-generation, or incomplete chain. Score 0 when evidence is
      missing or incomplete. Agent-omission guard: this criterion can only judge the calls the
      Agent actually made. If the Agent never issued a call this criterion depends on, that gap is
      an Agent-layer omission, not a Harness defect — score 0 and begin the reason with the
      literal prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the
      Harness. Judge Harness quality only over the calls that were actually issued; never let the
      Agent's own artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call", "tool_result"]
      keywords: ["CAPABILITY_RETIRED", "current_generation=2", "generation=2"]
      match: "any"
      case_sensitive: true
      max_events: 40
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "CAPABILITY_DISCOVERED", "lifecycle_state=AUTHORIZED", "lifecycle_state=EXECUTED"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "CAPABILITY_DISCOVERED", "lifecycle_state=AUTHORIZED", "lifecycle_state=EXECUTED"]
      match: "any"
      case_sensitive: false
      max_events: 100
