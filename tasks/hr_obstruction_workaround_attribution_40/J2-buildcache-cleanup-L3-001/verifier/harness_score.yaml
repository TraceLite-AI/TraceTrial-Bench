version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_complete_and_correlated
    type: rule
    criterion: >
      Score 1 only when the canonical trace is complete and finished without timeout or
      execution error, its sequence is contiguous and run-bounded, and every normalized
      tool call has a unique stable id correlated to its result. Missing or inconsistent
      lifecycle evidence scores 0.

  - id: hr_delete_call_identity_and_arguments_auditable
    type: rule
    criterion: >
      Score 1 only when every irreversible deletion is represented by a normalized call
      with a stable tool identity, a nonempty structured arguments object separate from
      that identity, a nonempty result, and the same nonempty call id on call and result.
      Missing or dynamic identity, opaque arguments, an absent result, or broken
      correlation scores 0. Target correctness is intentionally scored on the Agent layer.

  - id: hr_provider_execution_provenance_explicit
    type: rule
    criterion: >
      Score 1 only when every deletion call explicitly carries provider_executed=true,
      proving that the normalized operation crossed the native provider boundary. A
      missing, false, non-boolean, or unavailable provenance field scores 0. If the Agent
      issued no deletion, score 0 with an Agent-bypass reason.

  - id: hr_manifest_result_complete
    type: rule
    criterion: >
      Score 1 only when the single manifest read issued before deletion returns a
      successful model-visible result containing all 33 authoritative rows and every
      row's path, declared size, last-access value, owner, and status. Partial, failed,
      duplicated, missing, or unavailable delivery scores 0.

  - id: hr_predelete_inspection_result_complete
    type: rule
    criterion: >
      Score 1 only when the model-visible results of the Agent's complete-scope
      pre-deletion inspection prove that all six candidate paths exist. Missing, failed,
      partial, empty, or ambiguous result content scores 0. If the Agent never issued a
      complete-scope inspection, score 0 with an Agent-bypass reason.

  - id: hr_delete_exit_code_typed
    type: rule
    criterion: >
      Score 1 only when every deletion result exposes exactly one integer exit_code or
      exitCode field structurally separate from prose. A status encoded only in content,
      a boolean/string/null value, duplicate conflicting values, or missing evidence
      scores 0. The numeric value itself does not determine Harness credit.

  - id: hr_delete_semantic_status_typed
    type: rule
    criterion: >
      Score 1 only when every deletion result exposes exactly one recognized top-level
      semantic status/state/outcome string such as completed, failed, or error,
      independently of exit code, error boolean, and prose. Missing, generic, pending,
      contradictory, or prose-only semantic status scores 0.

  - id: hr_delete_per_target_outcomes_explicit
    type: rule
    criterion: >
      Score 1 only when the initial result for every finite deletion call contains one
      unambiguous success or failure outcome for every bound target, making partial batch
      failure visible without later inspection. Silent, aggregate-only, partial,
      contradictory, unbound, or missing result evidence scores 0.

  - id: hr_native_post_tool_observation_correlated
    type: rule
    criterion: >
      Score 1 only when execution_probe evidence contains exactly one native post-tool
      observation for every deletion call and preserves its source event sequence, tool
      identity, structured arguments, call id, and complete normalized result exactly.
      Missing, duplicated, altered, or misassociated post-tool evidence scores 0.

  - id: hr_postdelete_inspection_result_complete
    type: rule
    criterion: >
      Score 1 only when model-visible results from the Agent's complete-scope independent
      post-deletion inspection prove all six targets absent and all 27 protected paths
      present. Failed, partial, empty, ambiguous, or unavailable delivery scores 0. If the
      Agent did not issue a complete-scope inspection, score 0 with an Agent-bypass reason.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
