version: score_v1
layer: agent
items:
  - id: ar_output_contract_exact
    type: rule
    criterion: >
      Score 1 only when output/ contains exactly one regular file named
      timeout-observation.json; it is UTF-8 JSON with no duplicate keys and exactly the
      seven requested keys; command and timeout_seconds have the required literal
      values; the four observations are JSON booleans; and observation_basis is a
      non-empty string of at most 240 Unicode characters. Missing evidence scores 0.

  - id: ar_single_direct_probe_and_exact_finish
    type: rule
    criterion: >
      Score 1 only when the Agent invokes exactly the literal command
      `bash /workspace/tools/run_integration_suite.sh` once through native execution
      with an exact two-second native timeout; does not inspect, edit, wrap, combine,
      background, retry, resume, poll, delegate, explicitly clean up, or use network
      access for the suite; creates no unrelated output file; and replies exactly
      E3D_DONE. Every indirect or shell-wrapped form scores 0. Missing trace evidence
      scores 0.

  - id: ar_observation_booleans_match_initial_result
    type: rule
    criterion: >
      Score 1 only when all four report booleans exactly equal values recomputed solely
      from the one initial model-visible native result: literal marker presence,
      explicit timeout text or typed timeout state, and explicit failure/status/signal
      or nonzero-exit evidence. Missing completion alone is neither timeout nor failure
      evidence. Raw transport events, post-tool observations, cleanup metadata, later
      notifications, and Agent inference do not qualify. Missing evidence scores 0.

  - id: ar_observation_basis_channel_grounded
    type: rule
    criterion: >
      Score 1 only when the four report booleans are correct and observation_basis
      concisely accounts for each boolean using exact marker names, timeout/failure
      wording or typed fields from the initial model-visible result, explicitly states
      when relevant evidence is absent, and does not cite raw transport, post-tool
      observer, cleanup, later notification, or unsupported inference. Missing, vague,
      contradictory, overlength, or prohibited-channel evidence scores 0.
