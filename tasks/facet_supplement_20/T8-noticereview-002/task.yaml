  description: "Twelve compliance items are released in three gated batches across ten turns through two native task-scoped skills. Exact full-result relay, one-to-one private/native call correlation, Unicode and newline fidelity, tool-free cross-turn retention, provenance, grounded artifacts, and complete trace lifecycle are evaluated."
