id: T8-noticereview-002
title: "Maintenance Notice Compliance: Native Skill Result Relay"
scenario:
  domain: "marketing-copy compliance validation"
  primary_subscenario: "native skill result relay"
  secondary_subscenarios:
    - "multi-turn batch processing"
    - "native tool call/result correlation"
    - "cross-turn receipt retention"
    - "evidence-grounded deliverables"
harness:
  dimension: T
  subdimension: T8
  subdimension_name: "skill result relay"
intensity:
