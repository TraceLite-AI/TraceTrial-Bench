  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: .harnessbench/simulator-cli
task_tools:
  version: mcp_stdio_v1
  manifest: simulator/tools.json
execution_probe:
  version: lifecycle_v1
  requires: [task_tools_v1, post_tool_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: M-T5d-copyreview-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the terminal domain. The mechanism layer is unchanged:
    same dimension/subdimension, the same twelve compliance items released in three
    gated batches across ten turns through two native task-scoped skills, the
    same exact full-result relay and one-to-one private/native call correlation,
    the same Unicode and newline fidelity checks, the same tool-free cross-turn
    retention and provenance rules, the same budget triple, both score rubrics,
    and score.py rule logic.
    Only the skin changes: the marketing copy review becomes a maintenance-notice review; the twelve constraint categories are kept one for one because they define the relay fidelity being measured."
