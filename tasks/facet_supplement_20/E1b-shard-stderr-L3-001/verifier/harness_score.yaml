version: score_v1
layer: harness
items:
  - id: hr_complete_ten_turn_trace
    type: rule
    criterion: >
      Score 1 only when one canonical ten-turn conversation is complete and its
      finished summary is aligned with the final trace event. Score 0 for any
      missing, partial, duplicated, or inconsistent trace. This is always binary.

  - id: hr_direct_invocations_auditable
    type: rule
    criterion: >
      Score 1 only when all twelve privately recorded shard invocations have one
      matching model-visible direct tool call/result in assigned order. Score 0
      when issued calls are absent, duplicated, reordered, wrapped, or not
      attributable to their results. If the Agent did not exercise the required
      direct path, score 0 with an Agent-bypass reason; never use N/A.

  - id: hr_routine_stdout_and_success_coherent
    type: rule
    criterion: >
      Score 1 only when every shard result contains its exact routine SHARD lines,
      assertion count, status=completed, and a successful completion indication in
      the same result. Score 0 for loss, truncation, contradiction, or cross-call
      mixing. If the Agent bypassed the direct path, score 0; never use N/A.

  - id: hr_stderr_payload_shard02_intact
    type: rule
    criterion: >
      Score 1 only when shard 02's privately issued stderr FAILURE diagnostic,
      exact one-time code, diagnostic type, and complete impact note reach that
      shard's model-visible direct result exactly once. Otherwise score 0.
  - id: hr_stderr_payload_shard03_intact
    type: rule
    criterion: >
      Score 1 only when shard 03's privately issued stderr FAILURE diagnostic,
      exact one-time code, diagnostic type, and complete impact note reach that
      shard's model-visible direct result exactly once. Otherwise score 0.
