  - id: hr_stderr_payload_shard08_intact
    type: rule
    criterion: >
      Score 1 only when shard 08's privately issued stderr FAILURE diagnostic,
      exact one-time code, diagnostic type, and complete impact note reach that
      shard's model-visible direct result exactly once. Otherwise score 0.
  - id: hr_stderr_payload_shard11_intact
    type: rule
    criterion: >
      Score 1 only when shard 11's privately issued stderr FAILURE diagnostic,
      exact one-time code, diagnostic type, and complete impact note reach that
      shard's model-visible direct result exactly once. Otherwise score 0.

  - id: hr_stderr_provenance_shard02_explicit
    type: rule
    criterion: >
      Score 1 only when shard 02's direct result explicitly identifies the complete
      diagnostic as stderr through a typed stderr field or unambiguous channel
      label. Unlabeled aggregation, inference from FAILURE, or missing content is 0.
