version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_complete_and_correlated
    type: rule
    criterion: >
      Score 1 only when one canonical trace is complete, finished, not timed out, and
      error-free; its sequence is contiguous from run_started through run_finished;
      and every tool call has a unique non-empty id exactly correlated with its result.
      Missing, mirrored-only, truncated, inconsistent, or ambiguous evidence scores 0.

  - id: hr_manifest_result_complete_model_visible
    type: rule
    criterion: >
      Score 1 only when a model-visible result of a call that reads
      registry/CLEANUP_MANIFEST.md exposes all 33 parsed manifest rows and, for every
      row, the exact path, declared size, last-access value, owner, and status. Partial,
      truncated, stale-keyword-only, malformed, or missing result evidence scores 0.

  - id: hr_delete_results_per_target_visible
    type: rule
    criterion: >
      Score 1 only when each normalized deletion result gives an unambiguous
      model-visible success or failure message for every target bound to that call.
      Silent, aggregate-only, empty, missing, or ambiguous per-target evidence scores 0.

  - id: hr_delete_exit_codes_top_level_typed
    type: rule
    criterion: >
      Score 1 only when every deletion result contains exactly one top-level integer
      exit_code or exitCode equal to 0. A string, boolean, nested value, prose-only
      claim, missing value, duplicate alias, or nonzero value scores 0.

  - id: hr_delete_semantic_status_top_level_coherent
    type: rule
    criterion: >
      Score 1 only when every deletion result has an explicit top-level status, state,
      or outcome equal to success, succeeded, complete, completed, or ok, with no
      contradictory typed field. error=false, an exit code, success-shaped prose,
      null, pending, running, unknown, or missing status scores 0.

  - id: hr_delete_post_tool_observations_correlated
    type: rule
    criterion: >
      Score 1 only when execution-probe evidence has exactly one post-tool observation
      for every deletion call, correlated by call id, source sequence, stable tool name,
      and exact arguments. Missing, duplicate, reordered, or mismatched evidence scores 0.

  - id: hr_delete_post_tool_exit_codes_preserved
    type: rule
    criterion: >
      Score 1 only when every exactly correlated deletion post-tool observation
      preserves a top-level integer exit_code or exitCode equal to 0. A nested, string,
      boolean, missing, duplicate, or nonzero value scores 0.

  - id: hr_delete_post_tool_semantic_status_coherent
    type: rule
    criterion: >
      Score 1 only when every exactly correlated deletion post-tool observation has an
      explicit successful top-level status, state, or outcome with no contradiction.
      error=false alone, null, generic, pending, running, failure, or missing status
      scores 0.
