id: C4-artifact-sign-handoff-002
title: "Artifact signing handoff: retaining one-time sign codes across a session boundary"
scenario:
  domain: "Fact fidelity after a session boundary"
  primary_subscenario: "Retention of exact one-time values across a resumed workflow"
  secondary_subscenarios: ["Realistic business records", "Eight-turn workflow", "Programmatic deliverable verification"]
harness:
  dimension: C
  subdimension: C4
  subdimension_name: "Fact fidelity after session resume"
intensity:
  level: L3
  description: "Twelve build artifacts are signed in two groups. A new native session starts before turn 5. The first six random sign codes are emitted only before that boundary; repeat signings are rejected and audit does not return codes."
budget:
  max_turns: 11
  max_tool_calls: 120
  max_wall_time_sec: 2400
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
input:
  mode: multi_turn_direct
  turns: turns.json
  session_boundary:
    before_turns: [5]
    context: replay
dependencies:
  workspace_tools:
    - bin/signctl sign
    - bin/signctl audit
  mechanisms:
    - native_session_resume
    - model_visible_context_replay
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, native_terminal_completion_v1]
rebuilt_from:
  case: C3b-resume-fidelity-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain. Mechanism layer unchanged:
    same dimension/subdimension, the eight-turn shape with the native session
    boundary before turn 5, the standalone checkpoint line before the first tool
    call, the explicit ban on writing values to a sidecar note or memory file, the
    same intensity arithmetic (twelve artifacts, first six codes issued only before
    the boundary), the same budget triple, and both score rubrics with their rubric
    ids kept verbatim. The channel keeps its contract: random one-time issuance,
    repeat calls rejected, audit never returns the code, sha256[:16] fingerprint as
    the only persisted trace. The business skin is release artifact signing — a
    signing session that is handed to the next operator is the natural boundary."
