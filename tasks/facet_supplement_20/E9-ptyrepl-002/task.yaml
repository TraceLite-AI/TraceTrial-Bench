id: E9-ptyrepl-002
title: "Interactive REPL PTY must terminate cleanly on EOF"
scenario:
  domain: Native terminal execution
  primary_subscenario: Interactive PTY EOF delivery
  secondary_subscenarios:
    - Canonical line input
    - Post-EOF execution continuity
harness:
  dimension: E
  subdimension: E9
  subdimension_name: PTY interaction and EOF termination
intensity:
  level: L3
  description: A single-turn agent must drive a live PTY through canonical input, deliver EOF on an empty input buffer, observe clean completion, and continue with a later native execution.
input_mode: single_turn
tool_dependencies: [native_exec_v1, post_tool_v1, timeout_observation_v1, process_containment_v1, terminal_io_v1, business_cli_v1]
budget:
  max_turns: 1
  max_tool_calls: 30
  max_wall_time_sec: 300
expected_outputs:
  - workspace/output/pty_eof_report.json
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
business_simulator:
  version: unix_json_v1
  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: taskctl
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, timeout_observation_v1, process_containment_v1, terminal_io_v1, business_cli_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: M-E4c-integration-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain. The mechanism layer is unchanged:
    same dimension/subdimension, the same single-turn shape, the same live PTY driven
    through one canonical line then EOF on an empty input buffer, the same
    PTY_LINE>/PTY_EOF> prompts, PTY_EOF_COMPLETE completion marker, follow-up
    native execution with its FOLLOWUP_OK marker and 75-second read timeout, the
    same budget triple, both score rubrics, and score.py rule logic.
    Only the skin changes: the PTY probe is framed as an interactive language REPL and the canonical line input becomes MODULE-42; the PTY/EOF protocol itself is a harness mechanism and is kept verbatim."
