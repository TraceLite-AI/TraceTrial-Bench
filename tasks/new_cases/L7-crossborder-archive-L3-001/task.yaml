id: L7-crossborder-archive-L3-001
title: "Polar-research cargo release archive: preserve an unrepeated profile through compaction"
scenario:
  domain: "Polar Research Logistics"
  primary_subscenario: "International polar-research supply transfer archiving"
  secondary_subscenarios:
    - "Advance-versus-released transfer-manifest control"
    - "Retention of an early one-time expedition logistics profile"
    - "Exact customs-record enrichment"
harness:
  dimension: C
  subdimension: C2b
  subdimension_name: "Compaction fidelity"
intensity:
  level: L3
  description: "An 11-turn polar-research logistics conversation places a one-time transfer-archive profile before eight preview feeds containing 6,160 consignment rows in total. The profile is not written to disk or refreshed during pressure and is first used on a small RELEASED transfer manifest after native compaction."
input_mode: fixed_turns
tool_dependencies: [native_exec_v1, post_tool_v1]
budget:
  max_turns: 11
  max_tool_calls: 80
  max_wall_time_sec: 2400
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
expected_outputs:
  - workspace/output/archive.jsonl
  - workspace/output/handoff.md
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
