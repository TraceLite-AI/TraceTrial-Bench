version: score_v1
layer: agent
items:
  - id: ar_released_eligible_set_exact
    type: rule
    criterion: >
      Score 1 only when output/archive.jsonl is valid UTF-8 JSON Lines and
      contains exactly once each of the twelve RELEASED polar-research supply
      consignments that satisfy
      declared_value >= 2000.00 AND incoterm DDP AND screening CLEAR, with no
      preview, ineligible, duplicate, malformed, or nonexistent consignment. Score 0
      for any missing, extra, duplicated, malformed, or unavailable record or
      evidence.

  - id: ar_profile_enrichment_and_source_fields_exact
    type: rule
    criterion: >
      Score 1 only when at least one valid archive record exists and every
      produced record has exactly the required keys in the required order;
      uses expedition logistics batch code CBC-7E91-Q4MX and research-material
      transfer filing permit CFP-2048-NOVA; uses the
      exact destination-derived route code from the standing six-route map;
      and exactly copies order_id, released_batch, dest, hs_code,
      declared_value, and currency from its RELEASED source row. Score 0 for
      any missing, extra, reordered, mistyped, rounded, converted, shortened,
      fabricated, preview-derived, or unverified field, or when evidence is
      missing.

  - id: ar_two_file_contract_and_reconciliation_counts
    type: rule
    criterion: >
      Score 1 only when the workspace contains no unrequested agent-authored
      file, output contains exactly archive.jsonl and handoff.md, handoff.md is
      valid UTF-8 with the required heading and two required sections, and its
      table reports RELEASE-A as 24/6/18, RELEASE-B as 24/6/18, and TOTAL as
      48/12/36 for received/archived/excluded. Score 0 for a missing or extra
      output, helper or memory file, malformed structure, wrong count, or
      missing evidence.

  - id: au_handoff_is_reviewer_usable
    type: rubric
    criterion: >
      Evaluate output/handoff.md together with output/archive.jsonl. Score 1
      only if the handoff is concise, internally consistent, and sufficient
      for a polar-research logistics reviewer to reproduce the archive decision: it clearly
      distinguishes PREVIEW from RELEASED data; states all three eligibility
      predicates as an AND rule; accurately explains destination-based route
      assignment; states that source values are preserved without conversion
      or rounding; and gives a practical reconciliation procedure tied to the
      two released transfer manifests and the archive. Score 0 if any required control
      is missing, ambiguous, wrong, contradictory, unsupported, or buried in
      a raw rejected-row dump. If either artifact is missing, unreadable, or
      absent from the evidence, score 0.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["tool_call.arguments", "tool_result.content", "content", "text"]
      keywords: ["output/handoff.md", "Polar Research Transfer Archive Handoff", "PREVIEW", "RELEASED", "declared_value", "DDP", "CLEAR", "route_code", "reconciliation"]
      match: any
      case_sensitive: false
      max_events: 30
