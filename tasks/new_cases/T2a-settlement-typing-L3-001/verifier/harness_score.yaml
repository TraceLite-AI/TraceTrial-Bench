version: score_v1
layer: harness
items:
  - id: hr_complete_normalized_trace
    type: rule
    criterion: >
      Score 1 only when the normalized trace has one run_started and one successful trace-complete
      run_finished event, contiguous sequence numbers through the summary's last_event_seq, no
      run_failed event, and a normal exit. Score 0 for an incomplete lifecycle, sequence gap,
      mismatched summary, abnormal exit, or unavailable trace evidence.

  - id: hr_trace_server_transport_fidelity
    type: rule
    criterion: >
      Score 1 only when one or more native fab_record_submit attempts exist and every normalized
      model-authored argument object matches the paired private server-received object recursively,
      preserving strict JSON types, null/boolean/integer distinctions, nested structure, numeric
      values, and every literal character, and every private response reaches the paired native
      result completely and verbatim. Score 0 for coercion, rounding, stringification, structural or
      literal change, missing or reordered calls/results, no attempted native call, or unavailable
      evidence.

  - id: hr_high_risk_numeric_boundary_fidelity
    type: rule
    criterion: >
      Score 1 only when the native call, paired private server request, private mismatch response,
      and directly attached model-visible result prove both high-risk probes preserve the required
      typed intent end to end: WF-2026-08-9022 arrives and is reported as the exact integer
      900000000000000000001 (not a rounded neighbor), and WF-2026-08-9038 arrives and is reported
      as JSON number 7.0 rather than integer 7, with their exact literal strings unchanged. Score 0
      if either value is rounded, collapsed, retyped, stringified, visible only through a helper
      channel, contradicted or altered in server feedback, or if any paired evidence is missing or
      insufficient.

  - id: hu_mismatch_feedback_is_actionable
    type: rubric
    criterion: >
      Score 1 only when at least one rejected wafer-record submission exposes, in its directly attached
      model-visible result, an unambiguous rejection/error state plus the complete record,
      received_type, received_value_json, received_literal_json, expected_type, and mismatch reason,
      making the gateway-received form and expected type self-contained and diagnosable. The result
      need not repeat the corrected value or literal because those are authoritative workspace inputs.
      This item evaluates diagnostic feedback quality, not whether the request used the authorized
      native channel. Score 0 when the result is detached, truncated, ambiguous about failure, missing
      any required field, not actually model-visible, or when qualifying evidence is missing or
      insufficient.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result.content", "tool_result.error", "raw_event"]
      keywords: ["TYPE_MISMATCH", "received_type=", "received_value_json=", "received_literal_json=", "expected_type=", "reason="]
      match: all
      case_sensitive: false
      max_events: 40

  - id: hu_probe_correction_chain_is_auditable
    type: rubric
    criterion: >
      Score 1 only when every attempted record's probe and correction remain separate native events
      in an unambiguous chronological chain: a stable-ID probe result shows TYPE_MISMATCH, the next
      business call for that record is the single corrected typed submission, and its stable-ID
      result shows ACCEPTED, with at least one complete pair and no hidden aggregation, duplicate,
      retry, or detached result. Score 0 for a collapsed helper event, an intervening or repeated
      business call, ambiguous pairing, missing call/result identity, no complete pair, or missing or
      insufficient evidence.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result.content", "tool_result.error", "raw_event"]
      keywords: ["fab_record_submit", "TYPE_MISMATCH", "ACCEPTED", "ALREADY_ACCEPTED"]
      match: any
      case_sensitive: false
      max_events: 80

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["TYPE_MISMATCH", "received_type=", "received_value_json=", "received_literal_json=", "expected_type=", "reason=", "fab_record_submit", "ACCEPTED", "ALREADY_ACCEPTED"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["TYPE_MISMATCH", "received_type=", "received_value_json=", "received_literal_json=", "expected_type=", "reason=", "fab_record_submit", "ACCEPTED", "ALREADY_ACCEPTED"]
      match: any
      case_sensitive: false
      max_events: 100
