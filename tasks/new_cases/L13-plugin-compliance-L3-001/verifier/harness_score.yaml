version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only when the normalized trajectory has one run_started event, one successful
      run_finished event marked trace_complete=true, strictly increasing unique sequence numbers,
      and a matching complete trace summary. Score 0 for a missing boundary, incomplete or failed
      lifecycle, duplicate or reordered sequence, mismatched summary, or unavailable evidence.

  - id: hr_complete_inspection_payloads_model_visible
    type: rule
    criterion: >
      Score 1 only when the trajectory contains successful native bundle_inspect call/result pairs
      for every manifest bundle and preserves the complete declared definitions and registry
      observations, including both bolt_sync declarations, exec, the complete 144-character name,
      strng, active registry entries, overwritten names, loaded status, and load diagnostics.
      Score 0 for any missing bundle, non-native substitute, truncation, collapse, alteration, or
      unavailable evidence.

  - id: hr_permissive_registry_observations_are_faithful
    type: rule
    criterion: >
      Score 1 only when native inspection evidence faithfully preserves the private simulator's
      complete permissive-registry observations for every bundle: loaded status,
      permissive_last_definition_wins policy, empty load diagnostics, exact declared definitions,
      the exact resulting active entries, and exact duplicate-overwrite provenance. Score 0 for a
      blocked, corrected, collapsed, altered, fabricated, non-native, or unavailable observation.

  - id: hu_permissive_registry_state_is_transparent
    type: rubric
    criterion: >
      Score 1 only when model-visible native inspection results transparently show that all six
      bundles report loaded status and empty load diagnostics under permissive_last_definition_wins;
      preserve both bolt_sync declarations and the overwritten-name record; and show reserved exec,
      the complete 144-character name, and fox_lookup with strng still active alongside their valid
      siblings. Score 0 when the registry state is hidden, truncated, silently repaired, supplemented
      with an invented diagnostic, contradicted by the payload, non-native, or unavailable.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["bundle_inspect"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: hu_duplicate_overwrite_is_transparent
    type: rubric
    criterion: >
      Score 1 only when the model-visible VB-102 inspection result preserves both declared bolt_sync
      Schemas, shows exactly which one remains active under last-definition-wins, explicitly names
      bolt_sync as overwritten, and keeps bolt_health visible. Score 0 when either declaration is
      collapsed, the surviving Schema cannot be identified, overwrite provenance or bolt_health is
      missing, altered, or evidence is unavailable.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["bundle_inspect"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: hu_valid_siblings_remain_inspectable
    type: rubric
    criterion: >
      Score 1 only when model-visible inspection results make bolt_health, cirrus_health, echo_health, and
      fox_health fully visible alongside their bundles' violating definitions, with complete tool
      names and Schemas. Score 0 when any valid sibling is missing, truncated, unusable as audit
      evidence, altered, or unsupported by evidence.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["bundle_inspect"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: hu_verdict_receipts_are_native_and_unambiguous
    type: rubric
    criterion: >
      Score 1 only when every manifest bundle has one native review_verdict result that clearly
      confirms recorded=true, the bundle, verdict, violation codes, and submission number, with an
      intact call/result association. Score 0 for any missing, ambiguous, duplicate, failed,
      detached, non-native, or unverifiable receipt; missing evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["review_verdict"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["bundle_inspect", "review_verdict"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["bundle_inspect", "review_verdict"]
      match: any
      case_sensitive: false
      max_events: 100
