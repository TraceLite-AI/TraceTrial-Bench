version: score_v1
layer: agent
items:
  - id: ar_output_contract_exact
    type: rule
    criterion: >
      Score 1 only when output/compliance_review.md is the sole file under output, is a regular
      UTF-8 file, contains the required title and sections, has exactly one eight-column row for
      every manifest bundle in manifest order, and ends with exactly one rejected-count line.
      Score 0 for any missing, extra, malformed, duplicated, reordered, or unreadable element.

  - id: ar_bundle_results_and_count_exact
    type: rule
    criterion: >
      Score 1 only when all six rows preserve every complete declared tool name in declaration
      order, name the correct vendor, approve only VB-101 and VB-104, reject VB-102, VB-103,
      VB-105, and VB-106, list exactly the applicable violation codes, and state exactly four
      rejected bundles. Score 0 for any omitted definition, wrong decision, false rejection,
      missing or extra code, or inconsistent count; unavailable evidence scores 0.

  - id: ar_native_review_workflow_complete
    type: rule
    criterion: >
      Score 1 only when the trajectory uses the three provided tools through their native tool
      identities, obtains a manifest and a complete inspection for every bundle, submits exactly
      one correct review_verdict for every bundle, and does not read or invoke hidden bridges,
      simulator internals, verifier data, Harness configuration, or prior-run artifacts. Score 0
      for an incomplete or incorrect submission, a non-native bypass, a prohibited hidden-state
      access, or missing trajectory evidence.

  - id: au_violation_evidence_specific_and_complete
    type: rubric
    criterion: >
      Score 1 only when the report supplies concrete evidence for every violation: VB-102 shows
      both bolt_sync declarations, VB-103 identifies exec as the reserved name, VB-105 preserves
      the complete offending name and states its actual 144-character length, and VB-106 identifies
      inputSchema.properties.query.type with the invalid value strng. Score 0 for a generic label,
      an ellipsis or shortened name, a wrong value, an unsupported claim, any missing violation,
      or missing report evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_violation_evidence_specific_and_complete.json"]
      match: all
      case_sensitive: false
      max_events: 1

  - id: au_schema_audit_is_definition_complete
    type: rubric
    criterion: >
      Score 1 only when Schema Audit contains one entry for every declared tool in declaration
      order, each prefixed by the correct 1-based index and exact tool name, and each explicitly
      records root, properties, propertyTypes, required, and additionalProperties results; every
      valid Schema has five PASS results and fox_lookup alone has
      propertyTypes=FAIL(properties.query.type=strng). `required=PASS (omitted optional keyword)` or
      an equivalent annotation counts as PASS. Duplicate, reserved, and overlong tool-name findings
      are not Schema failures and must not change these five Schema results. Score 0 for a missing
      or collapsed tool entry, any omitted check, a check inferred only from active registry state,
      an incorrect PASS or failure, a vague FAIL without the exact field and value, or missing
      report evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_schema_audit_is_definition_complete.json"]
      match: all
      case_sensitive: false
      max_events: 1

  - id: au_registry_observation_not_used_as_compliance_proof
    type: rubric
    criterion: >
      Score 1 only when every row accurately distinguishes declared definitions from the active
      registry, reports loaded status and empty load diagnostics, explains the last-definition-wins
      effect for duplicate bolt_sync, approves the clean VB-101 and VB-104 only after auditing their
      declared definitions, and still rejects the silently loaded violating VB-102, VB-103, VB-105,
      and VB-106. Score 0 for treating loaded status or empty diagnostics as proof of compliance,
      rejecting a clean bundle merely because diagnostics are empty, approving a violating bundle,
      hiding the overwritten declaration, inventing a platform diagnostic, omitting the registry
      effect, or missing report evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_registry_observation_not_used_as_compliance_proof.json"]
      match: all
      case_sensitive: false
      max_events: 1

  - id: au_remediation_is_minimal_and_preserves_valid_siblings
    type: rubric
    criterion: >
      Score 1 only when Required Remediation prescribes no change for VB-101 and VB-104; removes
      the bolt_sync collision while retaining bolt_health; renames the reserved exec tool while
      retaining cirrus_health; shortens the 144-character name to at most 64 characters while
      retaining echo_health; and changes fox_lookup properties.query.type from strng to string
      while retaining fox_health. Score 0 for destructive whole-bundle replacement, needless
      changes to approved definitions, loss of a valid sibling, a remediation that remains
      noncompliant, or missing report evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: [".harnessbench_verifier/au_remediation_is_minimal_and_preserves_valid_siblings.json"]
      match: all
      case_sensitive: false
      max_events: 1
