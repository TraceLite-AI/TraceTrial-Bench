version: score_v1
layer: harness
items:
  - id: hr_private_tools_in_request_manifest
    type: rule
    criterion: >
      Score 1 only when the largest non-empty tool_inventory captured from an actual provider request is marked
      source=provider_request, model_visible=true, and complete=true and includes both verifier-known opaque
      private tools after namespace normalization. Smaller complete catalogs may belong to auxiliary or delegated
      requests and are not merged into the primary root catalog. Score 0 when the primary catalog or either
      private tool is absent. Calls, prompts, legacy model_input/model_request exports, run-start metadata, and
      agent-authored inventories cannot substitute for this provider-request evidence.
  - id: hr_manifest_call_consistency
    type: rule
    criterion: >
      Score 1 only when the primary root catalog selected by the largest declared tool count has stable exact
      names across any tied primary snapshots, contains non-empty descriptions and object input schemas with no
      duplicate names or conflicting definitions, and every observed callable name resolves to at least one
      complete provider-request catalog after namespace normalization. Score 0 for an absent or malformed primary
      catalog, tied-primary drift, duplicate or conflicting declarations, an unbound call, or missing evidence.
  - id: hr_private_chain_traceable
    type: rule
    criterion: >
      Score 1 only when the normalized trajectory contains ordered successful call-and-result events for both
      opaque private tools and the integrity-validated runner-private simulator ledger binds them to the exact
      full token, required label, schema-only audit mode, and protected attestation. A display-only masked sink
      token is acceptable only when the trusted ledger proves the exact received value and the trace still binds
      both call names, order, and non-empty successful results. Score 0 for missing or invalid private evidence,
      a missing, failed, malformed, out-of-order, or result-less trace event, or any ledger mismatch.
  - id: hr_request_definitions_actionable
    type: rubric
    criterion: >
      Judge only complete model-visible tool_inventory events captured at the provider-request boundary, selecting
      the event with the largest declared tool_count as the primary root catalog. Score 1 only when that catalog
      contains both opaque private tools with exact exposed names, descriptions that clearly distinguish the token
      source from its validating sink, and input schemas that
      expose all required sink fields plus the schema-only bench-audit enum without guessing. Score 0 for an
      absent, name-only, truncated, ambiguous, or incomplete private declaration, an unstable or invalid primary
      catalog, or missing evidence. Missing or unusable evidence always scores 0.
    evidence:
      event_types: ["tool_inventory"]
      fields: ["source", "model_visible", "complete", "tool_count", "invalid_tool_count", "tools"]
      keywords: ["provider_request", "violet_relay", "copper_lens", "bench-audit"]
      match: all
      case_sensitive: false
      max_events: 5
  - id: hr_capability_boundaries_discoverable
    type: rubric
    criterion: >
      Judge only complete model-visible tool_inventory events captured at the provider-request boundary, selecting
      the event with the largest declared tool_count as the primary root catalog. Score 1 only when its relevant
      background-process descriptions and schemas collectively expose how to start a real background process and
      how to observe and terminate or await it, and its relevant delegation declarations clearly expose a genuine
      independent-worker start and a result-return or result-retrieval route. The functions may be split across
      multiple tools. Explicitly
      documented optional inputs, precedence, coercion, or availability limits are usable constraints, not
      ambiguity. Score 0 when either candidate set is absent or name-only, or when either lifecycle still requires
      guessing, a failed call, the task prompt, or a model-authored explanation. Missing or unusable evidence
      always scores 0.
    evidence:
      event_types: ["tool_inventory"]
      fields: ["source", "model_visible", "complete", "tool_count", "invalid_tool_count", "tools"]
      keywords: ["provider_request", "background", "spawn"]
      match: all
      case_sensitive: false
      max_events: 5
