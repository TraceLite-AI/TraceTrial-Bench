version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_and_all_turns_complete
    type: rule
    criterion: >
      Score 1 only when the selected aggregate normalized trace is marked complete, starts with
      conversation_started, ends with run_finished, contains exactly matching configured inputs
      for turns 1 through 10, and contains a conversation_turn_finished event for every turn.
      Score 0 for an incomplete lifecycle, missing or altered turn, missing finish event, or
      unavailable deterministic trace evidence.
  - id: hr_one_native_session_carries_all_revisions
    type: rule
    criterion: >
      Score 1 only when the conversation summary proves that all ten turns completed in one non-
      empty native session with no configured or observed session boundary before a later turn.
      Score 0 for multiple or missing native session IDs, fewer than ten completed turns, a
      session boundary, or unavailable deterministic evidence.
  - id: hr_all_controlled_values_reach_model_in_bound_results
    type: rule
    criterion: >
      Score 1 only when each of the eight settled construction bid-lot IDs has a normalized recon
      fetch tool event whose call names that bid lot and whose bound result contains that bid
      lot's exact issued settled_at and approver values. Score 0 when any line lacks a bound
      complete result, values appear only in private state or later agent output, or deterministic
      evidence is unavailable.
  - id: hr_current_revocation_is_visible_in_model_input
    type: rubric
    criterion: >
      Score 1 only when a normalized model_input event for conversation turn 7 exposes the
      complete current user revision to the model, including that approver is revoked, settled_at
      replaces it, the report must be updated in that turn, and approver must not remain even as
      null. Exact readable user-message content inside that turn-7 model_input event, whether in
      messages or its raw_event payload, is sufficient. A conversation_turn_started scheduling
      event, assistant paraphrase, later file write, or model_input record without readable
      revision text is insufficient. Score 0 when any clause is absent or truncated, the event is
      not tied to turn 7, only non-model-input evidence is available, or evidence is missing.
      Evaluate the matching turn-7 event itself: repetition of the same readable message in later
      model_input events must not negate Score 1 and uniqueness across later turns is not
      required. Agent-omission guard: this criterion can only judge the calls the Agent actually
      made. If the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["model_input"]
      fields: ["messages", "raw_event", "conversation_turn"]
      keywords: ["the `approver` field is revoked", "Replace it with `settled_at`", "do not keep `approver`, even as `null`"]
      match: "all"
      case_sensitive: false
      max_events: 20
  - id: hr_prior_goal_context_is_auditable_at_revocation
    type: rubric
    criterion: >
      Score 1 only when normalized model_input evidence tied to conversation turn 7 makes the
      ordered goal history auditable: the earlier settled-bid-lots-only scope revision, the later
      instruction to add approver, and the current instruction to revoke approver and replace it
      with settled_at are all present as user inputs in their original order inside one coherent
      model-request payload. The proof must be one normalized model_input event tied to
      conversation turn 7 whose ordered messages field contains all three revisions. Records
      originating from turns 3 or 5, or separate turn-7 model_input events that each expose only
      one historical message, must not be combined: they do not prove those messages belonged to
      one model request. Later replay at turns 8-10 is irrelevant. Score 0 when only the current
      turn is exposed in the qualifying event, history is fragmented across events, prior
      revisions are missing or unordered, the evidence is opaque or assistant-authored, or
      evidence is missing. Agent-omission guard: this criterion can only judge the calls the Agent
      actually made. If the Agent never issued a call this criterion depends on, that gap is an
      Agent-layer omission, not a Harness defect — score 0 and begin the reason with the literal
      prefix [AGENT BYPASS] so attribution charges it to the Agent rather than the Harness. Judge
      Harness quality only over the calls that were actually issued; never let the Agent's own
      artifacts, records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["model_input"]
      fields: ["messages", "raw_event", "conversation_turn", "seq"]
      keywords: ["settled construction bid lots only", "add `approver` to every report entry", "the `approver` field is revoked"]
      match: "any"
      case_sensitive: false
      max_events: 30
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "the `approver` field is revoked", "Replace it with `settled_at`", "do not keep `approver`, even as `null`"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "the `approver` field is revoked", "Replace it with `settled_at`", "do not keep `approver`, even as `null`"]
      match: "any"
      case_sensitive: false
      max_events: 100
