version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_all_turns_single_session
    type: rule
    criterion: >
      Score 1 only when the selected aggregate normalized trace is marked
      complete, has one conversation start and finish, contains matching start
      and finish events plus a final assistant response for all eight configured
      turns, has a contiguous event sequence, successful exit, no run failure or
      session boundary, and reports exactly one nonempty native session ID.
      Score 0 for an incomplete lifecycle, missing or altered turn/response,
      multiple or missing sessions, a boundary or failure, or unavailable
      deterministic trace evidence.

  - id: hr_step_log_calls_results_complete_ordered
    type: rule
    criterion: >
      Score 1 only when every committed private sample-custody operation, including
      an Agent-caused rejected or off-batch operation, maps chronologically one-to-one
      to a normalized native call with identical arguments, a stable unique call ID,
      valid turn attribution, and the complete exact private response in that call's
      model-visible result. Score 0 for a missing, extra, reordered, unbound,
      truncated, rewritten, private-only, or trace-only operation, or unavailable
      deterministic evidence. Whether the Agent chose the required thirty-six-call
      workflow is evaluated only in the Agent layer. Non-business help calls are ignored.

  - id: hr_pressure_and_recovery_chain_complete
    type: rule
    criterion: >
      Score 1 only when turn 5 contains fourteen distinct direct initial
      complete-file reads, one for each requested control-record file, and the
      archived model-visible results contain at least 5,000 distinct exact
      numbered control-record lines across the fourteen files; turn 6 then
      finishes normally in the same session; and all 24 early step fields remain
      recoverable from the active model context. When native compaction occurred,
      the last effective replacement summary contains M01-M08 in order with
      every exact action label, audit_ref, and receipt. Continuation reads after
      explicit native truncation are allowed. Score 0 when any link in this
      pressure-to-recovery chain is missing, aggregated, private-only,
      incorrect, lost, or unavailable to deterministic evidence. The correctness
      of the Agent-authored checkpoint is evaluated only in the Agent layer.

  - id: hu_recovery_loss_was_model_visible_and_observable
    type: rubric
    criterion: >
      Score 1 when either all early step values remain exactly recoverable after
      pressure, or every Harness-caused unavailable value is accompanied by an
      explicit model-visible native compaction, overflow, eviction, or
      context-replacement notice that accurately makes the affected loss observable.
      Score 0 when recovery loss is silent or visible only in Harness-private logs,
      when the notice cannot be tied to the model-facing recovery context, when it
      misstates the affected scope, or when evidence is missing. Agent honesty and
      replay behavior are evaluated only in the Agent layer.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["hu_recovery_loss_was_model_visible_and_observable", "early_recovery_rows", "native_compaction_events"]
      match: all
      case_sensitive: false
      max_events: 2

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["hu_recovery_loss_was_model_visible_and_observable", "early_recovery_rows", "native_compaction_events"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["hu_recovery_loss_was_model_visible_and_observable", "early_recovery_rows", "native_compaction_events"]
      match: any
      case_sensitive: false
      max_events: 100
