version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, contains
      run_started and run_finished lifecycle events, ends with status=finished and
      exit_code=0 without timeout, has last_event_seq equal to the maximum event seq,
      and container/process cleanup is valid with zero residual processes. Score 0
      when any lifecycle or cleanup fact is false or unavailable. Missing evidence
      scores 0.

  - id: hr_tool_call_result_pairing_complete
    type: rule
    criterion: >
      Score 1 only when the normalized trace contains at least one tool event, every
      tool event has both a structured call and structured result, every call/result
      pair carries the same non-empty tool_call_id, all call IDs are unique, and the
      trace summary reports equal total tool-call and tool-result counts. Score 0 for
      any missing, duplicated, orphaned, or mismatched call/result evidence. Missing
      trace or summary evidence scores 0.

  - id: hr_channel_transitions_delivered_with_operation_identity
    type: rule
    criterion: >
      Score 1 only when every privately logged accepted operation has its exact
      operation_id and submitted state in pre-reconciliation model-visible tool-result
      evidence; every privately confirmed operation also has its exact operation_id,
      confirmed state, rows, and downstream_ms visible; and every submitted-only
      operation has its exact operation_id plus confirmation=unavailable and
      channel_wait_window_elapsed visible. For a confirmation whose private source is
      audit_reconciliation, the matching authoritative audit result must instead expose
      its exact operation_id, confirmed state, receipt, rows, and downstream_ms. Score 0
      for any missing, truncated, cross-associated, or contradictory operation outcome.
      Agent-authored artifacts are not substitutes. Missing private or trajectory
      evidence scores 0.

  - id: hu_submitted_state_is_actionable
    type: rubric
    criterion: >
      Evaluate the direct writeoff-run results, including correctly correlated process
      poll results when a command continues asynchronously. Score 1 only if the model
      can clearly see that submitted is an intermediate or submitted-only state rather
      than confirmation: the batch and operation identity remain attributable, the
      waiting message is preserved, and at least one slow operation visibly ends with
      confirmation unavailable after the channel window. Score 0 if submitted is lost,
      presented as success/confirmation, detached from its batch or operation, or the
      terminal unavailable outcome is absent or ambiguous. Ignore prompt prose, audit
      output, Agent artifacts, and later Agent explanations. Missing matching direct
      result evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_name", "tool_call.name", "tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["bin/writeoff", "\"state\":\"submitted\"", "channel_wait_window_elapsed"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: hu_terminal_outcome_provenance_is_unambiguous
    type: rubric
    criterion: >
      Evaluate direct writeoff-run and correlated continuation results. Score 1 only
      when result provenance lets the model distinguish both terminal cases without
      inference: confirmed operations are success-shaped and carry confirmed, rows,
      and downstream_ms for the same operation, while submitted-only operations carry
      confirmation=unavailable/channel_wait_window_elapsed and a Harness-native,
      machine-readable non-success field such as error=true, a nonzero typed exit_code,
      or status=failed. A shell-emitted string such as EXIT_CODE=75, Agent prose, or
      inference from the business payload does not qualify as result-status metadata.
      Score 0 when either terminal case is missing, success/failure metadata is absent
      or contradictory, output from different operations is mixed, or a submitted-only
      result appears success-shaped. Prompt/runbook text, Agent artifacts, Agent-layer scores, and Agent
      conclusions do not qualify and must not alter this Harness verdict. When both
      terminal conditions are directly shown, score 1 even if an Agent deliverable or
      Agent-layer item is wrong. Missing matching result evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["bin/writeoff", "\"state\":\"confirmed\"", "channel_wait_window_elapsed", "downstream_ms"]
      match: any
      case_sensitive: false
      max_events: 50

  - id: hu_operation_results_remain_correlated
    type: rubric
    criterion: >
      Evaluate the model-visible results of writeoff-run operations, whether they finish
      in one tool result, a grouped command, or a still-running session with later polls.
      Score 1 only when each submitted, confirmed, or confirmation-unavailable fragment
      remains unambiguously attributable to the correct batch and operation_id; if
      continuations occur, they must also remain bound to the originating call/session.
      Score 0 when output fragments are orphaned, mixed across operations, lose batch or
      operation identity, or make the lifecycle impossible to reconstruct. Synchronous
      completion is valid evidence and must not score 0 merely because no continuation
      was necessary. Missing matching writeoff result evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_call.tool_name", "tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["operation_id", "bin/writeoff", "still running", "session", "poll"]
      match: any
      case_sensitive: false
      max_events: 60

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["bin/writeoff", "\"state\":\"submitted\"", "channel_wait_window_elapsed", "\"state\":\"confirmed\"", "downstream_ms", "operation_id", "still running", "session", "poll"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["bin/writeoff", "\"state\":\"submitted\"", "channel_wait_window_elapsed", "\"state\":\"confirmed\"", "downstream_ms", "operation_id", "still running", "session", "poll"]
      match: any
      case_sensitive: false
      max_events: 100
