id: T2d-coercion-advice-L3-001
title: "National Germplasm Bank: Typed Accession Metadata Correction"
scenario:
  domain: "crop germplasm conservation"
  primary_subscenario: "legacy accession metadata type correction"
  secondary_subscenarios:
    - "native structured tool argument fidelity"
    - "seed-bank gateway correction payload delivery"
    - "evidence-grounded accession resubmission"
    - "multi-turn intake evidence retention"
harness:
  dimension: T
  subdimension: T2d
  subdimension_name: "parameter type correction advice delivery"
intensity:
  level: L3
  description: >
    Twelve crop-germplasm accessions exercise integer-to-string, number-to-string, string-to-boolean,
    string-to-null, string-to-integer, string-to-number, and exact-literal
    metadata corrections. Each accession requires one
    documented legacy metadata probe, a native TypeCorrectionRequired result carrying
    the exact server-received type and literal plus an authoritative typed
    suggestion, and one correction derived from that result. Model-authored
    arguments, private server-received arguments, model-visible results,
    cross-turn recall, signed germplasm intake receipts, type-boundary explanations,
    and final accession artifacts are reconciled.
input_mode: fixed_turns
tool_dependencies: [task_tools_v1, post_tool_v1]
budget:
  max_turns: 8
  max_tool_calls: 120
  max_wall_time_sec: 1800
model_call_budget:
  version: provider_requests_v1
  limit: 96
  finalization_reserve: 8
container_resources:
  version: container_limits_v1
  memory_bytes: 8589934592
expected_outputs:
  - workspace/output/accession_result.json
  - workspace/output/accession_notes.md
verifier:
  entrypoint: verifier/run.sh
  selftest: verifier/selftest.py
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
business_simulator:
  version: unix_json_v1
  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: .harnessbench/simulator-cli
task_tools:
  version: mcp_stdio_v1
  manifest: simulator/tools.json
execution_probe:
  version: lifecycle_v1
  requires: [task_tools_v1, post_tool_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: tasks/cases/T2d-coercion-advice-L3-001
  what_changed: >
    Optimized as a fully English eight-turn native-tool case. All twelve retained
    crop-germplasm accessions still require a real seed-bank gateway rejection and an
    advice-grounded typed
    retry, while non-mechanism summary and validation turns were removed. A dedicated
    preparation turn separates workspace reading from the first business batch; the
    final four accessions are split across two bounded turns and artifact finalization has
    its own business-tool-free turn. Canonical corrections remain runner-private;
    typed arguments, model-visible error results, cross-turn recall, signed intake
    receipts, and Agent-authored type-boundary explanations are evaluated with compact
    rule and rubric evidence.
