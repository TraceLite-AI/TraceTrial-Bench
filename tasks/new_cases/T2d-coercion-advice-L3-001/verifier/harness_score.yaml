version: score_v1
layer: harness
items:
  - id: hr_complete_eight_turn_native_trajectory
    type: rule
    criterion: >
      Score 1 only when all eight fixed user turns finish successfully in one
      complete native conversation, the normalized event sequence is contiguous,
      no run_failed event exists, and every attempted accession_submit call has a
      stable call ID with one attached result and one chronologically corresponding
      private simulator record. Fewer than twenty-four business calls is an Agent
      omission and remains neutral here. Score 0 for a missing/failed turn,
      non-native or detached call, duplicate trace identity, trace/private count or
      order mismatch, nonzero exit, or missing lifecycle evidence.

  - id: hr_typed_accession_arguments_arrive_exactly
    type: rule
    criterion: >
      Score 1 only when every attempted model-authored accession_submit argument object
      matches its paired private server-received argument object recursively, with
      strict JSON type and value equality and every literal character preserved.
      Score 0 for stringification, number/boolean/null coercion, numeric or literal
      rewriting, reordered/detached pairing, missing boundary evidence, or no attempted
      accession_submit call from which argument transport can be evidenced.

  - id: hr_type_correction_results_reach_model_verbatim
    type: rule
    criterion: >
      Score 1 only when every attempted private germplasm-accession gateway response has one
      paired model-visible native tool result containing the complete exact task-tool
      content, including all received/suggested fields in TypeCorrectionRequired
      errors and all accepted fields and signed receipts in successes. Score 0 for a
      missing, truncated, duplicated, detached, altered, or unavailable result, or when
      no accession_submit call is attempted and result delivery therefore cannot be evidenced.

  - id: hu_correction_advice_is_actionable
    type: rubric
    criterion: >
      Evaluate only accession_submit rejections that the Agent actually attempted in the
      model-visible native trajectory; unattempted accessions are an Agent omission and
      are neutral here. Score 1 only if at least one attempted rejection is evidenced
      and every such rejection is clearly attributable to its accession_submit call and
      exposes, without ambiguity, the received type/value/literal, the suggested
      type/value/literal, and the mismatch reason in a form the model can directly
      use for the next typed call. Score 0 for an ambiguous carrier, missing call
      association, conflated received/suggested fields, advice that requires guessing
      or reparsing a damaged fragment, an attempted rejection with missing/unreadable
      result evidence, or no relevant attempted-rejection evidence at all. Missing
      evidence for an attempted call always scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call", "tool_result"]
      keywords: ["TYPE_CORRECTION"]
      match: any
      case_sensitive: true
      max_events: 60

  - id: hu_ambiguous_scalar_identity_survives_context
    type: rubric
    criterion: >
      Evaluate tool-result and subsequent model-input evidence for the subset of
      GA-7101, GA-7103, GA-7104, and GA-7111 that the Agent actually attempts;
      unattempted accessions are neutral. Score 1 only if at least one selected accession is
      attempted and the Harness preserves an
      auditable distinction between JSON strings and the numeric, boolean, or null
      values they resemble, including the exact quote-bearing literal fields, and
      keeps those facts attributable to structured tool results rather than elevating
      or flattening them into ambiguous instructions. Score 0 for type erasure,
      quote/literal loss, unsafe or ambiguous role flattening, cross-accession mixing, an
      attempted selected accession with missing/unreadable result or model-input evidence,
      or no selected attempted accession evidence at all. Missing evidence for an
      attempted selected accession always scores 0.
    evidence:
      event_types: ["tool", "model_input"]
      fields: ["conversation_turn", "tool_call", "tool_result", "messages", "content", "raw_event"]
      keywords: ["GA-7101", "GA-7103", "GA-7104", "GA-7111"]
      match: any
      case_sensitive: true
      max_events: 80

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["TYPE_CORRECTION", "GA-7101", "GA-7103", "GA-7104", "GA-7111"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["TYPE_CORRECTION", "GA-7101", "GA-7103", "GA-7104", "GA-7111"]
      match: any
      case_sensitive: false
      max_events: 100
