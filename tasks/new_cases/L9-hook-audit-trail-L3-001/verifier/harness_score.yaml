version: score_v1
layer: harness
items:
  - id: hr_trace_and_actions_attributable
    type: rule
    criterion: >
      Score 1 only when the normalized trajectory contains exactly one run_started and
      one run_finished event and all event sequence numbers are present, unique, and
      monotonic; and each of the six manifest actions appears in exactly one separate
      native execution event with a unique nonempty tool-call ID. These actions are the
      radio-telescope configuration changes. Score 0 when lifecycle
      evidence is missing, duplicated, malformed, or out of order, or when an action is
      missing, duplicated, combined, or unidentifiable.

  - id: hr_exec_error_envelopes_truthful
    type: rule
    criterion: >
      Score 1 only when both nonzero actions expose their exact exit code and both output
      sides under an outer tool-result error=true envelope, and both timeout actions expose
      error=true, explicit timeout/termination, both partial-output markers, no completion
      token, no continued/background handle, and no retry or larger-timeout advice. Score 0
      when any outer error flag or required fact is absent/false, or any forbidden success,
      continuation, background, polling, or retry signal is present.

  - id: hr_hook_chain_model_visible
    type: rule
    criterion: >
      Score 1 only when the trace and committed simulator evidence correlate one observatory manifest
      request, one execution-triggered hook bridge per action, one registration per
      action, and one hook export request; and the model-visible export preserves the
      expected four singleton rows, CHG-4202 duplicate, and CHG-4204 omission exactly.
      Score 0 for any missing, duplicate, unmatched, corrupted, or model-invisible stage.

  - id: hr_nonzero_exec_error_fidelity
    type: rubric
    criterion: >
      Use only the matched trajectory tool_result fields; ignore the Agent deliverable,
      Agent rubric verdicts, and Agent-authored interpretation. Evaluate the initial
      native results for CHG-4200 and CHG-4203. Score 1 when the matched CHG-4200 result
      literally contains COMMIT COMPLETE, ERROR journal checksum rejected, and exit 17,
      and the matched CHG-4203 result literally contains deployment successful, FATAL
      lease handoff rejected, and exit 23. Those same-call result fields are direct proof
      of payload fidelity. Score 0 if either result is absent, truncated, flattened,
      delayed, cross-associated, or lacks any required literal/status. Missing or
      irrelevant evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_result"]
      keywords: ["COMMIT COMPLETE", "FATAL lease handoff rejected"]
      match: any
      case_sensitive: false
      max_events: 16

  - id: hr_timeout_exec_error_fidelity
    type: rubric
    criterion: >
      Use only the matched trajectory tool_result fields; ignore the Agent deliverable,
      Agent rubric verdicts, and Agent-authored interpretation. Evaluate the initial
      native results for CHG-4201 and CHG-4204. Score 1 only when each same-call result
      explicitly reports timeout/termination, preserves preflight=ok plus its action's
      activation marker, omits completion-token=issued, and remains attributable to the
      correct action. Score 0 for a null/missing result, normal completion, lost partial
      output, contradictory completion metadata, or cross-association. Missing or
      irrelevant evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_result"]
      keywords: ["activation acknowledged", "policy activation started"]
      match: any
      case_sensitive: false
      max_events: 16

  - id: hr_hook_export_fidelity
    type: rubric
    criterion: >
      Evaluate only the initial model-visible hook_audit_log result. Score 1 only when it
      identifies the channel as a simulated observatory invocation-observation export, returns four
      singleton change rows plus two CHG-4202 rows and no CHG-4204 row, preserves the
      ToolAudit and execution-marker fields, and adds no outcome, exit-code, error, or
      timeout facts. Score 0 when the result is absent, truncated, deduplicated, enriched,
      altered, or associated with another call. Missing or irrelevant evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_result"]
      keywords: ["taskctl hook_audit_log", "HOOK_AUDIT_EXPORT"]
      match: any
      case_sensitive: false
      max_events: 4

  - id: hr_cross_channel_provenance
    type: rubric
    criterion: >
      Score 1 only when the trajectory keeps each native action result, its subsequent
      change_register call/result, and the final hook-export call/result separately
      attributable by tool-call ID and change ID, while preserving their distinct
      semantics: native results carry outcome evidence, registrations carry Agent
      classifications, and hook rows carry invocation observations only. Score 0 when
      identifiers or ordering are lost, channels are merged, native errors are visible
      only through later Agent text, or hook/registration data is presented by the
      Harness as native outcome truth. Missing or irrelevant evidence scores 0.
    evidence:
      event_types: ["tool"]
      fields: ["seq", "tool_call.tool_call_id", "tool_call.arguments", "tool_result"]
      keywords: ["_hook_record", "change_register", "hook_audit_log"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "COMMIT COMPLETE", "FATAL lease handoff rejected", "activation acknowledged"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "COMMIT COMPLETE", "FATAL lease handoff rejected", "activation acknowledged"]
      match: any
      case_sensitive: false
      max_events: 100
