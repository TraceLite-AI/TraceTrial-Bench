id: T1e-monthend-actions-L3-001
title: "Submersible Dive Actions: Dense Native Tool Surface and Exact Routing"
scenario:
  domain: "crewed deep-sea submersible dive-readiness control"
  primary_subscenario: "large near-duplicate native tool surface"
  secondary_subscenarios:
    - "request-time tool-list capacity and truncation"
    - "exact routing among near-duplicate names"
    - "stateful no-effect and audit-block signals"
    - "multi-turn receipt retention"
harness:
  dimension: T
  subdimension: T1e
  subdimension_name: "tool-surface explosion and exact routing"
intensity:
  level: L3
  description: "Fifty task-scoped native tools are exposed together: twelve submersible action families each have one effective unsuffixed form and three non-effective near-duplicates, plus two dive-control process tools. A controlled calibration triggers NO_EFFECT and AUDIT_BLOCK, while three staged releases require exact one-shot routing and receipt retention across ten turns."
budget:
  max_turns: 10
  max_tool_calls: 140
  max_wall_time_sec: 2400
model_call_budget:
  version: provider_requests_v1
  limit: 120
  finalization_reserve: 10
expected_outputs:
  - workspace/output/dive_action_receipts.json
  - workspace/output/dive_action_notes.md
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
business_simulator:
  version: unix_json_v1
  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: .harnessbench/simulator-cli
task_tools:
  version: mcp_stdio_v1
  manifest: simulator/tools.json
execution_probe:
  version: lifecycle_v1
  requires: [task_tools_v1, post_tool_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: T1e-monthend-actions-L3-001
  what_changed: "Reframed as a crewed deep-sea submersible dive-readiness operation while preserving the fully English ten-turn case, fifty runner-native near-duplicate tools, isolated NO_EFFECT/AUDIT_BLOCK calibration, three strict release turns, delayed finalization, private cross-turn reconciliation, compact rubric evidence, and no legacy workspace bootstrap Markdown files."
