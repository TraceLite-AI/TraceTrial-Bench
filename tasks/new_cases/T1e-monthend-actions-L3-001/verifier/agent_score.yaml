version: score_v1
layer: agent
items:
  - id: ar_output_contract
    type: rule
    criterion: >
      Score 1 only when output contains exactly dive_action_notes.md and dive_action_receipts.json as
      regular UTF-8 files; the duplicate-key-free JSON has exactly the twelve ordered item keys and
      every value has exactly state, action, and receipt in that order; and the Markdown has exactly
      the required title, one calibration section with three bullets, one item section, the exact
      table header and separator, and exactly twelve ordered five-column rows with no extra nonblank
      content. Score 0 for any missing, extra, malformed, reordered, duplicate, non-regular,
      structurally altered, or unavailable output evidence.

  - id: ar_exact_validated_dive_results
    type: rule
    criterion: >
      Score 1 only when all twelve output records exactly match the private ground truth and each is
      supported by exactly one committed dive_brief call, one applicable unsuffixed production
      action returning its complete item-bound EFFECTIVE line and receipt, and one dive_submit call
      with that receipt returning ACCEPTED; every item-table row must repeat the exact selected
      action, EFFECTIVE line, and ACCEPTED line, and the three calibration bullets must identify the
      exact tools and complete direct results in call order. Score 0 for any wrong, missing,
      invented, borrowed, ineffective, duplicated, retried, unvalidated, contradictory, or
      unavailable item or calibration evidence.

  - id: ar_released_turns_and_one_shot
    type: rule
    criterion: >
      Score 1 only when protected native trajectory evidence associates the exact three calibration
      calls with turn 2, every item 001-004 process call with turn 2, every item 005-008 call with
      turn 4, and every item 009-012 call with turn 7; all workflows are one-shot; no task tool is
      called on preparation, recall, evidence-only, or finalization turns; and no hidden channel or
      network access occurs. Score 0 for early release, late execution, a wrong-turn call, retry,
      duplicate, bypass, or unavailable native association.

  - id: ar_audit_note_grounding_first_half
    type: rubric
    criterion: >
      Score 1 when every Brief basis output cell for items 001 through 006 is a concise, faithful
      account of that item's paired authoritative request and does not add a different operational
      effect, unsupported condition, tool-derived claim, or contradiction. Score 0 when any cell is
      absent, vague enough to lose the requested effect, materially inaccurate, contradictory,
      fabricated, or unsupported. If any of the six pairs is missing or incomplete, score 0.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["ar_audit_note_grounding_first_half", "EVIDENCE_END"]
      match: all
      case_sensitive: true
      max_events: 1

  - id: ar_audit_note_grounding_second_half
    type: rubric
    criterion: >
      Score 1 when every Brief basis output cell for items 007 through 012 is a concise, faithful
      account of that item's paired authoritative request and does not add a different operational
      effect, unsupported condition, tool-derived claim, or contradiction. Score 0 when any cell is
      absent, vague enough to lose the requested effect, materially inaccurate, contradictory,
      fabricated, or unsupported. If any of the six pairs is missing or incomplete, score 0.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["ar_audit_note_grounding_second_half", "EVIDENCE_END"]
      match: all
      case_sensitive: true
      max_events: 1

  - id: ar_cross_turn_recall_is_exact
    type: rubric
    criterion: >
      Judge only the focused verifier packet containing the authoritative recall expectations, the
      final model-authored assistant response on turns 3, 6, and 8, and the task-tool calls observed
      on those turns. Score 1 only when turn 3 gives DS-2026-08-001's exact called action and exact
      EFFECTIVE receipt, turn 6 identifies exactly DS-2026-08-003 and DS-2026-08-005 as the released
      irreversible or hard-locking requests, turn 8 binds the exact receipts to DS-2026-08-005 and
      DS-2026-08-009 respectively, and none of those recall turns invokes a task-scoped tool or adds
      a contradictory action, item, or receipt. Score 0 when any requested fact is missing, wrong,
      swapped, fabricated, ambiguous, contradicted, or unsupported; when an additional item is
      presented as matching the turn-6 classification; when a task-scoped tool is called on a recall
      turn; or when any required answer or evidence is missing or unusable. Missing or unusable
      evidence always scores 0.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["ar_cross_turn_recall_is_exact", "turn_3", "turn_6", "turn_8", "EVIDENCE_END"]
      match: all
      case_sensitive: true
      max_events: 1
