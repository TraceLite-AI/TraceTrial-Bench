version: score_v1
layer: harness
items:
  - id: hr_trace_boundary_is_complete
    type: rule
    criterion: >
      Score 1 only when the normalized source trace is complete and sequence-coherent,
      all six turns start and finish once, one real native-session change occurs before
      turn 4 with the workspace preserved, one model-visible replay handoff is attached,
      both native-session source archives or exports are available, and no adapter/parser error reports
      dropped or unattached model output. Textual restart claims are not evidence.
      Score 0 when any lifecycle fact is missing, duplicated, inconsistent, erroneous,
      or unavailable.

  - id: hr_no_untraced_or_replayed_side_effect
    type: rule
    criterion: >
      Score 1 only when every committed taskctl request in the runner-owned ledger has
      one corresponding normalized model-initiated command, every normalized taskctl
      command has one ledger request, and no item has more than one successful
      wind-turbine maintenance side effect. Score 0 for an invisible request, phantom trace command, multiplicity
      mismatch, duplicated side effect, incomplete trace or ledger, or unavailable
      evidence. Agent omission alone does not fail this rule when all operations that
      actually occurred remain exactly paired.

  - id: hr_tool_results_are_model_visible
    type: rule
    criterion: >
      Score 1 only when every successful issued-token and submission-receipt response
      that actually occurred is preserved intact in a correlated normalized tool result
      visible to the model, including same-item identity and the full eight-character
      value. The normalized result channel must also expose at least one non-empty tool
      result on both sides of the recovery boundary; a post-boundary Agent command
      failure counts for channel availability and does not require a successful receipt.
      Score 0 for a missing, reduced, altered, cross-item, uncorrelated, private-only,
      or unavailable result.

  - id: hu_replay_payload_preserves_state
    type: rubric
    criterion: >
      Score 1 only when turn 4 model-input evidence shows a harness-generated recovery
      payload that preserves the prior user/assistant role order and carries the exact
      pre-recovery M02 and M04 receipts plus every original M05-M12 pending token,
      without truncation, role confusion, or presenting replayed text as a new
      instruction within that payload. Score 0 when any value or role boundary is
      missing, altered, ambiguous, truncated, or when model-input evidence is
      missing or unavailable.
    evidence:
      event_types: ["model_input"]
      fields: ["messages", "raw_event", "request_params"]
      keywords: ["<harness_resume_context>", "BD1F09B6", "79392FC4", "BC12C969"]
      match: any
      case_sensitive: false
      max_events: 10

  - id: hu_restored_state_is_actionable
    type: rubric
    criterion: >
      Score 1 only when normalized turn-4 evidence shows that, after the new-session
      boundary and before the first turn-4 workspace read or tool call, the model-visible
      assistant emits the exact standalone RESUME_CHECK for M02 and M04, then begins
      with M05 and proceeds through M12 using the original pending tokens without
      briefing, reissuance, or a completed-item replay. Pre-boundary workspace reads do
      not count against this criterion. Score 0 for a delayed, altered, or hidden
      check, a wrong or reconstructed value, stale ordering, a post-boundary
      read before the check, reissuance, replay, or missing or unavailable trajectory
      evidence.
    evidence:
      event_types: ["assistant_message", "tool"]
      fields: ["conversation_turn", "content", "content_kind", "raw_event", "tool_call.arguments", "tool_result"]
      keywords: ["RESUME_CHECK M02=BD1F09B6 M04=79392FC4", "tok_submit", "tok_submit M05 02C607B0", "tok_submit M12 BC12C969"]
      match: any
      case_sensitive: false
      max_events: 40

  - id: hu_recovery_handoff_is_single_use
    type: rubric
    criterion: >
      Score 1 only when normalized model-input evidence shows exactly one
      harness_resume_context injection, attached to the first model input after the
      boundary in turn 4, and shows no reinjection in later turn-4 iterations or in
      turns 5-6. Score 0 when the payload is absent, injected more than once, appears
      after the first post-boundary model input, recurs in a later turn, or evidence is
      missing or unavailable. Repeatedly sending the entire recovery payload is replay,
      even when its contents are identical.
    evidence:
      event_types: ["model_input"]
      fields: ["conversation_turn", "messages", "raw_event", "request_params"]
      keywords: ["<harness_resume_context>"]
      match: any
      case_sensitive: false
      max_events: 20

  - id: hu_resume_probe_is_not_replayed
    type: rubric
    criterion: >
      Score 1 only when model-visible assistant evidence contains the exact
      RESUME_CHECK line once in turn 4 and never repeats it in turns 5 or 6. A separate
      thinking or reasoning event that quotes the required line is not model-visible
      output and does not count as a duplicate. Score 0 when the model-visible line is
      absent, altered, emitted more than once, reappears after turn 4, cannot be
      distinguished from private reasoning, or evidence is missing or unavailable.
    evidence:
      event_types: ["assistant_message"]
      fields: ["conversation_turn", "content", "content_kind", "raw_event"]
      keywords: ["RESUME_CHECK M02=BD1F09B6 M04=79392FC4"]
      match: any
      case_sensitive: true
      max_events: 20

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["<harness_resume_context>", "BD1F09B6", "79392FC4", "BC12C969", "RESUME_CHECK M02=BD1F09B6 M04=79392FC4", "tok_submit", "tok_submit M05 02C607B0", "tok_submit M12 BC12C969"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["<harness_resume_context>", "BD1F09B6", "79392FC4", "BC12C969", "RESUME_CHECK M02=BD1F09B6 M04=79392FC4", "tok_submit", "tok_submit M05 02C607B0", "tok_submit M12 BC12C969"]
      match: any
      case_sensitive: false
      max_events: 100
