id: M-C5a-assets-L3-001
title: "Air-navigation technology inventory: receipt lifecycle across sessions"
scenario:
  domain: "Civil Aviation Air Traffic Management"
  primary_subscenario: "Cross-session certification lifecycle for air-navigation technology assets"
  secondary_subscenarios:
    - "Three-session inventory-certification workflow"
    - "Create, amend, and retire technology-group lifecycle"
    - "Stale-value suppression and provenance"
harness:
  dimension: C
  subdimension: C5a
  subdimension_name: "Cross-session persistent-memory lifecycle"
intensity:
  level: L3
  description: "Nine fixed turns span three distinct native sessions during an air-navigation technology inventory. One-time certification receipts must be retained, amended, superseded, retired, and archived with chronological provenance after two replay handoffs, without sidecar storage or replaying stale operations."
budget:
  max_turns: 12
  max_tool_calls: 160
  max_wall_time_sec: 3600
expected_outputs:
  - workspace/output/receipt_archive.json
verifier:
  entrypoint: verifier/run.sh
  selftest: verifier/selftest.py
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
business_simulator:
  version: unix_json_v1
  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: taskctl
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, business_cli_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
