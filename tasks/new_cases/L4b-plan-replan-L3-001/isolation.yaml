target:
  mechanism: "native goal task tracking"
  scope: "unfinished-goal singleton and task-thread isolation"
  thread_schedule:
    - "Turn 1: primary goal plus rejected competing goal in thread A"
    - "Turn 2: empty tracker, independent handoff goal, and completion in thread B"
    - "Turn 3: empty tracker during read-only audit in thread C"
  required_observations:
    - "Successful goal operations must have correlated model-visible results."
    - "An unfinished goal rejects a competing create in the same thread."
    - "A goal never appears in either later fresh thread."
    - "Completion is proven by the native result, not by a workspace file or assistant claim."
non_targets:
  - "Generic plan-tool quality"
  - "Memory-file persistence"
  - "Cross-thread goal sharing"
  - "Network or external-service behavior"
