  primary_subscenario: Candidate data-processing institution admission review
  secondary_subscenarios:
    - Native child-agent delegation
    - Complete child-result handoff
    - Parent-side evidence-preserving reconciliation
harness:
  dimension: L
  subdimension: L3c
  subdimension_name: Child-agent result aggregation
