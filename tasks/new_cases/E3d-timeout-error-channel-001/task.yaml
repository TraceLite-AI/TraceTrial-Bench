id: E3d-timeout-error-channel-001
title: "Transit Display Watchdog Drill: Timeout Errors Must Reach Audit Observers"
scenario:
  domain: Public-transit passenger-information service readiness
  primary_subscenario: Timeout error propagation
  secondary_subscenarios:
    - Unresponsive platform-display publication worker
    - Native timeout evidence preservation
    - Audit-observer status propagation
harness:
  dimension: E
  subdimension: E3d
  subdimension_name: Timeout propagation to post-tool observers
intensity:
  level: L3
  description: A pre-service watchdog drill simulates an unresponsive platform-display publication worker; its timed-out native execution must remain identifiable as a failure on both the operator-visible result channel and the audit-observer channel.
budget:
  max_turns: 6
  max_tool_calls: 6
  max_wall_time_sec: 120
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, timeout_observation_v1, process_containment_v1]
input:
  mode: single_turn
  turns: turns.json
dependencies:
  workspace_tools:
    - tools/sleep_timeout.sh
  native_tools:
    - native command execution with per-call timeout
  mechanisms:
    - timeout_observation
    - post_tool_observer
    - process_containment
    - partial_output_preservation
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
