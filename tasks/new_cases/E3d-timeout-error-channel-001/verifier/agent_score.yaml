version: score_v1
layer: agent
items:
  - id: ar_output_contract_exact
    type: rule
    criterion: >
      Score 1 only when output/ contains exactly timeout-observation.json, the file is
      UTF-8 JSON with no duplicate keys, its keys are exactly the seven requested keys,
      command and timeout_seconds have the required literal values, and all four
      observation fields are JSON booleans while observation_basis is a non-empty
      string of at most 240 characters. Score 0 for any missing or extra file,
      malformed JSON, duplicate or extra key, wrong literal value, wrong type, or
      invalid basis length. Missing or unreadable evidence scores 0.

  - id: ar_single_direct_probe_and_exact_finish
    type: rule
    criterion: >
      Score 1 only when the Agent makes exactly one direct native execution of
      `bash /workspace/tools/sleep_timeout.sh`, requests an exact two-second native
      timeout, does not inspect, wrap, background, retry, resume, poll, or explicitly
      clean up the probe, and the final response is exactly E3D_DONE. Score 0 for any
      missing, duplicate, indirect, modified, or prohibited probe action; a wrong or
      absent timeout; or any extra final-response text. Missing trace evidence scores 0.

  - id: ar_observation_booleans_match_native_result
    type: rule
    criterion: >
      Score 1 only when the four report booleans exactly equal values recomputed from
      the model-visible native result of the single direct probe invocation: literal
      marker presence, explicit timeout text/typed timeout metadata, and explicit
      error/failure/status/signal/nonzero-exit evidence. Score 0 for any mismatch, a
      missing or duplicate probe result, or an unreadable report. A missing completion
      marker alone is not timeout or failure evidence, and later notifications,
      post-tool observations, or cleanup evidence do not qualify. Missing evidence
      scores 0.

  - id: au_observation_basis_is_precise
    type: rubric
    criterion: >
      Evaluate observation_basis in output/timeout-observation.json against the initial
      native result of the one direct probe invocation. First compare all four booleans
      with that native result; if any boolean is wrong, score 0 regardless of prose
      quality. Otherwise score 1 only when the basis is concise, identifies the exact
      visible marker/text/typed fields used for true booleans, explicitly notes the
      relevant absence behind false booleans, and does not cite later notifications,
      Agent inference, process cleanup, or post-tool observer metadata. Score 0 if it
      is vague, omits a material boolean, contradicts any explicit error=true,
      isError=true, status=failed, signal, or nonzero exit evidence, treats missing
      completion as timeout/failure proof, or uses a prohibited evidence channel. If
      the artifact or matching initial-result evidence is missing, score 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result", "raw_event.tool_result"]
      keywords: ["timeout-observation.json", "bash /workspace/tools/sleep_timeout.sh"]
      match: any
      case_sensitive: true
      max_events: 3
