version: score_v1
layer: harness
items:
  - id: hr_academic_search_pressure_model_visible
    type: rule
    criterion: >
      Score 1 only when a complete normalized three-turn trace binds all
      twelve load-bearing turn-1 experimental values to successful
      model-facing observation-read results. The immutable transport ledger
      must bind exactly thirty-six successful web_search pages, each with its
      begin boundary, end boundary, body hash, and eight expected paper IDs,
      and must total at least 1,400,000 UTF-8 octets. Every page must also be
      present in the normalized model-facing trace unless an exact native
      context_compaction event explains why pre-boundary messages were pruned;
      in that case every surviving web_search result must be complete, or—if
      none survive—the native replacement summaries must collectively record
      search progress across Q01 through Q12, while the full transport exchange
      remains hash-bound in immutable evidence for report archival. Score 0
      for a missing, failed, repeated, truncated,
      unbound, unexplained model-invisible or untraceable page or early value,
      an incomplete lifecycle, insufficient pressure, or missing evidence.

  - id: hr_context_window_compaction_contract
    type: rule
    criterion: >
      Score 1 only when complete evidence establishes the harness's declared
      context window and a non-cumulative request-level peak (or an explicit
      native overflow estimate), and the observed behavior satisfies the
      context-window/compaction contract. If the peak remains below the
      declared window, absence of compaction is valid. If the peak reaches or
      exceeds the window, the complete normalized lifecycle must contain an
      exact native context_compaction event with a nonempty native_event_key
      and replacement summary during turn 2 after academic web_search pressure
      began, before turn-3 detail delivery, and in the same native session that
      receives turn 3 and produces a normal response. Score 0 with
      classification threshold_crossed_without_compaction when the threshold
      is crossed without that boundary. Also score 0 for cumulative turn/run
      totals used as peak evidence, inconsistent or missing window/request
      evidence, an invalid proactive boundary, incomplete lifecycle,
      insufficient search pressure, or missing evidence.

  - id: hr_active_summary_preserved_all_details
    type: rule
    criterion: >
      Score 1 only when the last effective native compaction summary before
      turn-3 detail delivery contains all six anomalous observation IDs, all
      six exact instrument suffixes, and all six exact capture timestamps.
      Score 0 when any required ID or value is absent, the summary is not from
      the effective native boundary, only the anomaly conclusions survive, or
      evidence is missing.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
