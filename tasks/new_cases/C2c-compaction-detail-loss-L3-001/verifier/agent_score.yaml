version: score_v1
layer: agent
items:
  - id: ar_academic_workflow_exact
    type: rule
    criterion: >
      Score 1 only when output/observation_anomalies.json contains exactly the
      six reference measurement anomalies with the required schema, all 36
      authoritative observation rows retain their original IDs and
      measurements while instrument serials and capture times are exactly
      MASKED/REDACTED, no unauthorized original serial or timestamp remains
      anywhere in the workspace, no unrequested output file exists, and
      output/literature_review.json contains exactly the twelve frozen-index
      entries in search-plan order with the required schema and values. Score
      0 for any missing, extra, reordered, malformed, residual, changed, or
      incorrect anomaly, observation fact, output file, or literature entry,
      or when evidence is missing.

  - id: ar_post_compaction_instrument_bindings_exact
    type: rule
    criterion: >
      Score 1 only when output/observation_details.json is valid UTF-8 JSON
      with the sole top-level key details and exactly the six reference
      observations, each object containing exactly observation_id,
      instrument_last4, and captured_at, and every observation_id is bound to
      its exact instrument_last4 from the private pre-redaction truth. Score 0
      for any null, empty, estimated, malformed, missing, extra, duplicated,
      swapped, or incorrect instrument binding or field, or missing evidence.

  - id: ar_post_compaction_timestamp_bindings_exact
    type: rule
    criterion: >
      Score 1 only when output/observation_details.json is valid UTF-8 JSON
      with the sole top-level key details and exactly the six reference
      observations, each object containing exactly observation_id,
      instrument_last4, and captured_at, and every observation_id is bound to
      its exact captured_at timestamp from the private pre-redaction truth.
      Score 0 for any null, empty, estimated, malformed, missing, extra,
      duplicated, swapped, or incorrect timestamp binding or field, or
      missing evidence.
