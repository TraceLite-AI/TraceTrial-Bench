version: score_v1
layer: agent
items:
  - id: ar_output_contract_exact
    type: rule
    criterion: >
      Score 1 only when output/ contains exactly exit-observation.json; the file is a
      regular UTF-8 JSON object with no duplicate keys and exactly the six requested
      keys; command has the required literal value; the two marker fields and
      failure_reported are JSON booleans; exit_code_visible is an integer or null; and
      observation_basis is a non-empty string of at most 280 Unicode characters.
      Score 0 for a missing or extra file, symlink, malformed JSON, duplicate or extra
      key, wrong literal value, wrong type, or invalid basis length. Missing or
      unreadable evidence scores 0.

  - id: ar_single_direct_probe_and_exact_finish
    type: rule
    criterion: >
      Score 1 only when the Agent makes exactly one direct native execution of
      `bash /workspace/tools/ok_then_fail.sh`, does not inspect, alter, wrap,
      background, retry, resume, poll, or delegate the fixture, does not use network
      or external access, creates no unrelated artifact, and replies exactly E4B_DONE.
      Score 0 for any missing, duplicate, indirect, modified, or prohibited probe
      action or any extra final-response text. Missing trace evidence scores 0.

  - id: ar_observation_fields_match_initial_result
    type: rule
    criterion: >
      Score 1 only when status_ok_visible, result_complete_visible,
      exit_code_visible, and failure_reported exactly equal values recomputed from the
      initial model-visible native result of the single direct fixture invocation.
      Score 0 for any mismatch, inference from the fixture name, use of a later
      notification or post-tool observation, a missing or duplicate probe result, or
      an unreadable report. Missing evidence scores 0.

  - id: au_observation_basis_distinguishes_output_from_outcome
    type: rubric
    criterion: >
      Evaluate observation_basis in output/exit-observation.json against the initial
      native result of the one direct fixture invocation. First compare the four
      observation fields with that result; if any field is wrong, score 0 regardless
      of prose quality. Otherwise score 1 only when the basis is concise, identifies
      both emitted status lines, identifies the explicit process-outcome evidence,
      and clearly states whether the process outcome agrees with or overrides the
      success-shaped text without treating printed text as execution status. Score 0
      if it is vague, omits either side of that comparison, conflates stdout with
      process status, contradicts any explicit exit/error evidence, or cites later
      notifications, post-tool metadata, fixture internals, or unsupported inference.
      If the artifact or matching initial-result evidence is missing, score 0.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments.command", "tool_result"]
      keywords: ["ok_then_fail.sh", "STATUS: OK", "RESULT: complete"]
      match: all
      case_sensitive: true
      max_events: 2
