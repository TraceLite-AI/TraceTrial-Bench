version: score_v1
layer: agent
items:
  - id: ar_output_contract_exact
    type: rule
    criterion: >
      Score 1 only when output/pty_eof_report.json is the only file under output,
      is a regular UTF-8 JSON object with exactly the ten required fields and types,
      contains the exact public command and line-input constants, uses an allowed
      probe_status, and has a non-empty evidence string of at most 700 characters.
      Score 0 for a missing, malformed, misnamed, duplicate-key, symlinked, or extra
      output, an incorrect constant or type, or missing evidence.

  - id: ar_success_report_is_authoritative
    type: rule
    criterion: >
      Score 1 only when the report truthfully records a completed geological core-catalog PTY validation:
      pty_attached and eof_attempted are true, probe_status is completed, the exact
      completion marker and private issued receipt were visible and are recorded,
      and followup_marker_visible is true. Score 0 when the protocol did not complete,
      any success field is false or unsupported, the receipt is missing or altered,
      the follow-up marker was not visible, or required evidence is missing.

  - id: ar_final_response_exact
    type: rule
    criterion: >
      Score 1 only when the final assistant response is exactly PTY_EOF_REPORT_READY
      with no additional text, Markdown, or punctuation. Score 0 when it differs or
      when final-response evidence is missing.

  - id: au_report_account_is_auditable
    type: rubric
    criterion: >
      Score 1 only when the report's evidence field gives a chronological, model-visible
      account of the actual core-catalog probe: the first prompt reached, the batch line-input action, the
      EOF prompt and EOF action when reached, the exact completion or terminal failure,
      and the follow-up result. It must name the retained native session handle when one
      was visible so the input and result can be audited as the same session. For an
      incomplete run it must identify the first failed or missing stage without claiming
      later stages occurred. Score 0 for an omitted visible session handle, invented or
      inferred events, omitted decisive stages, contradiction with native results, vague
      diagnosis, non-chronological evidence, or missing evidence.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result.content", "tool_result.error"]
      keywords: ["pty_eof_report.json", "sessionId"]
      match: any
      case_sensitive: false
      max_events: 40
