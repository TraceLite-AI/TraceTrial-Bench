version: score_v1
layer: agent
items:
  - id: ar_exact_single_json_contract
    type: rule
    criterion: >
      Score 1 only when output/research.json is the sole file under output, is a regular UTF-8 JSON
      file with no duplicate object keys, has exactly A1-1 through A5-5 at the top level, and every
      entry has exactly the four string fields angle, value, quote, and source_url with the correct
      angle prefix. Score 0 for any missing, extra, malformed, duplicated, non-string, or misnamed
      element, or when the evidence needed to establish the contract is unavailable.

  - id: ar_all_25_values_correct
    type: rule
    criterion: >
      Score 1 only when all 25 delivered values match the pinned reference answers. Case and
      whitespace differences, an optional `Python` prefix on version values, conventional written
      forms of the same ISO date, and a parenthetical qualifier after an otherwise exact answer are
      accepted. Score 0 when any value is missing, empty, substituted, semantically incorrect, or
      cannot be verified from the available evidence.

  - id: ar_all_quotes_verbatim_and_urls_canonical
    type: rule
    criterion: >
      Score 1 only when every source_url exactly equals the canonical URL for its angle and every
      non-empty quote is a contiguous substring of that pinned source's raw or rendered text after
      whitespace normalization. Score 0 for any alternative URL, empty quote, reconstructed or
      unsupported quote, or unavailable source-comparison evidence.

  - id: au_quotes_directly_support_each_fact
    type: rubric
    criterion: >
      Score 1 only when every one of the 25 quotations is self-contained enough to directly support
      its reported value: the quotation must identify the specific setting, module, package version,
      or PEP named by that fact and also contain the reported answer. Score 0 if even one quotation
      is a bare date or version, is ambiguous about which fact it supports, requires joining separate
      excerpts, conflicts with the value, or if the required evidence is missing or insufficient.
    evidence:
      event_types: ["tool", "assistant_message"]
      fields: ["tool_call.arguments", "tool_result.content", "content", "text"]
      keywords:
        - "au_quotes_directly_support_each_fact"
        - "A1-1"
        - "A2-1"
        - "A3-1"
        - "A4-1"
        - "A5-1"
        - "A5-5"
      match: all
      case_sensitive: false
      max_events: 4
