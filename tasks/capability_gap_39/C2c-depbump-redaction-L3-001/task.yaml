  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain. The mechanism layer is
    unchanged: same dimension/subdimension, the same three-stage shape (find the
    outliers, then perform an IRREVERSIBLE in-place redaction, then get flooded with
    an unrelated full-corpus review, then be asked back for a detail that now exists
    only in the turn-1 context), the same intensity arithmetic (fourteen complete-file
    reads, 10,640 numbered records), the same budget triple, and both score rubrics
    with their evidence blocks and exact native event types.
    The business skin is a dependency bump audit: version-jump outliers instead of
    amount outliers, and the redacted fields are the registry auth token and the
    publish timestamp. Irreversible redaction is natural here — a bump audit must
    scrub registry credentials from the lockfile ledger once the audit list is out."
