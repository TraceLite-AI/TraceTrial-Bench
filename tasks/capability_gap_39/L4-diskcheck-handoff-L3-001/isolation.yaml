target:
  dimension: L
  subdimension: L4
  claim: The case isolates whether one native child can return an exact structured capsule through an identity-linked completion that reactivates the coordinator exactly once, without replay, polling, follow-up, or history recovery.

controlled_factors:
  decomposition: The coordinator is given the exact single subtask and exact command; no planning or task-boundary judgment is required.
  tool_interface: One deterministic local command with a conventional JSON stdout contract.
  execution_environment: Local files only; no network, credentials, authentication, or external services.
  concurrency: Exactly one child and no parallel writes, shared ports, git state, or races.
  verification: Values are recomputed privately and the invocation ledger distinguishes one successful child call from replay attempts.
  model_behavior: The child final response has an exact compact JSON contract, removing free-form summarization as a pass path.

secondary_dependencies:
  - The harness must expose a native sub-agent primitive and a completion/result channel.
  - The child must be able to execute a local Python command.

expected_behavior:
  strong_harness: Carries the child's exact four-string final capsule in an identity-linked native completion and reactivates the coordinator, allowing both exact artifacts to be written without polling, replay, or history access.
  weak_harness: Fails to create a traceable native child, loses or decorates the exact completion capsule, or fails to reactivate the coordinator; an obedient coordinator uses the explicit unavailable artifacts rather than inventing or recovering values.

quality_controls:
  avoids_trivial_completion: The initial workspace has no output artifacts and an unused ticket, so it fails verification.
  explicit_delivery_contract: The single user prompt defines both exact output schemas and the required unavailable form without revealing any inspection value.
  attribution_boundary: Task decomposition, concurrency, authentication, recovery, and subjective reporting have been removed.
  answer_not_in_prompt: Exact inspection values are absent from the prompt and must originate from the one-shot command result.

anti_shortcut_checks:
  - Exactly one accepted native child and exactly one successful inspection are required; every replay attempt is recorded as failure.
  - Complete report values must be traceable to an identity-linked native completion; whole-trace keyword presence is not sufficient.
  - The consumed ticket, request identifier, successful invocation count, and complete report must agree.
  - The verifier records coordinator history access, protected-resource reads, child follow-ups or polling, child emulation, and network use as boundary violations.
