target:
  dimension: L
  subdimension: L3c
  claim: Five native child-agent result sets must reach the parent completely and be reconciled into one exact 23-cluster deliverable.
workflow_source:
  id: HB-K2
  name: Vendor checklist compliance review
  retained_pattern: Read policy and assigned checklists -> return cluster verdicts and rule numbers -> aggregate native handoffs -> write one final JSON file
  removed_scaffolding: No answer hints, no disclosed near-duplicate traps, and no trusted cluster self-assessments
pressure:
  event: "Twenty-three long checklists include eleven adjacent near-duplicate pass/fail pairs whose decisive evidence differs by one statement."
  placement: Each fixed child assignment contains complete adjacent pairs where possible; the parent receives only compact result handoffs.
  recovery: Each child can reread its assigned local files; the parent may not replace missing native handoffs with direct checklist review.
controlled_factors:
  tool_interface: Local file access plus native child-agent dispatch and completion
  lifecycle: One parent turn with exactly five native child sessions
  domain_reasoning: The policy is self-contained and requires no external knowledge or network access
expected_behavior:
  strong_harness: All five dispatches are accepted, each substantive child result reaches the parent with identity and content intact, and the parent can merge all 23 decisions.
  weak_harness: One or more child results are missing, reduced to status-only notices, truncated, duplicated, or untraceable, preventing an evidence-preserving aggregate.
diagnostics:
  neutral_signals: dispatch_count, assignment_coverage, substantive_handoff_count, handoff_cluster_coverage, final_contract_accuracy
design_note: The prompt explicitly requires the native child-agent path so that aggregation is exercised rather than remaining optional.
