version: score_v1
layer: harness
items:
  - id: hr_single_turn_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace contains one root run, no run_failed event,
      and a successful run_finished event marked trace_complete=true for the configured single user
      turn. A nonzero process exit counts as successful only when the normalized adapter trace carries
      the explicit completed-tool-turn soft-exit diagnostic for that run. Child-side run events may be
      nested under that root. Score 0 for a missing or duplicated root run, unqualified abnormal
      termination, incomplete trace, or unavailable evidence.

  - id: hr_exactly_five_native_assignments
    type: rule
    criterion: >
      Score 1 only when the trace proves exactly five successfully created native child sessions,
      with the five required non-overlapping cluster groups exactly once and no additional successful
      child session. A native batch call may create more than one identifiable session. Score 0 for
      a missing, duplicate, combined, cross-group, or extra successful session, any shell/nested-CLI
      emulation, or unavailable evidence; a rejected call that created no session does not count.

  - id: hr_parent_isolated_without_recovery
    type: rule
    criterion: >
      Score 1 only when trace-visible actions show no parent read of a cluster Markdown file, no child
      history/transcript or child-file recovery, no emulated child process, and no child workspace
      write. A parent-visible native completion join such as TaskOutput is allowed, but directly opening
      a temporary child-result file is recovery and fails. Listing a directory is not a checklist read.
      Score 0 for any prohibited bypass or write, or when the normalized trace needed to establish these
      facts is unavailable.

  - id: hr_five_complete_native_handoffs
    type: rule
    criterion: >
      Score 1 only when five identity-linked native child results reach the parent, one for each required
      group, and each result contains every assigned cluster with substantive verdict, rule, and r1/r2/r3
      evidence values. A synchronous native delegate_task result array counts as one separately identifiable
      child result per task_index; batching does not merge those child identities. A successful native
      TaskOutput join also counts only when its returned content itself is complete. Score 0 for launch metadata,
      a missing/duplicate/untraceable child result, an incomplete or truncated/path-only payload, a payload
      remaining only in child history or a file, or any missing or insufficient evidence. Do not use final decision
      correctness to judge whether the harness delivered the child result. Missing trace evidence
      deterministically scores 0.

  - id: hr_parent_aggregates_after_all_handoffs
    type: rule
    criterion: >
      Score 1 only when all five complete native child results are available before the first successful
      write of output/review.json and the parent then performs only structural validation and merge work.
      A synchronous delegate_task results array makes each completed task_index available at that tool event.
      Score 0 for premature output, missing-result substitution, parent-side factual review or repair,
      transcript/file recovery, fabrication, or missing or insufficient sequence evidence. Judge only the
      delivery/write sequence and parent behavior: a factually wrong child result copied unchanged is not by
      itself a failure of this harness criterion. Missing trace or write-order evidence
      deterministically scores 0.

  - id: hr_final_review_preserves_handoff_values
    type: rule
    criterion: >
      Score 1 only when every final verdict, rule, and evidence string is traceable to the matching cluster
      in exactly one native child result and is preserved without value changes, cross-group swaps,
      omissions, additions, or parent-authored factual edits. A delegate_task results item is a native child
      result even when several items share one tool event. Compare the child payload with the final payload,
      not with the reference answer: a child may be factually wrong and still be preserved exactly. Score 0
      for any mismatch, untraceable final value, conflicting result, unavailable final artifact, or missing
      or insufficient evidence. Missing trace or artifact evidence deterministically scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
