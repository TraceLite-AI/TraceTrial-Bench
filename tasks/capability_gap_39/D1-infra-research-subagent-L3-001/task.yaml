id: D1-infra-research-subagent-L3-001
title: "Platform baseline research: isolated native subagents and compact handoffs"
scenario:
  domain: Deep Research
  primary_subscenario: Multi-angle fact research
  secondary_subscenarios:
    - Verbatim quotation verification
    - Context-capacity pressure
    - Subagent delegation
harness:
  dimension: C
  subdimension: C6a
  subdimension_name: Subagent isolation
intensity:
  level: L3
  description: Five isolated native child sessions, about 730 KB of source material, 25 verbatim facts, and one same-child re-verification
input:
  mode: multi_turn_direct
  turns: turns.json
dependencies:
  native_tools: ["native child-agent dispatch", "native child-agent continuation"]
  external_access: ["web retrieval in child sessions"]
  mechanisms: [subagent_isolation, compact_native_handoff, same_child_reverification]
tool_dependencies: [native_child_delegation_v1, native_child_lifecycle_observation_v1, native_async_child_dispatch_v1, native_child_return_boundary_v1, native_pushed_child_completion_v1]
budget:
  max_turns: 14
  max_tool_calls: 300
  max_wall_time_sec: 5400
verifier:
  entrypoint: verifier/run.sh
  selftest: verifier/selftest.py
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
expected_outputs:
  - workspace/output/research.json
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
execution_probe:
  version: lifecycle_v1
  requires: [native_child_delegation_v1, native_child_lifecycle_observation_v1, native_async_child_dispatch_v1, native_child_return_boundary_v1, native_pushed_child_completion_v1]
rebuilt_from:
  case: D1-research-subagent-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the terminal/infrastructure domain. The mechanism
    layer is unchanged: same dimension/subdimension, the same five-angle by five-fact
    structure for 25 verbatim facts, the same three-turn shape (turn 1 dispatches
    exactly five native children, turn 2 continues one original child to re-verify
    exactly one fact, turn 3 assembles parent-side from native handoffs only), the
    same budget triple, the same 25-key/four-field JSON contract, both score rubrics
    with their evidence blocks, and score.py's rule logic.
    The subject matter moves from Python-ecosystem library documentation to
    infrastructure configuration references: shipped Redis and PostgreSQL
    configuration defaults, PHP production INI limits, kernel sysctl defaults, and
    kernel command-line parameter defaults. All five sources are real upstream
    documents pinned to an exact tag or URL, and all 25 answers were extracted from
    those pinned copies rather than authored.
    Two consequences of using real documents are recorded honestly. Source volume is
    730 KB against the reference's 665 KB (+10%), with the largest document 470 KB
    against 433 KB (+11%); the intensity shape - one dominant rendered HTML document
    plus four raw text documents - is preserved, but the exact byte counts follow
    whatever upstream actually ships. And score.py's fact_subject() regex was
    retargeted: the reference matched a per-angle mix of backticks, `Requests <ver>`,
    `Flask <ver>`, and `PEP <n>`, while every question here names its subject in
    backticks, so one uniform backtick match replaces the five-branch dispatch."
