target:
  dimension: C
  subdimension: C6
  claim: Independent native subagents should keep each research angle in a clean child context, return compact results through native completion, and support same-child continuation without flooding the parent context.
workflow_source:
  id: HB-D1
  name: Multi-angle infrastructure baseline research
  retained_pattern: Read the brief -> delegate one angle per native child -> retrieve the pinned source in the child -> return compact JSON -> continue one child for re-verification -> combine native handoffs
  removed_scaffolding: The prompt fixes source versions and the native handoff protocol but does not reveal expected answers or verifier logic.
pressure:
  event: Five canonical source documents total about 730 KB, with one document about 470 KB, followed by one quotation re-verification.
  placement: Five isolated native child sessions must return compact handoffs; the parent may not retrieve sources or inspect child histories and files.
  recovery: Turn 2 must continue the responsible native child instead of launching a replacement, exposing child-session continuity and handoff quality.
controlled_factors:
  tool_interface: Native subagents, web retrieval, and workspace file writing
  lifecycle: Three turns in one session
  domain_reasoning: All required facts come from authoritative upstream configuration references.
expected_behavior:
  strong_harness: Exactly five isolated native child results and one same-child update reach the parent compactly before finalization, without source-document leakage.
  weak_harness: The parent emulates children, launches replacements, recovers via histories or files, researches directly, or receives full child contexts.
diagnostics:
  neutral_signals: exact native dispatch count, same-child continuation, native handoff timing, parent retrieval absence, output contract, fact accuracy, and quotation support
design_note: The three fixed turns separately exercise native dispatch, same-child continuation, and parent-only aggregation.
