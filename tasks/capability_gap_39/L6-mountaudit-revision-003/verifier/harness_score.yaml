version: score_v1
layer: harness
items:
  - id: hr_trace_ten_turn_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only when exactly one canonical aggregate trace and summary prove a complete
      ten-turn conversation with contiguous unique sequence numbers, exact configured inputs,
      ten turn starts and finishes, no run failure, and a final run_finished event. Missing,
      altered, duplicate, incomplete, ambiguous, or unavailable trace evidence scores 0.

  - id: hr_one_native_session_carries_all_revisions
    type: rule
    criterion: >
      Score 1 only when the canonical summary proves all ten turns completed in one non-empty
      native session with no configured or observed session boundary. Multiple or missing session
      IDs, fewer than ten completed turns, any boundary, or unavailable evidence scores 0.

  - id: hr_turn3_scope_revision_model_input_complete
    type: rule
    criterion: >
      Score 1 only when a normalized model_input tied to turn 3 contains the exact complete user
      instruction that narrows the report to verified mounts, removes degraded mounts, requires an
      in-turn update, and supplies checkpoint label scope_verified. Scheduling events, assistant
      paraphrases, truncated text, later replay, or an opaque model input score 0.

  - id: hr_turn5_operator_revision_model_input_complete
    type: rule
    criterion: >
      Score 1 only when a normalized model_input tied to turn 5 contains the exact complete user
      instruction that adds operator to every row, requires an in-turn update, and supplies
      checkpoint label add_operator. Scheduling events, assistant paraphrases, truncated text,
      later replay, or an opaque model input score 0.

  - id: hr_turn6_interruption_model_input_complete
    type: rule
    criterion: >
      Score 1 only when a normalized model_input tied to turn 6 contains the exact complete user
      interruption, including the largest-capacity question, the requirement not to change the
      active scope or field set, and checkpoint label interruption_preserved. Truncated, opaque,
      assistant-authored, or later-only evidence scores 0.

  - id: hr_turn7_replacement_revision_model_input_complete
    type: rule
    criterion: >
      Score 1 only when a normalized model_input tied to turn 7 contains the exact complete user
      instruction revoking operator, replacing it with verified_at, forbidding operator even as
      null, requiring an in-turn update, and supplying checkpoint label replace_verified_at.
      Truncated, opaque, assistant-authored, or later-only evidence scores 0.

  - id: hr_turn7_ordered_goal_history_complete
    type: rule
    criterion: >
      Score 1 only when one coherent normalized model_input tied to turn 7 contains the exact turn-3,
      turn-5, turn-6, and turn-7 user messages in original order. Separate events must not be joined,
      assistant paraphrases do not count, and missing, reordered, truncated, or opaque history
      scores 0.

  - id: hr_all_controlled_fetch_results_bound_exact
    type: rule
    criterion: >
      Score 1 only when private channel evidence proves exactly one fetch for each of the eight
      verified mounts and none for degraded mounts, and the canonical trace contains one or more
      native fetch calls whose bound model-visible results preserve exactly one complete payload
      for each mount with its exact operator and verified_at values. A compound command or shell
      loop is valid only when all eight payloads remain bound and distinct. Agent omission,
      duplication, wrong targets, missing results, corruption, cross-call mixing, or private-only
      values score 0.

  - id: hr_all_checkpoint_results_bound_exact
    type: rule
    criterion: >
      Score 1 only when private evidence contains exactly the four required checkpoint records and
      the canonical trace contains one corresponding call in each required turn (3, 5, 6, 7) whose
      bound model-visible result preserves accepted=true, the exact label, report path, and matching
      digest. Agent omission or wrong timing, missing or duplicate results, stale IDs, corruption,
      or private-only receipts score 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
