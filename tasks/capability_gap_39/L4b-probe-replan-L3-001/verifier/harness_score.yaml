version: score_v1
layer: harness
items:
  - id: hr_turn_delivery_and_trace_complete
    type: rule
    criterion: >
      Score 1 only when the three configured turns are delivered byte-exactly once and in order,
      all three have matching completion events, the normalized trace is explicitly complete, and
      the run has exactly one successful terminal event with no timeout or infrastructure failure.
      Every failure mode scores 0; this criterion is always applicable.

  - id: hr_same_thread_then_fresh_audit_topology
    type: rule
    criterion: >
      Score 1 only when turns 1 and 2 expose the same nonempty canonical native task-thread identity,
      turn 3 exposes one different nonempty identity, and the only replay handoff is exactly before
      turn 3. Missing, extra, mixed-namespace, or contradictory boundary evidence scores 0.

  - id: hr_goal_results_are_correlated_and_typed
    type: rule
    criterion: >
      Score 1 only when the trace contains at least the two create_goal, five get_goal, and one
      update_goal calls needed to exercise the protocol; every observed goal call has a nonempty
      result carrying the exact same tool-call ID;
      every get unambiguously exposes an active goal, completed goal, or no-goal state; the intended
      primary create is active; and the update exposes that primary goal as complete. Missing,
      detached, empty, unavailable, unknown-tool, or semantically unreadable evidence scores 0.

  - id: hr_same_thread_singleton_is_enforced
    type: rule
    criterion: >
      Score 1 only when turn 1 natively creates and reads the exact primary active goal, rejects the
      exact competing create specifically because an unfinished goal already exists, and then reads
      the unchanged primary goal again. Replacement, ambiguous rejection, tool absence, changed
      objective/status, reordered evidence, or rollback scores 0.

  - id: hr_active_goal_persists_across_turns
    type: rule
    criterion: >
      Score 1 only when turn 2's first native goal read returns the exact primary goal as active,
      after the same goal was the final goal state observed in turn 1, and
      turns 1 and 2 have the same canonical native thread identity. Missing state, reconstruction,
      wrong objective/status, or a different thread scores 0.

  - id: hr_goal_completion_is_atomic_and_visible
    type: rule
    criterion: >
      Score 1 only when turn 2 has one unambiguous successful update of the persisted primary goal
      from active to complete and the immediately following goal operation reads that exact goal
      as complete. A missing, duplicated, failed, detached, intermediate,
      stale-active, blocked, or wrong-objective result scores 0.

  - id: hr_completed_goal_isolated_from_fresh_audit
    type: rule
    criterion: >
      Score 1 only when turn 3 is a distinct fresh native thread and its first goal operation is a
      correlated get_goal result that unambiguously reports no goal. Leakage of the completed goal,
      a fabricated empty state, a create/update before the probe, or a missing result scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
