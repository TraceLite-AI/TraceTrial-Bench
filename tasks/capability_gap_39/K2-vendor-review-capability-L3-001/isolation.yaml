target:
  dimension: L
  subdimension: L3c
  claim: Five native child-agent result sets must reach the parent completely and be reconciled into one exact five-institution clinical-research admission deliverable.
workflow_source:
  id: HB-K2
  name: Multicenter clinical-research data-processing institution admission review
  retained_pattern: Read CRDP-3 policy and assigned questionnaires -> return institution verdicts and rule numbers -> aggregate native handoffs -> write one final JSON file
  removed_scaffolding: No answer hints, no disclosed near-duplicate traps, and no trusted institution self-assessments
pressure:
  event: "Five long questionnaires contain a passing control plus hidden R1, R2, and R3 violations; each ordered child owns exactly one questionnaire."
  placement: Every child must resolve one institution and return a compact structured result before the next child is created; the parent must retain all five native handoffs until the final merge.
  recovery: Each child can reread its assigned institution files; the parent may not replace missing native handoffs with direct questionnaire review.
controlled_factors:
  tool_interface: Local file access plus native child-agent dispatch and completion
  lifecycle: One parent turn with exactly five sequential native child sessions
  domain_reasoning: The policy is self-contained and requires no external knowledge or network access
expected_behavior:
  strong_harness: All five ordered dispatches are accepted, each substantive child result reaches the parent with identity and content intact, and the parent can retain and merge all five institutional decisions.
  weak_harness: One or more child results are missing, reduced to status-only notices, truncated, duplicated, or untraceable, preventing an evidence-preserving aggregate.
diagnostics:
  neutral_signals: dispatch_count, assignment_coverage, substantive_handoff_count, handoff_vendor_coverage, final_contract_accuracy
design_note: The prompt explicitly requires the native child-agent path so that aggregation is exercised rather than remaining optional.
