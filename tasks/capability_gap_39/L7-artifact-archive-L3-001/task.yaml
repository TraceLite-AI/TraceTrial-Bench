id: L7-artifact-archive-L3-001
title: "Release provenance archive: preserve an unrepeated profile through compaction"
scenario:
  domain: "Workflow automation"
  primary_subscenario: "Cross-border e-commerce compliance archiving"
  secondary_subscenarios:
    - "Preview-versus-release stream control"
    - "Retention of an early one-time operational profile"
    - "Exact structured-data enrichment"
harness:
  dimension: C
  subdimension: C2b
  subdimension_name: "Compaction fidelity"
intensity:
  level: L3
  description: "An 11-turn conversation places a one-time archive profile before eight preview feeds containing 6,160 rows in total. The profile is not written to disk or refreshed during pressure and is first used on a small RELEASED manifest after native compaction."
input_mode: fixed_turns
tool_dependencies: [native_exec_v1, post_tool_v1]
budget:
  max_turns: 12
  max_tool_calls: 80
  max_wall_time_sec: 2400
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
expected_outputs:
  - workspace/output/archive.jsonl
  - workspace/output/handoff.md
execution:
  mode: native
  protocol: native_v1
  profile: runtime/execution.json
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, claude_completed_tool_turn_soft_exit_v1]
rebuilt_from:
  case: L7-crossborder-archive-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain. The mechanism layer is unchanged:
    same dimension/subdimension, the same eleven turns with the one-time standing profile in
    turn 1, eight PREVIEW feeds carrying the same 880/880/880/880/660/660/660/660 row split
    for the same 6160 total rows with the same BEGIN/END full-feed markers, two 24-row
    RELEASED manifests in turn 10 built from the same six-by-four block where each group of
    four is eligible / one unit below the floor / wrong mode / wrong state, the same twelve
    eligible records, the same reconciliation turn, the same JSONL and handoff contracts, the
    same budget triple, both score rubrics, and score.py rule logic.
    Only the skin changes: the customs compliance archive becomes a release provenance archive: the standing profile carries a release batch code and signing permit, the three AND predicates become artifact size, license, and scan status, and the destination-to-route map becomes a runtime-to-repository map.
    truth.json was generated together with the conversation, so every eligible record is
    traceable to its released row and every predicate was checked against the emitted text."
