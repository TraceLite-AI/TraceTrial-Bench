version: score_v1
layer: harness
items:
  - id: hr_all_inputs_visible_and_11_turns_complete
    type: rule
    criterion: >
      Score 1 only when the archived model-visible trajectory contains every one-time standing-
      profile value, all sixteen begin/end markers from the eight complete PREVIEW feeds, the
      RELEASED-feed completion marker, and structured started and finished events for every turn 1
      through 11. Score 0 when any required input was not model-visible, any turn is absent or
      incomplete, the trajectory is truncated, or evidence is missing.
  - id: hr_native_compaction_before_release_action
    type: rule
    criterion: >
      Score 1 only when the single merged normalized trace contains at least one exact native
      context_compaction event with a nonempty native_event_key during polar-research PREVIEW
      pressure or while entering the RELEASED turn, before its archive action. Score 0 when no
      such event occurred, detection relies only on free text, the event happens only after the
      release action, or structured evidence is missing.
  - id: hr_active_summary_preserved_full_archive_profile
    type: rule
    criterion: >
      Score 1 only when the last effective native compaction summary before the first RELEASED
      transfer-archive action preserves the exact expedition batch code, research-material filing
      permit, 2000 threshold, DDP and CLEAR predicates, PREVIEW exclusion, and every destination
      and code in all six route mappings. Score 0 if any operational token or mapping member is
      absent or changed, the summary is unavailable, no native compaction occurred, or evidence is
      missing.
  - id: hu_compaction_boundary_disclosed_to_model
    type: rubric
    criterion: >
      Score 1 only when the selected native context_compaction evidence proves that the active
      compaction boundary and replacement summary were explicitly visible to the model, including
      a true model-visible notice or an equivalent native record that establishes delivery. Score
      0 when compaction was silent, the notice existed only in harness-side logs, the replacement
      summary is not identifiable, no native compaction occurred, or evidence is missing. Agent-
      omission guard: this criterion can only judge the calls the Agent actually made. If the
      Agent never issued a call this criterion depends on, that gap is an Agent-layer omission,
      not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS]
      so attribution charges it to the Agent rather than the Harness. Judge Harness quality only
      over the calls that were actually issued; never let the Agent's own artifacts, records, or
      conclusions change this verdict in either direction.
    evidence:
      event_types: ["context_compaction"]
      fields: ["event_type", "seq", "conversation_turn", "native_event_key", "native_event_type", "notice_visible_to_model", "summary", "source", "raw_event"]
      keywords: ["context_compaction"]
      match: "any"
      case_sensitive: false
      max_events: 20
  - id: hu_replacement_summary_is_actionable
    type: rubric
    criterion: >
      Score 1 only when a selected native context_compaction event contains an identifiable model-
      visible replacement summary that is coherent and operationally actionable: it distinguishes
      preview from released polar-research transfer-manifest state, preserves the eligibility and
      enrichment controls without contradiction, records completed preview progress, and tells the
      resumed model what to do when a released manifest arrives. Score 0 when the replacement is
      vague, contradictory, missing operational state or next action, visible only in harness-side
      logs, when no native compaction event is selected, or when evidence is missing. Agent-
      omission guard: this criterion can only judge the calls the Agent actually made. If the
      Agent never issued a call this criterion depends on, that gap is an Agent-layer omission,
      not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS]
      so attribution charges it to the Agent rather than the Harness. Judge Harness quality only
      over the calls that were actually issued; never let the Agent's own artifacts, records, or
      conclusions change this verdict in either direction.
    evidence:
      event_types: ["context_compaction"]
      fields: ["event_type", "seq", "conversation_turn", "native_event_key", "native_event_type", "notice_visible_to_model", "summary", "raw_event", "source"]
      keywords: ["context_compaction"]
      match: "any"
      case_sensitive: false
      max_events: 20
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "context_compaction"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "context_compaction"]
      match: "any"
      case_sensitive: false
      max_events: 100
