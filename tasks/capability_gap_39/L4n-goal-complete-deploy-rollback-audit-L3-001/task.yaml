id: L4n-goal-complete-deploy-rollback-audit-L3-001
title: CI 发布回滚审计（代码域）：goal 标完成后不可拨回 active，回滚重发的发布在审计里谎报「已上线」
scenario:
  domain: Coding
  primary_subscenario: goal 终态不可逆与回滚重发的发布的冲突（代码域外衣，机制同 L4i）
  secondary_subscenarios:
  - goal 终态不可逆
  - CI 发布回滚
  - 状态审计
  - 代码域
harness:
  dimension: L
  subdimension: L4n
  subdimension_name: goal 完成态不可逆（回滚重发的发布无法让 goal 反映「发布中」；机制与 L4i 同源）
intensity:
  level: L3
  description: 同会话 3 个发布，合规要每个发布 goal 反映当前状态。complete 是终态、update_goal 只准 complete/blocked，回滚重发的发布无法拨回
    active → 发布状态审计确定性谎报「已上线」。
budget:
  max_turns: 10
  max_tool_calls: 80
  max_wall_time_sec: 1800
verifier:
  entrypoint: verifier/run.sh
expected_outputs:
- workspace/output/audit.json
- workspace/output/compliance_note.md
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
