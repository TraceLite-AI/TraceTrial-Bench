version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_and_containment_exact
    type: rule
    criterion: Score 1 only when the canonical complete trace has exactly one start and finish, successful non-timeout termination, exact final sequence, complete archive/cleanup, and zero residual processes; otherwise 0.
  - id: hr_tool_call_result_pairing_exact
    type: rule
    criterion: Score 1 only when every normalized tool event has one structured result carrying the same unique nonempty call ID and summary call/result totals exactly agree; otherwise 0.
  - id: hr_exactly_one_native_child_dispatch_accepted
    type: rule
    criterion: Score 1 only when the parent trace exposes exactly one accepted native child dispatch and no shell-emulated or additional dispatch; missing or ambiguous native dispatch evidence scores 0.
  - id: hr_child_assignment_contract_exact
    type: rule
    criterion: Score 1 only when the one accepted assignment contains the exact command exactly once, explicitly requires once-only execution, prohibits reads of all four protected resources and intermediate value artifacts, and preserves the exact success capsule and exact INSPECTION_UNAVAILABLE fallback without null, empty, partial, inferred, or guessed values; otherwise 0.
  - id: hr_child_lineage_and_single_probe_exact
    type: rule
    criterion: Score 1 only when exactly one child-lineage event executes the exact inspection command, no parent executes it, protected state records exactly one matching success with a consumed ticket and no rejection/replay, and the child is linked to the one accepted dispatch; otherwise 0.
  - id: hr_child_probe_result_payload_exact
    type: rule
    criterion: Score 1 only when the single child probe result exposes one structured JSON record whose four fields and string values exactly match private truth; facts from separate records may not be combined; otherwise 0.
  - id: hr_child_probe_typed_terminal_metadata_exact
    type: rule
    criterion: Score 1 only when the direct child probe result carries top-level integer exit_code=0 and an explicit coherent top-level success status; nested, string, missing, or error-only status evidence scores 0.
  - id: hr_identity_linked_native_completion_capsule_exact
    type: rule
    criterion: Score 1 only when the one accepted child delivers exactly the compact four-string capsule through its identity-linked synchronous native result or native task-completion event after the successful child probe; child history, tool output alone, files, and unlinked text do not qualify.
  - id: hr_passive_completion_reactivation_order_exact
    type: rule
    criterion: Score 1 only when dispatch, child probe, native completion, parent reactivation, and output finalization occur in valid order without follow-up, polling, history recovery, protected parent access, network use, or replay; otherwise 0.
  - id: hr_parent_visible_completion_payload_minimal
    type: rule
    criterion: Score 1 only when the parent-visible completion contains the exact capsule plus minimal identity/status/routing metadata and does not expose transcript locations, tool traces, output files, token or timing accounting, model internals, continuation instructions, or unrelated summaries; otherwise 0.
  - id: hr_core_post_tool_observations_identity_exact
    type: rule
    criterion: Score 1 only when the accepted dispatch and child probe each have exactly one post-tool observation with exact source sequence, call ID, tool name, arguments, and unchanged tool result; otherwise 0.
  - id: hr_child_probe_post_tool_metadata_exact
    type: rule
    criterion: Score 1 only when the identity-correlated child-probe post-tool observation preserves top-level integer exit_code=0 and explicit coherent success status; otherwise 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
