target:
  dimension: L
  subdimension: L6
  claim: "Whether the agent keeps the latest goal after consecutive revisions that narrow scope, add a field, and then revoke and replace that field."
workflow_source:
  id: HB-L4a
  name: "Monthly business-line reconciliation"
  retained_pattern: "Inspect authoritative data -> maintain one report -> apply three revisions in place -> finalize latest scope"
  removed_scaffolding: "The task no longer relies on a Markdown runbook; required CLI usage is stated in the first user turn."
pressure:
  event: "Three revisions arrive in separate turns, and an unrelated maximum-amount question interrupts the workflow before the revocation."
  placement: "The revoked reviewer value remains visible in earlier channel results, making stale-field accumulation observable."
load_bearing_truth:
  rule: "Statuses and amounts come from workspace data; controlled details are issued only by bin/modctl."
  landing: "The final report must contain released modules only with exact line, loc_count, and released_at fields and no reviewer field."
expected_behavior:
  strong: "The same report is revised after every change and the final artifacts contain only the latest scope and fields."
  weak: "Pending lines remain, reviewer survives revocation, released_at is missing or invented, or revision notes describe an obsolete goal."
