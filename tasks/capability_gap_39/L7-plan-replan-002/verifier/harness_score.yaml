version: score_v1
layer: harness
items:
  - id: hr_trace_and_thread_boundaries_complete
    type: rule
    criterion: >
      Score 1 only when all three configured user turns are delivered exactly once and in order,
      the normalized conversation finishes without timeout or infrastructure error, each turn has
      complete lifecycle evidence, and turns 1, 2, and 3 use three distinct native task-thread
      identities at the two configured replay boundaries. Score 0 for an altered or missing turn,
      incomplete lifecycle, abnormal termination, missing identity, or reused identity across a
      required boundary.
  - id: hr_native_goal_results_are_real_and_visible
    type: rule
    criterion: >
      Score 1 only when normalized tool evidence contains correlated, nonempty results for every
      attempted create_goal, get_goal, and update_goal call and proves a real supported goal
      capability: successful creates and updates must expose native state, while missing-tool,
      unknown-tool, or unavailable-tool responses do not count as successful goal operations even
      if their normalized error flag is false. Score 0 when the capability is absent, calls or
      results are missing, or model-visible results cannot be correlated.
  - id: hr_singleton_and_thread_scope_semantics_hold
    type: rule
    criterion: >
      Score 1 only when trace evidence proves all of these native semantics: thread A creates and
      reads the exact primary active goal, rejects the competing unfinished goal, and still reads
      the primary goal; thread B initially has no goal, creates and reads the exact handoff goal,
      completes it, and reads it complete; thread C initially has no goal. Score 0 for
      replacement, leakage across a boundary, false rejection caused by a missing tool, state
      rollback, incorrect objective or status, or unavailable evidence.
  - id: hu_goal_feedback_is_clear_and_actionable
    type: rubric
    criterion: >
      This is a trajectory-only criterion: selected tool-call and tool-result events are the
      authoritative and sufficient evidence, and no workspace artifact is required or expected.
      Score 1 only when the model-visible native goal results clearly distinguish created, active,
      rejected-because-an-unfinished-goal-exists, no-goal-in-this-thread, and completed outcomes;
      each outcome must remain attached to its call and provide enough objective or state detail
      for the Agent to choose the next action without guessing. Score 0 when feedback is
      ambiguous, contradictory, detached, mislabeled as success, omits the decisive state,
      conflates a missing tool with singleton rejection, or evidence is missing. Agent-omission
      guard: this criterion can only judge the calls the Agent actually made. If the Agent never
      issued a call this criterion depends on, that gap is an Agent-layer omission, not a Harness
      defect — score 0 and begin the reason with the literal prefix [AGENT BYPASS] so attribution
      charges it to the Agent rather than the Harness. Judge Harness quality only over the calls
      that were actually issued; never let the Agent's own artifacts, records, or conclusions
      change this verdict in either direction.
    evidence:
      event_types: ["tool"]
      fields: ["conversation_turn", "tool_call.tool_name", "tool_call.arguments", "tool_result.content", "tool_result.error", "raw_event"]
      keywords: ["create_goal", "get_goal", "update_goal", "goal already exists", "status"]
      match: "any"
      case_sensitive: false
      max_events: 60
  - id: hu_replayed_thread_handoff_is_context_faithful
    type: rubric
    criterion: >
      This is a trajectory-only criterion: selected conversation inputs are the authoritative and
      sufficient evidence, and no workspace artifact is required or expected. Score 1 only when
      the model-visible input at both fresh-thread boundaries preserves enough prior business
      context to continue the shared-workspace refactor, clearly foregrounds the current handoff
      or audit instruction, and does not present an earlier thread's native goal as current state.
      Score 0 when replay drops material contract or output requirements, obscures the current
      instruction, injects stale goal state as current, mixes thread identities, or evidence is
      missing. Agent-omission guard: this criterion can only judge the calls the Agent actually
      made. If the Agent never issued a call this criterion depends on, that gap is an Agent-layer
      omission, not a Harness defect — score 0 and begin the reason with the literal prefix [AGENT
      BYPASS] so attribution charges it to the Agent rather than the Harness. Judge Harness
      quality only over the calls that were actually issued; never let the Agent's own artifacts,
      records, or conclusions change this verdict in either direction.
    evidence:
      event_types: ["context_handoff", "conversation_turn_started", "model_input"]
      fields: ["conversation_turn", "turn_index", "action", "input", "user_input", "messages", "raw_event"]
      keywords: ["fresh task thread"]
      match: "any"
      case_sensitive: false
      max_events: 30
  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness imposed on the model
      in this run: content the model asked for that came back truncated, dropped, emptied, reset,
      blocked, rate-limited, or that required extra steps the task itself did not ask for. Quote
      each one from the direct tool result that carries it, with its tool-call identity. If there
      were none, state that explicitly. Then score. Score 1 when either (a) the Harness imposed no
      obstruction at all, or (b) every obstruction it did impose came with a usable recovery path
      that was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could read back - so
      the model could still obtain what it needed without guessing. Score 0 when any obstruction
      was silent, or was announced but left no path the model could actually take. A notice counts
      only when it appears inside the direct result of the very call that was obstructed and names
      what is missing or where to get it. Text the model itself wrote never counts. A generic word
      such as "unavailable" appearing elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "create_goal", "get_goal", "update_goal"]
      match: "any"
      case_sensitive: false
      max_events: 100
  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a specific Harness
      obstruction. This includes the case where obstructions occurred but the model routed around
      all of them and the deliverables are still complete and exact - detour cost alone is never
      charged to the Harness. Score 0 only when all three hold together: (i) the Harness
      obstructed at least one call, (ii) at least one delivered item is missing, null-where-a-
      value was obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity. Requirement (iii) is decisive and must be shown, not assumed:
      name the deliverable key and the tool-call id it failed behind. If the model failed for an
      unrelated reason, or the link cannot be shown from the trajectory, score 1 and say so - that
      failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "create_goal", "get_goal", "update_goal"]
      match: "any"
      case_sensitive: false
      max_events: 100
