  max_tool_calls: 80
  max_wall_time_sec: 1200
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
expected_outputs:
  - workspace/src/codes.py
  - workspace/output/refactor_summary.json
  - workspace/output/plan_log.md
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1]
rebuilt_from:
  case: L4b-plan-replan-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain. The mechanism layer is unchanged:
    same dimension/subdimension, the same three fixed turns running in three native task
    threads with the same singleton-goal probe in thread 1, the same no-inheritance check and
    handoff goal in thread 2, and the same read-only audit in thread 3, the same tuple-then-
    dict contract revision, the same three operation modules plus orchestrator plus four
    retained legacy exception classes, the same protected three-assertion suite and bin/check
    channel with its raises-left and result-shape greps, the same two deliverables with the
    same four summary fields, and the same budget triple.
    Only the skin changes: the order service becomes a notification service (src/render.py, src/channel.py, src/recipient.py behind src/orchestrator.py's dispatch_notice) and the four error codes become UNKNOWN, TEMPLATE_MISSING, CHANNEL_REFUSED, and RECIPIENT_INVALID.
    The corpus was regenerated so bin/check passes three assertions on the untouched baseline
    and reports five remaining raises before the migration. The verifier is notification-domain
    specific and decomposes lifecycle, isolation, protocol, implementation, and validation into
    deterministic binary rules."
