id: L4b-notice-replan-L3-001
title: "Singleton goal tracking across isolated task-thread handoffs"
scenario:
  domain: "Workflow automation"
  primary_subscenario: "Native goal lifecycle tracking"
  secondary_subscenarios:
    - "Unfinished-goal singleton enforcement"
    - "Task-thread isolation"
    - "Contract invalidation and rework"
harness:
  dimension: L
  subdimension: L4b
  subdimension_name: "Singleton thread-scoped goal tracking"
