version: score_v1
layer: harness
items:
  - id: hr_all_inputs_visible_and_11_turns_complete
    type: rule
    criterion: >
      Score 1 only when one complete normalized trajectory proves that every
      standing-profile token, all sixteen PREVIEW begin/end markers, the exact
      RELEASED introduction, and structured started and finished events for
      turns 1 through 11 were model-visible. Score 0 for any missing input,
      incomplete turn, truncated trajectory, or unavailable evidence.

  - id: hr_preview_ack_protocol_exact
    type: rule
    criterion: >
      Score 1 only when turns 2 through 9 each contain exactly one visible
      assistant response equal to the requested PREVIEW-NN acknowledgement and
      contain no tool call. Score 0 for commentary, duplicated acknowledgement,
      tool use, wrong text, missing turn, or unavailable evidence.

  - id: hr_native_compaction_before_release_action
    type: rule
    criterion: >
      Score 1 only when a structured native context_compaction event with a
      nonempty native_event_key occurs after PREVIEW pressure and strictly
      before the first tool call in the RELEASED turn. Score 0 when compaction
      is absent, synthetic or free-text-only, late, lacks a native key, or the
      ordering evidence is unavailable.

  - id: hr_active_summary_preserved_full_archive_profile
    type: rule
    criterion: >
      Score 1 only when the last summary-bearing native compaction before the
      first RELEASED-turn tool call preserves both exact constants, the 2000
      threshold, APACHE-2.0 and CLEAN predicates, PREVIEW exclusion, and every
      runtime and repo_code member of the complete standing map. Score 0 for
      any missing or changed token, empty summary, absent compaction, or
      unavailable evidence.

  - id: hr_compaction_boundary_visible_to_model
    type: rule
    criterion: >
      Score 1 only when that selected compaction has structured proof that its
      replacement summary was delivered to the model, either by an explicit
      true visibility field or by a native model-directed replacement-history
      record. Score 0 for a silent or harness-log-only boundary, unidentified
      replacement, absent compaction, or unavailable evidence.

  - id: hr_replacement_summary_state_and_next_action_exact
    type: rule
    criterion: >
      Score 1 only when the selected model-visible replacement summary records
      completion through PREVIEW-08 without claiming any PREVIEW was released,
      states that no RELEASED manifest has yet been processed, and directs the
      resumed model to process a future RELEASED manifest into archive.jsonl
      and later handoff.md. Score 0 for stale progress, contradiction, missing
      next action, invisible summary, absent compaction, or unavailable evidence.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
