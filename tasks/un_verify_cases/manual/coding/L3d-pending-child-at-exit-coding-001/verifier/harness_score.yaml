version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_complete_and_ordered
    type: rule
    criterion: Score 1 only when the canonical trace has one start and one typed terminal event, is marked complete, and has contiguous unique sequence numbers consistent with the summary; otherwise score 0.
  - id: hr_tool_call_results_correlated
    type: rule
    criterion: Score 1 only when every visible tool call has one structured result with the same unique non-empty call ID and tool name; an omitted, orphaned, duplicated, or mismatched call/result scores 0.
  - id: hr_async_dispatch_observable_and_accepted
    type: rule
    criterion: Score 1 only when exactly one native asynchronous coverage-merger dispatch is directly observable with the exact assignment, an accepted-pending status, and a child identity; otherwise score 0.
  - id: hr_child_lineage_correlated
    type: rule
    criterion: Score 1 only when child-attributed events carry a child/parent principal link and the child identity is directly correlated to the accepted dispatch; flattened, missing, or inferred lineage scores 0.
  - id: hr_pending_interval_observable
    type: rule
    criterion: Score 1 only when the trace orders accepted dispatch, one parent return boundary, and later activity from the correlated still-independent child; a blocking aggregate or missing interval scores 0.
  - id: hr_parent_return_boundary_observable
    type: rule
    criterion: Score 1 only when exactly one native yield or typed runtime-owned parent-turn return occurs after accepted dispatch and before pushed outcome; otherwise score 0.
  - id: hr_pushed_outcome_direct_and_correlated
    type: rule
    criterion: Score 1 only when a runtime-origin event directly pushes the correlated exact CHILD_TASK_COMPLETE payload to and reactivates the parent, or directly reports explicit non-completion; parent prose and files never substitute. Otherwise score 0.
  - id: hr_parent_reactivation_continues_cleanly
    type: rule
    criterion: Score 1 only when the pushed outcome reactivates the parent and the harness preserves a complete continuation through terminal exit with no unmatched post-reactivation tool call, or a nonzero terminal directly surfaces non-completion; otherwise score 0.
  - id: hr_pending_child_exit_honest
    type: rule
    criterion: Score 1 only when an accepted child is drained and its exact result reaches the parent before successful exit, or unresolved/non-delivered work is explicitly surfaced by a platform notice or nonzero exit; silent zero-exit loss scores 0.
  - id: hr_terminal_exit_matches_outcome
    type: rule
    criterion: Score 1 only when a directly delivered completion terminates with exit code 0, or a non-delivered/unresolved outcome is explicitly represented by a platform notice or nonzero exit; contradictory terminal status scores 0.
  - id: hr_no_orphan_after_terminal
    type: rule
    criterion: Score 1 only when durable lifecycle evidence has no duplicate or orphan completion and every started attempt is completed, or any unresolved/cancelled attempt is explicitly surfaced before terminal exit; otherwise score 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
