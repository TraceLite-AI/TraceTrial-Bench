version: score_v1
layer: harness
items:
  - id: hr_three_session_trace_is_complete
    type: rule
    criterion: >
      Score 1 only when structured trace evidence contains one start and one
      successful finish for every turn 1 through 9, exactly two new-native-session
      boundaries before turns 4 and 7, three distinct chained native session IDs,
      preserved workspace state, and a matching model-visible replay handoff with a
      nonempty message count and identical history digest at each boundary. Score 0
      for missing or inconsistent lifecycle evidence, or when a substantive prior
      assistant message is re-emitted and attributed to a later turn, because such
      cross-turn replay makes the normalized trace incomplete or misleading.

  - id: hr_lifecycle_responses_are_model_visible
    type: rule
    criterion: >
      Compare every successful RECEIPT, AMENDED, and RETIRED lifecycle fact in the
      private simulator ledger with normalized model-visible tool results. Score 1
      only when all eighteen expected facts are present and the full fact
      multiplicity counters are identical. Score 0 for a missing, altered,
      duplicated, unpaired, or unavailable fact; set-only equality is insufficient.

  - id: hr_replay_preserves_actionable_current_state
    type: rule
    criterion: >
      Inspect the actual model inputs at both boundaries. Score 1 only when the last
      visible current-state occurrence before turn 4 is M02=B8AF630A and M05=D3346039,
      the last such occurrence before turn 7 is M02=41C7D90E and M04=DA525ACF, and
      both inputs contain the model-visible resume wrapper. Score 0 for a missing,
      stale, wrong-group, runner-only, or unavailable current value.

  - id: hr_replay_scope_role_and_provenance_are_clear
    type: rubric
    criterion: >
      Score 1 only when both model-visible transition inputs explicitly identify a
      new native session, delimit replayed history from the current user request,
      preserve user/assistant role and chronological order for this task only, and
      link the payload through trace metadata to old/new session IDs, boundary turn,
      message count, and digest. Score 0 for silent or ambiguous transitions,
      replay/current mixing, role corruption, unrelated-history leakage,
      inconsistent provenance, or missing evidence. If the required evidence cannot
      be retrieved, score 0.
    evidence:
      event_types: ["context_handoff", "session_boundary", "conversation_turn_started", "model_input"]
      fields: ["event_type", "action", "before_turn", "previous_session_id", "session_id", "model_visible", "history_message_count", "history_sha256", "new_session", "history_replayed", "turn_index", "conversation_turn", "input", "messages", "content", "raw_event"]
      keywords: ["harness_resume_context", "current_user_message", "new native session", "session_boundary", "context_handoff", "replay"]
      match: any
      case_sensitive: false
      max_events: 80
