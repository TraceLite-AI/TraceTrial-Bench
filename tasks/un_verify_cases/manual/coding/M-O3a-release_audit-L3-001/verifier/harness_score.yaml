version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_all_turns_single_session
    type: rule
    criterion: >
      Score 1 only when the selected aggregate normalized trace is marked
      complete, has one conversation start and finish, contains matching start
      and finish events for all eight configured turns, has no run failure or
      session boundary, and reports exactly one nonempty native session ID.
      Score 0 for an incomplete lifecycle, missing or altered turn, multiple or
      missing sessions, a boundary or failure, or unavailable deterministic
      trace evidence.

  - id: hr_step_log_calls_results_complete_ordered
    type: rule
    criterion: >
      Score 1 only when exactly thirty-six business calls form the uninterrupted
      ordered sequence audit_brief, audit_do, audit_submit for M01-M12; M01-M04
      occur only in turn 2, M05-M08 only in turn 4, and M09-M12 only in turn 7;
      every call has model-visible complete arguments and the exact bound action
      label, audit_ref, or receipt result; and no business call occurs in turns
      1, 3, 5, 6, or 8. Score 0 for a missing, extra, retried, reordered,
      premature, unbound, truncated, or private-only step, or unavailable
      deterministic evidence. Non-business help calls are ignored.

  - id: hr_pressure_and_recovery_chain_complete
    type: rule
    criterion: >
      Score 1 only when turn 5 contains fourteen distinct direct initial
      complete-file reads, one for each requested control-record file, and the
      archived model-visible results contain at least 5,000 distinct exact
      numbered control-record lines across the fourteen files; turn 6 then
      finishes in the same session with the exact M01-M08 checkpoint and no
      business call; and, when native compaction occurred before that response,
      the last effective replacement summary contains M01-M08 in order with
      every exact action label, audit_ref, and receipt. Continuation reads after
      explicit native truncation are allowed. Score 0 when any link in this
      pressure-to-recovery chain is missing, aggregated, private-only,
      incorrect, replayed, or unavailable to deterministic evidence.

  - id: hu_recovery_loss_was_model_visible_and_observable
    type: rubric
    criterion: >
      Score 1 only when exact early step values are genuinely unavailable at
      the turn-6 checkpoint and trajectory evidence shows that the model first
      received an explicit model-visible native compaction, overflow, eviction,
      or context-replacement notice that makes the loss observable; the later
      response must identify the affected values as unavailable rather than
      silently inventing or replaying them. Score 0 when no recovery loss
      occurred, the loss was silent or visible only in Harness-private logs, the
      notice cannot be tied to the model-facing recovery context, the response
      conceals or fabricates a value, a business call is repeated to compensate,
      or evidence is missing. Missing or unusable evidence must be scored 0.
    evidence:
      event_types: ["context_compaction", "model_input", "assistant_message", "conversation_turn_started", "conversation_turn_finished", "artifact", "tool"]
      fields: ["event_type", "conversation_turn", "turn_index", "seq", "notice_visible_to_model", "summary", "messages", "content", "path", "tool_call.arguments", "tool_result", "source", "raw_event"]
      keywords: ["context overflow", "context_compaction", "compacted", "unavailable", "MISSING", "null", "recall_checkpoint.json"]
      match: any
      case_sensitive: false
      max_events: 80
