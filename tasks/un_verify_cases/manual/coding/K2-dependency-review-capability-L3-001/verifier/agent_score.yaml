version: score_v1
layer: agent
items:
  - id: ar_exact_native_dispatch_plan
    type: rule
    criterion: >
      Score 1 only when the parent creates exactly five successful native child sessions,
      exactly once for each required non-overlapping group, with no extra, repeated,
      combined, cross-group, or emulated child session. Score 0 for every deviation.

  - id: ar_child_prompt_scope_exact
    type: rule
    criterion: >
      Score 1 only when each of the five child prompts names exactly its assigned component
      IDs and checklist files, names docs/POLICY.md, includes all three decision rules and
      the verdict/rule/r1/r2/r3 response contract, forbids workspace writes, and exposes no
      unassigned checklist path, component ID, wildcard, answer, or prior child result.
      Score 0 if any child prompt is over-broad, incomplete, or unavailable.

  - id: ar_parent_delegation_boundary_respected
    type: rule
    criterion: >
      Score 1 only when the parent never reads component checklist contents, inspects child
      history or transcripts, recovers child files, emulates a child through shell or a
      nested CLI, or permits a child workspace write. Directory listing alone is allowed.
      Score 0 for any prohibited bypass or when trace evidence is unavailable.

  - id: ar_initial_handoffs_well_formed
    type: rule
    criterion: >
      Score 1 only when the parent receives exactly five native child handoffs before any
      deliverable write, one pure-JSON completion per required group, and each completion
      contains every assigned component with exactly verdict, rule, and evidence containing
      exactly r1, r2, and r3. Score 0 for missing, duplicate, late, prose-wrapped, malformed,
      or incomplete handoffs.

  - id: ar_final_output_derived_from_handoffs
    type: rule
    criterion: >
      Score 1 only when every final verdict, rule, and evidence string is copied unchanged
      from exactly one matching native child handoff, all five complete handoffs precede the
      first successful output/review.json write, and the parent performs no factual repair.
      Score 0 for premature output, substitution, cross-group swaps, edits, additions,
      omissions, or unavailable comparison evidence.

  - id: ar_exact_single_json_contract
    type: rule
    criterion: >
      Score 1 only when output/review.json is the sole file under output, is a regular UTF-8
      duplicate-free JSON object containing exactly V01 through V23, and every component
      contains exactly verdict, rule, and evidence; evidence contains exactly r1, r2, and r3
      as non-empty trimmed strings of at most 300 Unicode characters with the required
      verdict/rule types. Score 0 for any deviation.

  - id: ar_all_decisions_exact
    type: rule
    criterion: >
      Score 1 only when every one of the 23 verdict and rule pairs exactly matches the
      pinned reference decision, with null for every pass and the lowest-numbered violated
      policy rule for every failure. Score 0 for any incorrect or unavailable pair.

  - id: ar_all_evidence_verbatim
    type: rule
    criterion: >
      Score 1 only when all 69 evidence strings are non-empty contiguous quotations from
      the checklist belonging to that same component after whitespace normalization.
      Score 0 if any quotation is absent, reconstructed, cross-component, policy-derived,
      or unavailable.

  - id: au_r1_v04_evidence_supports_review
    type: rubric
    criterion: >
      Score 1 only when V04's three verbatim quotations are assigned to the correct policy
      rules and the R1 quotation exposes the copyleft fact that justifies V04's delivered
      failure on lowest-numbered rule 1, while R2 and R3 quotations accurately support
      their assessments. Score 0 for any incorrect, irrelevant, contradictory, concealed,
      self-declared, or unavailable evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["au_r1_v04_evidence_supports_review"]
      match: all
      case_sensitive: false
      max_events: 2

  - id: au_r2_v10_evidence_supports_review
    type: rubric
    criterion: >
      Score 1 only when V10's three verbatim quotations are assigned to the correct policy
      rules and the R2 quotation exposes the out-of-lockfile build fetch that justifies
      V10's delivered failure on lowest-numbered rule 2, while R1 and R3 quotations
      accurately support their assessments. Score 0 for any incorrect, irrelevant,
      contradictory, concealed, self-declared, or unavailable evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["au_r2_v10_evidence_supports_review"]
      match: all
      case_sensitive: false
      max_events: 2

  - id: au_r2_v21_dormant_source_supports_pass
    type: rubric
    criterion: >
      Score 1 only when V21 is delivered as a pass with rule null and its three verbatim
      quotations support all three rules, including R2 evidence that a merely planned,
      not-enabled backup source performs no fetch and no contrary active out-of-lockfile
      fetch. Score 0 for treating the dormant plan as an active violation, hiding contrary
      text, using irrelevant evidence, relying on self-declared compliance, or unavailable
      artifact/source evidence.
    evidence:
      event_types: ["artifact"]
      fields: ["path", "content"]
      keywords: ["au_r2_v21_dormant_source_supports_pass"]
      match: all
      case_sensitive: false
      max_events: 2
