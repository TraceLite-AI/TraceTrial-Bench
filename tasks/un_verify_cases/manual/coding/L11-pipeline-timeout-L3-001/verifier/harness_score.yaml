version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only if exactly one canonical structured trace has contiguous sequence
      numbers, exactly three started and three finished conversation turns in order, one
      conversation finish, no run failure, and a finished non-timeout execution probe.
      Score 0 for missing, duplicate, malformed, incomplete, or failed lifecycle evidence.
  - id: hr_pressure_calls_observable_once
    type: rule
    criterion: >
      Score 1 only if the model-visible trace exposes exactly one distinct native pipeline
      execution for each of BLD-502, BLD-505, and BLD-507. Score 0 if any pressure call is
      missing, duplicated, merged beyond attribution, or cannot be associated with its step.
  - id: hr_pressure_deadline_exact
    type: rule
    criterion: >
      Score 1 only if each of the three pressure calls exposes exactly one native timeout
      parameter equal to 4 seconds (or 4000 milliseconds). Score 0 for a missing, extra,
      ambiguous, inherited, or differently valued timeout parameter.
  - id: hr_terminal_timeout_model_visible
    type: rule
    criterion: >
      Score 1 only if every pressure call's initial model-visible result explicitly reports
      a terminal timeout at the observation boundary. Score 0 if any result is generic,
      pending, still running, backgrounded, pollable, resumable, or suggests retrying.
  - id: hr_partial_stdout_preserved
    type: rule
    criterion: >
      Score 1 only if every pressure result preserves that step's exact phase-start stdout
      marker and does not contain phase complete. Score 0 if partial stdout is absent,
      misattributed, or falsely contains completion evidence.
  - id: hr_process_disposition_model_visible
    type: rule
    criterion: >
      Score 1 only if every pressure result explicitly tells the model that the command or
      process group was killed, terminated, stopped, or has no remaining process. A bare
      timeout flag, status, or exit code is insufficient. Score 0 if disposition is omitted
      or the result says the process remains in the background.
  - id: hr_post_tool_timeout_metadata_correlated
    type: rule
    criterion: >
      Score 1 only if each pressure trace call ID maps one-to-one to a terminal post-tool
      observation with timed_out=true and duration from 3500 through 6500 milliseconds.
      Score 0 for missing, duplicate, contradictory, pending, implausibly timed, or
      uncorrelated metadata.
  - id: hr_timeout_processes_contained
    type: rule
    criterion: >
      Score 1 only if aggregate containment is valid with zero residual processes and all
      three turn receipts are valid, cleanly drained, successfully tracked, and have zero
      residual descendants. Score 0 for any missing receipt, cleanup/tracking/drain failure,
      residual process, or unavailable containment evidence.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["error", "failed", "timeout"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["error", "failed", "timeout"]
      match: any
      case_sensitive: false
      max_events: 100
