      Score 1 only when stream_notes.md associates shard 11 with exactly its actual
      diagnostic type and no conflicting type. Otherwise score 0.

  - id: ar_stream_and_dashboard_explanation_correct
    type: rule
    criterion: >
      Score 1 only when stream_notes.md states the documented stderr/stdout split
      and correctly explains that the dashboard appeared green because it consumed
      stdout but not stderr. Missing or contradictory content scores 0.

  - id: ar_code_availability_disclosed
    type: rule
    criterion: >
      Score 1 only when every null code has a shard-specific evidence-gap disclosure,
      or, when there are no null codes, the handoff explicitly states that no code
      is unavailable. The statement must agree with failures.json; otherwise 0.

  - id: ar_harness_provenance_classification
    type: rule
    criterion: >
      Score 1 only when stream_notes.md contains exactly one required Harness stream
      provenance line and its classification matches the direct model-visible tool
      results: explicit, unlabeled-aggregate, mixed, or no-failure-evidence.
      Inference from the runbook does not count; missing or wrong text scores 0.
