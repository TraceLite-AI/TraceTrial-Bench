  - id: ar_handoff_shard02_type_exact
    type: rule
    criterion: >
      Score 1 only when stream_notes.md associates shard 02 with exactly its actual
      diagnostic type and no conflicting type. Otherwise score 0.
  - id: ar_handoff_shard03_type_exact
    type: rule
    criterion: >
