version: score_v1
layer: harness
items:
  - id: hr_trace_and_tool_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only when the canonical trace has one run_started and one successful
      trace-complete run_finished event, contiguous sequence numbers agreeing with the
      finished summary, and every native tool call has a same-ID result. Score 0 for a
      missing, duplicated, unfinished, unpaired, non-contiguous, or unavailable trace.

  - id: hr_real_background_supervision_exercised
    type: rule
    criterion: >
      Score 1 only when every listed job has one direct model-visible start result with
      a distinct positive PID and worker_alive=true, at least one later status result,
      and at least two jobs expose a later live running sample with worker_alive=true
      and positive progress before terminal observation. Score 0 when any launch or
      status is missing, a PID is reused, no real running progress is observed, or
      required evidence is unavailable.

  - id: hr_terminal_evidence_and_containment_intact
    type: rule
    criterion: >
      Score 1 only when all twelve jobs receive a model-visible terminal status, every
      expected business terminal state has its exact exit code and signal, every
      accepted submission returns its complete same-job receipt, and process-containment
      evidence reports valid cleanup with zero residual processes. Score 0 for an
      unresolved or lost job, altered or missing terminal detail or receipt, residual
      process, invalid cleanup evidence, or missing evidence.

  - id: hu_background_start_is_unambiguously_nonterminal
    type: rubric
    criterion: >
      Evaluate only direct jobctl start calls and their model-visible results. Score 1
      only when every launch is clearly presented as a returned background start rather
      than completed foreground work, and the same result exposes the job ID, a positive
      supervisor PID, terminal_status=running, and worker_alive=true without truncation
      or cross-call mixing. Score 0 when any field is missing or ambiguous, a start looks
      terminal, provenance is unclear, or evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_call.tool_name", "tool_call.arguments", "tool_result"]
      keywords: ["jobctl start", "started", "terminal_status", "worker_alive", "pid"]
      match: all
      case_sensitive: false
      max_events: 30

  - id: hu_running_progress_is_actionable
    type: rubric
    criterion: >
      Evaluate direct status results for jobs observed while still running. Score 1 only
      when at least two jobs each have at least two separate status results that
      unambiguously identify the same stable PID, report terminal_status=running and
      worker_alive=true, and show a strictly increasing non-negative progress_samples
      value. Score 0 when fewer than two jobs demonstrate advancing live progress, or when
      progress is detached from its call, stale, contradictory, unreadable, or missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result"]
      keywords: ["jobctl status", "running", "progress_samples", "worker_alive", "pid"]
      match: all
      case_sensitive: false
      max_events: 50

  - id: hu_abnormal_exit_reason_is_unambiguous
    type: rubric
    criterion: >
      Evaluate only direct terminal status results for the expected failed, signaled,
      and timed-out jobs. Score 1 only when the model-visible results clearly distinguish
      all three outcome classes, bind each outcome to the correct job and PID, expose the
      exact numeric exit code, and expose signal 15 only for the signaled job. Score 0
      when a class is conflated, a reason or field is missing or contradictory, evidence
      is mixed across calls, or evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result"]
      keywords: ["jobctl status", "failed", "signaled", "timed_out", "exit_code", "signal"]
      match: any
      case_sensitive: false
      max_events: 60

  - id: hu_lifecycle_result_provenance_is_explicit
    type: rubric
    criterion: >
      Evaluate the native start, status, collect, and submit results as trajectory
      evidence, not the Agent's later report. Score 1 only when each result remains tied
      to a stable tool-call identifier and the normalized result exposes an explicit
      error/exit or completion indication sufficient to distinguish command success,
      business failure, signal termination, timeout, and supervisor loss. Score 0 when
      provenance or command outcome is absent, detached, contradictory, collapsed into
      unlabelled prose, or evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.tool_call_id", "tool_call.tool_name", "tool_call.arguments", "tool_result", "raw_event"]
      keywords: ["jobctl", "tool_call_id", "exit_code", "error", "terminal_status", "worker_alive"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hu_status_metadata_is_structured
    type: rubric
    criterion: >
      Inspect the normalized tool_result object itself for direct jobctl status calls; do
      not parse or decode its content, text, or output string. Score 1 only when PID,
      terminal_status, worker_alive, progress_samples, exit_code, and signal are already
      exposed as dedicated typed sibling fields on that tool_result object. Score 0 when
      any required value occurs only inside a content/text/output string (even when that
      string is valid JSON), is absent or untyped, is split across unrelated events, or
      when evidence is missing.
    evidence:
      event_types: ["tool"]
      fields: ["tool_call.arguments", "tool_result"]
      keywords: ["jobctl status", "terminal_status", "worker_alive", "progress_samples"]
      match: all
      case_sensitive: false
      max_events: 60
