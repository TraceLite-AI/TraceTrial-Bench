id: D1-toolchain-research-subagent-L3-001
title: "Toolchain baseline research: isolated native subagents and compact handoffs"
scenario:
  domain: Deep Research
  primary_subscenario: Multi-angle fact research
  secondary_subscenarios:
    - Verbatim quotation verification
    - Context-capacity pressure
    - Subagent delegation
harness:
  dimension: C
  subdimension: C6a
  subdimension_name: Subagent isolation
intensity:
  level: L3
  description: Five isolated native child sessions, about 659 KB of source material, 25 verbatim facts, and one same-child re-verification
budget:
  max_turns: 14
  max_tool_calls: 300
  max_wall_time_sec: 5400
verifier:
  entrypoint: verifier/run.sh
  selftest: verifier/selftest.py
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
expected_outputs:
  - workspace/output/research.json
input:
  mode: multi_turn_direct
  turns: turns.json
dependencies:
  native_tools:
    - native child-agent dispatch
    - native child-agent continuation
  external_access:
    - web retrieval in child sessions
  mechanisms:
    - subagent_isolation
    - compact_native_handoff
    - same_child_reverification
tool_dependencies: [native_child_delegation_v1, native_child_lifecycle_observation_v1, native_async_child_dispatch_v1, native_child_return_boundary_v1, native_pushed_child_completion_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
execution_probe:
  version: lifecycle_v1
  requires: [native_child_delegation_v1, native_child_lifecycle_observation_v1, native_async_child_dispatch_v1, native_child_return_boundary_v1, native_pushed_child_completion_v1]
rebuilt_from:
  case: D1-research-subagent-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding/build-toolchain domain. The mechanism
    layer is unchanged: same dimension/subdimension, the same five-angle by five-fact
    structure for 25 verbatim facts, the same three-turn shape (turn 1 dispatches
    exactly five native children, turn 2 continues one original child to re-verify
    exactly one fact, turn 3 assembles parent-side from native handoffs only), the
    same budget triple, the same 25-key/four-field JSON contract, both score rubrics
    with their evidence blocks, and score.py's rule logic.
    The subject matter moves from Python-ecosystem library documentation to
    build-toolchain configuration references: Jest configuration defaults, Prettier
    option defaults, Rollup configuration-option defaults, Cargo configuration
    defaults, and Rust release dates. All five sources are real upstream documents
    pinned to an exact tag, and all 25 answers were extracted from those pinned copies
    rather than authored. The fact-type mix of the reference is preserved: four angles
    of named-setting lookups plus one angle of release dates.
    Source volume is 659 KB against the reference's 665 KB (-0.9%), with the largest
    document 409 KB against 433 KB (-5.4%). Two score.py adjustments follow from the
    new subject matter: fact_subject() now uses one uniform backtick match because
    every question here names its subject in backticks, and equivalent_value() trades
    the reference's optional `Python` version prefix for an optional pair of quotes
    around a quoted string default. The ISO-date branch is retained because angle A5
    still reports release dates."
