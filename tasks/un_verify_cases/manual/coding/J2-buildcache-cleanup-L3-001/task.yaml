  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the coding domain. The mechanism layer is unchanged:
    same dimension/subdimension, the same 33 manifest entries in the same order with every
    declared size, last-access value, owner, and status copied verbatim (so the reclaimable
    set is the same six ordinals and the reclaimed total stays 2442 MB), the same three
    protected categories (production data, active-process lock, statutory audit retention),
    the same single-turn shape, the same five-section report contract with identical column
    sets, the same budget triple, both score rubrics, and score.py rule logic.
    Only the skin changes: the storage tree becomes a build cache tree (buildcache/ with objects, artifacts, audit, queue, tmp), the managed blobs become compiled objects (obj_NN.o), and the three protected files become the released-artifact index, an in-flight build job lock, and the compliance provenance log.
    truth.json was regenerated from the new manifest, so manifest_sha256 matches the file
    actually shipped."
