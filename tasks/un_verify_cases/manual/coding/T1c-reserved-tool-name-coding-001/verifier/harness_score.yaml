version: score_v1
layer: harness
items:
  - id: hr_reserved_bundle_trace_integrity
    type: rule
    criterion: >
      Score 1 only when the validated task-tool bundle contains all five reserved-name
      probes and the legal sibling, the selected Harness reports task_tools_v1 and
      post_tool_v1 compatible with task-tool injection enabled, and the canonical
      normalized trace has one complete contiguous run_started-to-run_finished
      lifecycle with successful exit and stable unique tool-call identities. Score 0
      when the stress bundle was not armed, capability is missing, execution did not
      start or finish cleanly, lifecycle events are missing/duplicated/non-contiguous,
      call identity is unstable, or evidence is missing.

  - id: hr_native_executor_preserved
    type: rule
    criterion: >
      Score 1 only when exactly one normalized call carrying the exact command is
      executed by the selected Harness's platform-native command identity, returns
      exactly T1C_NATIVE_OK without error, and no committed reserved probe receives
      that command. Score 0 when the native identity is absent, shadowed, ambiguous,
      retried, altered, unsuccessful, or intercepted, or when trace/private evidence
      is missing.

  - id: hr_valid_sibling_preserved
    type: rule
    criterion: >
      Score 1 only when exactly one committed private task_ready_check request with
      token T1C correlates by tool identity and exact T1C_CONTROL_OK receipt to exactly
      one normalized model-visible tool result with a stable call ID. Trace redaction
      of the token is acceptable because the private ledger proves the argument.
      Score 0 when the legal sibling disappears with conflicting tools, is duplicated,
      detached, altered, unsuccessful, or lacks either trace or private evidence.

  - id: hu_collision_disposition_disclosure
    type: rubric
    criterion: >
      Evaluate only the compact registration-disposition evidence, before considering
      Agent conclusions. Score 1 only when the Harness gives a model-visible,
      actionable registration notice that identifies the requested conflicting native
      name and explicitly states its disposition, such as rejection or the exact
      replacement namespace, before either preflight operation is chosen. Score 0 for
      silent dropping, silent shadowing, an unexplained prefixed name, a generic MCP
      error without the conflicting name and disposition, an inventory that merely
      omits the extension tools, or when evidence is missing or unreadable.
    evidence:
      event_types: ["run_started", "model_input"]
      fields: ["source", "provider", "raw_event", "tools"]
      keywords: ["openclaw", "codex", "claudecode", "hermes"]
      match: any
      case_sensitive: false
      max_events: 5

  - id: hu_operator_facing_tool_provenance
    type: rubric
    criterion: >
      Evaluate only the matched trajectory evidence; ignore the Agent deliverable and
      all Agent-layer scores or conclusions. Score 1 only when the
      model-visible inventory and results let an operator unambiguously distinguish
      the platform-native command capability from third-party similarly named tools,
      and the native output's displayed identity/result remain attributable to the
      native channel without relying on private implementation knowledge. Score 0
      when the native identity is missing or indistinguishable, a third-party probe is
      presented or used as the native executor, source/result linkage is detached, or
      when evidence is missing or unreadable.
    evidence:
      event_types: ["run_started", "tool"]
      fields: ["source", "raw_event.tools", "tool_call.tool_name", "tool_result.content"]
      keywords: ["openclaw", "codex", "claudecode", "hermes", "T1C_NATIVE_OK", "HB_T1C_RESERVED_DISPATCH_HIT"]
      match: any
      case_sensitive: false
      max_events: 2

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "openclaw", "codex", "claudecode"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "openclaw", "codex", "claudecode"]
      match: any
      case_sensitive: false
      max_events: 100
