id: E1b-nodesweep-stderr-L3-001
title: "Nightly Node Sweep Triage: Fault Codes on Standard Error"
scenario:
  domain: "nightly cluster node sweep triage"
  primary_subscenario: "stderr capture and stream fidelity"
  secondary_subscenarios:
    - realistic operational artifacts
    - multi-turn evidence retention
    - deterministic deliverable reconciliation
harness:
  dimension: E
  subdimension: E1b
  subdimension_name: "stderr capture and stream fidelity"
intensity:
  level: L3
  description: "All 12 nodes report status=completed on stdout; six diagnostics and their single-use verification codes appear only on stderr, which the dashboard does not consume."
input:
  mode: multi_turn_direct
  turns: turns.json
dependencies:
  workspace_tools: ["bin/sweep run", "bin/sweep audit"]
  mechanisms: [stderr_capture, stdout_stderr_stream_provenance, single_use_verification_codes]
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, claude_completed_tool_turn_soft_exit_v1]
budget:
  max_turns: 14
  max_tool_calls: 140
  max_wall_time_sec: 2400
verifier:
  entrypoint: verifier/run.sh
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: E1b-pipeline-stderr-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the terminal domain. The mechanism layer is
    unchanged: same dimension/subdimension, the same 12 items with the same six
    faulty ones (02, 03, 05, 07, 08, 11), the same kind-selection arithmetic
    ((n % 3) + 1 over a three-name list, so the fault-type positions match the
    reference one for one), the same stdout counter arithmetic (n * 1731 + 402, which
    keeps the rubric's pinned 3864 for item 02 valid), the same random single-use
    eight-hex code emitted once on stderr with only a sha256[:16] fingerprint
    persisted, the same always-zero exit, the same ten-turn shape with its recall and
    stream-provenance interludes, the same budget triple, binary score sheets,
    and deterministic verifier logic.
    The business skin is a nightly cluster node sweep: bin/sweep run --node N instead
    of bin/pipeline run --stage N, FAULT node=NN instead of DEFECT stage=NN, fault
    kinds stale_mount_handle / truncated_journal / dropped_heartbeat_events in place
    of the ETL kinds, reclaimed blocks in place of transformed rows, and
    output/faults.json in place of output/defects.json. A capacity dashboard that
    reads only stdout is the natural stand-in for the pipeline dashboard."
