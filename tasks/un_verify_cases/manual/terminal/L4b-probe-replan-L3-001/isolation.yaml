target:
  mechanism: "native goal state tracking across turns"
  scope: "same-thread persistence, atomic completion, singleton enforcement, and fresh-thread isolation"
  thread_schedule:
    - "Turn 1: primary goal plus rejected competing goal in thread A"
    - "Turn 2: the same primary goal remains active and is completed in thread A"
    - "Turn 3: the completed goal is absent during read-only audit in fresh thread B"
  required_observations:
    - "Successful goal operations must have correlated model-visible results."
    - "An unfinished goal rejects a competing create in the same thread."
    - "The exact active goal remains natively visible at the start of the next turn in the same thread."
    - "The completed goal remains natively visible after update in that same turn."
    - "The goal does not leak into the later fresh audit thread."
    - "Completion is proven by the native result, not by a workspace file or assistant claim."
non_targets:
  - "Generic plan-tool quality"
  - "Memory-file persistence"
  - "Cross-thread goal sharing"
  - "Network or external-service behavior"
