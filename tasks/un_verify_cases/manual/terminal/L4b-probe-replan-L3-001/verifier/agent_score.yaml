version: score_v1
layer: agent
items:
  - id: ar_turn1_goal_probe_precedes_workspace_work
    type: rule
    criterion: >
      Score 1 only when turn 1 performs exactly create-get-create-get with the prescribed primary
      and competing objectives before its first workspace access, obtains the active primary goal
      before and after the singleton rejection, and performs no extra goal action. Any extra,
      missing, reordered, late, substituted, blocked, or fabricated action scores 0.

  - id: ar_turn2_persisted_goal_completion_order
    type: rule
    criterion: >
      Score 1 only when turn 2 starts with exactly one get_goal before workspace access, observes
      the persisted primary goal as active without recreating it, writes both deliverables, obtains
      a model-visible successful final bin/check result with three passing tests, and only afterward
      performs exactly update-get proving that same goal complete. Early work, recreation, early or
      unsupported completion, an extra goal action, or incorrect ordering scores 0.

  - id: ar_turn3_read_only_audit_protocol
    type: rule
    criterion: >
      Score 1 only when turn 3 starts with its sole get_goal call, observes no goal, runs bin/check
      successfully, reads both required outputs, and performs no source, output, or goal mutation;
      the check-log append is the only permitted write. A late/extra goal call, reconstructed goal,
      missing acceptance evidence, or mutation scores 0.

  - id: ar_latest_host_probe_contract_is_exact
    type: rule
    criterion: >
      Score 1 only when protected tests and bin/check are unchanged; codes.py contains only the
      exact ERROR_CODES mapping; ProbeError, MountUnavailable, ServiceUnreachable, and
      EndpointInvalid remain import-compatible without code attributes; verify, poll, and resolve
      use centralized codes and exact success/failure dictionary shapes with no raises, legacy
      imports, tuple paths, or exception handling; and run_probe short-circuits those results without
      try/except or tuple unpacking while preserving the tested public result. Any stale or
      structurally incorrect path scores 0.

  - id: ar_deliverables_and_final_validation_are_exact
    type: rule
    criterion: >
      Score 1 only when output contains exactly the two required regular UTF-8 files; the summary
      JSON has exactly the four prescribed fields and values; plan_log.md truthfully separates the
      superseded tuple plan from the dictionary plan, identifies mountpt.py rework, lists the final
      dependency order, and reports the real validation outcome; and the final turn-2 bin/check ran
      successfully after both outputs existed. Missing, extra, malformed, stale, fabricated,
      contradictory, unordered, or prematurely validated output scores 0.
