version: score_v1
layer: harness
items:
  - id: hr_trace_lifecycle_complete_and_ordered
    type: rule
    criterion: "1 iff the normalized trace has exactly one successful complete start/finish lifecycle, unique increasing sequence numbers, and a matching complete summary; otherwise 0."
  - id: hr_native_call_result_identity_correlated
    type: rule
    criterion: "1 iff every native business-tool result preserves a unique call ID, its exact native tool identity, and a non-error result; otherwise 0. Harness-specific wrapper shapes are not required."
  - id: hr_manifest_content_complete_and_exact
    type: rule
    criterion: "1 iff the model-visible vendor_manifest result semantically contains exactly all six bundle/vendor entries in order and bundle_count=6; otherwise 0."
  - id: hr_inspection_payloads_complete_and_exact
    type: rule
    criterion: "1 iff exactly one native inspection result per bundle semantically preserves the complete exact nested payload, including declared and active tools; otherwise 0."
  - id: hr_duplicate_declarations_preserved_in_order
    type: rule
    criterion: "1 iff VB-102 preserves both distinct bolt_sync definitions in declaration order plus bolt_health; otherwise 0."
  - id: hr_duplicate_active_registry_effect_preserved
    type: rule
    criterion: "1 iff VB-102 preserves the last-definition-wins active payload and exactly overwritten_duplicate_names=[bolt_sync]; otherwise 0."
  - id: hr_overlong_name_preserved_without_truncation
    type: rule
    criterion: "1 iff VB-105 preserves the exact 144-character name without abbreviation or ellipsis; otherwise 0."
  - id: hr_invalid_schema_literal_preserved
    type: rule
    criterion: "1 iff VB-106 preserves the exact nested query type literal strng and all sibling fields; otherwise 0."
  - id: hr_registry_observation_fields_preserved
    type: rule
    criterion: "1 iff all inspections preserve loaded status, permissive_last_definition_wins policy, exact active-registry content, overwrite state, and the exact empty diagnostics array; otherwise 0."
  - id: hr_verdict_receipts_complete_and_correlated
    type: rule
    criterion: "1 iff every successful simulator verdict record has exactly one native call/result in the same sequence with identical arguments and receipt fields (recorded, bundle, verdict, violations, submission number), and at least one verdict receipt exists; otherwise 0. Decision correctness and call order choices are scored only in the Agent layer."
  - id: hr_post_tool_observations_lossless_and_correlated
    type: rule
    criterion: "1 iff every native business call has exactly one normalized post-tool observation with identical sequence, identity, arguments, and result; otherwise 0."

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["error", "failed", "timeout"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["error", "failed", "timeout"]
      match: any
      case_sensitive: false
      max_events: 100
