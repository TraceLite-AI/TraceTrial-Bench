version: score_v1
layer: harness
items:
  - id: hr_canonical_11_turn_trace_complete
    type: rule
    criterion: >
      Score 1 only when one merged normalized root trajectory has exactly one
      structured start and one successful finish for every turn 1 through 11,
      with no missing, duplicate, failed, or truncated turn. Score 0 otherwise
      or when canonical evidence is unavailable.

  - id: hr_pressure_inputs_model_visible
    type: rule
    criterion: >
      Score 1 only when structured model-context archives prove delivery of
      both exact standing constants, all three eligibility predicates, every
      region and channel-code member, all sixteen PREVIEW begin/end markers,
      and the exact RELEASED introduction. Raw stdout/stderr is never accepted
      as model-visible evidence. Score 0 for any missing value or evidence.

  - id: hr_native_compaction_before_first_archive_write
    type: rule
    criterion: >
      Score 1 only when a typed native context_compaction event with a nonempty
      native_event_key and summary occurs after substantial PREVIEW pressure
      and strictly before the first tool event that writes archive.jsonl.
      Score 0 for absent, synthetic, marker-only, early, late, or unorderable
      compaction evidence.

  - id: hr_active_compaction_summary_model_visible
    type: rule
    criterion: >
      Score 1 only when the last summary-bearing native compaction strictly
      before the first archive write has structured proof that its replacement
      summary was delivered to the model: an explicit true visibility field or
      an equivalent native model-directed replacement-history record. Score 0
      for a silent, harness-log-only, or unavailable boundary.

  - id: hr_active_summary_preserves_full_archive_profile
    type: rule
    criterion: >
      Score 1 only when that active summary preserves the exact batch code,
      permit, transfer_size_gib threshold, RSYNC and VERIFIED predicates,
      PREVIEW exclusion, and every region and channel code in the complete
      standing map. Score 0 for any omitted, changed, or contradicted token or
      when the active summary is unavailable.

  - id: hr_active_summary_state_and_next_action_actionable
    type: rule
    criterion: >
      Score 1 only when the active model-visible summary accurately identifies
      the current PREVIEW progress, preserves the no-preview-write rule, states
      that no RELEASED manifest has yet been processed, and directs the resumed
      model to process RELEASED input into archive.jsonl and later handoff.md.
      Score 0 for stale progress, contradiction, missing next action, or
      unavailable evidence.

  - id: hr_post_compaction_release_and_reconciliation_complete
    type: rule
    criterion: >
      Score 1 only when turns 10 and 11 both finish successfully after the
      selected compaction, the first archive write occurs after that boundary,
      and handoff.md is written only in turn 11 after the archive. Score 0 for
      a stalled resume, reordered write, missing finalization, or unavailable
      evidence.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
