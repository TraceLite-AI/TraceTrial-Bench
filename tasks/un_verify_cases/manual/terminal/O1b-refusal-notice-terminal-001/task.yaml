id: O1b-refusal-notice-terminal-001
title: "Snapshot Desk Refusal Handoff"
scenario:
  domain: "managed archive operations with refusal handoff"
  primary_subscenario: "Harness delivery of task-tool error notifications"
  secondary_subscenarios:
    - "single-turn refusal handling"
    - "native task-tool call and result correlation"
    - "verbatim error preservation"
    - "receipt-grounded deliverable reconciliation"
harness:
  dimension: O
  subdimension: O1b
  subdimension_name: "Harness error and refusal notification"
intensity:
  level: L3
  description: "Eight snapshot jobs are processed through managed task tools. Four succeed and four return distinct isError refusals whose complete notices must remain visible, correlated, unmodified, and actionable at the model boundary."
input_mode: single_turn
tool_dependencies: [task_tools_v1, post_tool_v1]
budget:
  max_turns: 1
  max_tool_calls: 40
  max_wall_time_sec: 1800
expected_outputs:
  - workspace/output/archive_result.json
verifier:
  entrypoint: verifier/run.sh
  selftest: verifier/selftest.py
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
business_simulator:
  version: unix_json_v1
  scenario: simulator/scenario.json
  server: simulator/server.py
  cli: .harnessbench/simulator-cli
task_tools:
  version: mcp_stdio_v1
  manifest: simulator/tools.json
execution_probe:
  version: lifecycle_v1
  requires: [task_tools_v1, post_tool_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: O1b-harness-refusal-notice-L3-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the terminal domain. The mechanism layer is unchanged: same
    dimension/subdimension, the same eight jobs in the same fixed order with the same
    alternating success/refusal pattern and the same four refusal classes at the same
    ordinals, the same one-attempt-then-one-report protocol with no retries, the same
    character-for-character notice copy rule and null-when-not-visible rule, the same
    receipt preservation, the same register contract, the same budget triple, both score
    rubrics, and score.py rule logic.
    Only the skin changes: the Archive Desk becomes a Snapshot Desk: eight snapshot jobs over the same four refusal classes (source outside the workspace, source is a directory, source not found, destination outside the workspace)."
