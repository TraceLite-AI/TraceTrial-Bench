version: score_v1
layer: agent
items:
  - id: ar_output_contract_and_single_audit
    type: rule
    criterion: >
      Score 1 only when the controlled snapshot command has exactly one durable start
      and matching completion and out/ contains only exact regular duplicate-free UTF-8
      child_report.json and final_status.json files with authoritative values; or when
      one genuinely unresolved start has the exact supported pending final status and
      platform notice. Missing, extra, malformed, guessed, or inconsistent output scores 0.

  - id: ar_native_request_and_coordinator_protocol
    type: rule
    criterion: >
      Score 1 only when the coordinator issues exactly one correctly named native
      asynchronous request with the verbatim assignment, crosses exactly one later native
      return-to-runtime boundary, and performs no blocking result retrieval, child-state
      polling/list/history access, retry, replacement, sleep, nested delegation, network
      access, protected-input access, or coordinator execution of the child command.
      The request is graded independently of whether the Harness accepts or delivers it.

  - id: ar_child_assignment_exact
    type: rule
    criterion: >
      Score 1 only when child-attributed evidence contains exactly one invocation of
      sh tools/run_snapshot_verify.sh from the workspace root (an explicit cd /workspace
      prefix is equivalent) and no unrelated child tool action. Native process
      poll/log continuations tied to that already-issued command are permitted and do not
      count as additional command invocations. Missing, repeated, altered, parent-run,
      or extra child work scores 0.
