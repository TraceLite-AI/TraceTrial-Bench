version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the normalized trace has exactly one start and terminal event,
      is explicitly complete, has contiguous unique sequence numbers, exposes a typed
      parent exit code, and every tool call/result pair has one matching unique ID.
      Missing, truncated, duplicated, orphaned, or unpaired evidence scores 0.

  - id: hr_native_child_dispatch_accepted
    type: rule
    criterion: >
      Score 1 only when exactly one recognized native asynchronous snapshot-verifier
      dispatch is visible and its immediate structured result proves accepted/pending
      status plus a stable non-empty child identity before completion. A rejected,
      synchronous, flattened, duplicated, or identity-free result scores 0.

  - id: hr_pending_parent_boundary_observable
    type: rule
    criterion: >
      Score 1 only when the accepted child identity remains correlated across exactly
      one explicit native yield, mailbox wait, or typed parent-turn return boundary,
      and the matching runtime completion occurs strictly after that boundary. A mere
      completion notification, elapsed time, model prose, or blocking getter is not a
      return boundary. Missing or ambiguous chronology scores 0.

  - id: hr_child_execution_lineage_observable
    type: rule
    criterion: >
      Score 1 only when normalized child-attributed tool evidence links the exact
      snapshot command to the same accepted child identity and a non-empty parent
      principal. Flattened, parent-attributed, mismatched, or inferred lineage scores 0.

  - id: hr_pushed_completion_identity_correlated
    type: rule
    criterion: >
      Score 1 only when a typed or runtime-origin completion record carries exactly
      CHILD_TASK_COMPLETE with the authoritative sum and nonce and is identity-correlated
      to the accepted child. Child-only stdout, artifacts, parent repetition, or an
      uncorrelated raw string scores 0.

  - id: hr_parent_reactivated_before_finalization
    type: rule
    criterion: >
      Score 1 only when a typed pushed completion explicitly reactivates the parent and
      occurs after the return boundary but before the first parent write of
      out/final_status.json. A raw notification without normalized reactivation, a yield
      acknowledgement, or a post-finalization event scores 0.

  - id: hr_pending_child_exit_resolved
    type: rule
    criterion: >
      Score 1 only when the full accepted-child, pending-boundary, lineage, pushed-
      completion, reactivation, exact-output, and successful-exit chain is proven; or
      when a genuinely unresolved started child is represented by the exact pending
      output and an explicit Harness warning or nonzero parent exit. Silent successful
      loss, incomplete evidence, or a completion claim without the full chain scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
