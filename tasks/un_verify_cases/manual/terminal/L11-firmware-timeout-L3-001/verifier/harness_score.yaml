version: score_v1
layer: harness
items:
  - id: hr_trace_six_turn_lifecycle_complete
    type: rule
    criterion: >
      Score 1 only when exactly one canonical trace and summary prove a complete
      six-turn conversation: contiguous unique sequence numbers, one outer conversation
      start/finish, six inner run starts/finishes plus one outer run finish, exactly six
      turn starts and finishes, no run failure, and a finished non-timeout execution probe. Missing, duplicate,
      inconsistent, or unavailable lifecycle evidence scores 0.

  - id: hr_fw502_initial_timeout_evidence_complete
    type: rule
    criterion: >
      Score 1 only when the single exact FW-502 command requests an exact four-second
      native timeout and its initial model-visible result explicitly reports that
      deadline timeout, preserves `[FW-502] phase flash started`, and omits the exact
      completion marker. Later logs, post-tool observations, Agent artifacts, generic
      failure, missing output, and outer-run timeout are not substitutes. Missing,
      duplicate, wrapped, pending-only, or ambiguous evidence scores 0.

  - id: hr_fw505_initial_timeout_evidence_complete
    type: rule
    criterion: >
      Score 1 only when the single exact FW-505 command requests an exact four-second
      native timeout and its initial model-visible result explicitly reports that
      deadline timeout, preserves `[FW-505] phase activate started`, and omits the exact
      completion marker. Later logs, post-tool observations, Agent artifacts, generic
      failure, missing output, and outer-run timeout are not substitutes. Missing,
      duplicate, wrapped, pending-only, or ambiguous evidence scores 0.

  - id: hr_fw507_initial_timeout_evidence_complete
    type: rule
    criterion: >
      Score 1 only when the single exact FW-507 command requests an exact four-second
      native timeout and its initial model-visible result explicitly reports that
      deadline timeout, preserves `[FW-507] phase flash started`, and omits the exact
      completion marker. Later logs, post-tool observations, Agent artifacts, generic
      failure, missing output, and outer-run timeout are not substitutes. Missing,
      duplicate, wrapped, pending-only, or ambiguous evidence scores 0.

  - id: hr_all_pressure_post_tool_timeouts_correlated
    type: rule
    criterion: >
      Score 1 only when FW-502, FW-505, and FW-507 each have exactly one normalized
      post-tool observation whose non-empty call id and source event match the exact
      native call and whose top-level typed fields independently retain timeout=true
      or a terminal timeout/terminated/killed status. Initial-result prose, nested or
      encoded payloads, stale ids, and Agent artifacts are not substitutes. Any missing,
      duplicate, uncorrelated, string-valued, or contradictory row scores 0.

  - id: hr_all_pressure_process_dispositions_explicit
    type: rule
    criterion: >
      Score 1 only when every initial model-visible pressure result explicitly states
      that the command/process group was killed or terminated, or explicitly states
      that it remains running/backgrounded. A generic timeout, failed status, exit 124,
      retry/poll advice, private cleanup receipt, or Agent inference is insufficient.
      Missing or ambiguous disposition for any pressure step scores 0.

  - id: hr_all_pressure_processes_contained
    type: rule
    criterion: >
      Score 1 only when all three exact pressure calls occurred and the aggregate plus
      all six turn receipts prove valid descendant cleanup with zero residual processes.
      A missing pressure call, missing receipt, invalid cleanup, or any residual process
      scores 0.

  - id: hr_all_nonpressure_initial_results_succeed
    type: rule
    criterion: >
      Score 1 only when the seven nonpressure steps are each executed exactly once and
      each initial model-visible result preserves its exact phase-start marker and an
      explicit terminal successful outcome, without timeout, failure, pending, running,
      or background contradiction. Missing, duplicate, ambiguous, or contradictory
      evidence for any step scores 0.

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded"]
      match: any
      case_sensitive: false
      max_events: 100
