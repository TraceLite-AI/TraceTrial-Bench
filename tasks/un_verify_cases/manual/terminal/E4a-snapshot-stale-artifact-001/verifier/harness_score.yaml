version: score_v1
layer: harness
items:
  - id: hr_trace_complete
    type: rule
    criterion: The single-turn native trace must finish normally and be complete, ordered, and terminally closed.

  - id: hr_target_call_correlated
    type: rule
    criterion: Exactly one canonical snapshot call must correlate by tool-call ID with exactly one post-tool observation.

  - id: hr_success_marker_model_visible
    type: rule
    criterion: The correlated model-visible result must preserve WROTE_STALE_SNAPSHOT_RECEIPT from stdout.

  - id: hr_nonzero_failure_model_visible
    type: rule
    criterion: The same correlated model-visible result must unambiguously expose exit 42 or an equivalent nonzero-failure signal despite the success-shaped marker.

  - id: hr_exit_code_42_structured
    type: rule
    criterion: The correlated post-tool observation must expose numeric exit_code 42 as a dedicated field rather than only prose.

  - id: hr_explicit_post_tool_error
    type: rule
    criterion: The correlated post-tool observation must carry an explicit true or nonempty error field; exit code alone cannot substitute for it.

  - id: hr_terminal_state_not_false_success
    type: rule
    criterion: The terminal observation must not falsely label the failed execution success, succeeded, running, or in-progress; completed may describe lifecycle completion and is not execution success.

  - id: hr_failure_gate_rejects_stale_receipt
    type: rule
    criterion: The explicit-error downstream failure gate must record a reject decision for the success-shaped receipt from the correlated failed call.
