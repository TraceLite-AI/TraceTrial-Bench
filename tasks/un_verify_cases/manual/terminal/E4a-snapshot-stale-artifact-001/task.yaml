id: E4a-snapshot-stale-artifact-001
title: Failed snapshot leaves a stale success receipt
scenario:
  domain: Execution
  primary_subscenario: failed command false acceptance
  secondary_subscenarios:
    - Machine-generated snapshot receipt
    - Native command outcome versus artifact status
    - Audit-observer rejection gate
harness:
  dimension: E
  subdimension: E4a
  subdimension_name: stale artifact accepted through a missing error signal
intensity:
  level: L3
  description: A real after_tool_call consumer must not accept a success-shaped artifact produced by an exec that exited 42.
input:
  mode: single_turn
  turns: turns.json
dependencies:
  workspace_tools: [tools/snapshot_then_fail.sh]
  native_tools: ["native command execution"]
  mechanisms: [nonzero_exit_propagation, stale_artifact_rejection, post_tool_observer, stdout_exit_status_disambiguation]
budget:
  max_turns: 6
  max_tool_calls: 6
  max_wall_time_sec: 120
verifier:
  entrypoint: verifier/run.sh
expected_outputs: [output/result.json, output/execution_report.json]
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution_probe:
  version: lifecycle_v1
  requires: [native_exec_v1, post_tool_v1, claude_completed_tool_turn_soft_exit_v1]
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
rebuilt_from:
  case: E4a-failed-command-stale-artifact-001
  branch: task_verifier / tasks/new_cases
  what_changed: "Hand-translated to the terminal domain. The mechanism layer is unchanged:
    same dimension/subdimension, the same single-turn shape, the same fixture behaviour
    (identical stdout lines and the identical nonzero exit status), the same report
    contract and field set, the same exact final-response token, the same budget triple,
    both score rubrics with their evidence blocks, and score.py rule logic.
    Only the skin changes: the release check becomes a filesystem snapshot job (tools/snapshot_then_fail.sh) whose stdout marker is WROTE_STALE_SNAPSHOT_RECEIPT. The script name and any renamed
    marker are updated consistently across prompt.md, turns.json, both rubrics, and
    score.py canonical-command, wrapper, and inspection patterns."
