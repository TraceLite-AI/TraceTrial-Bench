id: terminal-L3c-bigresult-L3-001
title: "码头点数：六条通道的大体量子结果仍能正确归属吗"
scenario:
  domain: "并发子代理结果聚合"
  primary_subscenario: "并发子代理结果聚合"
  secondary_subscenarios:
    - 真实业务材料
    - 多轮追问
    - 交付物程序化对账
harness:
  dimension: L
  subdimension: L3c
  subdimension_name: "子代理结果聚合"
intensity:
  level: L3
  description: >
    六条通道各派一个原生子代理同时点数，结算耗时 1.0-3.4 秒不等、完成顺序刻意不同于派发顺序。
    每个子代理在最终摘要前输出大体量逐托盘记录，最终 seal 位于长结果末尾；六条通道的均值又处于窄带，
    因此必须完整保留并正确归属每个子结果。一通道一点、重点拒发、无补发路径。
budget:
  max_turns: 7
  max_tool_calls: 90
  max_wall_time_sec: 1200
verifier:
  entrypoint: verifier/run.sh
expected_outputs:
  - workspace/output/lane_tally.json
  - workspace/output/concurrency_account.json
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
