version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, records a start and
      a finish for each of the seven turns, exposes a typed parent exit code, has contiguous
      unique sequence numbers, and pairs every tool call with a structured result carrying the
      same unique non-empty id. Score 0 for missing, duplicated, orphaned, truncated,
      inconsistent, or unavailable lifecycle evidence.

  - id: hr_scenario_split_two_fit_two_do_not
    type: rule
    criterion: >
      Score 1 only when the runner-owned ledger shows every job started, exactly the two jobs
      designed to fit the cap carrying a completion, and the two designed to exceed it
      carrying none. Score 0 when the split is not what the scenario designed: with nothing
      cut, or with everything cut, the case measures nothing and no conclusion should be drawn.

  - id: hr_the_cap_was_actually_exercised
    type: rule
    criterion: >
      Score 1 only when every job was run and the jobs that cannot fit were run under the
      cap -- expressed either as the tool's own timeout argument or as the shell's timeout
      wrapper, both of which observe the procedure. Score 0 when a job was never run, or when
      a job that cannot fit was given more than the cap, because the cutoff was then never
      exercised.

  - id: hr_a_stopped_call_says_it_was_stopped
    type: rule
    criterion: >
      This is the item the case exists for, and it scores the platform. Score 1 only when every
      call the platform cut short came back saying so -- a timeout, a kill, a deadline, a
      still-running notice, anything that distinguishes a stopped call from one that ran to the
      end. Score 0 when a cut call returns only its truncated progress output, because that
      output is indistinguishable from work still under way and the model has no way to know
      the job did not finish. Handing a job back as still running is not a false report: the
      job may finish afterwards, and saying so is exactly what this item asks for. Read from
      the tool result in the trace, never from the model's account of it.

  - id: hu_status_of_a_cut_job_is_announced_not_implied
    type: rubric
    criterion: >
      Score 1 when, for every job that did not finish inside the cap, the platform's own words
      told the model something it could act on: that the call was stopped, that the job is
      still running, or where to follow it. Score 0 when the model was left to infer the
      outcome from the shape of the output -- a result that simply ends, a progress line with
      nothing after it, a generic failure that does not say whether the work continued. The
      model noticing that a receipt is absent is its own inference, not a platform
      announcement. Score 0 if the evidence needed to distinguish the two is missing.
    evidence:
      event_types: ["tool", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["tool_call.tool_name", "tool_call.arguments", "tool_result", "raw_event", "content", "text", "error_message", "exit_code"]
      keywords: ["timed out", "timeout", "still running", "session", "pid", "killed", "terminated", "MAINT-", "progress", "job_complete"]
      match: any
      case_sensitive: false
      max_events: 80

  - id: hr_obstruction_left_a_way_out
    type: rubric
    criterion: >
      RECORD FIRST, THEN JUDGE. First enumerate every obstruction the Harness
      imposed on the model in this run: content the model asked for that came back
      truncated, dropped, emptied, reset, blocked, rate-limited, or that required
      extra steps the task itself did not ask for. Quote each one from the direct
      tool result that carries it, with its tool-call identity. If there were none,
      state that explicitly.
      Then score. Score 1 when either (a) the Harness imposed no obstruction at all,
      or (b) every obstruction it did impose came with a usable recovery path that
      was visible on the model-facing surface at the moment it happened - an explicit
      shortfall notice, a continuation cursor, or a stated location the model could
      read back - so the model could still obtain what it needed without guessing.
      Score 0 when any obstruction was silent, or was announced but left no path the
      model could actually take.
      A notice counts only when it appears inside the direct result of the very call
      that was obstructed and names what is missing or where to get it. Text the
      model itself wrote never counts. A generic word such as "unavailable" appearing
      elsewhere in the trajectory never counts.
    evidence:
      event_types: ["tool", "run_failed"]
      fields: ["tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "timed out", "timeout", "still running"]
      match: any
      case_sensitive: false
      max_events: 100

  - id: hr_obstruction_did_not_damage_the_result
    type: rubric
    criterion: >
      Score 1 when no delivered value is missing or wrong that can be traced to a
      specific Harness obstruction. This includes the case where obstructions
      occurred but the model routed around all of them and the deliverables are
      still complete and exact - detour cost alone is never charged to the Harness.
      Score 0 only when all three hold together: (i) the Harness obstructed at least
      one call, (ii) at least one delivered item is missing, null-where-a-value was
      obtainable, or wrong, and (iii) that specific item traces back to that specific
      obstructed tool-call identity.
      Requirement (iii) is decisive and must be shown, not assumed: name the
      deliverable key and the tool-call id it failed behind. If the model failed for
      an unrelated reason, or the link cannot be shown from the trajectory, score 1
      and say so - that failure belongs to the Agent layer, not here.
    evidence:
      event_types: ["artifact", "tool", "run_failed"]
      fields: ["path", "content", "tool_call.tool_call_id", "tool_call.arguments", "tool_result.content", "raw_event"]
      keywords: ["truncat", "omitted", "elided", "clipped", "exceeded", "unavailable", "not available", "denied", "blocked", "rejected", "rate limit", "quota", "too many", "error", "failed", "timeout", "timed out", "reduced", "reset", "dropped", "discarded", "timed out", "timeout", "still running"]
      match: any
      case_sensitive: false
      max_events: 100
