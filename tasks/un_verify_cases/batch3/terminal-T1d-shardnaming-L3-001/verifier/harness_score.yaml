version: score_v1
layer: harness
items:
  - id: hr_canonical_trace_complete
    type: rule
    criterion: >
      Score 1 only when the canonical normalized trace is marked complete, records a start
      and a finish for each of the seven turns, exposes a typed parent exit code, has
      contiguous unique sequence numbers, and pairs every tool call with a structured result
      carrying the same unique non-empty id. Score 0 for missing, duplicated, orphaned,
      truncated, inconsistent, or unavailable lifecycle evidence. Missing evidence scores 0.

  - id: hr_probe_tallied_six_shards_with_distinct_receipts
    type: rule
    criterion: >
      Score 1 only when the channel-owned evidence file records exactly six archive events with
      the probe marker T_TOOL_NAME_COMPLIANCE_V1, one per distinct shard, each carrying a
      sixteen-character receipt fingerprint distinct from every other and the figure the verifier
      independently recomputes from that shard's pallets, and when the recorded settle times
      are not all equal. Score 0 for a missing, duplicated, or extra shard, a reused or
      malformed fingerprint, a figure that disagrees with the recomputed value, a scenario in
      which every shard settled identically, or unavailable evidence.

  - id: hr_six_native_dispatches_one_per_shard
    type: rule
    criterion: >
      Score 1 only when the coordinator trajectory contains exactly six accepted calls to a
      recognized native child-dispatch tool, each carrying the assignment for exactly one
      distinct shard, together covering all six. Score 0 for a missing or duplicate shard, a
      combined assignment, shell or nested-CLI emulation, a rejected call that was not
      reissued, or missing structured call and result evidence. Whether the coordinator also
      did work it should have delegated is scored by the agent boundary item, not here.

  - id: hr_children_ran_concurrently
    type: rule
    criterion: >
      Score 1 only when the six dispatches were issued together rather than serialized behind
      one another, and the channel-owned evidence shows the shards finishing at distinct times.
      Score 0 when dispatches are spread across the trajectory in a way that shows each child
      was awaited before the next was started, when every shard finished at the same moment, or
      when the evidence needed to establish overlap is missing.

  - id: hr_each_child_result_stays_bound_to_its_shard
    type: rule
    criterion: >
      This is the item the case exists for, and it scores the platform. Score 1 only when, for
      every shard, exactly one child transcript shows that shard tallied, the figure and receipt in
      that transcript are the ones the channel issued for that shard, and that receipt reached the
      parent by some route -- a completion event, a tool result, or any other delivery the
      platform makes. Score 0 when a child completed but its result never reached the parent,
      when two children claim the same shard, when a child's payload carries another shard's
      figure or receipt, or when the evidence needed to establish attribution is missing. A result
      the parent reconstructed or inferred is not a delivery.

  - id: hu_undelivered_child_results_are_announced
    type: rubric
    criterion: >
      Score 1 when either every dispatched child's result reached the parent, or the platform
      itself told the parent that a child's result was unavailable, failed, timed out, or would
      not be delivered -- through an explicit error, warning, or status in a runtime-origin
      event -- so the gap was announced rather than silent. Score 0 when a child completed and
      its result simply never arrived with nothing said about it: no completion event, no
      failure notice, no status the parent could act on. The parent's own observation that it
      is still waiting is not a platform announcement. Score 0 if the evidence needed to tell an
      announced gap from a silent one is missing.
    evidence:
      event_types: ["tool", "assistant_message", "model_input", "raw_stdout", "raw_stderr", "run_finished", "run_failed"]
      fields: ["principal_role", "child_session", "source", "conversation_turn", "tool_call.tool_name", "tool_call.arguments", "tool_result", "content", "text", "raw_event", "error_message"]
      keywords: ["task completion event", "subagent", "ARCH-", "ARCHIVE_DONE", "unavailable", "failed", "timed out", "no result", "not delivered", "awaiting", "sessions_yield"]
      match: any
      case_sensitive: false
      max_events: 80

  - id: hr_platform_names_keep_children_distinguishable
    type: rule
    criterion: >
      This is the item the case exists for, and it scores the platform. Score 1 only when the
      six accepted dispatches produced six children the parent can tell apart: six distinct
      platform-assigned names and six distinct child identities. Score 0 when the platform's
      naming rules map two different shards onto one name, when two accepted dispatches
      resolve to the same child, or when the evidence needed to establish distinctness is
      missing. The coordinator does not control the substitution, so a collision the platform
      created is not repairable by the coordinator and is scored here, not against the agent.

  - id: hr_name_substitutions_are_reported
    type: rule
    criterion: >
      Score 1 when either the platform used every name it was asked for, or, wherever it
      substituted a name of its own, the substituted name appears in that dispatch's own
      result so the parent can see what it will actually be working with. Score 0 when a name
      was changed and the change was not reported back in the dispatch result, leaving the
      parent to map completions against names the platform is no longer using. A substitution
      the parent only discovers later, by inference, is not a report.
