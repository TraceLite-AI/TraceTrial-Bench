id: coding-C3a-benchbaseline-L3-001
title: "季度基线记录：十几轮之后，第一批套件的基线数还说得出来吗"
scenario:
  domain: "同一会话内的跨轮事实保持"
  primary_subscenario: "同一会话内的跨轮事实保持"
  secondary_subscenarios:
    - 真实业务材料
    - 多轮追问
    - 交付物程序化对账
harness:
  dimension: C
  subdimension: C3a
  subdimension_name: "跨轮事实保持"
intensity:
  level: L3
  description: >
    16 个基准套件分四批记录（第 2/4/6/8 轮），中间穿插五轮真实分析工作把距离拉开；
    第 12 轮才要求汇总全部 16 个。基线一套件一读、重读拒发、无补发路径，
    figure 也不能从套件运行值反推 —— 早轮的数留不住就是留不住。
    全程不断会话：丢了不是因为谁重置了，是对话本身没把它带住。
budget:
  max_turns: 14
  max_tool_calls: 140
  max_wall_time_sec: 1500
verifier:
  entrypoint: verifier/run.sh
expected_outputs:
  - workspace/output/baseline_register.json
  - workspace/output/retention_account.json
scoring:
  version: layered_100_v1
  harness_score: verifier/harness_score.yaml
  agent_score: verifier/agent_score.yaml
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
