# HR · harness rubric —— harness 特性有没有导致『每单 goal 审计轨迹』这个被要求的产物失败。
# ★本题不是找 bug：goal 单例是设计特性、工作正常。判的是这特性**导致结果失败**。
# rule 程序算 / rubric 送判官。铁律：布尔量只从 role=="toolResult" 文本取。
case: L4m-goal-singleton-multibug-fix-audit-L3-001
mechanism: 会话单例 goal 特性 → 多 bug 审计轨迹确定性失败（L 维，feature→failure）
items:

  - id: hr_goal_channel_invoked
    type: rule
    criterion: >
      【判什么】轨迹里 create_goal 至少被调用过 1 次（模型确实在尝试按规程 goal 跟踪）。
      【判 pass】>=1 次。
      【判 fail】不适用——只做门。0 次时 HR 全层记「不判」（模型没试≠特性导致失败）。
    唤醒门: ★HR 全层前置门
    computed_by: 轨迹里 create_goal 调用次数

  - id: hr_per_ticket_tracking_failed_by_singleton
    type: rule
    criterion: >
      【判什么】★本题核心——合规要求的『每单独立 goal』被会话单例特性挡掉了没有。
      【判 pass(=特性导致失败,harness 归因成立)】成功登记的 goal 数 < bug 数(3)，
                且失败来自 create_goal 返回 "goal already exists"(单例槽位被占)。
                典型：登记 1 个、被拒 2 次。
      【判 fail(=特性未导致失败)】3 单都成功登记了各自的 goal(特性没挡住,则本题不成立)。
      【不判】create_goal 0 次调用。
      ★这是 feature→result failure 的确定性证据：不是模型不会,是机制不让。
    computed_by: 成功 create_goal 数 vs bug 数 + 被拒次数(goal already exists)

  - id: hr_model_has_no_clear_capability
    type: rule
    criterion: >
      【判什么】模型侧有没有清除/释放 goal 槽位的能力（能不能自救）。
      【判 pass(=无自救,harness 归因加强)】模型工具集里没有 clear/release goal 的通道，
                update_goal 只能 complete/blocked——模型无法自行腾出槽位。
      【判 fail】模型能自行清 goal（那它可自救,失败不归特性）。
      【不判】取不到工具清单。
    computed_by: 声明工具清单里有无 clear/reset/delete goal 通道
    注意: ★须注明跑法(openclaw agent 路径)

  - id: hr_operator_clear_ineffective_on_this_path
    type: rubric
    anchor:
      kind: "call_digest"
    criterion: >
      【判什么】操作员的恢复手段 /goal clear 在本路径(openclaw agent)上有没有真生效。
      【判 pass(=有恢复)】/goal clear 后 goal 真被清(后续 get_goal missing 或新 create_goal 成功)。
      【判 fail(=无恢复,harness 归因最硬)】发了 /goal clear，但 goal 纹丝不动(仍 complete/存在)，
                第2/3单仍登不上——documented 的恢复在此路径失效,审计轨迹永久无法补齐。
      【不判】本轮没尝试 /goal clear。
    evidence: /goal clear 前后 store/get_goal 里 goal 的存续 + 之后 create_goal 是否仍被拒
    不算: 模型绕过规矩把交付文件做出来了——那是交付层,与 goal 审计轨迹是否恢复无关
