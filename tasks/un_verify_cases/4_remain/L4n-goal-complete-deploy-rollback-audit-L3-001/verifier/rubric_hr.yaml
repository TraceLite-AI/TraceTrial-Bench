# HR · harness rubric —— goal 完成态不可逆这个**特性**有没有让『回滚重发的发布的状态如实反映』失败。
# ★不是找 bug：complete 不可逆是设计。判的是它导致结果失败。
# 核心 HR 项按框架约定 `_gap_caused_failure` 命名(True=特性未害/False=特性害的)，pass=False 时归 harness。
case: L4n-goal-complete-deploy-rollback-audit-L3-001
mechanism: goal 完成态不可逆 → 回滚重发的发布审计状态确定性谎报（L 维，feature→failure）
items:
  - id: hr_goal_channel_invoked
    type: rule
    criterion: >
      【判什么】create_goal 至少调过 1 次(模型确在按规程用 goal 跟踪)。
      【判 pass】>=1。【判 fail】不适用,只做门。【不判】0 次时 HR 全层不判。
    唤醒门: ★HR 全层前置门
    computed_by: create_goal 调用次数
  - id: hr_reopened_goal_state_gap_caused_failure
    type: rule
    criterion: >
      【判什么】★回滚重发的发布能不能把 goal 拨回 active 反映『进行中』。
      【判 pass(True,特性未害)】update_goal(active) 成功,goal 反映为 active。
      【判 fail(False,特性害的)】update_goal(active) 被拒(complete 终态不可逆/只准 complete·blocked),
                goal 卡在 complete → 审计只能显示『已上线』,而发布实际在重发 → 状态确定性失真。
      【不判】未尝试拨回,或 create_goal 0 次。
    computed_by: update_goal(active/paused 等) 是否被 schema/终态拒 + goal 是否卡 complete
    注意: ★须注明跑法(openclaw agent 路径,模型侧 update_goal 只准 complete/blocked)
