# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-T4c-inventory-L3-001
items:
  - id: hr_parallel_calls_all_delivered
    criterion: >
      同一回合发起的多个工具调用，其结果是否全部送达模型。判 fail：调用数与结果数不符。判 N-A：未出现同回合多调用。
    evidence: 同一 message_index 下的 toolCall 数 vs toolResult 数
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时，**失败判别符是否到达了消费方能读到的字段**。逐项检查（有哪项查哪项，其余判 N-A）：
      ① 模型可见的工具结果原文里出现失败迹象（退出码/信号/错误文本）；
      ② 若本题有 after_tool_call hook 观测文件，其 hook_error_present 在工具确实失败时必须为 true；
      ③ result_exit_code 必须等于命令的真实退出码，不得被改写为 0。
      **判 fail 的确切条件**：上述任一项在「工具确实失败」的前提下不成立。
      ★只看①就判 pass 是不够的 —— 实测失败确实进了工具结果，却没进 hook 的 error 字段；退出码也出现过被改写成 0。
    evidence: 证据包 4.1 工具结果原文 · output/hook-observation.json（若有）· 轨迹里命令的真实退出码
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: >
      harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error）。
    evidence: CLI 输出中的 status 与 error.kind 分布
  - id: hr_parallel_results_all_delivered
    criterion: >
      同一回合发起的多个工具调用，其结果是否**全部**送达且与调用一一对应。判 fail：结果数少于调用数，或对应关系错乱。判 N-A：未出现同回合多调用。
    evidence: 同一 message_index 下的 toolCall 数 vs toolResult 数及其 toolCallId 对应
    locates: ★T4c 叶的机制专属项（通用条目判不到）
  - id: hr_parallel_call_ordering_stable
    criterion: >
      同回合多调用的结果与调用的对应关系是否稳定可辨（有 toolCallId 对应）。判 fail：无法对应。
    evidence: toolCall 与 toolResult 的 id 对应
    locates: ★T4c 机制专属
  - id: hr_parallel_failure_isolated
    criterion: >
      并行调用中某个失败是否影响其余。判 fail：一个失败导致其余结果丢失。判 N-A：未并行。
    evidence: 并行调用各自的返回
    locates: ★T4c 机制专属
  - id: hr_parallel_concurrency_declared
    criterion: >
      同回合可并行数是否有声明上限。判 fail：无声明且超出后静默丢弃。
    evidence: 工具/平台文档 + 实际行为
    locates: ★T4c 机制专属
