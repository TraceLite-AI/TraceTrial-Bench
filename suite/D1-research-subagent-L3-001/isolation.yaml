target:
  dimension: C
  subdimension: C2b
  claim: 材料量远超窗口时，顺序做会让后期角度的源文档被截断→引文失真；子代理给每个角度干净窗口。差额=该能力的增益
workflow_source:
  id: HB-D1
  name: 多角度技术调研
  retained_pattern: 读任务书 → 逐角度抓上游文档 → 提取事实+逐字引文 → 汇总
  removed_scaffolding: 不提示该派子代理、不提示材料装不下、不提示引文会失真
pressure:
  event: 5 份源文档合计 665KB，A5 一份 433KB；4 轮排期看板继续累积
  placement: 角度按顺序列出，后期角度天然承受更大上下文压力
  recovery: 文档可重抓（所以代价会落在引文保真而非覆盖率，见 F16）
controlled_factors:
  tool_interface: web fetch + 文件读写
  lifecycle: 7 轮同 session
  domain_reasoning: 全部来自 pinned 上游文档，无需领域知识
expected_behavior:
  strong_harness: 各角度引文均可逐字核验，无位置漂移
  weak_harness: 后期角度源文档被截断 → 引文失真或凭记忆编造
diagnostics:
  neutral_signals: fact_accuracy · **verbatim_quote_rate** · **late_vs_early_quote_drift** · spawn_count(前提量) · gw.log 压缩证据
arms:
  ON: 默认(sessions_spawn 可用)
  OFF: config_overrides tools.deny=["sessions_spawn","subagents","sessions_send"]
design_note: ★不赌锚定(K2 已证不 binding)，赌上下文容量(F14-F16 已证会咬人)。先验 spawn_count>0 再比结果。
