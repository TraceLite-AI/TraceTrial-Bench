# HR · trajectory / harness 引入的问题（判官层，7 条）
# 触发的机制: exec, fail, filler, plugin, timeout, tools
case: W01-monthend-close-L3-001
items:
  - id: hr_reached_task_end
    criterion: 会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束，导致任务没走完
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_exit_code_reaches_hook
    criterion: >
      非零退出码是否到达 after_tool_call hook 的可判别字段。判据看 output/hook-observation.json: 脚本以非零码退出时, result_exit_code 必须是该非零码。判 fail: 脚本非零退出而 result_exit_code 为 0 或 null。
    evidence: hook-observation.json 的 result_exit_code 字段 + 轨迹里该脚本的实际退出码
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_hook_error_field_populated
    criterion: >
      工具失败时 after_tool_call 的 error 字段是否被填充。判 fail: 工具确实失败(result_status=failed 或退出码非零) 而 hook_error_present=false / hook_error=null —— 按 error 判成败的 hook 消费方将完全看不到失败。
    evidence: hook-observation.json 的 hook_error_present / hook_error 字段
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_exit_code_value_preserved
    criterion: >
      退出码的**具体数值**是否保真到达模型（不是只给成功/失败二元）。判 fail：非零退出但模型只收到笼统失败、拿不到具体码。
    evidence: 工具结果原文里的退出码呈现
    locates: ★E1a 机制专属
  - id: hr_signal_death_distinguishable
    criterion: >
      被信号杀死与正常非零退出是否可区分。判 fail：两者呈现相同。判 N-A：本次无信号终止。
    evidence: 被杀与报错两类返回的对比
    locates: ★E1a 机制专属
  - id: hr_exit_code_not_masked_by_pipeline
    criterion: >
      命令串联（; && || |）时，模型看到的退出码是否对应它真正关心的那条命令。判 fail：退出码被管道末端覆盖且无提示。
    evidence: 命令原文 vs 返回的退出码
    locates: ★E1a 机制专属
