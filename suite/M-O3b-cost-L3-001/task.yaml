id: M-O3b-cost-L3-001
title: 任务成本归因（token 可见）
scenario:
  domain: 任务成本归因
  primary_subscenario: token 可见
  secondary_subscenarios:
    - 多轮长程
    - 真实业务材料
    - 交付物核对
harness:
  dimension: O
  subdimension: O3b
  subdimension_name: token 可见
intensity:
  level: L3
  description: 任务成本归因场景; 压 O3b token 可见; 中途注入 8 轮真实子步骤用量累积上下文。
budget:
  max_turns: 14
  max_tool_calls: 160
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: two_layer
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
