# HR · trajectory / harness 引入的问题（判官层，6 条）
# 触发的机制: filler, subagent
case: W06-ledger-audit-coord-L3-001
items:
  - id: hr_reached_task_end
    criterion: 会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束，导致任务没走完
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_child_result_complete
    criterion: >
      子任务的结果回到父任务时是否**完整**（不是只回一句成功/失败，而是带上父任务需要的内容）。判 fail：子任务返回内容缺失关键字段，父任务不得不重做。判 N-A：本次未派子任务。
    evidence: 轨迹里子任务调用的返回内容
    locates: ★L3c 叶的机制专属项（通用条目判不到）
  - id: hr_child_failure_surfaces
    criterion: >
      子任务失败时，失败信息是否回到父任务（而非只回一个空结果或成功）。判 fail：子任务失败而父任务收到的是成功/空。
    evidence: 子任务返回内容 vs 其实际执行结果
    locates: ★L3c 机制专属
  - id: hr_child_output_size_not_truncated
    criterion: >
      子任务返回内容是否因体积被截断而未标注。判 fail：子任务结果明显不完整且无截断提示。判 N-A：未派子任务。
    evidence: 子任务返回内容长度与结尾形态
    locates: ★L3c 机制专属
  - id: hr_child_count_matches_dispatch
    criterion: >
      实际回到父任务的子任务结果数是否等于派发数。判 fail：两者不符且无失败说明。判 N-A：未派子任务。
    evidence: 派发调用数 vs 返回数
    locates: ★L3c 机制专属
  - id: hr_child_identity_traceable
    criterion: >
      每个子任务结果能否对应回它是哪次派发（有可辨识的句柄/编号）。判 fail：结果无法归属。判 N-A：未派子任务。
    evidence: 派发与返回的对应关系
    locates: ★L3c 机制专属
