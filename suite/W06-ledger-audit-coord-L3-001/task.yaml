id: W06-ledger-audit-coord-L3-001
title: 台账审计协调（派出去的子任务结果必须回收）
scenario:
  domain: Workflow Automation
  primary_subscenario: 子代理结果聚合
  secondary_subscenarios:
    - 执行观察留档
    - 真实退出码核实
    - 审计可核对性
harness:
  dimension: L
  subdimension: L3c
  subdimension_name: 子代理结果聚合
intensity:
  level: L3
  description: 协调者派一个子任务后若提前收场, 子任务结果会被静默丢弃; 审计要求每个子任务都有结论。
budget:
  max_turns: 15
  max_tool_calls: 120
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: official_grader_plus_rr
  official_grader: verifier/wrap_meta.json → official_grader（原样 subprocess 调用，判据一行未改）
  official_semantics: checks 全过 = harness 行为正确; fail = 缺陷复现 = harness-attributable
  rr_semantics: 我们的 RR 层只判任务完成质量, 全二值, 不参与缺陷判定
  device_gates: 官方 checks 里名含 one_exec/present/evidence 的项挂了 → inconclusive
  determinism: full
  llm_judge: reserved
expected_outputs:
  - workspace/output/coord_report.md
  - workspace/output/coord_report.md
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-w06-ledger-audit-coord-l3-001:v1
  image_lock: runtime/image.lock.json
