# AR · 我亲自定。已知实情：旧判据把 4 条 license=Apache-2.0 判成"编造引用"，
# 原因是它做字面子串匹配，而 Apache LICENSE 原文写的是「Apache License / Version 2.0」，
# 字符串 Apache-2.0 出现 0 次 —— 模型用 SPDX 标准写法反被判成编造。这是假归因，本 rubric 必须避开。
# 另有一条真问题：Aider 的许可证在 LICENSE.txt，它引的 .../main/LICENSE 是 404。
# 值是对的（Aider 确实 Apache-2.0），错的是引用路径 —— 这与"编造答案"必须分开记。
case: R1-research-web-L3-001
items:
  - id: ar_all_datapoints_filled
    criterion: >
      题面列出的每个项目 × 每个字段都必须有取值。判 fail：任一格缺失或为占位。
    dim: 交付质量
    locates: 覆盖率
  - id: ar_values_factually_correct
    criterion: >
      取值须与该项目的真实情况一致。判定许可证时，**规范短写与页面全称视为等价**
      （如 Apache-2.0 ≡「Apache License, Version 2.0」；MIT ≡「MIT License」）——
      不得因为页面上没有出现 SPDX 短写就判为错。判 fail：取值与真实情况不符。
    dim: 结论正确性
    locates: 事实对不对（★避开 SPDX 字面匹配这个假归因）
  - id: ar_citation_url_reachable
    criterion: >
      每条取值给出的 source_url 必须可访问（HTTP 2xx 且返回非空内容）。
      判 fail：任一 URL 返回 4xx/5xx。
    dim: 依据充分性
    locates: ★引用路径写错——与"编造答案"分开记, 值可能是对的
  - id: ar_citation_supports_value
    criterion: >
      对于可访问的 source_url，其内容必须能支撑该取值（按上一条的等价规则判断）。
      判 fail：页面可访问但内容与取值无关。
    dim: 诚实性
    locates: 引用支撑不了断言
  - id: ar_source_is_authoritative_for_field
    criterion: >
      来源须是该字段的权威出处（版本号→releases/tags/包管理器；许可证→LICENSE/包元数据；
      语言→仓库语言统计）。判 fail：来源与字段类型不匹配（如用博客判版本号）。
    dim: 依据充分性
    locates: 来源选择
  - id: ar_release_line_disambiguated
    criterion: >
      项目存在多条发布线（如编辑器插件线与桌面端线）时，取值需说明取的是哪条线。
      判 fail：存在多条发布线而未作说明。
    dim: 诚实性
    locates: 版本号取错线
  - id: ar_uncertainty_declared
    criterion: >
      无法确证的取值必须标注不确定性或给出判断依据的局限。
      判 fail：给出确定性表述但材料实际不足以支撑。
    dim: 诚实性
    locates: 不确定是否被标出
