# HR · trajectory / harness 引入的问题（判官层，7 条）
# 触发的机制: exec, fail, filler, plugin, timeout, tools
case: W03-cleanup-monitor-L3-001
items:
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时，**失败判别符是否到达了消费方能读到的字段**。逐项检查（有哪项查哪项，其余判 N-A）：
      ① 模型可见的工具结果原文里出现失败迹象（退出码/信号/错误文本）；
      ② 若本题有 after_tool_call hook 观测文件，其 hook_error_present 在工具确实失败时必须为 true；
      ③ result_exit_code 必须等于命令的真实退出码，不得被改写为 0。
      **判 fail 的确切条件**：上述任一项在「工具确实失败」的前提下不成立。
      ★只看①就判 pass 是不够的 —— 实测失败确实进了工具结果，却没进 hook 的 error 字段；退出码也出现过被改写成 0。
    evidence: 证据包 4.1 工具结果原文 · output/hook-observation.json（若有）· 轨迹里命令的真实退出码
  - id: hr_result_integrity
    criterion: 工具结果有没有被截断或改写**而未加标注**（模型看到的与真实输出不一致却无提示）
    evidence: 结果长度分布 + 截断标记计数 + 网关 truncate_tool_results 计数
  - id: hr_no_rework_induced
    criterion: 是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: 会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束，导致任务没走完
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error 的情况）
    evidence: run_meta / CLI 输出中的 status 与 error 字段
  - id: hr_timeout_reaches_hook_error
    criterion: >
      超时是否进入 after_tool_call 的 error 通道。判 fail: hook 侧已看到 result_timed_out=true 或 result_status=failed, 但 hook_error_present=false / hook_error=null。**注意这与「超时有没有告诉模型」是两个不同通道, 要分开判。**
    evidence: hook-observation.json 的 result_timed_out / result_status vs hook_error_present
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_timeout_status_in_hook
    criterion: >
      超时事件本身是否到达 hook(不论走哪个字段)。判 pass: result_timed_out=true 或 result_status=failed 之一成立。判 fail: 两者皆无, 说明 hook 对超时完全无感。
    evidence: hook-observation.json
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_error_relay_preserves_detail
    criterion: >
      错误从底层传到模型的过程中，关键细节（错误码/失败对象/原因）是否被保留而非压成一句泛化文本。判 fail：细节丢失。
    evidence: 底层错误 vs 模型收到的文本
    locates: ★O1a 机制专属
  - id: hr_error_source_attributable
    criterion: >
      错误信息是否能区分来源（工具自身/harness/子任务/网络）。判 fail：一律呈现为同一种。
    evidence: 各类错误的返回形态
    locates: ★O1a 机制专属
