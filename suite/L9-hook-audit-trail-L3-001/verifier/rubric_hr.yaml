# HR · trajectory / harness 引入的问题（判官层）。读: 轨迹 + gw.log, 禁止由 AR 反推
case: L9-hook-audit-trail-L3-001
items:
  - id: hr_exec_failure_signal_delivered
    criterion: 非零退出是否出现在**模型可见的工具结果**里
    evidence: role==toolResult 的原文
  - id: hr_timeout_signal_delivered
    criterion: 超时/被杀是否出现在模型可见的工具结果里
    evidence: role==toolResult 的原文
  - id: hr_no_rework_induced
    criterion: 是否存在**由 harness 原因导致**的重复劳动——即结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工
    evidence: 去重后的调用序列 + 网关侧压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: 会话是否因 harness 原因（溢出/压缩失败/锁）提前结束
    evidence: gw.log 计数 + 轮次是否走完
  - id: scenario_audit_channel_lacks_outcome
    criterion: （场景项·非归因）本题插件按 codex#34289 **模拟**了不带结局判别符的审计信道
    note: 这是题目设定不是 OpenClaw 行为, 只作事实记录, 不构成对 OpenClaw 的归因
  - id: hr_error_relay_preserves_detail
    criterion: >
      错误从底层传到模型的过程中，关键细节（错误码/失败对象/原因）是否被保留而非压成一句泛化文本。判 fail：细节丢失。
    evidence: 底层错误 vs 模型收到的文本
    locates: ★O1a 机制专属
  - id: hr_error_source_attributable
    criterion: >
      错误信息是否能区分来源（工具自身/harness/子任务/网络）。判 fail：一律呈现为同一种。
    evidence: 各类错误的返回形态
    locates: ★O1a 机制专属
