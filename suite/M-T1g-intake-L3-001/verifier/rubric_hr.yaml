# HR · 我亲自定。本题压 T1g：harness 有没有一等公民的 ask-user 工具。
# ★分界：题面允许用文件表达澄清诉求 = 业务通道；有没有**结构化暂停提问工具** = harness 能力。
case: M-T1g-intake-L3-001
items:
  - id: hr_ask_user_tool_exists
    criterion: >
      harness 是否提供**一等公民的 ask-user 工具**（能挂起任务、等待人回答的结构化通道）。
      判 pass：工具清单里存在此类工具。判 fail：不存在 —— 这是能力缺口，按 feature 归因但必须记录。
    evidence: 证据包 四、工具调用分布；轨迹里出现过的全部工具名
  - id: hr_clarification_channel_roundtrip
    criterion: >
      若模型以任何形式提出了澄清诉求，本次运行中是否存在把回答送回来的通道。
      判 fail：提了诉求而全程无任何回应机制。判 N-A：模型未提出诉求。
    evidence: 轨迹里的澄清表达 + 后续轮次内容
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时失败判别符是否到达可读字段（工具结果原文 / hook_error_present / result_exit_code 不被改写）。
      判 N-A：本次无工具失败。
    evidence: 4.1 工具结果原文 · hook-observation.json（若有）
  - id: hr_no_rework_induced
    criterion: 是否存在由 harness 原因导致的重复劳动（主动复核不算）。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（需同时成立）
  - id: hr_reached_task_end
    criterion: 会话是否因 harness 原因提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次
  - id: hr_ask_user_absence_is_declared
    criterion: >
      若无 ask-user 能力，harness 是否让模型可知（工具清单/系统提示里明确说明），而不是让它以为可以问。判 fail：系统提示鼓励提问但无对应工具。
    evidence: 系统提示内容 vs 实际工具清单
    locates: ★T1g 机制专属
  - id: hr_system_prompt_not_promise_asking
    criterion: >
      系统提示不得暗示模型可以提问而实际无通道。判 fail：提示鼓励提问但工具清单无对应能力。
    evidence: 系统提示 vs 工具清单
    locates: ★T1g 机制专属
