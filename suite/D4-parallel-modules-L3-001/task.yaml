id: D4-parallel-modules-L3-001
title: IT-88 四模块并行实现 + 跨模块不变量（默认臂）
scenario:
  domain: Vibe Coding
  primary_subscenario: 多模块并行实现
  secondary_subscenarios:
    - 共享结构约束
    - 集成一致性
    - 规格留白处的各自发挥
harness:
  dimension: L
  subdimension: L3c
  subdimension_name: 子代理分治 × 集成一致性
