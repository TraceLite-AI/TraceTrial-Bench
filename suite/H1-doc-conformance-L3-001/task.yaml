id: H1-doc-conformance-L3-001
title: Python 3.13 升级：按上游官方文档做 services/ 一致性整改
scenario:
  domain: Workflow Automation
  primary_subscenario: 运行时升级整改
  secondary_subscenarios:
    - 上游文档核查
    - 批量代码修改
    - 保留项判断
    - 依据引用
harness:
  dimension: C
  subdimension: C2b
  subdimension_name: 上下文压缩保真（web 通道）
intensity:
  level: L3
  description: 权威判据只存在于上游 web 文档(PEP594 70KB + whatsnew 443KB, 不可 grep 本地); 32 模块里 17 需改、10 官方保留不得动。
budget:
  max_turns: 14
  max_tool_calls: 220
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: two_layer
  graded_object: "**services/ 下文件实际内容**"
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
  rr_semantics: 全二值; 漏改与改过头双向扣分
  no_scalar_score: 不输出加权总分
  determinism: full
  llm_judge: reserved
expected_outputs:
  - workspace/services/*.py（被修改）
  - workspace/output/conformance_report.md
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-h1-doc-conformance-l3-001:v1
  image_lock: runtime/image.lock.json
