target:
  dimension: C
  subdimension: C2b
  claim: 判据只能经 web 通道进入上下文, 无法卸载到磁盘 grep; 压缩若摘掉文档细节, 会同时表现为漏改与误改。
workflow_source:
  id: HB-H1
  name: 运行时升级一致性整改
  retained_pattern: 读工单 → 抓上游文档 → 逐模块判定 → 真改文件 → 自查 → 写带依据的报告
  removed_scaffolding: 不给移除清单, 不说哪些是保留项
pressure:
  event: 上游文档同页混列「已移除」与「仅废弃但保留」, 抓进来 100K+ token 后被压缩
  placement: 5 轮值班记录继续累积
  recovery: 文档可重抓; 自查脚本只查漏改不查过头
controlled_factors:
  tool_interface: web fetch + 文件读写 + exec
  lifecycle: 8 轮同 session
  domain_reasoning: 公开权威文档, 无需领域知识
expected_behavior:
  strong_harness: 文档要点活到最后, 漏改 0 且误改 0
  weak_harness: 压缩摘掉「保留但废弃」的区分 → 把 optparse/ftplib 等一并改掉, 或漏掉尾部移除项
diagnostics:
  neutral_signals: 漏改数 · 误改数 · 语法/签名完整 · 自查 rc · 文档引用数
github_basis: PEP 594 / whatsnew 3.12·3.13 为真实上游判据; 压缩链条对应 openai/codex#14589（压缩丢工具输出只留摘要）
design_note: ★自查脚本只能查出「漏改」, 查不出「改过头」—— 保留项判断必须来自文档理解, 不能靠工具兜底。
