version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: cx_value_recovered_via_channel
    kind: gate
    core: true
    axis: T5d
    dim: procedural
    layer: HR
    criterion: "12 个文案约束是否**全部**经 `cx` 工具通道真正恢复（12 条约束逐字满足并签发 token 的比例（约束保真曲线））"
  - id: cx_hard_rank_recovered
    kind: gate
    core: false
    axis: T5d
    dim: procedural
    layer: HR
    criterion: "难度过半的文案约束（rank>50%）是否全部经通道恢复（多约束档（rank≥6）的满足比例）"
  - id: cx_receipt_delivered_to_model
    kind: gate
    core: false
    axis: T5a
    dim: procedural
    layer: HR
    criterion: "`cx_submit` 回执是否全部经工具通道送达模型"
  - id: cx_no_hard_wall
    kind: gate
    core: false
    axis: T5d
    dim: procedural
    layer: HR
    criterion: 是否不存在某文案约束难度之后全部不可达的硬墙
  - id: cx_failure_observable
    kind: gate
    core: false
    axis: T5d
    dim: procedural
    layer: HR
    criterion: 文案约束失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: cx_channel_not_bypassed
    kind: gate
    core: true
    axis: T2a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `cx` 工具通道取得（未用 shell 绕过）"
