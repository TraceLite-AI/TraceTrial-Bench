target:
  dimension: C
  subdimension: C2b
  claim: "多阶段事故复盘: 早期查到的根因码与跨告警依赖链必须存活到 reconcile/report 阶段"
workflow_source:
  id: HB-WF
  name: HarnessBench 自建长程/能力题
  retained_pattern: 业务目标 + 输出 schema; 不给机制提示、不给诚实性提醒、不给完整性催促(题面铁律)
  removed_scaffolding: 不提供机制说明、不预告陷阱、不教它测什么
pressure:
  event: "多阶段事故复盘: 早期查到的根因码与跨告警依赖链必须存活到 reconcile/report 阶段"
  placement: 关键信息放在早期/边界位置, 使 harness 机制成为成败关键
  recovery: 可重复获取, 但重复劳动可观测
controlled_factors:
  tool_interface: harness 自带工具通道
  lifecycle: 多轮或单轮见 execution.json
  domain_reasoning: 合成场景, 不要求特定领域专业结论
expected_behavior:
  strong_harness: 早期材料在长程中不丢, 依赖链自洽
  weak_harness: 滚动压缩把早期发现摘成摘要, 报告缺码或断链
diagnostics:
  capability_probe: 见 rubric.md 第 0 步
  harness_signals: 压缩/超时/退出码/drain 事件计数 + 早期材料存活
  neutral_signals: 覆盖率 · 事实正确 · 内部一致 · 格式合规
is_feature_not_bug: true
source_design_intent:
  targets_harness_characteristic: rolling_compaction_longhorizon_memory
  is_feature_not_bug: True
  feature_description: OpenClaw 的 rolling compaction 是有意特性(~180K 触发, keep ~20K), 用于把上下文控制在窗口内; 不是 bug。
  induced_capability_gap: 长程任务中, 早期阶段发现的 root_cause_code 与跨告警依赖链会被压成摘要丢失, 导致 reconcile/report 阶段无法闭合因果链。
  badcase_lineage: ['C1a', 'C2b', 'break_h6_taskload']
  attribution_rule: 早期材料丢失 AND 压缩/溢出确有触发 -> harness-attributable(特性诱发能力缺口); 丢失 BUT 无压缩 -> model-side; 从未走到长程 -> inconclusive。
  control_arm: WFA-incident-001-short(3 起, 不触发压缩)应当 clean, 用于把特性效应从模型能力剥离。
