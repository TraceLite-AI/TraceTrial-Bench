# HR · 我亲自定。本题压的是**未决/超时批次的结果回流**。
case: M-L3a-settle-L3-001
items:
  - id: hr_pending_results_surfaced
    criterion: >
      发出去但未即时返回的批次，其结果最终有没有回到模型（有回执且时点可辨）。
      判 fail：轨迹显示某批次被发起后既无成功回执也无失败/超时信号，静默消失。
    evidence: 轨迹里每个批次的发起调用与其对应返回；工具结果原文
  - id: hr_timeout_signal_delivered
    criterion: >
      超时事件是否以可识别形式到达模型（超时文本/信号/被杀迹象），而不是返回一个看似正常的空结果。
      判 fail：批次实际超时而工具结果无任何超时迹象。判 N-A：本次无超时。
    evidence: 证据包 4.1 工具结果原文
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时失败判别符是否到达可读字段：① 工具结果原文有失败迹象；
      ② 若有 hook 观测文件，hook_error_present 在失败时须为 true；③ result_exit_code 不得被改写为 0。
      判 fail：任一项在「确实失败」的前提下不成立。
    evidence: 4.1 工具结果原文 · hook-observation.json（若有）· 真实退出码
  - id: hr_no_rework_induced
    criterion: >
      是否存在由 harness 原因（结果丢失/压缩/工具不可见）导致的重复劳动。模型主动复核不算。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（需同时成立）
  - id: hr_reached_task_end
    criterion: 会话是否因 harness 原因提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次
  - id: hr_status_consistent
    criterion: 顶层 status 与内部 error 是否一致。
    evidence: CLI 输出的 status 与 error.kind 分布
  - id: hr_spawn_capability_present
    criterion: >
      harness 是否提供可用的子代理派生能力（不只是列出工具名，而是实际可调用并返回结果）。判 fail：工具清单里无派生工具，或有工具名但调用不可用。
    evidence: 工具调用分布 + plugin_inspect 的工具清单 + 实际调用返回
    locates: ★L3a 叶的机制专属项（通用条目判不到）
  - id: hr_spawn_result_addressable
    criterion: >
      派生出的子任务是否有可寻址的句柄，使父任务能查询其状态/结果。判 fail：派生后无法查询。判 N-A：未派生。
    evidence: 派生调用的返回 + 后续查询能力
    locates: ★L3a 机制专属
  - id: hr_spawn_depth_bounded
    criterion: >
      派生深度是否有界。判 fail：无限制。判 N-A：未派生。
    evidence: 派生层级
    locates: ★L3a 机制专属
  - id: hr_spawn_failure_reported
    criterion: >
      派生失败时原因是否回传。判 fail：只知失败不知原因。判 N-A：未派生。
    evidence: 派生失败的返回
    locates: ★L3a 机制专属
