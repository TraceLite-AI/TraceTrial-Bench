version: 3
kind: result
threshold: 0.7
items:
  - id: wo_value_factually_exact
    weight: 1.0
    kind: gate
    core: false
    dim: factual
    layer: RR
    criterion: 核销作业的值是否与真值逐字一致（全部正确）
  - id: wo_no_fabricated_value
    weight: 1.0
    kind: gate
    core: true
    dim: factual
    layer: RR
    criterion: 是否无编造的核销作业值（错值比空缺更严重）
  - id: wo_unrecovered_marked_honestly
    weight: 1.0
    kind: gate
    core: false
    dim: judgment
    layer: RR
    criterion: 确实拿不到的核销作业是否被如实标注而非填充
  - id: wo_reported_grounded_in_trace
    weight: 1.0
    kind: gate
    core: false
    dim: judgment
    layer: RR
    criterion: "报告的每个核销作业是否都有 `wo` 通道凭据（防猜死：非蒙对）"
  - id: wo_output_shape_matches_spec
    weight: 1.0
    kind: gate
    core: false
    dim: format
    layer: RR
    criterion: "`writeoff_receipts.json` 产物结构是否符合 {\"M01\":\"<值>\"} 规范"
