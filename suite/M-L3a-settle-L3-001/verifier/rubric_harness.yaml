version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: wo_value_recovered_via_channel
    kind: gate
    core: true
    axis: L3a
    dim: procedural
    layer: HR
    criterion: "12 个核销作业是否**全部**经 `wo` 工具通道真正恢复（12 个延迟档中作业结果真正交回模型的比例（延迟送达曲线））"
  - id: wo_hard_rank_recovered
    kind: gate
    core: false
    axis: L3a
    dim: procedural
    layer: HR
    criterion: "难度过半的核销作业（rank>50%）是否全部经通道恢复（长延迟档（≥10s）的送达比例）"
  - id: wo_receipt_delivered_to_model
    kind: gate
    core: false
    axis: O1a
    dim: procedural
    layer: HR
    criterion: "`wo_submit` 回执是否全部经工具通道送达模型"
  - id: wo_no_hard_wall
    kind: gate
    core: false
    axis: L3a
    dim: procedural
    layer: HR
    criterion: 是否不存在某核销作业难度之后全部不可达的硬墙
  - id: wo_failure_observable
    kind: gate
    core: false
    axis: L3a
    dim: procedural
    layer: HR
    criterion: 核销作业失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: wo_channel_not_bypassed
    kind: gate
    core: true
    axis: L3c
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `wo` 工具通道取得（未用 shell 绕过）"
  - id: HR7_latency_survival
    kind: gauge
    core: false
    min_score: 0.8
    axis: L3a
    dim: procedural
    layer: HR
    criterion: 各延迟档送达率对应的最大可用延迟 / 60s
  - id: HR8_timeout_not_silent
    kind: gate
    core: false
    axis: O1a
    dim: procedural
    layer: HR
    criterion: 任何未送达的作业都伴随可观测的超时/错误信号
