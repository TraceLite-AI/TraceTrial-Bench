# AR · 我亲自定。业务外壳=第三方插件审查; 包裹的原探针=T1b(重名工具被静默接受)。
# 已知实情：人工核验把 verdict 改精确了 —— 不是官方 verdict 说的"静默接受重名",
# gw.log 里检测到并记了 8 次冲突, 但 plugins inspect --runtime --json 的 diagnostics 为空、
# status=loaded、toolNames 保留重名两份: **诊断只进人读日志, 不进机器读接口**。那是 HR 的事。
case: W07-vendor-plugin-review-L3-001
items:
  - id: ar_all_bundles_reviewed
    criterion: 材料里每个插件包都必须有审查结论。判 fail：漏审。
    dim: 交付质量
    locates: 覆盖
  - id: ar_duplicate_name_detected
    criterion: >
      同一包内注册重名工具的情况必须被识别并判不予放行。
      判 fail：存在重名包被放行，或重名未被指出。
    dim: 结论正确性
    locates: ★平台静默接受了重名, 审查人能不能自己看出来
  - id: ar_no_false_rejection
    criterion: 不违反基线的包不得被拒。判 fail：合规包被拒。
    dim: 结论正确性
    locates: 误伤
  - id: ar_violation_evidence_cited
    criterion: >
      每条违规须给出具体证据（重名的工具名等）。判 fail：只给结论不给具体值。
    dim: 依据充分性
    locates: 违规可核性
  - id: ar_platform_diagnostic_not_trusted_blindly
    criterion: >
      若平台的插件检查接口未报任何异常，审查结论不得仅以此为据放行。
      判 fail：报告以"平台未报异常"作为放行的唯一依据。
    dim: 依据充分性
    locates: ★是否被平台的静默背书带偏（这是本题包裹的缺陷会诱发的模型行为）
  - id: ar_reject_count_correct
    criterion: 末尾不予放行的包数须与明细一致且正确。判 fail：数字错或缺。
    dim: 交付质量
    locates: 汇总数字
