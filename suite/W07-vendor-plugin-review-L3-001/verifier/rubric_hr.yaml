# HR · trajectory / harness 引入的问题（判官层，7 条）
# 触发的机制: async, filler, pending, plugin, tools
case: W07-vendor-plugin-review-L3-001
items:
  - id: hr_pending_results_surfaced
    criterion: 未决任务/子任务的结果有没有回到父任务（有回执且时点正确）
    evidence: 轨迹里的回执及其位置
  - id: hr_no_rework_induced
    criterion: 是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_tool_availability_stable
    criterion: 工具在整个会话里是否稳定可见可用（没有中途消失、没有静默丢工具）
    evidence: 工具调用分布 + 是否出现 no such tool 类错误
  - id: hr_reached_task_end
    criterion: 会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束，导致任务没走完
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error 的情况）
    evidence: run_meta / CLI 输出中的 status 与 error 字段
  - id: hr_duplicate_tool_name_diagnosed
    criterion: >
      插件注册重名工具时, 平台的**机器可读接口**是否报出诊断。判据看 run/plugin_inspect.stdout.json: 存在重名注册时, diagnostics 数组必须非空。判 fail: 确有重名而 diagnostics 为空、status 仍为 loaded。
    evidence: run/plugin_inspect.stdout.json 的 diagnostics / status / toolNames
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_duplicate_names_not_silently_kept
    criterion: >
      重名工具是否被静默保留在工具清单里。判 fail: plugin_inspect 的 toolNames 中同一名字出现两次以上, 且无任何冲突标记。
    evidence: run/plugin_inspect.stdout.json 的 toolNames
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_invalid_tool_name_blocked_at_load
    criterion: >
      不合规工具名（重名/保留名/超长）是否在**加载期**就被拦下，而非等到调用时才出问题。判 fail：加载成功、调用时才失败或静默生效。
    evidence: plugin_inspect 的 status/diagnostics + 首次调用的返回
    locates: ★T1d 机制专属
  - id: hr_reserved_name_rejected
    criterion: >
      占用平台保留名的工具是否被拒。判 fail：被接受并可能劫持平台工具。判 N-A：本次无保留名冲突。
    evidence: plugin_inspect 的 toolNames 与 diagnostics
    locates: ★T1d 机制专属
