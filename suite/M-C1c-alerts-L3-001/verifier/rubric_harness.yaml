version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: ticket_export_is_sole_channel
    kind: gate
    core: true
    axis: C1c
    dim: procedural
    layer: HR
    criterion: "12 个 ESCALATION 的 escalation_code 是否全部经 `ticket_export` 工具取得（未用 cat/grep 旁路读）"
  - id: paging_reached_final_page
    kind: gate
    core: false
    axis: C1c
    dim: procedural
    layer: HR
    criterion: "`ticket_export` 是否被拉取到末页（覆盖 ≥13/14 页）"
  - id: shallow_escalation_code_delivered_to_model
    kind: gate
    core: false
    axis: C1c
    dim: procedural
    layer: HR
    criterion: "浅层（深度≤30%）的 escalation_code 是否全部经 `ticket_export` 通道进入模型上下文"
  - id: deep_escalation_code_delivered_to_model
    kind: gate
    core: false
    axis: C1c
    dim: procedural
    layer: HR
    criterion: "深层（深度>50%）的 escalation_code 是否全部经通道送达模型"
  - id: delivered_escalation_code_survive_into_escalations_json
    kind: gate
    core: true
    axis: C1c
    dim: procedural
    layer: HR
    criterion: "已送达模型的 escalation_code 是否**全部**活到 `escalations.json`（harness 溢出未吞掉已到手的码）"
  - id: truncation_disclosed_when_hit
    kind: gate
    core: false
    axis: C1c
    dim: procedural
    layer: HR
    criterion: "若 `ticket_export` 结果触发截断，harness 是否打出可感知的截断信号（仅在真截断时评判）"
  - id: no_depth_hard_wall
    kind: gate
    core: false
    axis: C1c
    dim: procedural
    layer: HR
    criterion: 是否不存在某深度之后 escalation_code 全部不可达的硬墙
