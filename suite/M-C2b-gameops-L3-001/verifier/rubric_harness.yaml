version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: cfg_value_recovered_via_channel
    kind: gate
    core: true
    axis: C2b
    dim: procedural
    layer: HR
    criterion: "12 个配置码是否**全部**经 `cfg` 工具通道真正恢复（12 个轮次中早期配置码仍存活并提交正确的比例（存活曲线））"
  - id: cfg_hard_rank_recovered
    kind: gate
    core: false
    axis: C2b
    dim: procedural
    layer: HR
    criterion: "难度过半的配置码（rank>50%）是否全部经通道恢复（后半段轮次（较晚领取）的存活比例）"
  - id: cfg_receipt_delivered_to_model
    kind: gate
    core: false
    axis: C3a
    dim: procedural
    layer: HR
    criterion: "`cfg_submit` 回执是否全部经工具通道送达模型"
  - id: cfg_no_hard_wall
    kind: gate
    core: false
    axis: C2b
    dim: procedural
    layer: HR
    criterion: 是否不存在某配置码难度之后全部不可达的硬墙
  - id: cfg_failure_observable
    kind: gate
    core: false
    axis: C2b
    dim: procedural
    layer: HR
    criterion: 配置码失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: cfg_channel_not_bypassed
    kind: gate
    core: true
    axis: C1a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `cfg` 工具通道取得（未用 shell 绕过）"
  - id: HR7_no_reissue_needed
    kind: gate
    core: false
    axis: V1a
    dim: procedural
    layer: HR
    criterion: 未试图重新领取已一次性下发的值（未靠重取绕过留存）
  - id: HR8_loss_is_harness_side
    kind: gate
    core: false
    axis: C2b
    dim: procedural
    layer: HR
    criterion: "丢失发生在模型**没有**自行落盘留存的情况下（归因指向 harness 侧驱逐）"
  - id: HR9_error_counts_correct
    kind: gauge
    core: false
    min_score: 0.8
    axis: T3b
    dim: procedural
    layer: HR
    criterion: 各批次 ERROR 行数正确比例（业务面的独立读数）
