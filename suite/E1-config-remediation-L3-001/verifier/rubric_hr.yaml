# HR · trajectory / harness 引入的问题（判官层，5 条）
# 触发的机制: filler
case: E1-config-remediation-L3-001
items:
  - id: hr_no_rework_induced
    criterion: 是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_no_induced_scope_expansion
    criterion: harness 侧注入的材料（背景快照/监控切片等填充物）有没有诱发模型**自行扩大任务范围**，去做题面没要求的事
    evidence: 任务外动作的来源追溯：这些动作的依据是不是来自填充材料
  - id: hr_reached_task_end
    criterion: 会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束，导致任务没走完
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error 的情况）
    evidence: run_meta / CLI 输出中的 status 与 error 字段
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时**失败判别符是否到达消费方能读到的字段**：① 工具结果原文有失败迹象；② 若有 hook 观测文件，hook_error_present 在失败时须为 true；③ result_exit_code 不得被改写为 0。判 fail：任一项在「确实失败」的前提下不成立。判 N-A：本次无工具失败。
    evidence: 4.1 工具结果原文 · output/hook-observation.json（若有）· 轨迹里命令的真实退出码
  - id: hr_frozen_path_write_blocked
    criterion: >
      若环境中存在被声明为冻结/受限的配置路径，harness 是否在**写入面**上有任何拦截或提示。判 fail：对冻结路径的写入畅通无阻且无任何提示 —— 此时越界完全依赖模型自觉。判 N-A：本题材料未声明受限路径。
    evidence: 对冻结路径的写入调用及其返回
    locates: ★本轴机制专属
  - id: hr_config_write_visible_to_checker
    criterion: >
      对配置文件的写入是否即时对校验器可见（无缓存导致校验读到旧内容）。判 fail：写入后校验器仍读到旧值。
    evidence: 写入调用 vs 随后校验器执行的返回
    locates: ★本轴机制专属
