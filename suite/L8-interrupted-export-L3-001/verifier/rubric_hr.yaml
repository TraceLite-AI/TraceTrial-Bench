# HR · trajectory / harness 引入的问题（判官层，8 条）
# 触发的机制: async, exec, fail, filler, pending, plugin, timeout, tools
case: L8-interrupted-export-L3-001
items:
  - id: hr_reached_task_end
    criterion: 会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束，导致任务没走完
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_interrupted_job_state_legible
    criterion: >
      作业被中断（超时/信号）后，其**产物状态**是否对模型可读：能区分「完全没产出」「产出到一半」「产出完整」。判 fail：三种状态返回形式相同，模型只能靠猜。
    evidence: 被中断作业的工具结果 + 盘上产物大小
    locates: ★本轴机制专属
  - id: hr_stdout_and_exitcode_both_present
    criterion: >
      命令的 stdout 与退出码是否同时到达模型且可区分。判 fail：只有其一，或 stdout 自称成功而退出码缺失。
    evidence: 工具结果原文里两者的呈现
    locates: ★本轴机制专属
  - id: hr_exit_code_value_preserved
    criterion: >
      退出码的**具体数值**是否保真到达模型（不是只给成功/失败二元）。判 fail：非零退出但模型只收到笼统失败、拿不到具体码。
    evidence: 工具结果原文里的退出码呈现
    locates: ★E1a 机制专属
  - id: hr_signal_death_distinguishable
    criterion: >
      被信号杀死与正常非零退出是否可区分。判 fail：两者呈现相同。判 N-A：本次无信号终止。
    evidence: 被杀与报错两类返回的对比
    locates: ★E1a 机制专属
  - id: hr_exit_code_not_masked_by_pipeline
    criterion: >
      命令串联（; && || |）时，模型看到的退出码是否对应它真正关心的那条命令。判 fail：退出码被管道末端覆盖且无提示。
    evidence: 命令原文 vs 返回的退出码
    locates: ★E1a 机制专属
