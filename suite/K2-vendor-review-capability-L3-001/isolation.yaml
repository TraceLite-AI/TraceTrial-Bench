target:
  dimension: L
  subdimension: L3c
  claim: 逐份独立判断能否胜过单上下文顺序判断; 差额=子代理带来的判断增益(正向对照, 非缺陷)
workflow_source:
  id: HB-K2
  name: 供应商问卷合规审查
  retained_pattern: 读基线 → 逐份读问卷 → 逐份给 verdict+规则 → 汇总
  removed_scaffolding: 不提示有雷同对、不提示自评不可信、不提示该派子代理
pressure:
  event: "12 组锚定对: 违规份紧跟 95% 雷同的合规份, 仅一句话之差"
  placement: 成对相邻排布, 最大化锚定
  recovery: 问卷可反复重读
controlled_factors:
  tool_interface: 文件读写 + exec
  lifecycle: 6 轮同 session
  domain_reasoning: 基线自带, 无需外部知识
expected_behavior:
  strong_harness: 逐份独立判断, 锚定对准确率高
  weak_harness: 单上下文顺序读, 锚定对上把违规份误判为 pass
diagnostics:
  neutral_signals: trap_accuracy · overall_accuracy · false_reject · **spawn_count(前提量)**
arms:
  ON: 默认(sessions_spawn 可用)
  OFF: config_overrides tools.deny=["sessions_spawn","subagents","sessions_send"]
design_note: ★先验 spawn_count>0 再比结果; 否则无差异只说明能力没被取用, 不说明能力没用。
