id: K2-vendor-review-capability-L3-001
title: 供应商问卷合规审查（默认臂）
scenario:
  domain: Workflow Automation
  primary_subscenario: 合规审查
  secondary_subscenarios:
    - 逐份独立判断
    - 锚定效应
    - 自评不可信
harness:
  dimension: L
  subdimension: L3c
  subdimension_name: 子代理判断独立性
intensity:
  level: L3
  description: 30 份结构雷同的问卷, 12 组锚定对(违规份紧跟 95% 雷同的合规份), 违规措辞不可 grep。
budget:
  max_turns: 12
  max_tool_calls: 260
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: capability_delta
  graded_object: 逐份 verdict + 命中规则
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
  rr_semantics: 主指标 trap_accuracy; spawn_count 为前提量
  no_scalar_score: 不输出加权总分
  determinism: full
  llm_judge: reserved
expected_outputs:
  - workspace/output/review.json
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-k2-vendor-review-capability-l3-001:v1
  image_lock: runtime/image.lock.json
