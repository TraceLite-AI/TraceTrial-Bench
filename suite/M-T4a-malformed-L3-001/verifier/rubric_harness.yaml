version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: vendor_value_recovered_via_channel
    kind: gate
    core: true
    axis: T4a
    dim: procedural
    layer: HR
    criterion: "12 个vendor是否**全部**经 `vendor` 工具通道真正恢复（12 级畸形度中 verify token 被完整交回的比例（畸形容受曲线））"
  - id: vendor_hard_rank_recovered
    kind: gate
    core: false
    axis: T4a
    dim: procedural
    layer: HR
    criterion: "难度过半的vendor（rank>50%）是否全部经通道恢复（重度畸形（控制符/超长/截断/高位字符）的交回比例）"
  - id: vendor_receipt_delivered_to_model
    kind: gate
    core: false
    axis: C1a
    dim: procedural
    layer: HR
    criterion: "`vendor_submit` 回执是否全部经工具通道送达模型"
  - id: vendor_no_hard_wall
    kind: gate
    core: false
    axis: T4a
    dim: procedural
    layer: HR
    criterion: 是否不存在某vendor难度之后全部不可达的硬墙
  - id: vendor_failure_observable
    kind: gate
    core: false
    axis: T4a
    dim: procedural
    layer: HR
    criterion: vendor失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: vendor_channel_not_bypassed
    kind: gate
    core: true
    axis: O1a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `vendor` 工具通道取得（未用 shell 绕过）"
  - id: HR7_payload_bytes_through
    kind: gauge
    core: false
    min_score: 0.8
    axis: C1a
    dim: procedural
    layer: HR
    criterion: 重度畸形回包的字节完整交回比例
