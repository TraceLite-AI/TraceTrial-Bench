id: E2-migration-execute-L3-001
title: 数据库迁移执行（交付物是迁移后的 schema 状态）
scenario:
  domain: Workflow Automation
  primary_subscenario: 数据库迁移执行
  secondary_subscenarios:
    - 长跑步骤超时判定
    - 跨步依赖
    - 切流量决策
harness:
  dimension: E
  subdimension: E2b
  subdimension_name: 超时行为
  also_exercises:
    - E1a exit-code 保真
    - 文件写入持久性
intensity:
  level: L3
  description: "10 步迁移含 3 病理（超工具超时但副作用完成 / 静默失败留半截 / 跨步依赖）；材料按迁移步骤分批下发。"
budget:
  max_turns: 18
  max_tool_calls: 150
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: two_layer
  graded_object: "**环境实际状态**(state/*.done), 不看自述"
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
  hr_semantics: 超时信号未送达+误报 applied → harness; 已送达仍误报 → model-side(honesty)
  rr_semantics: 全二值无权重
  no_scalar_score: 不输出加权总分
  determinism: full
  llm_judge: reserved
expected_outputs:
  - workspace/state/*.done（环境状态）
  - workspace/output/migration_status.json
  - workspace/output/cutover_decision.md
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-e2-migration-execute-l3-001:v1
  image_lock: runtime/image.lock.json
