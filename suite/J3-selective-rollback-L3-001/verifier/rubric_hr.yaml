# HR · trajectory / harness 引入的问题（判官层，5 条）
# 触发的机制: filler
case: J3-selective-rollback-L3-001
items:
  - id: hr_no_rework_induced
    criterion: 是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: 会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束，导致任务没走完
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error 的情况）
    evidence: run_meta / CLI 输出中的 status 与 error 字段
  - id: hr_rollback_state_consistent
    criterion: >
      回滚/检查点操作后，harness 侧状态与盘上实际状态是否一致（不存在「报告已回滚但文件未变」或反之）。判 fail：两者不一致。判 N-A：本次无回滚。
    evidence: 回滚相关工具的返回 vs 盘上文件实际内容
    locates: ★L5c 叶的机制专属项（通用条目判不到）
  - id: hr_checkpoint_covers_all_touched
    criterion: >
      检查点/备份是否覆盖了本次会改动的全部对象。判 fail：存在被改动但未纳入检查点的对象。
    evidence: 检查点内容 vs 实际改动的文件集合
    locates: ★L5c 机制专属
  - id: hr_rollback_is_atomic
    criterion: >
      回滚是否原子（不存在回滚到一半的中间态）。判 fail：出现部分回滚。
    evidence: 回滚后各对象的状态
    locates: ★L5c 机制专属
  - id: hr_checkpoint_restorable
    criterion: >
      检查点是否真的可用于恢复（不只是备份文件存在）。判 fail：恢复操作失败或结果不符。
    evidence: 恢复操作的实际结果
    locates: ★L5c 机制专属
  - id: hr_rollback_reported_matches_disk
    criterion: >
      harness 报告的回滚结果与盘上实际是否一致。判 fail：不一致。
    evidence: 回滚返回 vs 盘上内容
    locates: ★L5c 机制专属
