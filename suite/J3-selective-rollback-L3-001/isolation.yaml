target:
  dimension: L
  subdimension: L5c
  claim: 回滚必须精确到致故改动; 同批次正常生效的改动不得被一并退回。
workflow_source:
  id: HB-J3
  name: 事故回滚(精确性判断型)
  retained_pattern: 读事故记录 → 把症状映射到改动 → 逐个回滚 → 自查 → 写说明
  removed_scaffolding: "不提示哪 6 个坏(事故记录只给症状: 舍入异常/含税口径/折扣超额), 要自己映射"
pressure:
  event: 18 个改动混在一起, 备份是整文件级的 —— 全量恢复最省事但会退掉 12 个好改动
  placement: 中途 6 轮监控累积上下文
  recovery: backup/ 有发布前版本; 自查脚本检坏值
controlled_factors:
  tool_interface: 原生文件读写 + exec
  lifecycle: 9 轮同 session
  domain_reasoning: 合成配置
expected_behavior:
  strong_harness: 文件写入可靠, agent 能按症状精确定位
  weak_harness: 图省事全量回滚 → 12 个好改动被退掉
diagnostics:
  neutral_signals: 坏改动是否全回滚 · 好改动是否被误退 · 自查 · 保留项是否说明
design_note: ★最省事的解法(全量回滚)恰恰是错的, 考的是精确性。
