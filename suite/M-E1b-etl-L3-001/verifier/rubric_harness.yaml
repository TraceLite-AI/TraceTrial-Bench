version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: nightly_log_is_sole_channel
    kind: gate
    core: true
    axis: E1b
    dim: procedural
    layer: HR
    criterion: "12 个 FATAL_error 的 verification_code 是否全部经 `nightly_log` 工具取得（未用 cat/grep 旁路读）"
  - id: paging_reached_final_page
    kind: gate
    core: false
    axis: E1b
    dim: procedural
    layer: HR
    criterion: "`nightly_log` 是否被拉取到末页（覆盖 ≥9/10 页）"
  - id: shallow_verification_code_delivered_to_model
    kind: gate
    core: false
    axis: E1b
    dim: procedural
    layer: HR
    criterion: "浅层（深度≤30%）的 verification_code 是否全部经 `nightly_log` 通道进入模型上下文"
  - id: deep_verification_code_delivered_to_model
    kind: gate
    core: false
    axis: E1b
    dim: procedural
    layer: HR
    criterion: "深层（深度>50%）的 verification_code 是否全部经通道送达模型"
  - id: delivered_verification_code_survive_into_defects_json
    kind: gate
    core: true
    axis: E1b
    dim: procedural
    layer: HR
    criterion: "已送达模型的 verification_code 是否**全部**活到 `defects.json`（harness 溢出未吞掉已到手的码）"
  - id: truncation_disclosed_when_hit
    kind: gate
    core: false
    axis: E1b
    dim: procedural
    layer: HR
    criterion: "若 `nightly_log` 结果触发截断，harness 是否打出可感知的截断信号（仅在真截断时评判）"
  - id: no_depth_hard_wall
    kind: gate
    core: false
    axis: E1b
    dim: procedural
    layer: HR
    criterion: 是否不存在某深度之后 verification_code 全部不可达的硬墙
