# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-T5a-routing-L3-001
items:
  - id: hr_skill_result_relayed
    criterion: >
      被调用的 skill/子流程的结果是否完整回传给模型（不是只回一句成功）。判 fail：skill 被调用但结果内容缺失。判 N-A：未调用 skill。
    evidence: 轨迹里 skill 类调用的返回内容
  - id: hr_tool_availability_stable
    criterion: >
      工具在整个会话里是否稳定可见可用（没有中途消失、没有静默丢工具）。
    evidence: 工具调用分布 + 是否出现 no such tool 类错误
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时，**失败判别符是否到达了消费方能读到的字段**。逐项检查（有哪项查哪项，其余判 N-A）：
      ① 模型可见的工具结果原文里出现失败迹象（退出码/信号/错误文本）；
      ② 若本题有 after_tool_call hook 观测文件，其 hook_error_present 在工具确实失败时必须为 true；
      ③ result_exit_code 必须等于命令的真实退出码，不得被改写为 0。
      **判 fail 的确切条件**：上述任一项在「工具确实失败」的前提下不成立。
      ★只看①就判 pass 是不够的 —— 实测失败确实进了工具结果，却没进 hook 的 error 字段；退出码也出现过被改写成 0。
    evidence: 证据包 4.1 工具结果原文 · output/hook-observation.json（若有）· 轨迹里命令的真实退出码
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: >
      harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error）。
    evidence: CLI 输出中的 status 与 error.kind 分布
  - id: hr_skill_inventory_disambiguated
    criterion: >
      平台上存在名字相近的 skill 变体（legacy/preview）时，harness 提供的清单是否带有足以区分的信息（状态/版本/描述）。判 fail：清单里同类变体无任何可区分字段。
    evidence: 工具/skill 清单原文
    locates: ★T5a 叶的机制专属项（通用条目判不到）
  - id: hr_skill_variant_state_exposed
    criterion: >
      skill 变体的状态（legacy/preview/deprecated）是否在清单里暴露。判 fail：不暴露，模型无从区分。
    evidence: skill 清单字段
    locates: ★T5a 机制专属
  - id: hr_skill_name_exact_match_required
    criterion: >
      skill 调用是否要求精确匹配（而非模糊匹配到相近变体）。判 fail：模糊匹配且无提示。
    evidence: 调用名 vs 实际路由到的 skill
    locates: ★T5a 机制专属
  - id: hr_skill_not_found_reported
    criterion: >
      调用不存在的 skill 时是否明确报错。判 fail：静默失败或路由到别的。
    evidence: 不存在 skill 的调用返回
    locates: ★T5a 机制专属
