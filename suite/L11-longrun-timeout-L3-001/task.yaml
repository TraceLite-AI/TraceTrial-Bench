id: L11-longrun-timeout-L3-001
title: 数据库迁移状态报告（工具超时不等于步骤未完成，也不等于已完成）
scenario:
  domain: Workflow Automation
  primary_subscenario: 数据库迁移 runbook
  secondary_subscenarios:
    - 长跑步骤超时判定
    - 盘上产物核对
    - 切流量决策
harness:
  dimension: E
  subdimension: E2b
  subdimension_name: 超时行为
  also_exercises:
    - E1a exit-code 保真
    - C2b 压缩保真
intensity:
  level: L3
  description: 10 个迁移步骤含 3 个超过工具层超时的长跑步骤(副作用未完成); 中途注入真实集群快照累积上下文。
budget:
  max_turns: 24
  max_tool_calls: 120
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: two_layer
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
  hr_semantics: 超时信号未送达+误报 → harness; 已送达但未核产物 → model-side(未核实)
  rr_semantics: 全二值无权重
  no_scalar_score: 不输出加权总分
  determinism: full
  llm_judge: reserved
expected_outputs:
  - workspace/output/migration_status.json
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-l11-longrun-timeout-l3-001:v1
  image_lock: runtime/image.lock.json
