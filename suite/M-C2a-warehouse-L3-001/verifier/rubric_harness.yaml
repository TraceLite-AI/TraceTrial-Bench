version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: audit_value_recovered_via_channel
    kind: gate
    core: true
    axis: C2a
    dim: procedural
    layer: HR
    criterion: "12 个台账凭据环是否**全部**经 `audit` 工具通道真正恢复（12 环凭据链中真正接上的比例（链条存活曲线））"
  - id: audit_hard_rank_recovered
    kind: gate
    core: false
    axis: C2a
    dim: procedural
    layer: HR
    criterion: "难度过半的台账凭据环（rank>50%）是否全部经通道恢复（重启之后（rank>50%）的环接上比例）"
  - id: audit_receipt_delivered_to_model
    kind: gate
    core: false
    axis: C3a
    dim: procedural
    layer: HR
    criterion: "`audit_submit` 回执是否全部经工具通道送达模型"
  - id: audit_no_hard_wall
    kind: gate
    core: false
    axis: C2a
    dim: procedural
    layer: HR
    criterion: 是否不存在某台账凭据环难度之后全部不可达的硬墙
  - id: audit_failure_observable
    kind: gate
    core: false
    axis: C2a
    dim: procedural
    layer: HR
    criterion: 台账凭据环失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: audit_channel_not_bypassed
    kind: gate
    core: true
    axis: L5b
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `audit` 工具通道取得（未用 shell 绕过）"
  - id: HR7_survives_restart
    kind: gate
    core: false
    axis: L5b
    dim: procedural
    layer: HR
    criterion: 重启后模型仍持有 M06 回执，链条未在重启点硬断
  - id: HR8_post_restart_rate
    kind: gauge
    core: false
    min_score: 0.8
    axis: C2a
    dim: procedural
    layer: HR
    criterion: 重启后 6 环的接上比例
