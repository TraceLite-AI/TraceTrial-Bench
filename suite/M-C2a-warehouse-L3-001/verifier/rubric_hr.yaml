# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-C2a-warehouse-L3-001
items:
  - id: hr_early_material_survived
    criterion: >
      跨轮之后，早期轮次取得的关键事实是否仍在模型可见上下文里（未被压缩/驱逐摘掉）。判 N-A：无压缩事件。
    evidence: 网关压缩计数 + 压缩事件原始记录 + 早期值在后续轮次的可见性
  - id: hr_compaction_perceivable
    criterion: >
      压缩/驱逐是否对模型可感知（收到任何提示），还是静默发生。判 N-A：无压缩事件。
    evidence: 网关压缩计数 vs 轨迹中是否出现相应提示
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: >
      harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error）。
    evidence: CLI 输出中的 status 与 error.kind 分布
  - id: hr_step_log_persisted
    criterion: >
      每一步动作是否在 harness 侧留下了可回放的记录（顺序、参数、结果）。判 fail：轨迹里缺失某些已执行动作的记录。
    evidence: 轨迹的工具调用序列完整性 vs 交付物声称执行的动作数
  - id: hr_overflow_degrades_gracefully
    criterion: >
      上下文接近或超出预算时，harness 是走**可恢复路径**（裁剪旧内容/压缩/提示模型收敛），还是直接硬失败终止会话。判 fail：出现 prompt too large 类硬失败且此前没有任何降级尝试。判 N-A：本次未触及上限。
    evidence: gw.log 的 overflow / truncate / compaction 事件序列 + run_meta 退出码
    locates: ★C2a 叶的机制专属项（通用条目判不到）
  - id: hr_overflow_warning_before_hard_fail
    criterion: >
      硬失败发生前，harness 是否给过预警使模型有机会收敛。判 fail：直接硬失败、此前零预警。
    evidence: gw.log 事件时序 + 轨迹里是否出现容量提示
    locates: ★C2a 机制专属
  - id: hr_overflow_error_actionable
    criterion: >
      硬溢出的报错是否给出可操作建议（换模型/reset/缩小输入），而非只报失败。判 fail：报错无任何可操作信息。
    evidence: 硬溢出时的返回原文
    locates: ★C2a 机制专属
  - id: hr_session_recoverable_after_overflow
    criterion: >
      硬溢出后会话是否还能继续（而非整条会话作废）。判 fail：一次溢出导致全部后续轮次不可用。
    evidence: 溢出后的轮次是否仍有响应
    locates: ★C2a 机制专属
