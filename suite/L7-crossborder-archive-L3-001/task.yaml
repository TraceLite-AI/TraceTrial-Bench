id: L7-crossborder-archive-L3-001
title: 跨境订单合规归档（早期批号必须被每条记录沿用）
scenario:
  domain: Workflow Automation
  primary_subscenario: 跨境电商合规归档
  secondary_subscenarios:
    - 多批次流水处理
    - 早期规格沿用
    - 归档字段抄录
harness:
  dimension: C
  subdimension: C2b
  subdimension_name: 压缩保真
intensity:
  level: L3
  description: 28 批 × 72 单真实订单明细, 累计约 150K tokens 超过 128K 窗口; 合规批号只在第 1 轮出现一次, 但每条归档记录都必须带它 —— 早期材料一丢, 后续整批记录会被归档系统拒收。
budget:
  max_turns: 32
  max_tool_calls: 200
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: two_layer
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
  hr_semantics: pass/fail/N-A; 压缩未触发且任务完成=pass(记功)
  rr_semantics: 全二值无权重, 全过才算 pass
  no_scalar_score: 不输出加权总分
  determinism: full
  llm_judge: reserved
expected_outputs:
  - workspace/output/archive.jsonl
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-l7-crossborder-archive-l3-001:v1
  image_lock: runtime/image.lock.json
