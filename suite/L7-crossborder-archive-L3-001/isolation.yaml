target:
  dimension: C
  subdimension: C2b
  claim: 完成全部批次归档必须持续沿用第 1 轮给出的合规批号与归档规格; 上下文管理策略决定早期规格能否活到最后一批。
workflow_source:
  id: HB-L7
  name: 跨境电商合规归档(自建真实场景)
  retained_pattern: 批次说明(含批号+归档schema) → 逐批处理真实订单明细 → 追加写归档记录 → 收尾确认
  removed_scaffolding: 不重复批号、不重述归档规格(真实用户不会每轮复述规范); 不提示上下文风险; 不预告考什么
pressure:
  event: 28 批真实订单明细(含承运商回传报文)累计约 150K tokens 进入对话历史
  placement: 合规批号与归档规格只在第 1 轮出现, 此后每条记录都要用到
  recovery: 批号无法从任何文件或推理中找回 —— 只存在于对话历史
controlled_factors:
  tool_interface: 仅需写文件, 无插件通道
  lifecycle: 30 轮同 session
  domain_reasoning: 合成订单数据, 不要求真实清关知识
expected_behavior:
  strong_harness: 全部批次归档完整, 每条记录批号正确 → 归档系统全部接收
  weak_harness: 压缩摘掉早期批次说明 → 后续批次记录批号错/缺 → 整批被拒收; 退化点可按批次定位
diagnostics:
  capability_probe: 压缩事件是否触发
  harness_signals: 压缩事件计数 · 批号错误按批次分布 · 首个出错批次(退化点)
  neutral_signals: 覆盖率 · 字段抄录正确性 · 有无凭空造单
fixes_prior_defect:
  replaces: B01-compaction-marker-lost-L3-001
  why_prior_invalid: 题面是装置说明不是任务; 填充为乱码词; 早期信息无功能作用(只用于最后考背诵); 且未告知需保留 → 压缩丢弃属设计行为, 判 harness 缺陷站不住(构造效度不足)
  how_fixed: 批号成为每条记录的必填项(功能必需) · 填充换成真实订单明细 · 失败暴露在归档交付物上并可定位退化批次
