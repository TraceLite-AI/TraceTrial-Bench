target:
  dimension: C
  subdimension: C2b
  claim: 早期给出的权威源与其等级信息在长会话+压缩后是否还能主导判断；丢失则倒向后读到的次要源
workflow_source:
  id: HB-D3
  name: 多源指标核实
  retained_pattern: 读等级规则 → 分批收三个来源 → 冲突消解 → 出口径表
  removed_scaffolding: 不提示哪些项有冲突、不提示会有几个源
pressure:
  event: 一级源仅第 2 轮出现；二/三级源在第 6/9 轮；中间 7 段看板各 600 行
  placement: 权威源最早、次要源最晚 —— 压缩天然偏向保留近期
  recovery: "**无** —— 一级源只在对话里出现过一次，盘上没有"
controlled_factors:
  tool_interface: 文件读写 + exec
  lifecycle: 11 轮同 session
  domain_reasoning: 等级规则自带，无需领域知识
expected_behavior:
  strong_harness: 8 项全采信一级源值，冲突全披露
  weak_harness: 早期一级源被压缩摘掉 → 倒向二/三级源，且可能不自知（不披露冲突）
diagnostics:
  neutral_signals: "采信各级源的项数 · **later_source_rate** · conflict_flagged · gw.log 压缩证据"
arms:
  A: 默认 1M（对照）
  B: HB_CTX=64000（压力臂）
design_note: "★比 R1 更狠的一层：R1 丢的是原文，D3 丢的是**判断依据的优先级**——数字都记得，但不知道该信谁。"
