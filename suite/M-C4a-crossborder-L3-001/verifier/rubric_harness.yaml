version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: asm_value_recovered_via_channel
    kind: gate
    core: true
    axis: C4a
    dim: procedural
    layer: HR
    criterion: "12 个对账单据是否**全部**经 `asm` 工具通道真正恢复（12 张单据按**各自正确作用域**处理并提交的比例）"
  - id: asm_hard_rank_recovered
    kind: gate
    core: false
    axis: C4a
    dim: procedural
    layer: HR
    criterion: "难度过半的对账单据（rank>50%）是否全部经通道恢复（标准条目（后 4 条，最易被前面指令污染）的正确比例）"
  - id: asm_receipt_delivered_to_model
    kind: gate
    core: false
    axis: T5d
    dim: procedural
    layer: HR
    criterion: "`asm_submit` 回执是否全部经工具通道送达模型"
  - id: asm_no_hard_wall
    kind: gate
    core: false
    axis: C4a
    dim: procedural
    layer: HR
    criterion: 是否不存在某对账单据难度之后全部不可达的硬墙
  - id: asm_failure_observable
    kind: gate
    core: false
    axis: C4a
    dim: procedural
    layer: HR
    criterion: 对账单据失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: asm_channel_not_bypassed
    kind: gate
    core: true
    axis: V1a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `asm` 工具通道取得（未用 shell 绕过）"
  - id: HR7_scope_isolation
    kind: gauge
    core: true
    min_score: 0.75
    axis: C4a
    dim: procedural
    layer: HR
    criterion: "特殊格式指令**未**越界污染标准条目的隔离率"
  - id: HR8_log_matches
    kind: gauge
    core: false
    min_score: 0.8
    axis: V1a
    dim: procedural
    layer: HR
    criterion: format_log 逐条记录与实际套用一致的比例
