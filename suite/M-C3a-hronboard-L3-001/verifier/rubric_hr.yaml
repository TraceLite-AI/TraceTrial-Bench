# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-C3a-hronboard-L3-001
items:
  - id: hr_early_material_survived
    criterion: >
      跨轮之后，早期轮次取得的关键事实是否仍在模型可见上下文里（未被压缩/驱逐摘掉）。判 N-A：无压缩事件。
    evidence: 网关压缩计数 + 压缩事件原始记录 + 早期值在后续轮次的可见性
  - id: hr_compaction_perceivable
    criterion: >
      压缩/驱逐是否对模型可感知（收到任何提示），还是静默发生。判 N-A：无压缩事件。
    evidence: 网关压缩计数 vs 轨迹中是否出现相应提示
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: >
      harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error）。
    evidence: CLI 输出中的 status 与 error.kind 分布
  - id: hr_early_turn_content_still_visible
    criterion: >
      跨多轮之后，早期轮次的**用户消息原文**是否仍在模型可见上下文里（未被静默摘除）。判 fail：早期轮次内容已不可见且模型未收到任何提示。判 N-A：无压缩/驱逐事件。
    evidence: 压缩事件原始记录的 firstKeptEntryId + 早期轮内容在后续是否仍被引用
    locates: ★C3a 叶的机制专属项（通用条目判不到）
  - id: hr_fact_drift_absent
    criterion: >
      早期轮取得的事实在后续轮次被引用时，值是否仍与首次取得时一致。判 fail：同一事实在不同轮出现不同值。
    evidence: 轨迹里同一事实的多次出现
    locates: ★C3a 机制专属
  - id: hr_turn_boundary_preserved
    criterion: >
      各轮内容在上下文里是否保持轮次边界（不被合并成一段导致来源不可辨）。判 fail：无法区分某内容来自哪一轮。
    evidence: 轨迹里各轮消息的分隔
    locates: ★C3a 机制专属
  - id: hr_user_turn_verbatim
    criterion: >
      用户轮次的原文是否逐字保留（未被 harness 改写/摘要）。判 fail：模型收到的与实际发出的不一致。
    evidence: turns.json 原文 vs 轨迹里的 user 消息
    locates: ★C3a 机制专属
