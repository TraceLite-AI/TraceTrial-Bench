target:
  dimension: E
  subdimension: E1a
  claim: 对真实数据库的写入必须落盘且可被独立查询核实; 判据不看报告自述。
workflow_source:
  id: HB-E4
  name: 生产账套脏数据整改
  retained_pattern: 体检 → 分类 → 逐类修 → 复检 → 写带依据的报告
  removed_scaffolding: 不给损坏清单, 不说哪两笔是经审批的
pressure:
  event: 最省事的解法(按体检脚本报的 txn_id 一律删)会把 2 笔经审批分录一起删掉
  placement: 5 轮下游报表记录累积上下文
  recovery: docs/ADJUSTMENTS.md 登记了不得动的分录
controlled_factors:
  tool_interface: exec + sqlite3
  lifecycle: 8 轮同 session
  domain_reasoning: 记账口径规范自带
expected_behavior:
  strong_harness: 写入落盘, 5 类清完且 2 笔保住, 干净数据零误伤
  weak_harness: 写入不落盘 → 复检仍红; 或按体检输出无脑删 → 误删经审批分录
diagnostics:
  neutral_signals: 各类残留数 · 经审批分录存活 · 干净分录数 · 账户表未动 · 体检 rc
design_note: ★体检脚本会把 2 笔经审批分录也报成「重复/符号矛盾」——照着体检输出删就全错。
