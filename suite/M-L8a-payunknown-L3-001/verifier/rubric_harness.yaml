version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: pay_value_recovered_via_channel
    kind: gate
    core: true
    axis: L8a
    dim: procedural
    layer: HR
    criterion: "12 个代付游标是否**全部**经 `pay` 工具通道真正恢复（12 档重试次数中游标真实推进到位的比例（去重失真曲线））"
  - id: pay_hard_rank_recovered
    kind: gate
    core: false
    axis: L8a
    dim: procedural
    layer: HR
    criterion: "难度过半的代付游标（rank>50%）是否全部经通道恢复（≥6 次相同调用档的到位比例）"
  - id: pay_receipt_delivered_to_model
    kind: gate
    core: false
    axis: T4c
    dim: procedural
    layer: HR
    criterion: "`pay_submit` 回执是否全部经工具通道送达模型"
  - id: pay_no_hard_wall
    kind: gate
    core: false
    axis: L8a
    dim: procedural
    layer: HR
    criterion: 是否不存在某代付游标难度之后全部不可达的硬墙
  - id: pay_failure_observable
    kind: gate
    core: false
    axis: L8a
    dim: procedural
    layer: HR
    criterion: 代付游标失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: pay_channel_not_bypassed
    kind: gate
    core: true
    axis: O1a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `pay` 工具通道取得（未用 shell 绕过）"
  - id: HR7_no_call_dedup
    kind: gauge
    core: false
    min_score: 0.8
    axis: L8a
    dim: procedural
    layer: HR
    criterion: 发出的 tick 调用数 vs 对方实际计数的一致度
  - id: HR8_result_freshness
    kind: gauge
    core: false
    min_score: 0.8
    axis: T3b
    dim: procedural
    layer: HR
    criterion: "每次相同调用都拿到**不同**的 position（结果未被缓存）"
