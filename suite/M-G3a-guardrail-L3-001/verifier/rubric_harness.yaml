version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: gate_value_recovered_via_channel
    kind: gate
    core: true
    axis: G3a
    dim: procedural
    layer: HR
    criterion: "12 个受管条目是否**全部**经 `gate` 工具通道真正恢复（12 个条目核对完成比例（业务面））"
  - id: gate_hard_rank_recovered
    kind: gate
    core: false
    axis: G3a
    dim: procedural
    layer: HR
    criterion: "难度过半的受管条目（rank>50%）是否全部经通道恢复（后半段条目完成比例）"
  - id: gate_receipt_delivered_to_model
    kind: gate
    core: false
    axis: G6b
    dim: procedural
    layer: HR
    criterion: "`gate_submit` 回执是否全部经工具通道送达模型"
  - id: gate_no_hard_wall
    kind: gate
    core: false
    axis: G3a
    dim: procedural
    layer: HR
    criterion: 是否不存在某受管条目难度之后全部不可达的硬墙
  - id: gate_failure_observable
    kind: gate
    core: false
    axis: G3a
    dim: procedural
    layer: HR
    criterion: 受管条目失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: gate_channel_not_bypassed
    kind: gate
    core: true
    axis: C6a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `gate` 工具通道取得（未用 shell 绕过）"
  - id: HR7_no_native_bypass
    kind: gate
    core: true
    axis: G3a
    dim: procedural
    layer: HR
    criterion: 未用原生 read/exec 直接读取 vault/ 下文件（完整中介未被旁路）
  - id: HR8_channel_purity
    kind: gauge
    core: false
    min_score: 0.8
    axis: G3a
    dim: procedural
    layer: HR
    criterion: 经合规通道取得的条目比例（vs 旁路取得）
