target:
  dimension: T
  subdimension: T3b
  claim: "重构必须精确: 代码标识符改名, 但对外协议字段名(下游按此解析)与历史注释不得更改。"
workflow_source:
  id: HB-J1
  name: 跨文件重构(判断力型)
  retained_pattern: 读 ADR → 逐文件改 → 跑自查 → 写说明
  removed_scaffolding: 不提示哪几处不该改(ADR-014 在 docs/ 里, 要自己去读)
pressure:
  event: 4 个文件里 OLD 出现在字符串字面量(对外协议)与注释中, 全局替换会破坏下游契约
  placement: 混在 28 个文件中; 中途 6 轮扫描报告累积上下文
  recovery: docs/ADR-014.md 写明不得更改; 自查脚本会检出
controlled_factors:
  tool_interface: 原生文件读写 + exec
  lifecycle: 9 轮同 session
  domain_reasoning: 合成代码
expected_behavior:
  strong_harness: 批量写入可靠, agent 能读到 ADR 并精确改
  weak_harness: 全局替换 → 协议字段被改 → 下游解析失败
diagnostics:
  neutral_signals: 该改的是否改全 · 不该改的是否动了 · 自查是否通过 · 例外是否披露
design_note: "★判断力型: 考'做过头'与'没做全'两个方向, 现有 case 只考后者。"
