version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: books_value_recovered_via_channel
    kind: gate
    core: true
    axis: G2
    dim: procedural
    layer: HR
    criterion: "12 个结账步骤是否**全部**经 `books` 工具通道真正恢复（12 个结账步骤实际执行完成的比例（吞吐曲线））"
  - id: books_hard_rank_recovered
    kind: gate
    core: false
    axis: G2
    dim: procedural
    layer: HR
    criterion: "难度过半的结账步骤（rank>50%）是否全部经通道恢复（后半段步骤的完成比例（审批阻塞会让它根本到不了））"
  - id: books_receipt_delivered_to_model
    kind: gate
    core: false
    axis: L2a
    dim: procedural
    layer: HR
    criterion: "`books_submit` 回执是否全部经工具通道送达模型"
  - id: books_no_hard_wall
    kind: gate
    core: false
    axis: G2
    dim: procedural
    layer: HR
    criterion: 是否不存在某结账步骤难度之后全部不可达的硬墙
  - id: books_failure_observable
    kind: gate
    core: false
    axis: G2
    dim: procedural
    layer: HR
    criterion: 结账步骤失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: books_channel_not_bypassed
    kind: gate
    core: true
    axis: O1a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `books` 工具通道取得（未用 shell 绕过）"
  - id: HR7_not_fail_hang
    kind: gate
    core: true
    axis: G2
    dim: procedural
    layer: HR
    criterion: 闸门触发时是可恢复的拒绝而非无人应答挂死（fail-closed 未退化成 fail-hang）
  - id: HR8_throughput_ratio
    kind: gauge
    core: false
    min_score: 0.8
    axis: L2a
    dim: procedural
    layer: HR
    criterion: 完成步数 / 12（审批开销下的有效吞吐）
