# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-L2a-tokens-L3-001
items:
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时，**失败判别符是否到达了消费方能读到的字段**。逐项检查（有哪项查哪项，其余判 N-A）：
      ① 模型可见的工具结果原文里出现失败迹象（退出码/信号/错误文本）；
      ② 若本题有 after_tool_call hook 观测文件，其 hook_error_present 在工具确实失败时必须为 true；
      ③ result_exit_code 必须等于命令的真实退出码，不得被改写为 0。
      **判 fail 的确切条件**：上述任一项在「工具确实失败」的前提下不成立。
      ★只看①就判 pass 是不够的 —— 实测失败确实进了工具结果，却没进 hook 的 error 字段；退出码也出现过被改写成 0。
    evidence: 证据包 4.1 工具结果原文 · output/hook-observation.json（若有）· 轨迹里命令的真实退出码
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: >
      harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error）。
    evidence: CLI 输出中的 status 与 error.kind 分布
  - id: hr_loop_detection_active
    criterion: >
      模型陷入重复调用时，harness 是否有检测并干预（提示/中断），还是任其循环到预算耗尽。判 fail：同一调用重复超过合理次数而 harness 全程无干预。判 N-A：未出现重复循环。
    evidence: 去重后的调用序列最大重复次数 + 是否出现 harness 侧干预信号
    locates: ★L2a 叶的机制专属项（通用条目判不到）
  - id: hr_repeat_call_result_differs
    criterion: >
      重复调用同一目标时返回是否有变化；若始终相同，harness 是否提示了这一点。判 fail：无限相同返回且无提示。
    evidence: 重复调用的返回内容对比
    locates: ★L2a 机制专属
  - id: hr_repeat_threshold_configurable
    criterion: >
      循环检测的阈值是否可知（模型能预期何时会被干预）。判 fail：不可知。
    evidence: 配置/工具描述
    locates: ★L2a 机制专属
  - id: hr_intervention_is_actionable
    criterion: >
      干预时给出的信息是否可据以改变策略。判 fail：只是中断，无原因。
    evidence: 干预时的返回内容
    locates: ★L2a 机制专属
