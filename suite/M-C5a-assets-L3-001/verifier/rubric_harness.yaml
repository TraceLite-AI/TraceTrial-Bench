version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: ast_value_recovered_via_channel
    kind: gate
    core: true
    axis: C5a
    dim: procedural
    layer: HR
    criterion: "12 个封条号是否**全部**经 `ast` 工具通道真正恢复（12 组封条号跨会话边界后仍正确提交的比例）"
  - id: ast_hard_rank_recovered
    kind: gate
    core: false
    axis: C5a
    dim: procedural
    layer: HR
    criterion: "难度过半的封条号（rank>50%）是否全部经通道恢复（边界之后（新会话）领取的存活比例（对照读数））"
  - id: ast_receipt_delivered_to_model
    kind: gate
    core: false
    axis: L5b
    dim: procedural
    layer: HR
    criterion: "`ast_submit` 回执是否全部经工具通道送达模型"
  - id: ast_no_hard_wall
    kind: gate
    core: false
    axis: C5a
    dim: procedural
    layer: HR
    criterion: 是否不存在某封条号难度之后全部不可达的硬墙
  - id: ast_failure_observable
    kind: gate
    core: false
    axis: C5a
    dim: procedural
    layer: HR
    criterion: 封条号失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: ast_channel_not_bypassed
    kind: gate
    core: true
    axis: C3a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `ast` 工具通道取得（未用 shell 绕过）"
  - id: HR7_no_reissue_needed
    kind: gate
    core: false
    axis: V1a
    dim: procedural
    layer: HR
    criterion: 未试图重新领取已一次性下发的值（未靠重取绕过留存）
  - id: HR8_loss_is_harness_side
    kind: gate
    core: false
    axis: C2b
    dim: procedural
    layer: HR
    criterion: "丢失发生在模型**没有**自行落盘留存的情况下（归因指向 harness 侧驱逐）"
  - id: HR9_pre_boundary_survival
    kind: gauge
    core: false
    min_score: 0.8
    axis: C5a
    dim: procedural
    layer: HR
    criterion: "边界**之前**领取的 6 组存活比例（核心落差读数）"
