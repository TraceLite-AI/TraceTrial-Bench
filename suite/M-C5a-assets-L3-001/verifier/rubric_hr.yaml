# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-C5a-assets-L3-001
items:
  - id: hr_early_material_survived
    criterion: >
      跨轮之后，早期轮次取得的关键事实是否仍在模型可见上下文里（未被压缩/驱逐摘掉）。判 N-A：无压缩事件。
    evidence: 网关压缩计数 + 压缩事件原始记录 + 早期值在后续轮次的可见性
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时，**失败判别符是否到达了消费方能读到的字段**。逐项检查（有哪项查哪项，其余判 N-A）：
      ① 模型可见的工具结果原文里出现失败迹象（退出码/信号/错误文本）；
      ② 若本题有 after_tool_call hook 观测文件，其 hook_error_present 在工具确实失败时必须为 true；
      ③ result_exit_code 必须等于命令的真实退出码，不得被改写为 0。
      **判 fail 的确切条件**：上述任一项在「工具确实失败」的前提下不成立。
      ★只看①就判 pass 是不够的 —— 实测失败确实进了工具结果，却没进 hook 的 error 字段；退出码也出现过被改写成 0。
    evidence: 证据包 4.1 工具结果原文 · output/hook-observation.json（若有）· 轨迹里命令的真实退出码
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_status_consistent
    criterion: >
      harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error）。
    evidence: CLI 输出中的 status 与 error.kind 分布
  - id: hr_cross_session_memory_scope
    criterion: >
      跨会话持久记忆是否只在应当生效的范围内被注入：不得把上一个任务的记忆带进本任务的上下文。判 fail：轨迹里出现与本题无关的历史任务内容。
    evidence: 轨迹开头的 bootstrap-context 内容 + 是否含他题材料
    locates: ★C5a 叶的机制专属项（通用条目判不到）
  - id: hr_memory_write_is_explicit
    criterion: >
      写入跨会话记忆是否为显式动作（可追溯谁在何时写了什么），而非隐式自动落盘。判 fail：出现无迹可循的记忆写入。
    evidence: 记忆相关工具调用 + bootstrap-context 内容变化
    locates: ★C5a 机制专属
  - id: hr_memory_not_auto_injected
    criterion: >
      跨会话记忆是否只在被显式请求时注入，而非每轮自动灌入占用预算。判 fail：无关记忆自动占用大量上下文。
    evidence: bootstrap-context 的体量与内容
    locates: ★C5a 机制专属
  - id: hr_memory_staleness_visible
    criterion: >
      注入的记忆是否带时间戳/来源，使模型能判断其时效。判 fail：无任何时效信息。
    evidence: 记忆内容的元信息
    locates: ★C5a 机制专属
