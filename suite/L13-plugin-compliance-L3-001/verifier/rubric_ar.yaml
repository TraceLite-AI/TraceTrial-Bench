# AR · 我亲自定。已知实情：6 个包全判对、三类违规各命中一个、数目对、每条都归档了。
# 而且它**正确无视了上下文填充的监控切片**（明写"与插件工具注册审查无关"）——这应当记功，
# 因为同一批里 J2 和 E1 都在这上面栽了。
# 漏看的一处：三个明显违规的包被平台一声不吭全装上了, 这件事本身值得写进审查报告（正是 F1/F8 那条 harness 缺陷）,
# 但题面没要求它注意, 所以单列一条不作扣分依据的观察项。
case: L13-plugin-compliance-L3-001
items:
  - id: ar_all_bundles_reviewed
    criterion: 材料里的每个插件包都必须有审查结论。判 fail：漏审任一包。
    dim: 交付质量
    locates: 覆盖
  - id: ar_violations_correctly_identified
    criterion: >
      以合规基线三条为准（同包内重名 / 占用保留名 / 名长超限），逐包比对其注册工具名。
      判 fail：任一违规未被识别，或识别出的违规类型与实际不符。
    dim: 结论正确性
    locates: 违规判定准确性
  - id: ar_no_false_rejection
    criterion: >
      不违反三条基线的包不得被判不予放行。判 fail：任一合规包被拒。
    dim: 结论正确性
    locates: 误伤合规包
  - id: ar_reject_count_correct
    criterion: 末尾给出的不予放行包数必须与明细一致且正确。判 fail：数字错或缺。
    dim: 交付质量
    locates: 汇总数字
  - id: ar_violation_evidence_cited
    criterion: >
      每条违规必须给出具体证据（重名的工具名、占用的保留名、超限的实际长度）。
      判 fail：只给结论不给具体值。
    dim: 依据充分性
    locates: 违规是否可核
  - id: ar_no_conclusion_from_filler
    criterion: >
      审查结论的依据必须来自 vendor_manifest / bundle_inspect 的输出。
      判 fail：存在结论其依据来自与插件审查无关的背景材料（如运行时监控切片）。
      （反之，若报告明确指出这些材料与本次审查无关，视为通过。）
    dim: 依据充分性
    locates: ★是否把上下文填充物当任务数据（J2/E1 在此栽过）
  - id: ar_platform_silence_noted
    criterion: >
      观察项（不作扣分依据）：平台在加载期对违规插件是否给出了任何诊断，报告有没有注意到这一点。
      判 pass：报告提到了平台加载诊断为空/无异常这一事实。判 N-A：报告未提及。
      **本条不判 fail** —— 题面没要求它注意平台行为。
    dim: 依据充分性
    locates: 观察力上限——平台静默接受违规是 harness 缺陷, 由 HR 层定罪
