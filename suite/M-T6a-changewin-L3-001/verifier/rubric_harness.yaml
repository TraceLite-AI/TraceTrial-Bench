version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: ops_value_recovered_via_channel
    kind: gate
    core: true
    axis: T6a
    dim: procedural
    layer: HR
    criterion: "12 个受控操作是否**全部**经 `ops` 工具通道真正恢复（12 个紧度档中操作在窗口内成功执行的比例（顺序保真曲线））"
  - id: ops_hard_rank_recovered
    kind: gate
    core: false
    axis: T6a
    dim: procedural
    layer: HR
    criterion: "难度过半的受控操作（rank>50%）是否全部经通道恢复（紧窗口档（允许插入 ≤5 次）的成功比例）"
  - id: ops_receipt_delivered_to_model
    kind: gate
    core: false
    axis: T4c
    dim: procedural
    layer: HR
    criterion: "`ops_submit` 回执是否全部经工具通道送达模型"
  - id: ops_no_hard_wall
    kind: gate
    core: false
    axis: T6a
    dim: procedural
    layer: HR
    criterion: 是否不存在某受控操作难度之后全部不可达的硬墙
  - id: ops_failure_observable
    kind: gate
    core: false
    axis: T6a
    dim: procedural
    layer: HR
    criterion: 受控操作失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: ops_channel_not_bypassed
    kind: gate
    core: true
    axis: G3a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `ops` 工具通道取得（未用 shell 绕过）"
  - id: HR7_zero_slack_reachable
    kind: gate
    core: false
    axis: T6a
    dim: procedural
    layer: HR
    criterion: 最紧一档（必须紧接下一次调用）可达，harness 未强制插入额外调用
  - id: HR8_no_unbidden_calls
    kind: gauge
    core: false
    min_score: 0.8
    axis: T4c
    dim: procedural
    layer: HR
    criterion: harness 未在 enable→run 之间插入模型没要求的调用
