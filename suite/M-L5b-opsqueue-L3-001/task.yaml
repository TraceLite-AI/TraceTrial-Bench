id: M-L5b-opsqueue-L3-001
title: 运维动作待办（session resume）
scenario:
  domain: 运维动作待办
  primary_subscenario: session resume
  secondary_subscenarios:
    - 多轮长程
    - 真实业务材料
    - 交付物核对
harness:
  dimension: L
  subdimension: L5b
  subdimension_name: session resume
intensity:
  level: L3
  description: 运维动作待办场景; 压 L5b session resume; 中途注入 8 轮真实运维动作累积上下文。
budget:
  max_turns: 19
  max_tool_calls: 160
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: two_layer
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
  hr_semantics: pass/fail/N-A; 机制未触发且任务完成=pass(记功), 未触发且未完成=fail
  rr_semantics: 全二值无权重, 全过才算 pass; 幅度看连续指标不进判定
  no_scalar_score: 不输出加权总分
  determinism: full
  llm_judge: reserved
  verifier_provenance: 沿用已验证的 v2 量具 verifier(本身已含 harness_rubric/result_rubric/attribution), 判据未改
expected_outputs:
  - workspace/output/
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-m-l5b-opsqueue-l3-001:v1
  image_lock: runtime/image.lock.json
