# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-L5b-opsqueue-L3-001
items:
  - id: hr_session_state_after_resume
    criterion: >
      会话中断/重启后，harness 是否保留了此前的进度状态（已完成项不被重置、未决项仍可见）。判 N-A：本次无中断。
    evidence: session 文件数 + 轨迹里是否出现重复的起始动作
  - id: hr_pending_results_surfaced
    criterion: >
      未决任务/子任务的结果有没有回到父任务（有回执且时点正确）。判 N-A：本次无未决任务。
    evidence: 轨迹里的回执及其位置
  - id: hr_reached_task_end
    criterion: >
      会话是否因 **harness 原因**（上下文溢出/压缩失败/会话锁/进程被杀）提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_status_consistent
    criterion: >
      harness 报给上层的顶层状态与其内部错误是否一致（是否存在 status=ok 但内部带 error）。
    evidence: CLI 输出中的 status 与 error.kind 分布
  - id: hr_resume_restores_progress
    criterion: >
      会话恢复后，此前的进度是否被还原（已完成项不被重置、未决项仍可见）。判 fail：恢复后模型从头开始或丢失已完成状态。判 N-A：本次无恢复事件。
    evidence: session 文件数 + 轨迹里是否出现重复的起始动作
    locates: ★L5b 叶的机制专属项（通用条目判不到）
  - id: hr_resume_does_not_replay_side_effects
    criterion: >
      会话恢复不得导致已执行的副作用被重复执行。判 fail：轨迹显示恢复后重复发起了此前已成功的动作。
    evidence: 恢复前后的调用序列对比
    locates: ★L5b 机制专属
  - id: hr_resume_preserves_tool_state
    criterion: >
      恢复后工具侧状态（已发起的动作）是否与恢复前一致。判 fail：工具状态被重置。判 N-A：无恢复。
    evidence: 恢复前后的工具状态查询
    locates: ★L5b 机制专属
