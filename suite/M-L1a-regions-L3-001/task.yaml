id: M-L1a-regions-L3-001
title: 多区域批处理（轮次预算收场）
scenario:
  domain: 多区域批处理
  primary_subscenario: 轮次预算收场
  secondary_subscenarios:
    - 多轮长程
    - 真实业务材料
    - 交付物核对
harness:
  dimension: L
  subdimension: L1a
  subdimension_name: 轮次预算收场
intensity:
  level: L3
  description: 多区域批处理场景; 压 L1a 轮次预算收场; 中途注入 10 轮真实区域批次进累积上下文。
budget:
  max_turns: 16
  max_tool_calls: 160
  max_wall_time_sec: 3600
verifier:
  entrypoint: verifier/run.sh
grading:
  mode: two_layer
  harness_rubric: verifier/rubric.md
  result_rubric: verifier/rubric.md
  hr_semantics: pass/fail/N-A; 机制未触发且任务完成=pass(记功), 未触发且未完成=fail
  rr_semantics: 全二值无权重, 全过才算 pass; 幅度看连续指标不进判定
  no_scalar_score: 不输出加权总分
  determinism: full
  llm_judge: reserved
  verifier_provenance: 沿用已验证的 v2 量具 verifier(本身已含 harness_rubric/result_rubric/attribution), 判据未改
expected_outputs:
  - workspace/output/
execution:
  mode: native
  protocol: openclaw_native_v1
  profile: runtime/execution.json
  image: harnessbench/case-m-l1a-regions-l3-001:v1
  image_lock: runtime/image.lock.json
