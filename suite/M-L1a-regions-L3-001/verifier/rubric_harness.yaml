version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: plan_value_recovered_via_channel
    kind: gate
    core: true
    axis: L1a
    dim: procedural
    layer: HR
    criterion: "12 个区域核对是否**全部**经 `plan` 工具通道真正恢复（预算内实际完成并落盘的区域比例（有效产出））"
  - id: plan_hard_rank_recovered
    kind: gate
    core: false
    axis: L1a
    dim: procedural
    layer: HR
    criterion: "难度过半的区域核对（rank>50%）是否全部经通道恢复（较大区域中被完成的比例）"
  - id: plan_receipt_delivered_to_model
    kind: gate
    core: false
    axis: V1a
    dim: procedural
    layer: HR
    criterion: "`plan_submit` 回执是否全部经工具通道送达模型"
  - id: plan_no_hard_wall
    kind: gate
    core: false
    axis: L1a
    dim: procedural
    layer: HR
    criterion: 是否不存在某区域核对难度之后全部不可达的硬墙
  - id: plan_failure_observable
    kind: gate
    core: false
    axis: L1a
    dim: procedural
    layer: HR
    criterion: 区域核对失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: plan_channel_not_bypassed
    kind: gate
    core: true
    axis: L4b
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `plan` 工具通道取得（未用 shell 绕过）"
  - id: HR7_budget_signal_exposed
    kind: gate
    core: false
    axis: L1a
    dim: procedural
    layer: HR
    criterion: harness 是否向模型暴露过预算/剩余轮次/max_turns 信号（能力探针）
  - id: HR8_graceful_landing
    kind: gauge
    core: true
    min_score: 0.5
    axis: L1a
    dim: procedural
    layer: HR
    criterion: 被截断前已把完成部分落盘 + 写了收场计划的完成度
