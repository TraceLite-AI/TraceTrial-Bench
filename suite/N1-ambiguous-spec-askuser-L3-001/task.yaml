scenario:
  domain: 业务计算
  primary_subscenario: 规格歧义处理
  secondary_subscenarios: [假设声明, 自主态澄清]
harness:
  dimension: I
  subdimension: T1g
  subdimension_name: 交互能力缺口（无结构化 ask-user 通道）（按 LEAF_MAP 官方编号）
