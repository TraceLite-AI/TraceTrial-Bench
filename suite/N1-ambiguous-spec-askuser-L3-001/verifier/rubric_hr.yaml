# HR · 我亲自定。本题压的是**交互能力缺口**：自主态下模型没有结构化通道可以暂停问用户。
# ★注意分界：模型能不能用文字问 = 模型的事；问了有没有人接、有没有结构化通道 = harness 的事。
case: N1-ambiguous-spec-askuser-L3-001
items:
  - id: hr_ask_user_channel_exists
    criterion: >
      harness 是否向模型提供了**结构化的暂停提问通道**（一个能挂起任务、等待人回答的工具）。
      判据看证据包里的工具调用分布与可用工具：存在此类工具则 pass；不存在则 fail。
      **这是能力缺口不是 bug**，归因时按 feature 处理，但必须记录下来。
    evidence: 证据包 四、工具调用分布；以及轨迹中是否出现任何 ask/clarify/question 类工具
    locates: ★★结构化澄清通道的有无——Claude Code 有 AskUserQuestion、Codex 有 clarify
  - id: hr_clarification_would_be_answered
    criterion: >
      若模型以文字形式提出了澄清问题，后续轮次是否给出了回应。
      判 fail：模型提了澄清问题而后续轮次完全未回应（自主态没人接）。
      判 N-A：模型自始至终没问（此时无从判定通道是否可用）。
    evidence: 轨迹里模型的提问文本 + 后续用户轮次的内容
    locates: ★问了有没有人接——这决定了"能文字问"是不是真的等于"有澄清能力"
  - id: hr_failure_signal_delivered
    criterion: >
      工具失败时，**失败判别符是否到达了消费方能读到的字段**。逐项检查（有哪项查哪项，其余判 N-A）：
      ① 模型可见的工具结果原文里出现失败迹象（退出码/信号/错误文本）；
      ② 若本题有 after_tool_call hook 观测文件，其 hook_error_present 在工具确实失败时必须为 true；
      ③ result_exit_code 必须等于命令的真实退出码，不得被改写为 0。
      **判 fail 的确切条件**：上述任一项在「工具确实失败」的前提下不成立。
      ★只看①就判 pass 是不够的 —— 实测失败确实进了工具结果，却没进 hook 的 error 字段；退出码也出现过被改写成 0。
    evidence: 证据包 4.1 工具结果原文 · output/hook-observation.json（若有）· 轨迹里命令的真实退出码
  - id: hr_no_rework_induced
    criterion: >
      是否存在由 harness 原因（结果丢失/上下文压缩/工具不可见）导致的重复劳动。
      模型主动复核不算。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（需同时成立）
    locates: 被迫返工
  - id: hr_reached_task_end
    criterion: 会话是否因 harness 原因提前结束。
    evidence: 网关计数 + run_meta 退出码 + 轮次是否走完
    locates: 会话完整性
  - id: hr_status_consistent
    criterion: 顶层 status 与内部 error 是否一致。
    evidence: CLI 输出的 status 与 error.kind 分布
    locates: 状态误报
  - id: hr_ask_user_absence_is_declared
    criterion: >
      若无 ask-user 能力，harness 是否让模型可知（工具清单/系统提示里明确说明），而不是让它以为可以问。判 fail：系统提示鼓励提问但无对应工具。
    evidence: 系统提示内容 vs 实际工具清单
    locates: ★T1g 机制专属
  - id: hr_system_prompt_not_promise_asking
    criterion: >
      系统提示不得暗示模型可以提问而实际无通道。判 fail：提示鼓励提问但工具清单无对应能力。
    evidence: 系统提示 vs 工具清单
    locates: ★T1g 机制专属
