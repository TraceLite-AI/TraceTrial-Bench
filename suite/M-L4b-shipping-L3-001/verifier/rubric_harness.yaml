version: 3
kind: harness
scoring:
  gauge: graded 0..1 reading measured over the sweep
  gate: "binary, only where the property truly is binary"
  core: "non-compensable; gauges need >= min_score"
  unexercised: "null -> inconclusive, never charged to the harness"
items:
  - id: goal_value_recovered_via_channel
    kind: gate
    core: true
    axis: L4b
    dim: procedural
    layer: HR
    criterion: "12 个受理号是否**全部**经 `goal` 工具通道真正恢复（12 个工单结案判定正确的比例（值 + 状态都对））"
  - id: goal_hard_rank_recovered
    kind: gate
    core: false
    axis: L4b
    dim: procedural
    layer: HR
    criterion: "难度过半的受理号（rank>50%）是否全部经通道恢复（后半段工单（作废通知离结案更远）的正确比例）"
  - id: goal_receipt_delivered_to_model
    kind: gate
    core: false
    axis: C3a
    dim: procedural
    layer: HR
    criterion: "`goal_submit` 回执是否全部经工具通道送达模型"
  - id: goal_no_hard_wall
    kind: gate
    core: false
    axis: L4b
    dim: procedural
    layer: HR
    criterion: 是否不存在某受理号难度之后全部不可达的硬墙
  - id: goal_failure_observable
    kind: gate
    core: false
    axis: L4b
    dim: procedural
    layer: HR
    criterion: 受理号失败时 harness 是否给出可观测信号（MISMATCH/拒绝等），而非静默放行
  - id: goal_channel_not_bypassed
    kind: gate
    core: true
    axis: V1a
    dim: procedural
    layer: HR
    criterion: "数据是否确经 `goal` 工具通道取得（未用 shell 绕过）"
  - id: HR7_no_reissue_needed
    kind: gate
    core: false
    axis: V1a
    dim: procedural
    layer: HR
    criterion: 未试图重新领取已一次性下发的值（未靠重取绕过留存）
  - id: HR8_loss_is_harness_side
    kind: gate
    core: false
    axis: C2b
    dim: procedural
    layer: HR
    criterion: "丢失发生在模型**没有**自行落盘留存的情况下（归因指向 harness 侧驱逐）"
  - id: HR9_void_tracked
    kind: gauge
    core: true
    min_score: 0.75
    axis: L4b
    dim: procedural
    layer: HR
    criterion: 4 个作废工单被正确判为 SUPERSEDED 的比例
  - id: HR10_active_not_voided
    kind: gauge
    core: false
    min_score: 0.8
    axis: L4b
    dim: procedural
    layer: HR
    criterion: 8 个有效工单未被误判为作废的比例
