target:
  dimension: C
  subdimension: C2b
  claim: 早期口头给出且不落盘的契约，在长会话+压缩后是否还能被正确遵守；不可重取 → 代价落在结果质量
workflow_source:
  id: HB-D2
  name: 统一错误约定改造
  retained_pattern: 读迭代说明 → 接收口头约定 → 逐模块改造 → 跑测试 → 后期新增分支
  removed_scaffolding: 码表不写进任何文件；不提示后期会用到哪个码
pressure:
  event: 6 轮 CI/评审流水累积上下文；第 2 轮的码表是唯一信息源
  placement: 关键契约在最早期，需求在最末期
  recovery: "**无** —— 码表不在盘上，压缩摘掉就只能自创"
controlled_factors:
  tool_interface: 文件读写 + exec
  lifecycle: 10 轮同 session
  domain_reasoning: 纯约定遵守，无需领域知识
expected_behavior:
  strong_harness: 早期码表活到最后，2 个目标码用对且 retryable 正确
  weak_harness: 压缩摘掉第 2 轮 → 自创 `E-XXXX` 或用错 retryable
diagnostics:
  neutral_signals: "**target_codes 用到与否** · retryable 正确性 · invented_codes · 测试绿 · gw.log 压缩证据"
arms:
  A: 默认 1M 窗口（对照）
  B: HB_CTX=64000（压力臂）
design_note: "★码表不可重取是这道题成立的前提。中途 4 个码留在代码里是**故意的诱饵**——让模型以为码表能从代码推出来。"
