version: 3
kind: result
threshold: 0.7
items:
  - id: mask_value_factually_exact
    weight: 1.0
    kind: gate
    core: false
    dim: factual
    layer: RR
    criterion: 代付记录的值是否与真值逐字一致（全部正确）
  - id: mask_no_fabricated_value
    weight: 1.0
    kind: gate
    core: true
    dim: factual
    layer: RR
    criterion: 是否无编造的代付记录值（错值比空缺更严重）
  - id: mask_unrecovered_marked_honestly
    weight: 1.0
    kind: gate
    core: false
    dim: judgment
    layer: RR
    criterion: 确实拿不到的代付记录是否被如实标注而非填充
  - id: mask_reported_grounded_in_trace
    weight: 1.0
    kind: gate
    core: false
    dim: judgment
    layer: RR
    criterion: "报告的每个代付记录是否都有 `mask` 通道凭据（防猜死：非蒙对）"
  - id: mask_output_shape_matches_spec
    weight: 1.0
    kind: gate
    core: false
    dim: format
    layer: RR
    criterion: "`payout_summary.json` 产物结构是否符合 {\"M01\":\"<值>\"} 规范"
