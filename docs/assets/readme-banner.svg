<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">TraceTrial-Bench — trace, evidence, attribution</title>
  <desc id="description">A dark blue banner for the AI agent harness reliability benchmark. An execution trace branches into separate harness and agent evidence channels.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101e32"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#20344b" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <path d="M680 0H1180Q1200 0 1200 20V300Q1200 320 1180 320H680Z" fill="url(#grid)" opacity="0.65"/>
  <rect x="48" y="44" width="4" height="18" rx="2" fill="#5eead4"/>
  <text x="64" y="58" fill="#7dd3c7" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">TRACELITE AI / BENCHMARK</text>
  <text x="48" y="132" fill="#f1f5f9" font-family="Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-2">TraceTrial-Bench</text>
  <text x="50" y="174" fill="#b5c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="20">Reliability and failure attribution</text>
  <text x="50" y="202" fill="#b5c5d8" font-family="Segoe UI,Arial,sans-serif" font-size="20">for AI agent harnesses.</text>
  <path d="M50 238H574" stroke="#2a3b50"/>
  <text x="50" y="270" fill="#7dd3c7" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2">FOLLOW THE TRACE. LOCATE THE FAILURE.</text>
  <g fill="none" stroke-width="2">
    <path d="M710 161H791Q811 161 811 141V106Q811 86 831 86H899" stroke="#5eead4"/>
    <path d="M811 161V218Q811 238 831 238H899" stroke="#93c5fd"/>
    <path d="M680 161H710" stroke="#526983" stroke-dasharray="4 5"/>
  </g>
  <circle cx="710" cy="161" r="8" fill="#0e1a2c" stroke="#d0deec" stroke-width="2"/>
  <circle cx="811" cy="161" r="5" fill="#d0deec"/>
  <text x="690" y="196" fill="#91a7bf" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">TRACE</text>
  <rect x="900" y="55" width="246" height="64" rx="10" fill="#122c32" stroke="#2d6c68"/>
  <circle cx="921" cy="87" r="4" fill="#5eead4"/>
  <text x="938" y="82" fill="#a9f1e6" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Harness evidence</text>
  <text x="938" y="103" fill="#8ab8b5" font-family="Segoe UI,Arial,sans-serif" font-size="12">Tools · context · lifecycle</text>
  <rect x="900" y="206" width="246" height="64" rx="10" fill="#15273e" stroke="#3c5b83"/>
  <circle cx="921" cy="238" r="4" fill="#93c5fd"/>
  <text x="938" y="233" fill="#c5dffd" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Agent evidence</text>
  <text x="938" y="254" fill="#94afcf" font-family="Segoe UI,Arial,sans-serif" font-size="12">Actions · deliverables · claims</text>
  <text x="917" y="167" fill="#738da8" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">TWO LAYERS. ONE TRACE.</text>
</svg>
