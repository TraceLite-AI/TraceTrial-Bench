case: M-L1a-regions-L3-001
items:
- id: hr_reached_task_end
  criterion: "判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次： 判 **fail** 的确切条件（满足任一）： ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0\n   —— 轮次没走完且原因指向 harness 侧；\n② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**\n   （例如每轮都以 \"prompt too large\" 作结、模型在多数轮次里无法执行任何实质动作）。\n   ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。\n判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。 ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。\n"
- id: hr_early_material_survived
  criterion: "跨轮之后，早期轮次取得的关键事实是否仍在模型可见上下文里（未被压缩/驱逐摘掉）。\nfail：发生压缩/驱逐之后，早期轮次取得的那个关键事实在模型可见上下文里不再可引，\n      表现为模型重新执行同一次取数、或后续结论与该事实不符。必须指名是哪一个事实。\npass：上述判定对象所指的那份材料仍可被引用；**或本轮根本没有发生压缩/驱逐**（机制未触发，记设计分）。\nN-A：发生了压缩/驱逐，但拿不到压缩前后的上下文对照。\n★判定顺序（先后不能颠倒）：先问「本轮到底有没有发生压缩/驱逐」——\n  看网关压缩计数与轨迹里的压缩事件。\n  **没发生 → 直接 pass**，不再往下看证据够不够；发生了才继续，此时证据不足才判 N-A。\n  ★「没压缩所以没有前后对照可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文：既要引出该材料压缩前出现过的原文，\n  也要引出它压缩后不可引（或模型重读）的原文。"
  evidence: 网关压缩计数 + 压缩事件原始记录 + 早期值在后续轮次的可见性
- id: hr_compaction_perceivable
  criterion: '**判的是「模型有没有被告知压缩发生了」**，不是「压缩这件事在证据里能不能被看到」。 判 **fail** 的确切条件：证据显示确实发生了压缩/驱逐（网关计数 > 0 或轨迹里有压缩事件）， 而**模型收到的消息流里没有任何压缩通知**——即压缩对模型是静默的。 ★注意：如果你的依据是「压缩静默发生、模型未收到提示」，那么取值**必须是 fail**，不是 pass。 判 **pass**：模型收到了压缩提示；**或**本轮根本没发生压缩（机制未触发，记设计分）。 判 N-A：拿不到压缩事件记录，也拿不到模型消息流。

    '
- id: hr_no_rework_induced
  criterion: '是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。

    '
  evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
- id: hr_status_consistent
  criterion: '**读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_status_consistent`： - `inconsistent` 为 true（即 `ok_count` > 0 且 `error_count` > 0，harness 对上层报 ok 却在内部记了 error）→ **fail** - `inconsistent` 为 false → **pass** - `available` 为 false（拿不到 run/cli_output.log）→ **N-A** 引用时请逐字复制该段里的 `top_level_status` / `internal_error_kinds` 两个字段值。

    '
- id: hr_budget_state_visible
  criterion: '轮次/预算余量是否对模型可见（还剩多少轮、是否临近上限），使其能主动收场。判 fail：预算耗尽前模型无从得知余量，会话被直接切断。

    '
  evidence: 轨迹里是否出现预算提示 + 会话结束方式
  locates: ★L1a 叶的机制专属项（通用条目判不到）
- id: hr_graceful_stop_at_budget
  criterion: '预算耗尽时是否给模型收场机会（提示后再终止），而非直接切断。判 fail：无提示直接终止。

    '
  evidence: 会话结束方式 + 最后一轮内容
  locates: ★L1a 机制专属
- id: hr_remaining_budget_queryable
  criterion: '模型能否主动查询剩余预算。判 fail：无查询手段。

    '
  evidence: 工具清单
  locates: ★L1a 机制专属
- id: hr_budget_exhaustion_not_silent
  criterion: '预算耗尽时的终止是否带明确原因。判 fail：静默终止。

    '
  evidence: 会话结束时的返回
  locates: ★L1a 机制专属
