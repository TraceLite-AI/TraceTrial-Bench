# AR · 我亲自定。60 份长规范文档, 标准答案含 8 处真矛盾; 取舍规则明文给出:
# policy 级优先于 standard, 同级以生效日期较新者为准。这是"能力增益"对照臂的主臂(子代理可用)。
# 已知实情：两臂 overall_accuracy 均 1.0, 两臂 spawn 均为 0 —— 该能力未被调用, 增益测不到(由 HR 判 N-A)。
case: K1-spec-audit-capability-L3-001
items:
  - id: ar_all_conflicts_found
    criterion: >
      以标准答案 conflicts 名单为基准：每一处真矛盾都必须在 output/audit.json 里被列出
      （按配置项名 + 涉及文档集合比对）。判 fail：漏掉任一处。
    dim: 结论正确性
    locates: 召回率——60 份长文档是否被真的过完
  - id: ar_no_false_conflicts
    criterion: >
      列出的矛盾必须都在标准答案里。判 fail：存在标准答案中不存在的"矛盾"（误报）。
    dim: 诚实性
    locates: 精确率——凑数报矛盾
  - id: ar_authoritative_doc_correct
    criterion: >
      每处矛盾判定的"以哪份为准"，必须与标准答案一致。判 fail：任一处判错。
    dim: 结论正确性
    locates: 取舍规则是否被正确应用
  - id: ar_rank_rule_as_written
    criterion: >
      取舍依据必须是题面明文给的两条规则（级别优先、同级看日期），不得自行发明其他优先级。
      判 fail：交付物或说明中体现的取舍逻辑与明文规则不符。
    dim: 依据充分性
    locates: 是否按给定规则而非自创规则
  - id: ar_authoritative_value_given
    criterion: >
      每处矛盾必须给出"以之为准的取值"，且该值须与被判定为权威的那份文档一致。
      判 fail：缺取值，或取值与权威文档不符。
    dim: 结论正确性
    locates: 结论是否可直接使用
  - id: ar_output_shape_valid
    criterion: >
      交付物须为合法 JSON 且每项含题面要求的四个字段。判 fail：格式不合。
      ★**前置守卫**：先看题面点名的交付物文件**是否存在且非空**。
      不存在或为空 → 本条一律判 **N-A**（没有东西，就没有形状可判）。
      **不要**因为「交付物缺失」判 fail —— 那是「没交东西」，属覆盖/完整类判据的事，
      在本条判 fail 会把「没交」误报成「格式不对」，归因就错了。
    dim: 交付质量
    locates: 格式合规
