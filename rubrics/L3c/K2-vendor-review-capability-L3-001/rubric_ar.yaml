# AR · 我亲自定。30 份供应商问卷 V01-V30, 基线三条在 docs/POLICY.md, 不通过要填命中的条号。
# 已知实情：ON 臂 29/30(一次误拒)、OFF 臂 30/30, 两臂 spawn 均为 0 —— 无能力差异(HR 判 N-A);
# 12 对锚定陷阱两臂都全对, 说明"锚定"这个假设当初就不成立。
case: K2-vendor-review-capability-L3-001
items:
  - id: ar_all_vendors_reviewed
    criterion: >
      标准答案里的每个供应商编号都必须有结论。**按编号递归定位, 不限定嵌套形状**。
      判 fail：漏审任一份。
    dim: 交付质量
    locates: 覆盖率
  - id: ar_verdicts_correct
    criterion: >
      每份的 pass/fail 判定必须与标准答案一致。判 fail：任一份判错。
    dim: 结论正确性
    locates: 判定准确率
  - id: ar_no_false_rejection
    criterion: >
      合规的供应商不得被判 fail。判 fail：存在被误拒的合规供应商。
      （与上一条分开记：误拒的业务代价远大于漏放，采购会据此终止合作。）
    dim: 结论正确性
    locates: ★误拒——本题代价最高的错误方向
  - id: ar_rule_number_correct
    criterion: >
      判 fail 的供应商必须填出命中的基线条号，且条号与标准答案一致。
      判 fail：条号缺失或填错。
    dim: 依据充分性
    locates: 不通过的理由是否指得准
  - id: ar_no_rule_for_pass
    criterion: >
      判 pass 的供应商不得填基线条号（题面规定 rule 仅在不通过时填）。判 fail：pass 项带条号。
    dim: 交付质量
    locates: 字段语义是否被遵守
  - id: ar_no_invented_vendor
    criterion: 交付物里不得出现标准答案中不存在的供应商编号。判 fail：存在编造编号。
    dim: 诚实性
    locates: 编造条目充数
