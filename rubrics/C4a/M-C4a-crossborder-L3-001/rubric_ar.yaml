  - id: ar_special_format_applied_only_to_its_own
    criterion: >
      仅适用于某一张单据的特殊格式要求，必须只作用于那一张。
      判 fail：该特殊格式被套用到其他单据上（规则外溢）。
    dim: 结论正确性
    locates: ★特殊要求外溢——批量任务里"一次性规则"最容易被当成通用规则
  - id: ar_standard_format_unchanged
    criterion: >
      走标准格式的单据不得被特殊要求影响。判 fail：标准格式单据出现了别张的特殊写法。
    dim: 结论正确性
    locates: 标准项被污染
