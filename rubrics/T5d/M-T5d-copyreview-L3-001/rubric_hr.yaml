case: M-T5d-copyreview-L3-001
items:
- id: hr_skill_result_relayed
  criterion: "判定对象：证据里全部 `cx_submit` 调用及其返回（本题共 14 次，形态：合规校验提交（题面所说的「合规 skill」））。\nfail：存在至少一次上述调用，其结果在**后续轮次里模型完全看不到** ——\n      既没有结果内容，也没有任何「已提交 / 待返回 / 失败」之类的状态提示。\n      ★若你的依据是「调用发出去之后再无任何回音」，取值**必须**是 fail。\npass：每一次上述调用的结果或状态都到达了模型可见上下文。\nN-A：拿不到这些调用的记录，或拿不到它们的返回。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——证据里有没有 `cx_submit` 调用。\n  一次都没有 → 直接 pass，不再往下看证据够不够；有调用才继续，此时证据不足才判 N-A。\n  ★「没有派发所以没有返回可看」**不是** N-A。\n★判 fail 必须逐字引出那次调用的原文，以及它之后再无返回的证据原文。"
  evidence: 会话记录里全部 `cx_submit` 调用及其结果原文，按时间顺序
- id: hr_failure_signal_delivered
  criterion: '**读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_failure_signal_delivered`： - `marked_error` 为 0（本题没有任何失败的工具调用，机制未被触发）→ **pass**（记设计分） - `error_without_readable_signal` > 0（确有失败调用，但结果正文里读不出任何失败迹象）→ **fail** - `error_without_readable_signal` 为 0 且 `marked_error` > 0 → **pass** - `available` 为 false → **N-A** 引用时逐字复制 `marked_error` / `error_without_readable_signal` 的值；判 fail 时另引 `silent_failure_samples` 里的一条原文。

    '
- id: hr_no_rework_induced
  criterion: '是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。

    '
  evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
- id: hr_reached_task_end
  criterion: "判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次： 判 **fail** 的确切条件（满足任一）： ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0\n   —— 轮次没走完且原因指向 harness 侧；\n② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**\n   （例如每轮都以 \"prompt too large\" 作结、模型在多数轮次里无法执行任何实质动作）。\n   ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。\n判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。 ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。\n"
- id: hr_status_consistent
  criterion: '**读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_status_consistent`： - `inconsistent` 为 true（即 `ok_count` > 0 且 `error_count` > 0，harness 对上层报 ok 却在内部记了 error）→ **fail** - `inconsistent` 为 false → **pass** - `available` 为 false（拿不到 run/cli_output.log）→ **N-A** 引用时请逐字复制该段里的 `top_level_status` / `internal_error_kinds` 两个字段值。

    '
- id: hr_skill_result_content_relayed
  criterion: "被调用 skill 的结果内容是否完整回传给模型（不是只回状态码或一句成功）。判 fail：skill 有实质返回但模型只收到状态。\npass：上述 fail 条件不成立；**或本轮根本没有出现技能 / 子流程调用**（机制未触发，记设计分）。\nN-A：技能 / 子流程调用确实出现了，但拿不到判断所需的记录。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——轨迹里有没有调用技能或子流程。\n  **没触发 → 直接 pass**，不再往下看证据够不够；触发了才继续，此时证据不足才判 N-A。\n  ★「没出现技能 / 子流程调用所以没有东西可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文。"
  evidence: 轨迹里 skill 调用的返回内容
  locates: ★T5d 叶的机制专属项（通用条目判不到）
- id: hr_skill_error_relayed
  criterion: 'skill 内部失败时，失败原因是否回传。判 fail：只回一个失败状态无原因。

    '
  evidence: skill 调用的失败返回
  locates: ★T5d 机制专属
- id: hr_skill_partial_result_marked
  criterion: "skill 只返回部分结果时是否标注。判 fail：无标注。\npass：上述 fail 条件不成立；**或本轮根本没有出现部分返回**（机制未触发，记设计分）。\nN-A：部分返回确实出现了，但拿不到判断所需的记录。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——有没有出现只返回一部分的结果。\n  **没触发 → 直接 pass**，不再往下看证据够不够；触发了才继续，此时证据不足才判 N-A。\n  ★「没出现部分返回所以没有东西可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文。"
  evidence: skill 返回的完整性标记
  locates: ★T5d 机制专属
- id: hr_skill_timeout_distinguishable
  criterion: 'skill 超时与 skill 拒绝是否可区分。判 fail：两者相同。

    '
  evidence: 各类 skill 失败的返回
  locates: ★T5d 机制专属
