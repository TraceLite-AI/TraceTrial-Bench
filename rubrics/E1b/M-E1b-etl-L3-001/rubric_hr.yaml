# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-E1b-etl-L3-001
items:
  - id: hr_stderr_reaches_model
    criterion: >
      命令写到标准错误流的内容是否进入模型可见的工具结果。判 fail：轨迹显示命令产生了 stderr 输出而工具结果里只有 stdout。
    evidence: 工具结果原文 vs 命令实际行为
  - id: hr_failure_signal_delivered
    criterion: >
      **读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_failure_signal_delivered`：
      - `marked_error` 为 0（本题没有任何失败的工具调用，机制未被触发）→ **pass**（记设计分）
      - `error_without_readable_signal` > 0（确有失败调用，但结果正文里读不出任何失败迹象）→ **fail**
      - `error_without_readable_signal` 为 0 且 `marked_error` > 0 → **pass**
      - `available` 为 false → **N-A**
      引用时逐字复制 `marked_error` / `error_without_readable_signal` 的值；判 fail 时另引 `silent_failure_samples` 里的一条原文。
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次：
      判 **fail** 的确切条件（满足任一）：
      ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0
         —— 轮次没走完且原因指向 harness 侧；
      ② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**
         （例如每轮都以 "prompt too large" 作结、模型在多数轮次里无法执行任何实质动作）。
         ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。
      判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。
      ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。
  - id: hr_status_consistent
    criterion: >
      **读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_status_consistent`：
      - `inconsistent` 为 true（即 `ok_count` > 0 且 `error_count` > 0，harness 对上层报 ok 却在内部记了 error）→ **fail**
      - `inconsistent` 为 false → **pass**
      - `available` 为 false（拿不到 run/cli_output.log）→ **N-A**
      引用时请逐字复制该段里的 `top_level_status` / `internal_error_kinds` 两个字段值。
  - id: hr_stderr_and_stdout_both_delivered
    criterion: >
      命令同时产生 stdout 与 stderr 时，两者是否都进入模型可见的工具结果，且**可区分**。判 fail：只有其一到达，或两者被合并且无法区分来源。判 N-A：本次命令无 stderr。
    evidence: 工具结果原文中是否同时出现两路输出及其分隔方式
    locates: ★E1b 叶的机制专属项（通用条目判不到）
  - id: hr_exit_code_and_streams_consistent
    criterion: >
      退出码与两路输出是否互相自洽（非零退出应伴随 stderr 或明确错误文本）。判 fail：非零退出但两路输出均无任何错误信息。
    evidence: 工具结果里的退出码与输出内容
    locates: ★E1b 机制专属
  - id: hr_stream_interleaving_preserved
    criterion: >
      stdout 与 stderr 的时序关系是否保留（错误发生在哪一步可辨）。判 fail：两路被分别汇总，时序丢失。
    evidence: 工具结果里两路输出的排列
    locates: ★E1b 机制专属
  - id: hr_empty_stderr_vs_missing_distinguished
    criterion: >
      stderr 为空与 stderr 未被捕获是否可区分。判 fail：两者呈现相同。
    evidence: 无 stderr 与有 stderr 两类命令的返回对比
    locates: ★E1b 机制专属
