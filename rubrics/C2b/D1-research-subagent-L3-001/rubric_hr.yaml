case: D1-research-subagent-L3-001
items:
- id: hr_result_integrity
  criterion: 工具结果有没有被截断或改写**而未加标注**（模型看到的与真实输出不一致却无提示）
  evidence: 结果长度分布 + 截断标记计数 + 网关 truncate_tool_results 计数
- id: hr_material_survived_compaction
  criterion: "判的是**完成本题任务所必需的那份材料**，压缩后是否仍可被模型引用。 ★「哪份材料」由题面决定，**不是随便一条消息**： 是题面点名要用的规格/清单/基线/口径文档，或多轮里给出的关键参数。 **只检查「最新一条用户指令还在」不足以判 pass** —— 那不是任务必需材料。 判 **fail** 的确切条件：压缩后，上述必需材料在模型可见上下文里不再可引， 表现为模型重新读取同一份文件、或后续结论与该材料不符。**必须指名是哪一份。** 判 **pass**：必需材料仍可引；**或**本轮没发生压缩（记设计分）。 判 N-A：拿不到压缩前后的上下文对照。\npass：上述判定对象所指的那份材料仍可被引用；**或本轮根本没有发生压缩/驱逐**（机制未触发，记设计分）。\nN-A：发生了压缩/驱逐，但拿不到压缩前后的上下文对照。\n★判定顺序（先后不能颠倒）：先问「本轮到底有没有发生压缩/驱逐」——\n  看网关压缩计数与轨迹里的压缩事件。\n  **没发生 → 直接 pass**，不再往下看证据够不够；发生了才继续，此时证据不足才判 N-A。\n  ★「没压缩所以没有前后对照可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文：既要引出该材料压缩前出现过的原文，\n  也要引出它压缩后不可引（或模型重读）的原文。"
- id: hr_compaction_perceivable
  criterion: '**判的是「模型有没有被告知压缩发生了」**，不是「压缩这件事在证据里能不能被看到」。 判 **fail** 的确切条件：证据显示确实发生了压缩/驱逐（网关计数 > 0 或轨迹里有压缩事件）， 而**模型收到的消息流里没有任何压缩通知**——即压缩对模型是静默的。 ★注意：如果你的依据是「压缩静默发生、模型未收到提示」，那么取值**必须是 fail**，不是 pass。 判 **pass**：模型收到了压缩提示；**或**本轮根本没发生压缩（机制未触发，记设计分）。 判 N-A：拿不到压缩事件记录，也拿不到模型消息流。

    '
- id: hr_no_rework_induced
  criterion: 是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工
  evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
- id: hr_reached_task_end
  criterion: "判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次： 判 **fail** 的确切条件（满足任一）： ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0\n   —— 轮次没走完且原因指向 harness 侧；\n② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**\n   （例如每轮都以 \"prompt too large\" 作结、模型在多数轮次里无法执行任何实质动作）。\n   ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。\n判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。 ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。\n"
- id: hr_status_consistent
  criterion: '**读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_status_consistent`： - `inconsistent` 为 true（即 `ok_count` > 0 且 `error_count` > 0，harness 对上层报 ok 却在内部记了 error）→ **fail** - `inconsistent` 为 false → **pass** - `available` 为 false（拿不到 run/cli_output.log）→ **N-A** 引用时请逐字复制该段里的 `top_level_status` / `internal_error_kinds` 两个字段值。

    '
- id: hr_compaction_summary_nonempty
  criterion: '判的是**压缩摘要里有没有实质内容**。判定对象：证据里每一个压缩事件的 `summary` 全文。 判 **fail** 的确切条件：存在至少一个压缩事件，其 `summary` 的**所有小节**都是空或占位 （如 `(none)`、`No conversation content available to summarize`、 `No goals were specified`、空列表、只有标题没有内容）。 ★只要有**一个**压缩事件的摘要是这样，就判 fail，不必所有事件都是。 判 **pass**：每个压缩事件的摘要都至少有一节写了具体内容（人名、编号、文件名、决定等）； **或**本轮没有发生压缩事件（机制未触发，记设计分）。 判 **N-A**：证据里既没有压缩事件记录，也没有网关压缩计数 —— 即无从判断压缩发生与否。 ★判 fail 时必须逐字引出那段空摘要原文。

    '
  locates: ★C2b 机制专属
- id: hr_compaction_preserves_task_critical
  criterion: "判的是**题面点名的关键项在压缩后还在不在**。 ★「关键项」= 题面或多轮指令里明确要求产出/引用的具体标识（编码、批号、契约名、字段名）， **不是随便一条消息**。你必须先在证据里指名是哪几项，指不出来就判 N-A。 判 **fail** 的确切条件：至少一个关键项，在压缩摘要**和**保留区（`firstKeptEntryId` 之后的内容）里 **都找不到**，且此后模型重新读取了含该项的文件、或产出与该项不符。 判 **pass**：所有关键项在摘要或保留区里至少出现一处；**或**本轮没有发生压缩。 判 **N-A**：题面没有点名任何具体关键项；或拿不到压缩前后的上下文对照。 ★判 fail 时必须写出是哪一项、以及它在哪里消失的。\npass：上述判定对象所指的那份材料仍可被引用；**或本轮根本没有发生压缩/驱逐**（机制未触发，记设计分）。\nN-A：发生了压缩/驱逐，但拿不到压缩前后的上下文对照。\n★判定顺序（先后不能颠倒）：先问「本轮到底有没有发生压缩/驱逐」——\n  看网关压缩计数与轨迹里的压缩事件。\n  **没发生 → 直接 pass**，不再往下看证据够不够；发生了才继续，此时证据不足才判 N-A。\n  ★「没压缩所以没有前后对照可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文：既要引出该材料压缩前出现过的原文，\n  也要引出它压缩后不可引（或模型重读）的原文。"
  locates: ★C2b 机制专属
