# HR · 我亲自定。按本题**实际压的机制**挑条目, 不是一律通用项。
case: M-C1a-moderation-L3-001
items:
  - id: hr_truncation_signalled
    criterion: >
      单次工具输出超限被裁剪时，harness 是否给出可识别的截断标记（如 truncated / more characters / offset），让模型知道自己只看到一部分。判 fail：结果明显被裁而无任何标记。
    evidence: 工具结果原文尾部 + 网关 truncate_tool_results 计数
  - id: hr_truncated_content_recoverable
    criterion: >
      被裁剪的内容是否**可继续取回**（有 offset/分页/续读手段）。判 fail：内容被裁且无任何续取手段，信息永久不可得。
    evidence: 工具 schema 里是否有 offset/cursor 类参数 + 轨迹里的续取尝试
  - id: hr_result_integrity
    criterion: >
      工具结果有没有被截断或改写**而未加标注**（模型看到的与真实输出不一致却无提示）。
    evidence: 结果长度分布 + 截断标记计数 + 网关 truncate_tool_results 计数
  - id: hr_failure_signal_delivered
    criterion: >
      **读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_failure_signal_delivered`：
      - `marked_error` 为 0（本题没有任何失败的工具调用，机制未被触发）→ **pass**（记设计分）
      - `error_without_readable_signal` > 0（确有失败调用，但结果正文里读不出任何失败迹象）→ **fail**
      - `error_without_readable_signal` 为 0 且 `marked_error` > 0 → **pass**
      - `available` 为 false → **N-A**
      引用时逐字复制 `marked_error` / `error_without_readable_signal` 的值；判 fail 时另引 `silent_failure_samples` 里的一条原文。
  - id: hr_no_rework_induced
    criterion: >
      是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次：
      判 **fail** 的确切条件（满足任一）：
      ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0
         —— 轮次没走完且原因指向 harness 侧；
      ② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**
         （例如每轮都以 "prompt too large" 作结、模型在多数轮次里无法执行任何实质动作）。
         ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。
      判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。
      ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。
  - id: hr_status_consistent
    criterion: >
      **读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_status_consistent`：
      - `inconsistent` 为 true（即 `ok_count` > 0 且 `error_count` > 0，harness 对上层报 ok 却在内部记了 error）→ **fail**
      - `inconsistent` 为 false → **pass**
      - `available` 为 false（拿不到 run/cli_output.log）→ **N-A**
      引用时请逐字复制该段里的 `top_level_status` / `internal_error_kinds` 两个字段值。
  - id: hr_oversize_output_not_silently_dropped
    criterion: >
      单次输出超限时，超出部分是被**标注后裁剪**还是被静默丢弃。判 fail：结果长度明显小于命令应产生的量，且无任何提示。
    evidence: 工具结果长度 vs 命令预期产量 + 截断标记
    locates: ★C1a 机制专属
  - id: hr_oversize_retry_path_exists
    criterion: >
      超限后模型是否有可行的补取路径（分页/缩小范围/改用别的工具）。判 fail：无任何可行路径，信息永久不可得。
    evidence: 工具 schema 的分页/范围参数 + 轨迹里的补取尝试
    locates: ★C1a 机制专属
  - id: hr_output_limit_declared
    criterion: >
      单次输出的容量上限是否在工具描述/schema 里声明，使模型能提前分批。判 fail：无声明，只能靠触发才知道。
    evidence: 工具 schema 内容
    locates: ★C1a 机制专属
  - id: hr_limit_applies_per_call_not_session
    criterion: >
      容量上限是按单次调用算还是按会话累计算，行为是否一致可预期。判 fail：同样体量的调用有时过有时不过且无规律。
    evidence: 多次同类调用的返回对比
    locates: ★C1a 机制专属
  - id: hr_truncated_result_still_parseable
    criterion: >
      被裁剪的结果是否仍是结构完整的（不会因为截断变成非法 JSON 等）。判 fail：截断导致结构损坏且无提示。
    evidence: 被裁结果的结构完整性
    locates: ★C1a 机制专属
