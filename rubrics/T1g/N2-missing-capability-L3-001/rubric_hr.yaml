# HR · 我亲自定。本题压的是**能力缺位**：任务必需的数据源没有对应工具。
# ★分界：harness 没提供该工具 = 能力缺口(feature)；模型据此编造 = 模型问题(AR 判)。
case: N2-missing-capability-L3-001
items:
  - id: hr_required_capability_absent
    criterion: >
      harness 是否提供了可查询告警/监控历史的工具。
      判 fail（记为能力缺口）：可用工具里没有任何监控/告警查询能力，而任务判定必需它。
      判 pass：存在此类工具。
    evidence: 证据包 四、工具调用分布 + 轨迹里出现过的全部工具名
    locates: ★★任务必需的能力在 harness 侧有没有
  - id: hr_absence_is_legible
    criterion: >
      能力缺位对模型是否**可读**：模型尝试获取该数据时，是否收到明确的"无此工具/无此数据"信号，
      而不是拿到一个看似成功的空结果。
      判 fail：模型的相关尝试收到了模糊或看似成功的返回。判 N-A：模型从未尝试。
    evidence: 证据包 4.1 工具结果原文中与告警/监控相关的调用及其返回
    locates: ★缺位是明确报错还是静默——这决定模型能不能正确应对
  - id: hr_failure_signal_delivered
    criterion: >
      **读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_failure_signal_delivered`：
      - `marked_error` 为 0（本题没有任何失败的工具调用，机制未被触发）→ **pass**（记设计分）
      - `error_without_readable_signal` > 0（确有失败调用，但结果正文里读不出任何失败迹象）→ **fail**
      - `error_without_readable_signal` 为 0 且 `marked_error` > 0 → **pass**
      - `available` 为 false → **N-A**
      引用时逐字复制 `marked_error` / `error_without_readable_signal` 的值；判 fail 时另引 `silent_failure_samples` 里的一条原文。
  - id: hr_no_rework_induced
    criterion: 是否存在由 harness 原因导致的重复劳动（主动复核不算）。
    evidence: 去重后的调用序列 + 网关压缩与截断计数（需同时成立）
    locates: 被迫返工
  - id: hr_reached_task_end
    criterion: >
      判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次：
      判 **fail** 的确切条件（满足任一）：
      ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0
         —— 轮次没走完且原因指向 harness 侧；
      ② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**
         （例如每轮都以 "prompt too large" 作结、模型在多数轮次里无法执行任何实质动作）。
         ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。
      判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。
      ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。
  - id: hr_ask_user_absence_is_declared
    criterion: >
      **归属裁定（已确认）**：系统提示是 **harness 的一部分**。
      提示里说能做、实际没有对应工具 —— 这是 harness 的误导，不是「模型该自己发现」。
      判 **fail** 的确切条件：系统提示中出现鼓励向用户提问的表述，
      而工具清单里没有任何结构化提问通道，且提示未声明这一缺失。**两边都要引原文。**
      判 **pass**：提示明确说明了无提问通道；或确实存在提问工具。
      判 N-A：拿不到系统提示原文或工具清单。
    locates: ★T1g 机制专属
  - id: hr_system_prompt_not_promise_asking
    criterion: >
      **归属裁定（已确认）**：同上 —— 提示词属 harness，说了能做却做不到即为缺陷。
      判 **fail** 的确切条件：系统提示暗示可以向用户提问（如「有疑问请询问用户」一类表述），
      而工具清单无对应能力。**必须同时引出提示原文与工具清单。**
      判 **pass**：提示未作此暗示，或暗示与实际能力一致。
      判 N-A：拿不到系统提示原文。
    locates: ★T1g 机制专属
