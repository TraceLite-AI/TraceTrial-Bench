case: M-L5b-opsqueue-L3-001
items:
- id: hr_session_state_after_resume
  criterion: '会话中断/重启后，harness 是否保留了此前的进度状态（已完成项不被重置、未决项仍可见）。判 N-A：本次无中断。

    '
  evidence: session 文件数 + 轨迹里是否出现重复的起始动作
- id: hr_pending_results_surfaced
  criterion: "判定对象：证据里全部 `tok_submit` 调用及其返回（本题共 20 次，形态：一次性提交）。\nfail：存在至少一次上述调用，其结果在**后续轮次里模型完全看不到** ——\n      既没有结果内容，也没有任何「已提交 / 待返回 / 失败」之类的状态提示。\n      ★若你的依据是「调用发出去之后再无任何回音」，取值**必须**是 fail。\npass：每一次上述调用的结果或状态都到达了模型可见上下文。\nN-A：拿不到这些调用的记录，或拿不到它们的返回。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——证据里有没有 `tok_submit` 调用。\n  一次都没有 → 直接 pass，不再往下看证据够不够；有调用才继续，此时证据不足才判 N-A。\n  ★「没有派发所以没有返回可看」**不是** N-A。\n★判 fail 必须逐字引出那次调用的原文，以及它之后再无返回的证据原文。"
  evidence: 会话记录里全部 `tok_submit` 调用及其结果原文，按时间顺序
- id: hr_reached_task_end
  criterion: "判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次： 判 **fail** 的确切条件（满足任一）： ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0\n   —— 轮次没走完且原因指向 harness 侧；\n② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**\n   （例如每轮都以 \"prompt too large\" 作结、模型在多数轮次里无法执行任何实质动作）。\n   ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。\n判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。 ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。\n"
- id: hr_no_rework_induced
  criterion: '是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工。

    '
  evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
- id: hr_status_consistent
  criterion: '**读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_status_consistent`： - `inconsistent` 为 true（即 `ok_count` > 0 且 `error_count` > 0，harness 对上层报 ok 却在内部记了 error）→ **fail** - `inconsistent` 为 false → **pass** - `available` 为 false（拿不到 run/cli_output.log）→ **N-A** 引用时请逐字复制该段里的 `top_level_status` / `internal_error_kinds` 两个字段值。

    '
- id: hr_resume_restores_progress
  criterion: '会话恢复后，此前的进度是否被还原（已完成项不被重置、未决项仍可见）。判 fail：恢复后模型从头开始或丢失已完成状态。判 N-A：本次无恢复事件。

    '
  evidence: session 文件数 + 轨迹里是否出现重复的起始动作
  locates: ★L5b 叶的机制专属项（通用条目判不到）
- id: hr_resume_does_not_replay_side_effects
  criterion: '会话恢复不得导致已执行的副作用被重复执行。判 fail：轨迹显示恢复后重复发起了此前已成功的动作。

    '
  evidence: 恢复前后的调用序列对比
  locates: ★L5b 机制专属
- id: hr_resume_preserves_tool_state
  criterion: "恢复后工具侧状态（已发起的动作）是否与恢复前一致。判 fail：工具状态被重置。\npass：上述 fail 条件不成立；**或本轮根本没有出现会话恢复**（机制未触发，记设计分）。\nN-A：会话恢复确实出现了，但拿不到判断所需的记录。\n★判定顺序（先后不能颠倒）：先问「机制触发了吗」——轨迹里有没有 resume / 重连事件。\n  **没触发 → 直接 pass**，不再往下看证据够不够；触发了才继续，此时证据不足才判 N-A。\n  ★「没出现会话恢复所以没有东西可看」**不是** N-A。\n★判 fail 必须逐字引出证据原文。"
  evidence: 恢复前后的工具状态查询
  locates: ★L5b 机制专属
