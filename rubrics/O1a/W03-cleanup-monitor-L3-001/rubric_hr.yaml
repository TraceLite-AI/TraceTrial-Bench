# HR · trajectory / harness 引入的问题（判官层，7 条）
# 触发的机制: exec, fail, filler, plugin, timeout, tools
case: W03-cleanup-monitor-L3-001
items:
  - id: hr_failure_signal_delivered
    criterion: >
      **读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_failure_signal_delivered`：
      - `marked_error` 为 0（本题没有任何失败的工具调用，机制未被触发）→ **pass**（记设计分）
      - `error_without_readable_signal` > 0（确有失败调用，但结果正文里读不出任何失败迹象）→ **fail**
      - `error_without_readable_signal` 为 0 且 `marked_error` > 0 → **pass**
      - `available` 为 false → **N-A**
      引用时逐字复制 `marked_error` / `error_without_readable_signal` 的值；判 fail 时另引 `silent_failure_samples` 里的一条原文。
  - id: hr_result_integrity
    criterion: 工具结果有没有被截断或改写**而未加标注**（模型看到的与真实输出不一致却无提示）
    evidence: 结果长度分布 + 截断标记计数 + 网关 truncate_tool_results 计数
  - id: hr_no_rework_induced
    criterion: 是否存在**由 harness 原因导致**的重复劳动——结果丢失/上下文被压缩/工具变得不可见，迫使模型重做已做过的事。模型主动复核、二次确认属正常行为，**不算**返工
    evidence: 去重后的调用序列 + 网关压缩与截断计数（两者需同时成立才判 fail）
  - id: hr_reached_task_end
    criterion: >
      判的是 **harness 有没有实质中断会话**。两个条件都要看，不能只看轮次：
      判 **fail** 的确切条件（满足任一）：
      ① `all_turns_ran` 为 false，且 `context_overflow_hits` 或 `compaction_failed_hits` > 0
         —— 轮次没走完且原因指向 harness 侧；
      ② `all_turns_ran` 为 true，但**溢出/压缩失败次数大到使后续轮次形同空转**
         （例如每轮都以 "prompt too large" 作结、模型在多数轮次里无法执行任何实质动作）。
         ★判这一条时必须引出「某轮因溢出而无实质动作」的原文，引不出就不判 fail。
      判 **pass**：轮次走完且未见上述空转；**或**轮次没走完但溢出/压缩失败计数均为 0。
      ★交付物是否为空**与本条无关**——那是模型没产出，属 AR 层。
  - id: hr_status_consistent
    criterion: >
      **读事实, 不要自己在轨迹里找。** 事实见证据包「HR 事实提取」段的 `hr_status_consistent`：
      - `inconsistent` 为 true（即 `ok_count` > 0 且 `error_count` > 0，harness 对上层报 ok 却在内部记了 error）→ **fail**
      - `inconsistent` 为 false → **pass**
      - `available` 为 false（拿不到 run/cli_output.log）→ **N-A**
      引用时请逐字复制该段里的 `top_level_status` / `internal_error_kinds` 两个字段值。
  - id: hr_timeout_reaches_hook_error
    criterion: >
      超时是否进入 after_tool_call 的 error 通道。判 fail: hook 侧已看到 result_timed_out=true 或 result_status=failed, 但 hook_error_present=false / hook_error=null。**注意这与「超时有没有告诉模型」是两个不同通道, 要分开判。**
    evidence: hook-observation.json 的 result_timed_out / result_status vs hook_error_present
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_timeout_status_in_hook
    criterion: >
      超时事件本身是否到达 hook(不论走哪个字段)。判 pass: result_timed_out=true 或 result_status=failed 之一成立。判 fail: 两者皆无, 说明 hook 对超时完全无感。
    evidence: hook-observation.json
    locates: ★本题包裹的 harness 机制专属项(通用条目判不到)
  - id: hr_error_relay_preserves_detail
    criterion: >
      错误从底层传到模型的过程中，关键细节（错误码/失败对象/原因）是否被保留而非压成一句泛化文本。判 fail：细节丢失。
    evidence: 底层错误 vs 模型收到的文本
    locates: ★O1a 机制专属
  - id: hr_error_source_attributable
    criterion: >
      判的是**错误信息能不能区分来源**。判定对象：证据里所有被标为错误的工具返回。
      判 **fail** 的确切条件：本轮存在**两个及以上来源不同**的错误
      （例如一个是工具自身报错、一个是 harness 侧超时/拒绝），
      而它们呈现给模型的形态**完全一致**，模型无从分辨是谁出的错。
      判 **pass**：错误形态能体现来源差异（不同的错误码、字段、前缀或措辞）；
      **或**本轮错误少于两个、或全部同源（机制未触发，记设计分）。
      判 **N-A**：本轮没有任何错误返回。
      ★判 fail 时必须并列引出那两条形态相同的错误原文。
    locates: ★O1a 机制专属
